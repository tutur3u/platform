include: package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - build/**
    - lib/l10n/gen/*
    - vendor/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    public_member_api_docs: false
    use_null_aware_elements: false
