# Lychee link checker configuration for Mintlify docs
# https://lychee.cli.rs/#/usage/config
# Run from apps/docs: lychee --config lychee.toml --no-progress '**/*.mdx'
# Written for lychee 0.24; internal Mintlify routes resolve against this
# directory and fall back to .mdx, so renamed or deleted pages are caught.

root_dir = "."
fallback_extensions = ["mdx"]

# Exclude patterns - regex patterns to exclude from checking
exclude = [
    # file:// URLs are Mintlify internal links
    '^file://',
    # Bot-blocking or login-gated hosts that answer 202/403 to crawlers
    '^https://chatgpt\.com/settings/',
    '^https://eur-lex\.europa\.eu/',
    '^https://developer\.squareup\.com/',
    # Intermittent 503 to automated clients
    '^https://azure\.microsoft\.com/',
]

# Exclude all private/local networks and file system links
exclude_all_private = true

# Timeout for requests (in seconds)
timeout = 30

# Maximum number of redirects to follow
max_redirects = 5

# Accept status codes as valid
accept = [200, 201, 204, 301, 302, 307, 308, 429]

# Ignore certificate errors for local development
insecure = true
