# Gitleaks configuration for security-checks.yaml. Pull request scans read this
# file from the base commit, so a pull request cannot allowlist its own secret.
# Keep allowlists path-scoped and justified; never allowlist by secret value.
[extend]
useDefault = true

[[allowlists]]
description = "Skill provenance manifests map reference file names to content digests"
paths = ['''^\.agents/skills/[^/]+/UPSTREAM\.json$''']

[[allowlists]]
description = "SQL grant guard baseline holds SHA-256 file and finding digests, not credentials"
targetRules = ['generic-api-key']
paths = ['''^scripts/ci/sql-grant-guard\.baseline\.json$''']

[[allowlists]]
description = "CocoaPods SPEC CHECKSUMS entries contain SHA-1 content digests"
targetRules = ['generic-api-key']
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)Podfile\.lock$''']
regexes = ['''^\s+[A-Za-z0-9_+./-]+: [0-9a-f]{40}$''']
