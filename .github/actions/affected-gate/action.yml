name: Affected app gate
description: >-
  Decide whether an app's heavy jobs should run. Pull requests and pushes to
  main skip when the diff plan is certain and the app is absent. Every other
  event, an uncertain plan, and any error resolve to run=true.
inputs:
  app:
    description: >-
      App directory name under apps/. A comma-separated list gates a workflow
      covering several apps: it runs when any of them is affected.
    required: true
outputs:
  run:
    description: Whether heavy jobs should run ("true" or "false")
    value: ${{ steps.gate.outputs.run || 'true' }}
  reason:
    description: Gate decision reason
    value: ${{ steps.gate.outputs.reason }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        REF: ${{ github.ref }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
        APP: ${{ inputs.app }}
      run: |
        # Fail open: if the script cannot even start, run everything.
        if ! node "${GITHUB_WORKSPACE}/scripts/ci/affected-gate.mjs"; then
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo 'reason=gate script failed' >> "$GITHUB_OUTPUT"
        fi
