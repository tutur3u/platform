name: Authenticate Supabase image pulls
description: Best-effort GHCR authentication, retaining anonymous public pulls when unavailable.
inputs:
  token:
    description: Read-only GitHub token; may be unavailable for fork pull requests.
    required: false
  username:
    description: GitHub actor associated with the token.
    required: true
runs:
  using: composite
  steps:
    - name: Log in to GHCR for public Supabase pulls
      shell: bash
      continue-on-error: true
      env:
        GHCR_TOKEN: ${{ inputs.token }}
        GHCR_USERNAME: ${{ inputs.username }}
      run: bash "$GITHUB_ACTION_PATH/login.sh"
