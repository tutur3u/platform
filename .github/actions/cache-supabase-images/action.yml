name: Cache Supabase images
description: Restore the pinned service images before local Supabase startup.
inputs:
  profile:
    description: contract, contract-http, or full configured stack
    default: contract
  database:
    description: Owning database workspace relative to the checkout
    default: apps/database
  pull-budget-seconds:
    description: 120 normally, or 600 only for a trusted main cache seed
    default: "120"
  seed-image-catalog:
    description: Fixed trusted seed catalog (current or cli-2.121.0)
    default: current
runs:
  using: composite
  steps:
    - name: Derive exact image cache identity
      id: identity
      shell: bash
      env:
        IMAGE_PROFILE: ${{ inputs.profile }}
        IMAGE_DATABASE: ${{ inputs.database }}
        IMAGE_PULL_BUDGET_SECONDS: ${{ inputs.pull-budget-seconds }}
        IMAGE_SEED_CATALOG: ${{ inputs.seed-image-catalog }}
      run: node scripts/ci/supabase-image-cache.js key
    - name: Restore exact image archive
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/supabase-images/images.tar
        key: ${{ steps.identity.outputs.key }}
    - name: Load cached images
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: node scripts/ci/supabase-image-cache.js load
    - name: Restore exact smaller profile archive
      id: subset
      if: steps.cache.outputs.cache-hit != 'true' && steps.identity.outputs.subset-key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/supabase-images/images.tar
        key: ${{ steps.identity.outputs.subset-key }}
    - name: Load smaller profile images
      if: steps.subset.outputs.cache-hit == 'true'
      shell: bash
      run: node scripts/ci/supabase-image-cache.js load-subset
    - name: Pull missing images within a short budget
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        IMAGE_PULL_BUDGET_SECONDS: ${{ inputs.pull-budget-seconds }}
        IMAGE_SAVE: ${{ steps.identity.outputs.save }}
        IMAGE_PROFILE: ${{ inputs.profile }}
        IMAGE_SEED_CATALOG: ${{ inputs.seed-image-catalog }}
      run: node scripts/ci/supabase-image-cache.js pull
    - name: Save trusted image archive
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cache.outputs.cache-hit != 'true' && steps.identity.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/supabase-images/images.tar
        key: ${{ steps.identity.outputs.key }}
