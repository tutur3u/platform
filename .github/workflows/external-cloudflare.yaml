name: external Cloudflare Build
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['apps/external/**', 'packages/**', 'bun.lock', 'scripts/ci/external-native-artifact.py', 'scripts/ci/apps-native-artifact.py', '.github/workflows/external-cloudflare.yaml', '.github/workflows/native-start-app.yaml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when external is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app.outputs.run == 'false') && 'false' || (github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true') }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: external
  build:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '["staging","production"]' || '["staging"]') }}
    uses: ./.github/workflows/native-start-app.yaml
    with:
      app: external
      package: '@tuturuuu/external'
      artifact-script: scripts/ci/external-native-artifact.py
      env-interface: ExternalGeneratedEnv
      worker-environment-type: ExternalEnvironment
      profile-env: VITE_EXTERNAL_NATIVE_PROFILE=${{ matrix.profile }}
      artifact-suffix: ${{ matrix.profile }}
      build-environment: ${{ matrix.profile == 'production' && 'production' || 'preview' }}
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ matrix.profile == 'production' && vars.PRODUCTION_SUPABASE_URL || matrix.profile == 'staging' && (vars.STAGING_SUPABASE_URL || 'https://external-ci.supabase.invalid') || '' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ matrix.profile == 'production' && vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || matrix.profile == 'staging' && (vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_external_ci_placeholder') || '' }}
        NEXT_PUBLIC_APP_URL=https://external.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
      unit-command: |
        if [ "$VITE_EXTERNAL_NATIVE_PROFILE" = production ]; then
          test -n "$NEXT_PUBLIC_SUPABASE_URL" && test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || exit 1
        fi
        bun x --no-install vitest run src/proxy.test.ts && bun run type-check:cloudflare
      format-paths: >-
        apps/external/cloudflare apps/external/start-bridge.config.ts apps/external/vite.config.mts apps/external/vitest.config.ts apps/external/void.config.ts
