name: Public schema guard
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/public-schema-allowlist.json"
      - "apps/database/scripts/public-schema-catalog*"
      - "apps/database/scripts/verify-public-schema-catalog.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - ".github/actions/cache-supabase-images/**"
      - "scripts/ci/supabase-image-cache*"
      - "scripts/check-public-schema-objects*"
      - "scripts/public-schema-guard/**"
      - "packages/types/src/supabase.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/public-schema-guard.yaml"
  push:
    branches: [main, production]
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/public-schema-allowlist.json"
      - "apps/database/scripts/public-schema-catalog*"
      - "apps/database/scripts/verify-public-schema-catalog.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - ".github/actions/cache-supabase-images/**"
      - "scripts/ci/supabase-image-cache*"
      - "scripts/check-public-schema-objects*"
      - "scripts/public-schema-guard/**"
      - "packages/types/src/supabase.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/public-schema-guard.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}-{3}{4}', github.workflow, github.event_name, github.event.pull_request.number || github.ref, (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest', github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '') }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: public-schema-guard.yaml
  contract:
    needs: check-ci
    if: (always() && needs.check-ci.result == 'success') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - name: Require an enabled contract gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify guard and catalog evaluation tests
        run: node --test scripts/check-public-schema-objects.test.js apps/database/scripts/public-schema-catalog.test.mjs
      - name: Check the shrink-only allowlist, generated types and migration lint
        env:
          PUBLIC_SCHEMA_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node scripts/check-public-schema-objects.js
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: ./.github/actions/cache-supabase-images
      - name: Compare the reset database catalog with the allowlist
        env:
          PUBLIC_SCHEMA_CATALOG_OUT: ${{ runner.temp }}/public-schema-catalog.json
        run: node apps/database/scripts/verify-public-schema-catalog.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-schema-catalog-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/public-schema-catalog.json
          if-no-files-found: warn
          retention-days: 14
