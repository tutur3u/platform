name: hive Cloudflare artifact
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['apps/hive/**', 'packages/**', 'bun.lock', '.github/workflows/hive-cloudflare.yaml']
permissions:
  contents: read
concurrency:
  group: hive-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://hive.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Record exact source identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: production
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build native app and workspace suppliers
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter="@tuturuuu/hive^..." --concurrency=2
          token: ''
          team: ''
      - name: Build production Worker
        working-directory: apps/hive
        run: bun run build:cloudflare
      - name: Record emitted Worker configuration
        run: node scripts/ci/native-emitted-config-receipt.mjs "apps/hive" "$SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config.json"
      - name: Upload emitted configuration receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-emitted-config-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-emitted-config.json
          retention-days: 7
          if-no-files-found: error
      - name: Check production ingress and anonymous login
        working-directory: apps/hive
        env:
          CI: 'true'
        run: bun run test:runtime
      - name: Package deployable Worker, config and assets
        run: |
          test -d apps/hive/dist/client
          test -f apps/hive/.wrangler/deploy/config.json
          printf '%s\n' "$SOURCE_SHA" > apps/hive/dist/SOURCE_SHA
          tar -C apps/hive -czf "$RUNNER_TEMP/hive-cloudflare.tar.gz" dist .wrangler/deploy/config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-cloudflare-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/hive-cloudflare.tar.gz
          retention-days: 7
          if-no-files-found: error
