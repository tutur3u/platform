name: Supabase Backup Export

# Gated, read-only export of a Supabase project into the bucket-locked R2
# backup bucket. "catalog" records sizes, exact row counts and storage stats;
# "export" adds pg_dump, roles, a storage copy and a restore parity check in
# a local Postgres 17 cluster.
# Outputs are age-encrypted before upload. This repository is public, so the
# job writes no artifacts and logs only pass or fail and hashes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Supabase project to export
        required: true
        type: choice
        options: [staging, production]
      mode:
        description: catalog (sizes and counts) or export (full backup)
        required: true
        type: choice
        options: [catalog, export]

permissions:
  contents: read

concurrency:
  group: supabase-backup-export-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # One job per target, each in its own branch-restricted environment, so
  # each job references only its own project's repository secrets
  # (scripts/ci/production-secret-scope.test.js).
  export-staging:
    name: ${{ inputs.mode }} staging
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Reviewer- and main-gated; holds the pooler host, CA, age recipients,
    # the backup bucket's object token and the Storage S3 key.
    environment: supabase-backup-staging
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare scratch disk, Postgres 17, pgvector and age
        run: bash scripts/backup/prepare-runner.sh

      - name: Run ${{ inputs.mode }}
        env:
          TARGET: staging
          PROJECT_REF: ${{ secrets.STAGING_PROJECT_ID }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          POOLER_HOST: ${{ secrets.POOLER_HOST }}
          DB_CA_CERT: ${{ vars.SUPABASE_DB_CA_CERT }}
          AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          R2_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          STORAGE_S3_ENDPOINT: ${{ secrets.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_REGION: ap-southeast-1
          STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
          STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORK_DIR: /mnt/supabase-export
          MODE: ${{ inputs.mode }}
        run: bash scripts/backup/supabase-export.sh "$MODE"

  export-production:
    name: ${{ inputs.mode }} production
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Reviewer- and main-gated; holds the pooler host, CA, age recipients,
    # the backup bucket's object token and the Storage S3 key.
    environment: supabase-backup-production
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare scratch disk, Postgres 17, pgvector and age
        run: bash scripts/backup/prepare-runner.sh

      - name: Run ${{ inputs.mode }}
        env:
          TARGET: production
          PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_ID }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          POOLER_HOST: ${{ secrets.POOLER_HOST }}
          DB_CA_CERT: ${{ vars.SUPABASE_DB_CA_CERT }}
          AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          R2_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          STORAGE_S3_ENDPOINT: ${{ secrets.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_REGION: ap-southeast-1
          STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
          STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORK_DIR: /mnt/supabase-export
          MODE: ${{ inputs.mode }}
        run: bash scripts/backup/supabase-export.sh "$MODE"
