name: E2E Tests

on:
  push:
    branches-ignore:
      - production
    paths:
      # Unknown future runtime inputs must reach the conservative planner too.
      - "**"
      - ".github/actions/**"
      - ".github/workflows/e2e-tests.yaml"
      - "apps/**"
      - "packages/**"
      - "bun.lock"
      - "bunfig.toml"
      - "docker-compose/**"
      - "docker-compose*.yml"
      - "package.json"
      - "tsconfig*.json"
      - "scripts/ci/e2e-*"
      - "scripts/ci/release-only-changes.*"
      - "scripts/ci/supabase-baseline*"
      - "scripts/ci/run-with-backoff.sh"
      - "scripts/docker-web.js"
      - "scripts/docker-web/**"
      - "scripts/e2e-*"
      - "scripts/run-web-e2e-docker*"
      - "turbo.json"
      - "!*.md"
      - "!**/AGENTS.md"
      - "!apps/docs/**"
      - "!apps/mobile/**"
      - "!apps/backend/**"
      - "!apps/tanstack-web/**"
      - "!docs/**"
      - "!plans/**"
      - "!plugins/**"
      - "!skills/**"
      - "!conductor/**"
      - "!.agents/**"
      - "!.agent/**"
      - "!.claude/**"
      - "!.codex/**"
      - "!.cursor/**"
      - "!.gemini/**"
      - "!.opencode/**"
      - "!.vscode/**"
      - "!.windsurf/**"
      - "!.zed/**"
  workflow_dispatch:
    inputs:
      supabase_image_transport:
        description: Supabase image transport benchmark mode
        type: choice
        options:
          - cache
          - registry
        default: cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

permissions:
  contents: read
  deployments: read
  actions: read
  packages: read

env:
  # apps/backend is a paused migration target outside the live Next.js E2E runtime.
  DOCKER_BACKEND_ENABLED: "0"
  E2E_IMAGE_BUNDLE_REPOSITORY: ghcr.io/tutur3u/platform-e2e
  E2E_IMAGE_BUNDLE_TAG_PREFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
  E2E_IMAGE_BUNDLE_WAIT_SECONDS: "10"
  E2E_DOCKER_SUPABASE_RESET: "0"
  E2E_SUPABASE_IMAGE_TRANSPORT: ${{ inputs.supabase_image_transport || 'cache' }}

jobs:
  relevance:
    name: Check E2E relevance
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
      run_web: ${{ steps.plan.outputs.run_web }}
      run_inventory: ${{ steps.plan.outputs.run_inventory }}
      matrix: ${{ steps.plan.outputs.matrix }}
      inventory_key: ${{ steps.plan.outputs.inventory_key }}
      runner_context: ${{ steps.plan.outputs.runner_context }}
    steps:
      - name: Check out code and comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false

      - name: Detect release-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'run_e2e=true' >> "$GITHUB_OUTPUT"
          else
            result="$(node scripts/ci/release-only-changes.js "$BEFORE_SHA" "$GITHUB_SHA")"
            echo "run_e2e=$result" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse successful unchanged E2E suites
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_ENABLED: ${{ steps.detect.outputs.run_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          E2E_RESULT_CACHE_EPOCH: ${{ vars.E2E_RESULT_CACHE_EPOCH || '1' }}
        run: node scripts/ci/e2e-result-plan.js

  prepare-e2e-images:
    name: Prepare E2E image bundle
    needs: relevance
    if: github.ref != 'refs/heads/production' && needs.relevance.outputs.run_e2e == 'true' && needs.relevance.outputs.run_web == 'true'
    continue-on-error: true
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: ttr-e2e-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_WEB_CACHE_CHAT_REALTIME_FROM: type=gha,scope=docker-chat-realtime,timeout=10m
      DOCKER_WEB_CACHE_HIVE_FROM: type=gha,scope=docker-hive-prod,timeout=10m
      DOCKER_WEB_CACHE_HIVE_REALTIME_FROM: type=gha,scope=docker-hive-realtime,timeout=10m
      DOCKER_WEB_CACHE_MARKITDOWN_FROM: type=gha,scope=docker-markitdown,timeout=10m
      DOCKER_WEB_CACHE_MEET_REALTIME_FROM: type=gha,scope=docker-meet-realtime,timeout=10m
      DOCKER_WEB_CACHE_STORAGE_UNZIP_FROM: type=gha,scope=docker-storage-unzip-proxy,timeout=10m
      DOCKER_WEB_CACHE_SUPERMEMORY_FROM: type=gha,scope=docker-supermemory,timeout=10m
      DOCKER_WEB_CACHE_WEB_FROM: type=gha,scope=docker-web-prod,timeout=10m
      DOCKER_WEB_COMPOSE_PROJECT_NAME: ttr-e2e-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8001

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Free runner disk for E2E image bundle
        run: bash scripts/ci/e2e-free-disk.sh

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Select Docker Buildx builder
        run: echo "BUILDX_BUILDER=${{ steps.buildx.outputs.name }}" >> "$GITHUB_ENV"

      - name: Expose GitHub cache runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Configure trusted BuildKit cache exports
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          {
            echo 'DOCKER_WEB_CACHE_CHAT_REALTIME_TO=type=gha,scope=docker-chat-realtime,mode=min,timeout=10m,ignore-error=true'
            echo 'DOCKER_WEB_CACHE_HIVE_TO=type=gha,scope=docker-hive-prod,mode=min,timeout=10m,ignore-error=true'
            echo 'DOCKER_WEB_CACHE_HIVE_REALTIME_TO=type=gha,scope=docker-hive-realtime,mode=min,timeout=10m,ignore-error=true'
            echo 'DOCKER_WEB_CACHE_MARKITDOWN_TO=type=gha,scope=docker-markitdown,mode=min,timeout=10m,ignore-error=true'
            echo 'DOCKER_WEB_CACHE_MEET_REALTIME_TO=type=gha,scope=docker-meet-realtime,mode=min,timeout=10m,ignore-error=true'
            echo 'DOCKER_WEB_CACHE_SUPERMEMORY_TO=type=gha,scope=docker-supermemory,mode=min,timeout=10m,ignore-error=true'
          } >> "$GITHUB_ENV"

      - name: Prepare trusted Turbo BuildKit secrets
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
        env:
          CACHE_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
          CACHE_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [ -z "${CACHE_TOKEN:-}" ]; then
            echo "::notice title=Turbo BuildKit cache disabled::TURBO_TOKEN is not configured."
            exit 0
          fi
          if [ -z "${CACHE_TEAM:-}" ]; then
            echo "::error title=Invalid Turbo BuildKit cache configuration::TURBO_TEAM is required when TURBO_TOKEN is configured."
            exit 1
          fi

          umask 077
          printf '%s' "$CACHE_TEAM" > "$RUNNER_TEMP/turbo-team"
          printf '%s' "$CACHE_TOKEN" > "$RUNNER_TEMP/turbo-token"
          {
            echo "DOCKER_WEB_TURBO_TEAM_SECRET_FILE=$RUNNER_TEMP/turbo-team"
            echo "DOCKER_WEB_TURBO_TOKEN_SECRET_FILE=$RUNNER_TEMP/turbo-token"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install

      - name: Log in to GHCR for E2E bundle publishing
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Remove abandoned E2E image bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/e2e-image-bundle.js cleanup --stale-hours 24

      - name: Build and publish E2E image bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Build only the live Next.js bundle while TanStack/Rust migration is paused.
        run: node scripts/ci/e2e-image-bundle.js publish --frontend next

      - name: Remove Turbo BuildKit secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/turbo-team" "$RUNNER_TEMP/turbo-token"

  e2e:
    name: Playwright E2E (${{ matrix.label }})
    needs: [relevance, prepare-e2e-images]
    if: ${{ always() && !cancelled() && github.ref != 'refs/heads/production' && needs.relevance.outputs.run_e2e == 'true' && needs.relevance.outputs.run_web == 'true' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.relevance.outputs.matrix) }}

    env:
      BASE_URL: https://tuturuuu.localhost:1355
      DOCKER_WEB_CACHE_CHAT_REALTIME_FROM: type=gha,scope=docker-chat-realtime,timeout=10m
      DOCKER_WEB_CACHE_HIVE_FROM: type=gha,scope=docker-hive-prod,timeout=10m
      DOCKER_WEB_CACHE_HIVE_REALTIME_FROM: type=gha,scope=docker-hive-realtime,timeout=10m
      DOCKER_WEB_CACHE_MARKITDOWN_FROM: type=gha,scope=docker-markitdown,timeout=10m
      DOCKER_WEB_CACHE_MEET_REALTIME_FROM: type=gha,scope=docker-meet-realtime,timeout=10m
      DOCKER_WEB_CACHE_STORAGE_UNZIP_FROM: type=gha,scope=docker-storage-unzip-proxy,timeout=10m
      DOCKER_WEB_CACHE_SUPERMEMORY_FROM: type=gha,scope=docker-supermemory,timeout=10m
      DOCKER_WEB_CACHE_WEB_FROM: type=gha,scope=docker-web-prod,timeout=10m
      DOCKER_WEB_COMPOSE_PROJECT_NAME: ttr-e2e-${{ github.run_id }}-${{ matrix.id }}
      E2E_SHARD_INDEX: ${{ matrix.shard }}
      E2E_TOTAL_SHARDS: ${{ matrix.total_shards }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/tmp/e2e-web-results.json
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8001
      PORTLESS_PORT: "1355"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Free runner disk for Dockerized E2E
        run: bash scripts/ci/e2e-free-disk.sh

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Get Supabase CLI version
        id: supabase-version
        run: echo "version=$(supabase --version)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Docker images
        id: cache-supabase
        if: env.E2E_SUPABASE_IMAGE_TRANSPORT == 'cache'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/supabase-docker
          key: supabase-docker-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-version.outputs.version }}-images
          restore-keys: |
            supabase-docker-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-version.outputs.version }}-

      - name: Load cached Docker images
        if: env.E2E_SUPABASE_IMAGE_TRANSPORT == 'cache' && steps.cache-supabase.outputs.cache-matched-key != ''
        run: docker load -i /tmp/supabase-docker/images.tar || true

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Select Docker Buildx builder
        run: echo "BUILDX_BUILDER=${{ steps.buildx.outputs.name }}" >> "$GITHUB_ENV"

      - name: Expose GitHub cache runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Prepare trusted Turbo BuildKit secrets
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
        env:
          CACHE_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
          CACHE_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [ -z "${CACHE_TOKEN:-}" ]; then
            echo "::notice title=Turbo BuildKit cache disabled::TURBO_TOKEN is not configured."
            exit 0
          fi
          if [ -z "${CACHE_TEAM:-}" ]; then
            echo "::error title=Invalid Turbo BuildKit cache configuration::TURBO_TEAM is required when TURBO_TOKEN is configured."
            exit 1
          fi

          umask 077
          printf '%s' "$CACHE_TEAM" > "$RUNNER_TEMP/turbo-team"
          printf '%s' "$CACHE_TOKEN" > "$RUNNER_TEMP/turbo-token"
          {
            echo "DOCKER_WEB_TURBO_TEAM_SECRET_FILE=$RUNNER_TEMP/turbo-team"
            echo "DOCKER_WEB_TURBO_TOKEN_SECRET_FILE=$RUNNER_TEMP/turbo-token"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install

      - name: Reuse migrated Supabase baseline
        uses: ./.github/actions/setup-supabase-baseline
      - name: Install Playwright browsers
        working-directory: apps/web
        run: bun x playwright install chromium

      - name: Log in to GHCR for E2E bundle reuse
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Reuse prepared E2E image bundle
        run: node scripts/ci/e2e-image-bundle.js pull --frontend next

      - name: Run Playwright shard
        if: matrix.mode == 'shard'
        working-directory: apps/web
        run: |
          mkdir -p ../../tmp/e2e-diagnostics
          set -o pipefail
          bun test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.total_shards }} --grep-invert "workspace invitation|Workspace invitation" --reporter=line,blob,json 2>&1 | tee ../../tmp/e2e-diagnostics/run-playwright-shard.log

      - name: Run dedicated workspace invitation Playwright suite
        if: matrix.mode != 'shard'
        working-directory: apps/web
        run: |
          mkdir -p ../../tmp/e2e-diagnostics
          set -o pipefail
          bun test:e2e -- "e2e/${{ matrix.spec }}" --reporter=line,json 2>&1 | tee ../../tmp/e2e-diagnostics/run-playwright-shard.log

      - name: Collect Dockerized E2E diagnostics
        if: ${{ failure() }}
        run: bash scripts/ci/e2e-diagnostics.sh

      - name: Redact E2E diagnostics artifact
        id: redact-diagnostics
        if: ${{ failure() }}
        run: node scripts/ci/e2e-diagnostics-redact.js

      - name: Save Supabase Docker images for cache
        id: prepare-supabase-docker-cache
        # Only the general first shard uploads the multi-GB cache, not invitation shards.
        if: ${{ always() && env.E2E_SUPABASE_IMAGE_TRANSPORT == 'cache' && github.ref == 'refs/heads/main' && matrix.mode == 'shard' && matrix.shard == 1 && steps.cache-supabase.outputs.cache-matched-key == '' }}
        run: |
          mkdir -p /tmp/supabase-docker
          docker images --format '{{.Repository}}:{{.Tag}}' | grep 'supabase/' | grep -v '<none>' | xargs -r docker save -o /tmp/supabase-docker/images.tar
          if [ -s /tmp/supabase-docker/images.tar ]; then
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Supabase Docker images were available to cache."
            echo "cache-ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Supabase Docker images
        if: ${{ always() && steps.prepare-supabase-docker-cache.outputs.cache-ready == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /tmp/supabase-docker
          key: supabase-docker-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-version.outputs.version }}-images

      - name: Upload E2E failure artifact
        uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.redact-diagnostics.outcome == 'success' }}
        with:
          name: e2e-failure-${{ matrix.id }}
          path: tmp/e2e-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Docker web and Supabase
        if: always()
        run: |
          node scripts/docker-web.js down --mode prod --strategy blue-green --env-file tmp/e2e/web.env || true
          bun sb:stop || true

      - name: Remove Turbo BuildKit secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/turbo-team" "$RUNNER_TEMP/turbo-token"

      - name: Record successful E2E proof
        id: proof
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          E2E_EXPECTED_RUNNER: ${{ needs.relevance.outputs.runner_context }}
          E2E_SUITE_ID: ${{ matrix.id }}
          E2E_PROOF_KEY: ${{ matrix.cache_key }}
          E2E_RESULTS_PATH: tmp/e2e-web-results.json
        run: node scripts/ci/e2e-result-receipt.js

      - name: Cache successful E2E proof
        if: success() && steps.proof.outputs.reusable == 'true'
        uses: actions/cache/save@v6
        with:
          path: tmp/e2e-proof-receipt.json
          key: ${{ matrix.cache_key }}

  inventory-storefront-cache-e2e:
    name: Inventory / Storefront cache contract
    needs: relevance
    if: github.ref != 'refs/heads/production' && needs.relevance.outputs.run_e2e == 'true' && needs.relevance.outputs.run_inventory == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/tmp/e2e-inventory-results.json

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Free runner disk for cross-app cache E2E
        run: bash scripts/ci/e2e-free-disk.sh

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Get Supabase CLI version
        id: supabase-version
        run: echo "version=$(supabase --version)" >> "$GITHUB_OUTPUT"

      - name: Restore cached Supabase Docker images
        id: cache-supabase
        if: env.E2E_SUPABASE_IMAGE_TRANSPORT == 'cache'
        uses: actions/cache/restore@v6
        with:
          path: /tmp/supabase-docker
          key: supabase-docker-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-version.outputs.version }}-images
          restore-keys: |
            supabase-docker-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-version.outputs.version }}-

      - name: Load cached Supabase Docker images
        if: env.E2E_SUPABASE_IMAGE_TRANSPORT == 'cache' && steps.cache-supabase.outputs.cache-matched-key != ''
        run: docker load -i /tmp/supabase-docker/images.tar || true

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install

      - name: Build app workspace dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=4 --filter=@tuturuuu/inventory^... --filter=@tuturuuu/storefront^...
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Reuse migrated Supabase baseline
        uses: ./.github/actions/setup-supabase-baseline
      - name: Install Playwright browser
        working-directory: apps/inventory
        run: bun x playwright install chromium

      - name: Start local Supabase
        run: bun sb:start

      - name: Verify cache invalidation and instant navigation
        working-directory: apps/inventory
        run: bun test:e2e -- --reporter=line,html,json

      - name: Sanitize cache E2E failure diagnostics
        id: redact-inventory
        if: ${{ failure() }}
        run: node scripts/ci/e2e-diagnostics-redact.js --report tmp/e2e-inventory-results.json --output tmp/e2e-diagnostics/inventory-results.json

      - name: Upload cache E2E failure artifact
        uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.redact-inventory.outcome == 'success' }}
        with:
          name: inventory-storefront-cache-e2e
          path: tmp/e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: bun sb:stop || true

      - name: Record successful E2E proof
        id: proof
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          E2E_EXPECTED_RUNNER: ${{ needs.relevance.outputs.runner_context }}
          E2E_SUITE_ID: inventory-storefront
          E2E_PROOF_KEY: ${{ needs.relevance.outputs.inventory_key }}
          E2E_RESULTS_PATH: tmp/e2e-inventory-results.json
        run: node scripts/ci/e2e-result-receipt.js

      - name: Cache successful E2E proof
        if: success() && steps.proof.outputs.reusable == 'true'
        uses: actions/cache/save@v6
        with:
          path: tmp/e2e-proof-receipt.json
          key: ${{ needs.relevance.outputs.inventory_key }}

  migration-e2e:
    name: Migration E2E (${{ matrix.mode }})
    needs: [prepare-e2e-images]
    # Retain the paused migration matrix without consuming CI capacity.
    if: ${{ false }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: tanstack-dual-stack
            bundle_frontend: tanstack
            command: bun test:e2e:tanstack:docker -- -- --project=chromium
            playwright_workdir: apps/tanstack-web
            setup_supabase: "false"
          - mode: compare-smoke
            bundle_frontend: both
            command: bun test:e2e:web:docker:compare -- public-marketing-routes.noauth.spec.ts --project=chromium-no-auth
            playwright_workdir: apps/web
            setup_supabase: "true"

    env:
      BASE_URL: https://tuturuuu.localhost:1355
      DOCKER_WEB_CACHE_BACKEND_FROM: type=gha,scope=docker-backend,timeout=10m
      DOCKER_WEB_CACHE_CHAT_REALTIME_FROM: type=gha,scope=docker-chat-realtime,timeout=10m
      DOCKER_WEB_CACHE_HIVE_FROM: type=gha,scope=docker-hive-prod,timeout=10m
      DOCKER_WEB_CACHE_HIVE_REALTIME_FROM: type=gha,scope=docker-hive-realtime,timeout=10m
      DOCKER_WEB_CACHE_MARKITDOWN_FROM: type=gha,scope=docker-markitdown,timeout=10m
      DOCKER_WEB_CACHE_MEET_REALTIME_FROM: type=gha,scope=docker-meet-realtime,timeout=10m
      DOCKER_WEB_CACHE_STORAGE_UNZIP_FROM: type=gha,scope=docker-storage-unzip-proxy,timeout=10m
      DOCKER_WEB_CACHE_SUPERMEMORY_FROM: type=gha,scope=docker-supermemory,timeout=10m
      DOCKER_WEB_CACHE_TANSTACK_FROM: type=gha,scope=docker-tanstack-web-prod,timeout=10m
      DOCKER_WEB_CACHE_WEB_FROM: type=gha,scope=docker-web-prod,timeout=10m
      COMPOSE_PROJECT_NAME: ttr-migration-e2e-${{ github.run_id }}-${{ matrix.mode }}
      DOCKER_WEB_COMPOSE_PROJECT_NAME: ttr-migration-e2e-${{ github.run_id }}-${{ matrix.mode }}
      E2E_COMPARE_REPORT_PATH: tmp/e2e/web-migration/${{ matrix.mode }}-compare-report.json
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8001
      PORTLESS_PORT: "1355"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Free runner disk for Dockerized migration E2E
        run: bash scripts/ci/e2e-free-disk.sh

      - name: Setup Supabase CLI
        if: matrix.setup_supabase == 'true'
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Select Docker Buildx builder
        run: echo "BUILDX_BUILDER=${{ steps.buildx.outputs.name }}" >> "$GITHUB_ENV"

      - name: Expose GitHub cache runtime to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Prepare trusted Turbo BuildKit secrets
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
        env:
          CACHE_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
          CACHE_TOKEN: ${{ secrets.TURBO_TOKEN }}
        run: |
          if [ -z "${CACHE_TOKEN:-}" ]; then
            echo "::notice title=Turbo BuildKit cache disabled::TURBO_TOKEN is not configured."
            exit 0
          fi
          if [ -z "${CACHE_TEAM:-}" ]; then
            echo "::error title=Invalid Turbo BuildKit cache configuration::TURBO_TEAM is required when TURBO_TOKEN is configured."
            exit 1
          fi

          umask 077
          printf '%s' "$CACHE_TEAM" > "$RUNNER_TEMP/turbo-team"
          printf '%s' "$CACHE_TOKEN" > "$RUNNER_TEMP/turbo-token"
          {
            echo "DOCKER_WEB_TURBO_TEAM_SECRET_FILE=$RUNNER_TEMP/turbo-team"
            echo "DOCKER_WEB_TURBO_TOKEN_SECRET_FILE=$RUNNER_TEMP/turbo-token"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install

      - name: Reuse migrated Supabase baseline
        uses: ./.github/actions/setup-supabase-baseline
      - name: Install Playwright browsers
        working-directory: ${{ matrix.playwright_workdir }}
        run: bun x playwright install chromium

      - name: Log in to GHCR for E2E bundle reuse
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Reuse prepared E2E image bundle
        run: node scripts/ci/e2e-image-bundle.js pull --frontend ${{ matrix.bundle_frontend }}

      - name: Run migration E2E
        run: ${{ matrix.command }}

      - name: Upload migration E2E artifacts
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: migration-e2e-${{ matrix.mode }}
          path: |
            apps/tanstack-web/playwright-report/
            apps/tanstack-web/test-results/
            apps/web/blob-report/
            apps/web/test-results/
            tmp/e2e/web-migration/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop migration E2E stacks
        if: always()
        run: |
          docker compose -f docker-compose.tanstack-dual.yml down || true
          node scripts/docker-web.js down --mode prod --strategy blue-green --env-file tmp/e2e/web.env || true
          bun sb:stop || true

      - name: Remove Turbo BuildKit secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/turbo-team" "$RUNNER_TEMP/turbo-token"

  cleanup-e2e-images:
    name: Clean up E2E image bundle
    needs: [relevance, prepare-e2e-images, e2e, migration-e2e]
    if: ${{ always() && github.ref != 'refs/heads/production' && needs.relevance.outputs.run_e2e == 'true' && needs.relevance.outputs.run_web == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Delete this run's E2E image bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/e2e-image-bundle.js cleanup --tag-prefix "$E2E_IMAGE_BUNDLE_TAG_PREFIX"
