name: Security Review Recheck

# Submitting or dismissing a review changes the Security review decision.
# pull_request_review runs this file from the pull request, with a read-only
# token for forks, so it only signals: security-review-reclassify.yaml then
# recomputes the check from the live review list with default-branch code and
# a write token. Keep this workflow permissionless and free of checkouts.
on:
  pull_request_review:
    types:
      - submitted
      - dismissed

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

permissions: {}

jobs:
  signal:
    name: Signal review change
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Request trusted reclassification
        run: echo "Review changed; the default-branch classifier recomputes the Security review check."
