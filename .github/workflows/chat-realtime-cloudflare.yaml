name: Chat Realtime Cloudflare Artifact

# Build-only: verifies the chat-realtime Worker at the exact commit, including
# the workerd runtime checks, and uploads its cf Build Output
# (`.cloudflare/output/v0`) with a SHA-256 digest, so a publication can pin the
# run id and re-verify the digest before `cf deploy --prebuilt`. No deploy, no
# secrets, no provider writes.
on:
  push:
    branches: [main]
    paths:
      - apps/chat-realtime/**
      - packages/realtime/src/chat/**
      - bun.lock
      - .github/workflows/chat-realtime-cloudflare.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/realtime test -- src/chat
      - run: bun run --cwd apps/chat-realtime test
      - run: bun run --cwd apps/chat-realtime type-check
      - run: bun run --cwd apps/chat-realtime lint
      - run: bun run --cwd apps/chat-realtime test:runtime
      - run: bun run --cwd apps/chat-realtime build
      - name: Assert the publication shape
        working-directory: apps/chat-realtime/.cloudflare/output/v0
        run: |
          jq -e '.name == "tuturuuu-chat-realtime"
            and .workersDev == false
            and .previewUrls == false
            and .exports.ChatInboxRoom.storage == "sqlite"
            and .exports.ChatConversationRoom.storage == "sqlite"
            and .env.CHAT_REALTIME_TOKEN_SECRET.type == "secret"
            and .env.CHAT_REALTIME_STOPPED.type == "secret"' \
            workers/default/worker.config.json
          jq -e '.buildContext.isPreview == false' config.json
      - name: Package with a digest
        id: package
        working-directory: apps/chat-realtime/.cloudflare
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf chat-realtime-output.tar output
          digest="$(sha256sum chat-realtime-output.tar | cut -d' ' -f1)"
          echo "$digest  chat-realtime-output.tar" > chat-realtime-output.tar.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### chat-realtime artifact"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- sha256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-realtime-output-${{ github.sha }}
          path: |
            apps/chat-realtime/.cloudflare/chat-realtime-output.tar
            apps/chat-realtime/.cloudflare/chat-realtime-output.tar.sha256
          if-no-files-found: error
          retention-days: 30
