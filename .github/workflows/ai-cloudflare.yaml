# Generated by the start-bridge codemod for ai; re-run it instead of editing.
name: Ai Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      [
        'apps/ai/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/turnstile/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/ai-native-artifact.py',
        '.github/workflows/ai-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/ai/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/turnstile/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/ai-native-artifact.py',
        '.github/workflows/ai-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ready-for-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: ai-cloudflare.yaml
  # Qualification only: no staging or production publisher.
  native:
    needs: check-ci
    if: ${{ (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: ai
      package: '@tuturuuu/ai-studio'
      artifact-script: scripts/ci/ai-native-artifact.py
      env-interface: AiGeneratedEnv
      worker-environment-type: AiEnvironment
      # Public staging values from repository variables for same-repository
      # events; fork pull requests (and unset variables) build with fixtures.
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_URL || 'https://ai-ci.supabase.invalid' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ai_ci_placeholder' }}
        NEXT_PUBLIC_APP_URL=https://ai.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/ai/src/start-bridge apps/ai/src/routes apps/ai/src/router.tsx apps/ai/src/start.ts apps/ai/cloudflare apps/ai/vite.config.mts apps/ai/void.config.ts apps/ai/tsconfig.json apps/ai/package.json apps/ai/start-bridge.routes.json
