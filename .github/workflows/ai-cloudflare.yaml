name: Ai Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      [
        'apps/ai/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/ai-native-artifact.py',
        'scripts/ci/ai-cutover-smoke.mjs',
        '.github/workflows/ai-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/ai/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/ai-native-artifact.py',
        'scripts/ci/ai-cutover-smoke.mjs',
        '.github/workflows/ai-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when ai is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: ai
  check-ci:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: ai-cloudflare.yaml
  # Restored-bytes acceptance of the staging-profile Worker: the reusable
  # workflow builds, seals, exercises the emitted runtime, then repeats the
  # runtime acceptance on the restored archive. No secrets, no publication.
  native:
    needs: [check-ci, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: ai
      package: '@tuturuuu/ai-studio'
      artifact-script: scripts/ci/ai-native-artifact.py
      env-interface: AiGeneratedEnv
      worker-environment-type: AiEnvironment
      unit-command: bun run test && bun run type-check:cloudflare
      runtime-command: node --test --test-concurrency=1 cloudflare/*.runtime.mjs
      # Public staging values from repository variables for same-repository
      # events; fork pull requests (and unset variables) build with fixtures.
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_URL || 'https://ai-ci.supabase.invalid' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ai_ci_placeholder' }}
        NEXT_PUBLIC_APP_URL=https://ai.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/ai/cloudflare apps/ai/src/routes apps/ai/src/router.tsx apps/ai/src/start.ts apps/ai/vite.config.mts apps/ai/void.config.ts apps/ai/vitest.config.ts apps/ai/native-profile.ts apps/ai/tsconfig.json apps/ai/tsconfig.cloudflare.json apps/ai/package.json apps/ai/start-bridge.routes.json apps/ai/start-bridge.config.ts
  cutover-build:
    needs: [check-ci, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (needs.check-ci.outputs.should_run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [staging, production]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_AI_NATIVE_PROFILE: ${{ matrix.profile }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars[format('{0}_SUPABASE_URL', matrix.profile == 'production' && 'PRODUCTION' || 'STAGING')] }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars[format('{0}_SUPABASE_PUBLISHABLE_KEY', matrix.profile == 'production' && 'PRODUCTION' || 'STAGING')] }}
      NEXT_PUBLIC_APP_URL: https://ai.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      TUTURUUU_NOINDEX: '1'
      NODE_ENV: production
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Require the selected public build inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - name: Build required workspace suppliers
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter="@tuturuuu/ai-studio^..." --concurrency=2
          token: ''
          team: ''
      - name: Generate exact source identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: ${{ matrix.profile }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build TanStack Start Worker and assets
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/ai && bun run build:cloudflare
          token: ''
          team: ''
      - name: Record emitted configuration receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/ai "$SOURCE_SHA" "$RUNNER_TEMP/ai-emitted-config.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-cutover-config-${{ matrix.profile }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ai-emitted-config.json
          retention-days: 7
          if-no-files-found: error
      - name: Check emitted anonymous redirect and required-secret startup refusal
        timeout-minutes: 4
        run: node scripts/ci/ai-cutover-smoke.mjs
      - name: Validate and seal the emitted Worker
        run: |
          python3 scripts/ci/ai-native-artifact.py config apps/ai
          python3 scripts/ci/ai-native-artifact.py seal apps/ai --receipt "$RUNNER_TEMP/receipt.json"
      - name: Exercise emitted runtime with fixture bindings
        working-directory: apps/ai
        timeout-minutes: 4
        env:
          CI: 'true'
          CI_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: bun run test:runtime
      - name: Package deployable output and emitted Wrangler config
        run: |
          python3 scripts/ci/ai-native-artifact.py pack apps/ai --receipt "$RUNNER_TEMP/receipt.json" --archive "$RUNNER_TEMP/ai-native.tar.gz"
      - name: Restore and qualify the sealed archive
        env:
          CI_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ai-restore" "$SOURCE_SHA"
          cd "$RUNNER_TEMP/ai-restore"
          bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
          python3 scripts/ci/ai-native-artifact.py restore apps/ai --archive "$RUNNER_TEMP/ai-native.tar.gz" --receipt "$RUNNER_TEMP/ai-restored-artifact.json"
          node scripts/ci/ai-cutover-smoke.mjs
          CI=true bun run --cwd apps/ai test:runtime
          python3 scripts/ci/ai-native-artifact.py verify apps/ai --receipt "$RUNNER_TEMP/ai-restored-artifact.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-cutover-${{ matrix.profile }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/ai-native.tar.gz
          retention-days: 7
          if-no-files-found: error
