name: Shared Secret Copy

# Dispatch-only operator jobs. Each copies the CURRENT value of a shared
# secret from the GitHub secret its owning deploy already publishes, to the
# apps/web Workers only (scope `web` in scripts/ci/shared-secret-targets.mjs).
# Nothing is rotated: the peer Workers keep the value they hold,
# which is the same one. The value exists only in the step's memory and in the
# Workers' secret stores; it is never an output, environment file, artifact,
# cache entry, log line or command argument. Logs carry names, destinations
# and types only.
#
# One job per source, because a job runs in one environment:
#   copy-repo-secret  colab-production: repository secrets
#                     CRON_CONTROL_DELIVERY_TOKEN and DEVBOX_CONTROL_INTERNAL_TOKEN
#   copy-meet         meet-cloudflare-production: MEET_REALTIME_TOKEN_SECRET
# Both write with WEB_OPENNEXT_CLOUDFLARE_API_TOKEN (Workers Scripts edit).
# Dispatch it on the `production` branch after a production sync: both
# environments admit that branch, and the jobs refuse any other ref.
on:
  workflow_dispatch:
    inputs:
      secret:
        description: Secret to copy to the apps/web Workers
        required: true
        type: choice
        options:
          - MEET_REALTIME_TOKEN_SECRET
          - CRON_CONTROL_DELIVERY_TOKEN
          - TUTURUUU_DEVBOX_CONTROL_TOKEN

permissions:
  contents: read

concurrency:
  group: shared-secret-copy-production
  cancel-in-progress: false

jobs:
  copy-repo-secret:
    if: github.ref == 'refs/heads/production' && inputs.secret != 'MEET_REALTIME_TOKEN_SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: colab-production
    steps:
      - name: Require production
        run: test "$GITHUB_REF" = refs/heads/production
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the secret tooling floor
        run: |
          git merge-base --is-ancestor 018eecf2fff936563b5775f711bfc5606e361219 HEAD \
            || { echo 'This commit predates the abuse-guard ratelimit family (018eecf2).'; exit 1; }
      - name: Copy the current value to every web Worker and read it back
        env:
          SHARED_SECRET: ${{ inputs.secret }}
          # Exactly one source resolves; the other is never referenced.
          SOURCE_VALUE: ${{ (inputs.secret == 'CRON_CONTROL_DELIVERY_TOKEN' && secrets.CRON_CONTROL_DELIVERY_TOKEN) || (inputs.secret == 'TUTURUUU_DEVBOX_CONTROL_TOKEN' && secrets.DEVBOX_CONTROL_INTERNAL_TOKEN) || '' }}
          CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          value="$SOURCE_VALUE"
          unset SOURCE_VALUE
          # The shape assertSecretValue enforces, checked before the value
          # reaches a workflow command. The length is tested apart from the
          # pattern because some regex engines cap a repeat count at 255.
          shape='^[A-Za-z0-9+/=._-]+$'
          [[ "$value" =~ $shape ]] && (( ${#value} >= 32 && ${#value} <= 512 )) || { printf 'source value has an unexpected shape\n' >&2; exit 1; }
          printf '::add-mask::%s\n' "$value"
          node scripts/ci/shared-secret.mjs preflight "$SHARED_SECRET" production web
          printf '%s' "$value" | node scripts/ci/shared-secret.mjs write workers "$SHARED_SECRET" production web
          unset value
          node scripts/ci/shared-secret.mjs verify "$SHARED_SECRET" production web

  copy-meet:
    if: github.ref == 'refs/heads/production' && inputs.secret == 'MEET_REALTIME_TOKEN_SECRET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: meet-cloudflare-production
    steps:
      - name: Require production
        run: test "$GITHUB_REF" = refs/heads/production
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the secret tooling floor
        run: |
          git merge-base --is-ancestor 018eecf2fff936563b5775f711bfc5606e361219 HEAD \
            || { echo 'This commit predates the abuse-guard ratelimit family (018eecf2).'; exit 1; }
      - name: Copy the current value to every web Worker and read it back
        env:
          SHARED_SECRET: MEET_REALTIME_TOKEN_SECRET
          SOURCE_VALUE: ${{ secrets.MEET_REALTIME_TOKEN_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          value="$SOURCE_VALUE"
          unset SOURCE_VALUE
          # The shape assertSecretValue enforces, checked before the value
          # reaches a workflow command. The length is tested apart from the
          # pattern because some regex engines cap a repeat count at 255.
          shape='^[A-Za-z0-9+/=._-]+$'
          [[ "$value" =~ $shape ]] && (( ${#value} >= 32 && ${#value} <= 512 )) || { printf 'source value has an unexpected shape\n' >&2; exit 1; }
          printf '::add-mask::%s\n' "$value"
          node scripts/ci/shared-secret.mjs preflight "$SHARED_SECRET" production web
          printf '%s' "$value" | node scripts/ci/shared-secret.mjs write workers "$SHARED_SECRET" production web
          unset value
          node scripts/ci/shared-secret.mjs verify "$SHARED_SECRET" production web
