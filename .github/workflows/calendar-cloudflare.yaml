name: Native Calendar Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths: ['apps/calendar/**', 'packages/**', 'scripts/ci/wave1-*', '.github/workflows/wave1-*', '.github/workflows/calendar-cloudflare.yaml', 'tuturuuu.ci.ts', 'tuturuuu.ts', 'bun.lock', 'turbo.json', 'package.json', '!**/*.md', '!**/*.mdx']
  push:
    branches: [main]
    paths: ['apps/calendar/**', 'packages/**', 'scripts/ci/wave1-*', '.github/workflows/wave1-*', '.github/workflows/calendar-cloudflare.yaml', 'tuturuuu.ci.ts', 'tuturuuu.ts', 'bun.lock', 'turbo.json', 'package.json']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
  deployments: read
# PR revisions supersede. Running main/production/manual jobs never cancel;
# older pending main/manual runs coalesce. Uploads retain the independent
# queue:max / cancel-in-progress:false lock in wave1-native-publish.yaml.
concurrency:
  group: native-calendar-cloudflare-${{ github.ref }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when calendar is unaffected.
    # Every other event, and any error, resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-gate.mjs
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: calendar
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: calendar-cloudflare.yaml
  native-profiles:
    needs: [check-ci, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    permissions:
      contents: read
      actions: read
      deployments: read
    uses: ./.github/workflows/wave1-native-app.yaml
    with:
      app: calendar

  native-publish-staging:
    needs: native-profiles
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.native-profiles.outputs.staging_allowed == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/wave1-native-publish.yaml
    with:
      app: calendar
      profile: staging
    secrets:
      CLOUDFLARE_STAGING_API_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CLOUDFLARE_STAGING_API_TOKEN || '' }}
      WAVE1_CONTROL_READ_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.WAVE1_CONTROL_READ_TOKEN || '' }}
      STAGING_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_URL || '' }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || '' }}
