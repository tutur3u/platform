name: Native Calendar Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths: ['apps/calendar/**', 'packages/**', 'scripts/ci/wave1-*', '.github/workflows/wave1-*', '.github/workflows/calendar-cloudflare.yaml', 'tuturuuu.ci.ts', 'tuturuuu.ts', 'bun.lock', 'turbo.json', 'package.json', '!**/*.md', '!**/*.mdx']
  push:
    branches: [main]
    paths: ['apps/calendar/**', 'packages/**', 'scripts/ci/wave1-*', '.github/workflows/wave1-*', '.github/workflows/calendar-cloudflare.yaml', 'tuturuuu.ci.ts', 'tuturuuu.ts', 'bun.lock', 'turbo.json', 'package.json']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
  deployments: read
# PR revisions supersede. Main and production pushes and dispatches use
# separate groups by SHA, run and attempt, so a planner callee never shares a
# group that could replace it as "cancelled". Uploads serialize per app in the
# reusable publish workflows.
concurrency:
  group: native-calendar-cloudflare-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('-{0}-{1}-{2}-{3}', github.event_name, github.sha, github.run_id, github.run_attempt) || '' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when calendar is unaffected.
    # Non-PR events skip this job completely (0s, no runner allocated) so a
    # gate failure can never block a main or production deploy.
    if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: calendar
  check-ci:
    needs: affected-gate
    if: ${{ (!cancelled() && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      workflow_name: calendar-cloudflare.yaml
  # Production publication builds its own sealed bytes in
  # wave1-native-production.yaml, so the dual-profile qualification build
  # stays off the production branch.
  native-profiles:
    needs: [check-ci, affected-gate]
    if: ${{ (!cancelled() && needs.check-ci.result == 'success' && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true') && (needs.check-ci.outputs.should_run == 'true') && github.ref != 'refs/heads/production') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    permissions:
      contents: read
      actions: read
      deployments: read
    uses: ./.github/workflows/wave1-native-app.yaml
    with:
      app: calendar

  native-publish-staging:
    needs: native-profiles
    if: ${{ (!cancelled() && needs.native-profiles.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.native-profiles.outputs.staging_allowed == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    permissions:
      contents: read
      actions: read
      deployments: write
    uses: ./.github/workflows/wave1-native-publish.yaml
    with:
      app: calendar
      profile: staging
    secrets:
      CLOUDFLARE_STAGING_API_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.CLOUDFLARE_STAGING_API_TOKEN || '' }}
      WAVE1_CONTROL_READ_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.WAVE1_CONTROL_READ_TOKEN || '' }}
      STAGING_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_URL || '' }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || '' }}

  # Production pushes reach this workflow only through the Production
  # Deployment Planner, which selects it when the app is affected. Only a run
  # whose top-level workflow is the planner publishes: a direct dispatch of
  # this workflow on production is not part of the upload history, so the
  # manual route is a wave1-native-production.yaml dispatch. The policy
  # job re-reads the tuturuuu.ci.ts admission before any credential is
  # forwarded; the reusable publisher checks it again, builds and restores its
  # own sealed production bytes, then uploads once with a read-only preflight,
  # a rollback receipt and an unchanged serving-topology check.
  production-policy:
    needs: affected-gate
    if: (!cancelled() && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true') && github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(github.workflow_ref, '/.github/workflows/vercel-production.yaml@')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - id: policy
        run: node scripts/ci/production-publication-policy.ts calendar-cloudflare.yaml "$GITHUB_STEP_SUMMARY" --automatic

  native-publish-production:
    needs: [check-ci, production-policy]
    if: ${{ (!cancelled() && needs.check-ci.result == 'success' && needs.production-policy.result == 'success' && github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(github.workflow_ref, '/.github/workflows/vercel-production.yaml@') && needs.check-ci.outputs.should_run == 'true' && needs.production-policy.outputs.allowed == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    permissions:
      contents: read
      actions: read
      deployments: read
      # The reusable publisher reports to the deployment coordinator with OIDC.
      id-token: write
    uses: ./.github/workflows/wave1-native-production.yaml
    with:
      app: calendar
    # Environment-scoped credentials of wave1-calendar-production resolve in a
    # called workflow only when the caller inherits; admission gates it above.
    secrets: inherit
