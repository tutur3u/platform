name: CodeQL Manual Fallback

# Repository-owned CodeQL. GitHub default setup is not configured; do not enable
# it alongside this workflow (code scanning rejects advanced-setup uploads while
# default setup is on). Pull requests and main pushes scan the languages their
# diff touches; security-checks.yaml calls this workflow on its daily schedule.
# Merge queue (merge_group) runs scan the candidate merge commit M and gate it
# against the default-branch baseline. They are untrusted candidate code: scope
# and gate scripts load from the queue base B, every job stays on GitHub-hosted
# ubuntu-latest (the fork pull request pool) and only analyze holds
# security-events: write (scripts/ci/merge-group-workflow-policy.test.js).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    # Prose-only PRs have nothing to scan. Main pushes stay unfiltered so the
    # baseline the PR new-alert gate compares against is always complete.
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'apps/docs/**'
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

# The codeql- prefix keeps the group distinct from security-checks.yaml when
# this runs as its reusable workflow (github.workflow names the caller there).
concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1 && github.workflow == 'CodeQL Manual Fallback') && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('codeql-{0}-{1}-{2}{3}', github.event_name, github.event.pull_request.number || github.ref, (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest', github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '') }}
  # Only superseded PR scans are cancelled. Main pushes queue (one running,
  # newest pending) so the default-branch baseline that PR gates compare
  # against always completes during bursts of merges.
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}

permissions:
  contents: read

jobs:
  # No ci-check switchboard: its selectors run from the pull request checkout,
  # so a hostile copy could skip every scan. The scope job below selects scans
  # with base-commit scripts only and runs everything when they are missing.
  scope:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    name: Resolve CodeQL scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.scope.outputs.codeql_languages }}
      run: ${{ steps.scope.outputs.codeql }}
    steps:
      - name: Check out scope inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/github-deployment-markers.ts
            scripts/ci/resolve-changed-files-core.ts
            scripts/ci/resolve-changed-files.ts
            scripts/ci/security-paths.js
          sparse-checkout-cone-mode: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Scope scripts come from the base commit (main for scheduled runs),
      # never the checkout, so a pull request cannot switch its own gates off.
      # Without them (bootstrap) every scan runs.
      - name: Load trusted scope scripts
        id: trusted_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          trusted="$GITHUB_SHA"
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = merge_group ]; then
            trusted=""
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              trusted="$BASE_SHA"
            fi
          fi
          dir="$RUNNER_TEMP/trusted-scope"
          for file in scripts/ci/github-deployment-markers.ts scripts/ci/resolve-changed-files-core.ts \
            scripts/ci/resolve-changed-files.ts scripts/ci/security-paths.js; do
            if [ -z "$trusted" ] || ! git cat-file -e "$trusted:$file" 2>/dev/null; then
              echo "::warning::Trusted scope scripts are unavailable; running every scan."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            mkdir -p "$dir/$(dirname "$file")"
            git show "$trusted:$file" > "$dir/$file"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Compute changed files
        id: changed_files
        if: steps.trusted_scope.outputs.available == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_SCOPE: ${{ steps.trusted_scope.outputs.dir }}
          WORKFLOW_NAME: codeql.yml
        run: node --experimental-strip-types "$TRUSTED_SCOPE/scripts/ci/resolve-changed-files.ts"

      - name: Select CodeQL languages
        id: scope
        env:
          AVAILABLE: ${{ steps.trusted_scope.outputs.available }}
          CHANGED_FILES_FILE: ${{ steps.changed_files.outputs.changed_files_path }}
          TRUSTED_SCOPE: ${{ steps.trusted_scope.outputs.dir }}
        run: |
          set -euo pipefail
          if [ "$AVAILABLE" = true ]; then
            node "$TRUSTED_SCOPE/scripts/ci/security-paths.js" scope
          else
            printf '%s\n' 'codeql_languages=["actions","javascript-typescript","python"]' \
              codeql=true dependencies=true workflows=true | tee -a "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    if: (needs.scope.outputs.run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A merge group's base B, and a main push's pre-push commit, can sit
          # several commits below the tip. The new-alert gate loads from that
          # commit, so those runs fetch full history.
          fetch-depth: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 0 || 2 }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          build-mode: none
          languages: ${{ matrix.language }}
          queries: security-extended

      # Fork pull requests get a read-only token, so their results stay local
      # and only feed the new-alert gate below.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-sarif
          upload: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'never' || 'always' }}

      # Pre-existing alerts are tracked by the findings register. A pull
      # request, merge group, or push to main fails only for high or critical
      # results absent from the latest default-branch analysis. The gate
      # script loads from the base commit (the pull request merge commit's
      # first parent, the queue base B, or the pre-push SHA), never from the
      # candidate. A main push uploads only after this gate, so that baseline
      # is still the previous analysis. Permissions are unchanged.
      - name: Fail on new high or critical results
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASELINE_REF: refs/heads/${{ github.event.repository.default_branch }}
          CATEGORY: /language:${{ matrix.language }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          trusted="HEAD^1"
          if [ "$EVENT_NAME" = merge_group ]; then
            if ! [[ "$QUEUE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$QUEUE_BASE_SHA^{commit}" 2>/dev/null; then
              echo "::error::The merge group base commit is missing or invalid; refusing to gate."
              exit 1
            fi
            trusted="$QUEUE_BASE_SHA"
          fi
          if [ "$EVENT_NAME" = push ]; then
            if ! [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
              echo "::error::The main push base commit is missing or invalid; refusing to gate."
              exit 1
            fi
            trusted="$PUSH_BEFORE_SHA"
          fi
          # Never the checkout's copy: without the trusted gate (bootstrap)
          # every high/critical result fails, and a result whose rule or rule
          # severity is missing or not numeric counts as high.
          if git cat-file -e "$trusted:scripts/ci/codeql-new-alerts.js" 2>/dev/null; then
            gate="$RUNNER_TEMP/codeql-new-alerts.js"
            git show "$trusted:scripts/ci/codeql-new-alerts.js" > "$gate"
            node "$gate" "$RUNNER_TEMP/codeql-sarif" "$CATEGORY"
          else
            shopt -s nullglob
            sarif=("$RUNNER_TEMP"/codeql-sarif/*.sarif)
            [ "${#sarif[@]}" -gt 0 ] || { echo "::error::No SARIF output to gate."; exit 1; }
            # Public logs show counts only; results live in the maintainer-only
            # code-scanning view (Security tab), never in logs or artifacts.
            levels="$(jq -rs '[.[] | .runs[]? as $run
              | ([$run.tool.driver.rules[]?, ($run.tool.extensions[]?.rules[]?)]
                 | map({key: .id, value: (.properties["security-severity"]
                     | if type == "number" then .
                       elif type == "string" and test("^[0-9]+(\\.[0-9]+)?$") then tonumber
                       else 10 end)})
                 | from_entries) as $severity
              | $run.results[]?
              | ($severity[(.ruleId // .rule.id // "")] // 10)
              | select(. >= 7)]
              | "\(length) \(map(select(. >= 9)) | length) \(map(select(. < 9)) | length)"' "${sarif[@]}")"
            read -r count critical high <<< "$levels"
            echo "$count high/critical CodeQL result(s) ($critical critical, $high high); the trusted gate is unavailable, so every one fails."
            if [ "$count" -ne 0 ]; then
              echo "::error::Review the results in the repository's Security tab (code scanning, category $CATEGORY)."
            fi
            [ "$count" -eq 0 ]
          fi

      # After the gate. Uploading first would make this push the baseline it
      # is compared against, and a new high result would not fail the job.
      # The job permission security-events: write already covers this upload.
      - name: Upload main CodeQL results
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}

