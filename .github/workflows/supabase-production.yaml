name: Supabase Production Migration

on:
  workflow_run:
    workflows:
      - "Production Deployment Planner"
      - "Supabase Staging Migration"
    types:
      - completed
    branches:
      - production
      - main
  workflow_dispatch:
    inputs:
      allow_cloudflare_verification_failures:
        description: "Allow only verified canonical Cloudflare failures; all database prerequisites remain required"
        type: boolean
        default: false
      expected_sha:
        description: "Exact production SHA required when opting into migration recovery"
        type: string
        default: ""
      expected_project_ref:
        description: "Expected production project reference required for migration recovery"
        type: string
        default: ""

concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && ((github.event.workflow_run.name == 'Production Deployment Planner' && github.event.workflow_run.head_branch == 'production' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.event.workflow_run.name == 'Supabase Staging Migration' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'))))) && 'supabase-production-migration' || format('supabase-production-migration-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  evaluate-prerequisites:
    name: Evaluate production prerequisites
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && ((github.event.workflow_run.name == 'Production Deployment Planner' && github.event.workflow_run.head_branch == 'production' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.event.workflow_run.name == 'Supabase Staging Migration' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')))) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      should_deploy: ${{ steps.evaluate.outputs.should_deploy }}
      target_sha: ${{ steps.resolve_target.outputs.target_sha }}
      trusted_trigger: ${{ steps.trigger.outputs.trusted }}
    steps:
      - name: Verify trusted trigger
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_DISPATCH_REF: refs/heads/production
          # One producer per line: <workflow file> <workflow ID> <exact branch> <events> <conclusions>
          TRUSTED_PRODUCERS: |
            vercel-production.yaml 317228637 production push,workflow_dispatch success
            supabase-staging.yaml 47180097 main workflow_run,workflow_dispatch success
        run: |
          set -euo pipefail
          # Expression `==` ignores case and workflow_run matches producers by name, so
          # re-prove the trigger with exact comparisons before any privileged step runs.
          # Values come from the event file and runner variables, never interpolation.
          reject() {
            echo "::error::Untrusted trigger: $1"
            exit 1
          }
          field() {
            jq -r "$1 // \"\" | tostring" "$GITHUB_EVENT_PATH"
          }
          listed() {
            local item
            local -a items
            IFS=',' read -r -a items <<< "$2"
            for item in "${items[@]}"; do
              if [ "$item" = "$1" ] || [ "$item" = any ]; then
                return 0
              fi
            done
            return 1
          }

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ -z "${TRUSTED_DISPATCH_REF:-}" ] || [ "$GITHUB_REF" != "$TRUSTED_DISPATCH_REF" ]; then
                reject "manual runs must start from ${TRUSTED_DISPATCH_REF:-a trusted producer}"
              fi
              branch="${TRUSTED_DISPATCH_REF#refs/heads/}"
              head_sha="$GITHUB_SHA"
              ;;
            workflow_run)
              run_path="$(field .workflow_run.path)"
              file=""
              while read -r candidate workflow_id branch events conclusions; do
                if [ -n "$candidate" ] && [ "$run_path" = ".github/workflows/$candidate" ]; then
                  file="$candidate"
                  break
                fi
              done <<< "${TRUSTED_PRODUCERS:-}"
              [ -n "$file" ] || reject "producer path '$run_path' is not trusted"
              [ -n "$workflow_id" ] && [ "$(field .workflow_run.workflow_id)" = "$workflow_id" ] ||
                reject "producer workflow ID is not $file's ID $workflow_id"
              [ "$(field .workflow_run.head_branch)" = "$branch" ] ||
                reject "producer branch is not exactly '$branch'"
              listed "$(field .workflow_run.event)" "$events" ||
                reject "producer event is not one of $events"
              listed "$(field .workflow_run.conclusion)" "$conclusions" ||
                reject "producer conclusion is not one of $conclusions"
              [ "$(field .workflow_run.head_repository.full_name)" = "$GITHUB_REPOSITORY" ] &&
                [ "$(field .workflow_run.head_repository.id)" = "$GITHUB_REPOSITORY_ID" ] ||
                reject "producer head repository is not $GITHUB_REPOSITORY"
              head_sha="$(field .workflow_run.head_sha)"
              ;;
            *)
              reject "unsupported event '$GITHUB_EVENT_NAME'"
              ;;
          esac

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || reject "head SHA is not a full commit SHA"
          # Compare against the fully qualified branch ref: a bare name resolves a
          # same-named tag (refs/tags/<branch>) first. identical: the head SHA is the
          # live branch tip; behind: it is reachable from the branch. Deploy
          # consumers set REQUIRE_BRANCH_TIP so a re-run cannot redeploy an old commit.
          # With TIP_TREE_PATH, a head behind the tip is still current when that
          # directory's tree is unchanged at the tip (unrelated commits landed).
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/refs/heads/$branch...$head_sha" --jq .status)"
          if [ "${REQUIRE_BRANCH_TIP:-false}" = true ]; then
            if [ "$status" = behind ] && [ -n "${TIP_TREE_PATH:-}" ]; then
              [[ "$TIP_TREE_PATH" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] ||
                reject "TIP_TREE_PATH is not a nested repository path"
              tree_sha() {
                gh api "repos/$GITHUB_REPOSITORY/contents/${TIP_TREE_PATH%/*}?ref=$1" \
                  --jq ".[] | select(.type == \"dir\" and .name == \"${TIP_TREE_PATH##*/}\") | .sha"
              }
              tip_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
              [[ "$tip_sha" =~ ^[0-9a-f]{40}$ ]] || reject "cannot resolve the tip of $branch"
              head_tree="$(tree_sha "$head_sha")"
              [[ "$head_tree" =~ ^[0-9a-f]{40}$ ]] && [ "$head_tree" = "$(tree_sha "$tip_sha")" ] ||
                reject "head SHA is behind $branch and $TIP_TREE_PATH changed since"
            else
              [ "$status" = identical ] || reject "head SHA is not the live tip of $branch"
            fi
          else
            [ "$status" = identical ] || [ "$status" = behind ] ||
              reject "head SHA is not reachable from $branch"
          fi
          {
            echo "trusted=true"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Trusted trigger: $head_sha on $branch"

      - name: Resolve immutable production migration target
        id: resolve_target
        if: steps.trigger.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_SHA: ${{ steps.trigger.outputs.head_sha }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          ALLOW_CLOUDFLARE_VERIFICATION_FAILURES: ${{ inputs.allow_cloudflare_verification_failures }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
        run: |
          set -euo pipefail
          ALLOW_CLOUDFLARE_VERIFICATION_FAILURES=${ALLOW_CLOUDFLARE_VERIFICATION_FAILURES:-false}
          TARGET_SHA=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CURRENT_REF_NAME" != "production" ]; then
              echo "::notice::Skipping production migration because manual dispatches must run from the production branch. Current ref is '$CURRENT_REF_NAME'."
            else
              TARGET_SHA="$CURRENT_SHA"
              echo "Manual dispatch detected on production. Checking production migration prerequisites for $TARGET_SHA."
            fi
          elif [ "$TRIGGER_WORKFLOW" = "Production Deployment Planner" ]; then
            if [ "$TRIGGER_BRANCH" != "production" ]; then
              echo "::notice::Skipping production migration because the production deployment planner ran on '$TRIGGER_BRANCH' instead of production."
            elif [ "$TRIGGER_CONCLUSION" != "success" ]; then
              echo "::notice::Skipping production migration because the production deployment planner concluded with '$TRIGGER_CONCLUSION'."
            else
              TARGET_SHA="$TRIGGER_SHA"
              echo "Production deployment planner completed. Checking prerequisites for production migration at $TARGET_SHA..."
            fi
          elif [ "$TRIGGER_WORKFLOW" = "Supabase Staging Migration" ]; then
            if [ "$TRIGGER_BRANCH" != "main" ]; then
              echo "::notice::Skipping production migration re-evaluation because the staging migration trigger ran on '$TRIGGER_BRANCH' instead of main."
            elif [ "$TRIGGER_CONCLUSION" != "success" ]; then
              echo "::notice::Skipping production migration re-evaluation because the staging migration trigger concluded with '$TRIGGER_CONCLUSION'."
            else
              TARGET_SHA=$(gh api "repos/$REPOSITORY/git/ref/heads/production" \
                --jq '.object | if .type == "commit" then .sha else "" end')
              if [ -z "$TARGET_SHA" ]; then
                echo "::error::The current production ref did not resolve to a commit."
                exit 1
              fi
              echo "Staging migration completed. Re-checking production migration prerequisites for $TARGET_SHA..."
            fi
          else
            echo "::notice::Skipping production migration because the triggering workflow was '$TRIGGER_WORKFLOW'."
          fi

          if [ "$ALLOW_CLOUDFLARE_VERIFICATION_FAILURES" = "true" ] && \
             { [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$CURRENT_REF_NAME" != "production" ] || \
               ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$EXPECTED_SHA" != "$TARGET_SHA" ] || \
               ! [[ "$EXPECTED_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; }; then
            echo "::error::Migration recovery requires manual production dispatch and the exact expected SHA."
            exit 1
          fi

          if [ -n "$TARGET_SHA" ] && ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The production migration target must be a full commit SHA."
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Check out trusted prerequisite tooling
        if: steps.resolve_target.outputs.target_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        if: steps.resolve_target.outputs.target_sha != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compute pending migration changes
        if: steps.resolve_target.outputs.target_sha != ''
        id: changed_files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: supabase-production.yaml
        run: >-
          node --experimental-strip-types scripts/ci/resolve-changed-files.ts
          --head-sha "$TARGET_SHA" --ref-name production

      - name: Check migration configuration
        if: steps.resolve_target.outputs.target_sha != ''
        id: check_config
        env:
          CHANGED_FILES_FILE: ${{ steps.changed_files.outputs.changed_files_path }}
          WORKFLOW_NAME: supabase-production.yaml
        run: node --experimental-strip-types scripts/ci/check-workflow-config.ts

      - name: Evaluate prerequisite status
        if: steps.resolve_target.outputs.target_sha != ''
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_AFFECTED: ${{ steps.check_config.outputs.should_run }}
          ALLOW_CLOUDFLARE_VERIFICATION_FAILURES: ${{ inputs.allow_cloudflare_verification_failures }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ALLOW_CLOUDFLARE_VERIFICATION_FAILURES=${ALLOW_CLOUDFLARE_VERIFICATION_FAILURES:-false}

          SHOULD_DEPLOY=false

          if [ "$DATABASE_AFFECTED" != "true" ]; then
            echo "::notice::Skipping production migration because no database changes are pending."
          else
            echo "Checking production deployment planner status..."
            VERCEL_RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/vercel-production.yaml/runs?branch=production&head_sha=$TARGET_SHA&per_page=1" \
              --jq '.workflow_runs[0] // {} | {id: .id, name: .name, run_attempt: .run_attempt, conclusion: .conclusion, status: .status, created_at: .created_at, head_branch: .head_branch, head_sha: .head_sha}')

            VERCEL_CONCLUSION=$(echo "$VERCEL_RUN" | jq -r '.conclusion // "missing"')
            VERCEL_STATUS=$(echo "$VERCEL_RUN" | jq -r '.status // "missing"')
            VERCEL_BRANCH=$(echo "$VERCEL_RUN" | jq -r '.head_branch // "missing"')
            VERCEL_SHA=$(echo "$VERCEL_RUN" | jq -r '.head_sha // "missing"')

            echo "Production deployment planner status: $VERCEL_STATUS"
            echo "Production deployment planner conclusion: $VERCEL_CONCLUSION"
            echo "Production deployment planner branch: $VERCEL_BRANCH"
            echo "Production deployment planner SHA: $VERCEL_SHA"

            RECOVERY_ALLOWED=false
            if [ "$ALLOW_CLOUDFLARE_VERIFICATION_FAILURES" = "true" ]; then
              if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$CURRENT_REF_NAME" != "production" ] || \
                 ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$EXPECTED_SHA" != "$TARGET_SHA" ]; then
                echo "::error::Migration recovery requires manual production dispatch and the exact expected SHA."
                exit 1
              fi
              if [ "$VERCEL_STATUS" = "completed" ] && [ "$VERCEL_CONCLUSION" = "failure" ] && \
                 [ "$VERCEL_SHA" = "$TARGET_SHA" ] && [ "$VERCEL_BRANCH" = "production" ]; then
                RECOVERY_DIR=$(mktemp -d)
                trap 'rm -rf -- "$RECOVERY_DIR"' EXIT
                printf '%s\n' "$VERCEL_RUN" > "$RECOVERY_DIR/planner.json"
                chmod 600 "$RECOVERY_DIR/planner.json"
                PLANNER_ID=$(echo "$VERCEL_RUN" | jq -r '.id')
                PLANNER_ATTEMPT=$(echo "$VERCEL_RUN" | jq -r '.run_attempt')
                gh api --paginate --slurp \
                  "repos/${{ github.repository }}/actions/runs/$PLANNER_ID/attempts/$PLANNER_ATTEMPT/jobs?per_page=100" \
                  > "$RECOVERY_DIR/jobs.json"
                chmod 600 "$RECOVERY_DIR/jobs.json"
                RECOVERY_PLANNER_FILE="$RECOVERY_DIR/planner.json" \
                  RECOVERY_JOBS_FILE="$RECOVERY_DIR/jobs.json" GITHUB_OUTPUT="$RECOVERY_DIR/output" \
                  node --experimental-strip-types scripts/ci/check-production-migration-recovery.ts
                RECOVERY_ALLOWED=$(sed -n 's/^recovery_allowed=//p' "$RECOVERY_DIR/output")
              fi
            fi

            if [ "$VERCEL_SHA" != "$TARGET_SHA" ]; then
              echo "::notice::Skipping production migration because no production deployment planner run was found for $TARGET_SHA."
            elif [ "$VERCEL_BRANCH" != "production" ]; then
              echo "::notice::Skipping production migration because the matching production deployment planner ran on '$VERCEL_BRANCH'."
            elif [ "$VERCEL_CONCLUSION" != "success" ] && [ "$RECOVERY_ALLOWED" != "true" ]; then
              echo "::notice::Skipping production migration because the production deployment planner for $TARGET_SHA has conclusion '$VERCEL_CONCLUSION'."
            else
              echo "Checking successful production platform deployment marker..."
              DEPLOYMENT_MARKER_DEPLOYMENT=$(gh api \
                "repos/${{ github.repository }}/deployments?environment=vercel-production-platform&per_page=100" \
                | jq --arg sha "$TARGET_SHA" '
                  def payload_obj:
                    (.payload // {}) as $payload
                    | if ($payload | type) == "object" then $payload
                      elif ($payload | type) == "string" then ($payload | fromjson? // {})
                      else {}
                      end;

                  [
                    .[]
                    | . as $deployment
                    | (payload_obj) as $payload
                    | select(
                        ($deployment.sha == $sha and $payload.sha == $sha)
                        and ($payload.markerKind == "deployment")
                        and ($payload.workflowName == "vercel-production-platform.yaml")
                      )
                  ]
                  | sort_by(.created_at // "")
                  | reverse
                  | .[0] // {}
                  | {id: .id, sha: .sha}')

              DEPLOYMENT_MARKER_DEPLOYMENT_ID=$(echo "$DEPLOYMENT_MARKER_DEPLOYMENT" | jq -r '.id // ""')
              DEPLOYMENT_MARKER_SHA=$(echo "$DEPLOYMENT_MARKER_DEPLOYMENT" | jq -r '.sha // "missing"')

              echo "Production platform deployment marker deployment ID: ${DEPLOYMENT_MARKER_DEPLOYMENT_ID:-missing}"
              echo "Production platform deployment marker SHA: $DEPLOYMENT_MARKER_SHA"

              if [ -z "$DEPLOYMENT_MARKER_DEPLOYMENT_ID" ]; then
                echo "::notice::Skipping production migration because no production platform deployment marker was found for $TARGET_SHA."
              else
                DEPLOYMENT_MARKER_STATUSES=$(gh api \
                  "repos/${{ github.repository }}/deployments/$DEPLOYMENT_MARKER_DEPLOYMENT_ID/statuses")
                DEPLOYMENT_MARKER_STATE=$(echo "$DEPLOYMENT_MARKER_STATUSES" | jq -r '.[0].state // "missing"')
                DEPLOYMENT_MARKER_HAS_SUCCESS=$(echo "$DEPLOYMENT_MARKER_STATUSES" | jq -r '.[0].state == "success"')

                echo "Production platform deployment marker latest state: $DEPLOYMENT_MARKER_STATE"
                echo "Production platform deployment marker has success status: $DEPLOYMENT_MARKER_HAS_SUCCESS"

                if [ "$DEPLOYMENT_MARKER_HAS_SUCCESS" != "true" ]; then
                  echo "::notice::Skipping production migration because the production platform deployment marker for $TARGET_SHA does not have a current success status. Latest state is '$DEPLOYMENT_MARKER_STATE'."
                else
                  node --input-type=module <<'STAGING_SOURCE_PROOF'
          // Inline Node 24 verifier; no checkout-local helpers or external packages.
          const assert = (ok, code) => { if (!ok) throw new Error(code); };
          const positive = value => Number.isSafeInteger(value) && value > 0;
          const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
          const stamp = value => typeof value === 'string' && Number.isFinite(Date.parse(value));
          const snapshot = value => JSON.stringify(value, (_key, item) =>
            item && typeof item === 'object' && !Array.isArray(item)
              ? Object.fromEntries(Object.entries(item).sort(([a], [b]) => a.localeCompare(b))) : item);
          const repo = process.env.GITHUB_REPOSITORY;
          const target = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          const api = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/$/, '');
          const server = (process.env.GITHUB_SERVER_URL || 'https://github.com').replace(/\/$/, '');
          const workflowPath = '.github/workflows/supabase-staging.yaml';
          const workflowName = 'supabase-staging.yaml';
          const environment = 'supabase-staging';
          const deadline = Date.now() + 120000;
          let requests = 0;

          async function get(route) {
            assert(route.startsWith('/repos/') && ++requests <= 50, 'request-budget');
            const remaining = deadline - Date.now();
            assert(remaining > 0, 'proof-deadline');
            const response = await fetch(`${api}${route}`, {
              method: 'GET', redirect: 'error',
              headers: {
                Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
              signal: AbortSignal.timeout(Math.min(10000, remaining)),
            });
            assert(response.ok, 'api-response');
            const reader = response.body.getReader();
            const chunks = [];
            let size = 0;
            try {
              for (;;) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.byteLength;
                assert(size <= 2097152, 'response-size');
                chunks.push(Buffer.from(value));
              }
            } finally {
              await reader.cancel();
            }
            return {
              data: JSON.parse(Buffer.concat(chunks).toString('utf8')),
              next: /rel="next"/.test(response.headers.get('link') || ''),
            };
          }

          async function inventory(route, key) {
            const result = [];
            const ids = new Set();
            let total;
            for (let page = 1; page <= 5; page++) {
              const { data, next } = await get(`${route}${route.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
              const rows = key ? data[key] : data;
              assert(Array.isArray(rows) && rows.length <= 100, 'inventory-shape');
              if (key) {
                assert(Number.isSafeInteger(data.total_count) && data.total_count >= 0,
                  'inventory-count');
                total ??= data.total_count;
                assert(total === data.total_count && total <= 499, 'inventory-overflow-or-change');
              }
              for (const row of rows) {
                assert(positive(row.id) && !ids.has(row.id), 'inventory-identity');
                ids.add(row.id);
                result.push(row);
              }
              if (rows.length < 100 && !next) {
                assert(!key || total === result.length, 'inventory-incomplete');
                return result;
              }
            }
            throw new Error('inventory-overflow');
          }

          function payload(deployment) {
            const p = typeof deployment.payload === 'string'
              ? JSON.parse(deployment.payload) : deployment.payload;
            assert(p && typeof p === 'object' && !Array.isArray(p), 'marker-payload');
            return p;
          }

          async function latestMarker() {
            const rows = await inventory(`${base}/deployments?environment=${environment}&sha=${target}`);
            assert(rows.length > 0, 'marker-missing');
            assert(rows.every(d => d.sha === target && d.environment === environment && stamp(d.created_at)),
              'marker-inventory-source');
            rows.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            // Never fall back to an older successful marker after the newest is rejected.
            return rows[0];
          }

          function checkMarker(d) {
            const p = payload(d);
            assert(positive(d.id) && d.sha === target && d.ref === target &&
              d.environment === environment && p.sha === target && p.markerKind === 'deployment' &&
              p.workflowName === workflowName && p.refName === 'main' && p.ref === 'refs/heads/main',
              'marker-source-contract');
            assert(typeof p.runId === 'string' && /^[1-9][0-9]*$/.test(p.runId) &&
              typeof p.runAttempt === 'string' && /^[1-9][0-9]*$/.test(p.runAttempt), 'marker-producer');
            assert(positive(Number(p.runId)) && positive(Number(p.runAttempt)), 'marker-producer-range');
            assert(p.runUrl === `${server}/${repo}/actions/runs/${p.runId}`, 'marker-run-url');
            return p;
          }

          function checkRun(run, p, repository, workflow) {
            assert(run.id === Number(p.runId) && run.run_attempt === Number(p.runAttempt) &&
              run.workflow_id === workflow.id && run.path === workflowPath &&
              run.head_branch === 'main' && sha(run.head_sha) &&
              ['workflow_run', 'workflow_dispatch'].includes(run.event) &&
              run.status === 'completed' && run.conclusion === 'success' &&
              run.repository?.id === repository.id && run.repository?.full_name === repo &&
              run.head_repository?.id === repository.id && run.head_repository?.full_name === repo,
              'producer-current-attempt-contract');
            // For workflow_run, the pinned emitting contract binds TARGET_SHA independently
            // of the wrapper head. Manual main dispatch checks out its own head.
            assert(run.event !== 'workflow_dispatch' || run.head_sha === target, 'manual-source');
          }

          const contracts = [
            [workflowPath, ['c80066e1cd038fcda3bd6c1a79c0b12993b94b49', '70937258932e55cf611c2896b788da0392c09717', '68449e684d33ca9608e6c873563ca3092543ca6c', 'ec2f81d196eff45ba05d2b87ad5bd1bb98b194da', 'd880c279f37b63628706b195e5397be1cf25acd5']],
            ['scripts/ci/record-deployment-marker.ts', ['35eaf73931589cfe9dd62f7456a3dbe3c48c988c']],
          ];
          async function checkContracts(producerHead) {
            for (const [path, allowed] of contracts) {
              const unique = new Set();
              for (const revision of new Set([target, producerHead])) {
                const { data: entry } = await get(`${base}/contents/${path}?ref=${revision}`);
                assert(entry.type === 'file' && entry.path === path && allowed.includes(entry.sha),
                  'unknown-producer-contract');
                unique.add(entry.sha);
              }
              // Resolve each commit, then rehash each distinct allowlisted Git blob.
              for (const expected of unique) {
                const { data: blob } = await get(`${base}/git/blobs/${expected}`);
                assert(blob.sha === expected && blob.encoding === 'base64' &&
                  Number.isSafeInteger(blob.size) && blob.size > 0 && blob.size <= 65536 &&
                  typeof blob.content === 'string', 'contract-blob-shape');
                const bytes = Buffer.from(blob.content.replace(/\s/g, ''), 'base64');
                assert(bytes.length === blob.size, 'contract-blob-size');
                const object = Buffer.concat([Buffer.from(`blob ${bytes.length}\0`), bytes]);
                const digest = Buffer.from(await crypto.subtle.digest('SHA-1', object)).toString('hex');
                assert(digest === expected, 'contract-blob-hash');
              }
            }
          }

          async function latestStatus(id, p) {
            const { data } = await get(`${base}/deployments/${id}/statuses?per_page=1&page=1`);
            assert(Array.isArray(data) && data.length === 1 && positive(data[0].id) &&
              data[0].state === 'success' && data[0].environment === environment &&
              data[0].log_url === p.runUrl, 'marker-latest-status');
            return data[0];
          }

          let base;
          async function main() {
            assert(typeof repo === 'string' && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo) &&
              sha(target) && typeof token === 'string' && token.length > 0, 'proof-input');
            for (const origin of [api, server]) {
              const url = new URL(origin);
              assert(url.protocol === 'https:' && !url.username && !url.password &&
                !url.search && !url.hash, 'proof-origin');
            }
            base = `/repos/${repo}`;
            const { data: repository } = await get(base);
            assert(positive(repository.id) && repository.full_name === repo &&
              repository.default_branch === 'main', 'repository-identity');
            const { data: workflow } = await get(`${base}/actions/workflows/${workflowName}`);
            assert(positive(workflow.id) && workflow.path === workflowPath &&
              workflow.name === 'Supabase Staging Migration' && workflow.state === 'active',
              'workflow-identity');
            const marker = await latestMarker();
            const p = checkMarker(marker);
            const runRoute = `${base}/actions/runs/${p.runId}`;
            const { data: run } = await get(runRoute);
            checkRun(run, p, repository, workflow);
            const status = await latestStatus(marker.id, p);
            await checkContracts(run.head_sha);
            const jobs = await inventory(`${runRoute}/attempts/${p.runAttempt}/jobs`, 'jobs');
            assert(jobs.length === 1, 'migration-job-inventory');
            const job = jobs[0];
            assert(job.name === 'Migrate staging database' && job.run_id === run.id &&
              job.run_attempt === run.run_attempt && job.head_sha === run.head_sha &&
              job.status === 'completed' && job.conclusion === 'success' &&
              stamp(job.started_at) && stamp(job.completed_at) &&
              Date.parse(job.completed_at) >= Date.parse(job.started_at) && Array.isArray(job.steps),
              'migration-job-contract');
            const critical = ['Check out migration target', 'Deploy migrations to staging',
              'Record successful staging migration marker'];
            let previous = 0;
            for (const name of critical) {
              const steps = job.steps.filter(step => step.name === name);
              assert(steps.length === 1, 'migration-step-identity');
              const step = steps[0];
              assert(positive(step.number) && step.number > previous &&
                step.status === 'completed' && step.conclusion === 'success' &&
                stamp(step.started_at) && stamp(step.completed_at) &&
                Date.parse(step.completed_at) >= Date.parse(step.started_at), 'migration-step-success');
              previous = step.number;
            }
            // Sequential re-reads bound the observation; they cannot make GitHub atomic.
            const newest = await latestMarker();
            assert(snapshot(newest) === snapshot(marker), 'marker-selection-changed');
            const { data: rereadMarker } = await get(`${base}/deployments/${marker.id}`);
            checkMarker(rereadMarker);
            assert(snapshot(rereadMarker) === snapshot(marker), 'marker-changed');
            const rereadStatus = await latestStatus(marker.id, p);
            assert(snapshot(rereadStatus) === snapshot(status), 'marker-status-changed');
            const { data: rereadRun } = await get(runRoute);
            checkRun(rereadRun, p, repository, workflow);
            assert(snapshot(rereadRun) === snapshot(run), 'producer-changed');
            assert(Date.now() <= deadline, 'proof-deadline');
            console.log(`Staging source proof: source=${target} producer=${run.id} attempt=${run.run_attempt} deployment=${marker.id}`);
          }
          main().catch(() => {
            // Never echo API bodies, exceptions, credentials, or environment values.
            console.error('::error::Exact-source staging proof unavailable or changed; refusing production migration.');
            process.exitCode = 1;
          });
          STAGING_SOURCE_PROOF
                  echo "Production platform deployment marker and staging migration are bound to $TARGET_SHA. Proceeding with migration."
                  SHOULD_DEPLOY=true
                fi
              fi
            fi
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

  deploy:
    name: Migrate production database
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Branch-restricted (main for workflow_run, production for dispatch) so
    # other branches cannot read the Management API token or DB password.
    environment: supabase-production-migrations
    needs: [evaluate-prerequisites]
    if: needs.evaluate-prerequisites.outputs.trusted_trigger == 'true' && needs.evaluate-prerequisites.outputs.should_deploy == 'true'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out approved migration target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evaluate-prerequisites.outputs.target_sha }}
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Deploy migrations to production
        env:
          PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          ALLOW_CLOUDFLARE_VERIFICATION_FAILURES: ${{ inputs.allow_cloudflare_verification_failures }}
          EXPECTED_PROJECT_REF: ${{ inputs.expected_project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        run: |
          if [ "$ALLOW_CLOUDFLARE_VERIFICATION_FAILURES" = "true" ] && \
             { [ -z "$EXPECTED_PROJECT_REF" ] || [ "$PRODUCTION_PROJECT_ID" != "$EXPECTED_PROJECT_REF" ]; }; then
            echo "::error::Migration recovery production project binding does not match."
            exit 1
          fi
          # Fail closed unless the environment targets the production project.
          if [ "$PRODUCTION_PROJECT_ID" != "nzamlzqfdwaaxdefwraj" ]; then
            echo "::error::PRODUCTION_PROJECT_ID does not match the production project ref."
            exit 1
          fi
          cd apps/database
          supabase link --project-ref "$PRODUCTION_PROJECT_ID"
          supabase db push --include-all

      - name: Record successful production migration marker
        env:
          DEPLOYMENT_MARKER_REF_NAME: production
          DEPLOYMENT_MARKER_SHA: ${{ needs.evaluate-prerequisites.outputs.target_sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: supabase-production.yaml
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types
          scripts/ci/record-deployment-marker.ts
