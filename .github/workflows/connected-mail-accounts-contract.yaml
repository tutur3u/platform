name: Connected Mail database contract
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/supabase/tests/connected-mail-accounts.sql"
      - "apps/database/scripts/verify-connected-mail-accounts-contract.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - '.github/actions/cache-supabase-images/**'
      - 'scripts/ci/supabase-image-cache*'
      - "apps/database/scripts/programming-database-tap.mjs"
      - "apps/database/scripts/programming-database-tap.test.mjs"
      - "apps/database/scripts/connected-mail-accounts-contract.test.mjs"
      - "apps/database/scripts/connected-mail-types-drift*"
      - "packages/types/src/supabase.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/connected-mail-accounts-contract.yaml"
  push:
    branches: [main, production]
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/supabase/tests/connected-mail-accounts.sql"
      - "apps/database/scripts/verify-connected-mail-accounts-contract.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - "apps/database/scripts/programming-database-tap.mjs"
      - "apps/database/scripts/programming-database-tap.test.mjs"
      - "apps/database/scripts/connected-mail-accounts-contract.test.mjs"
      - "apps/database/scripts/connected-mail-types-drift*"
      - "packages/types/src/supabase.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/connected-mail-accounts-contract.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ready-for-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: connected-mail-accounts-contract.yaml
  contract:
    needs: check-ci
    if: ${{ (always() && needs.check-ci.result == 'success') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - name: Require an enabled contract gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: ./.github/actions/cache-supabase-images
      - name: Verify TAP parser and bounded fixture sessions
        run: node --test apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/connected-mail-accounts-contract.test.mjs apps/database/scripts/connected-mail-types-drift.test.mjs
      - name: Apply complete schema, run strict pgTAP, generate actual schema types
        run: node apps/database/scripts/verify-connected-mail-accounts-contract.mjs
      - name: Reject drift in the three private Connected Mail tables
        run: node apps/database/scripts/connected-mail-types-drift.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connected-mail-accounts-types-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/types/src/supabase.ts
          if-no-files-found: error
          retention-days: 3
