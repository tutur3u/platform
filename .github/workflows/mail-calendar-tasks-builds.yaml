name: Mail Calendar Tasks builds
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'scripts/safe-fs.js'
      - 'apps/mail/**'
      - 'apps/calendar/**'
      - 'apps/web/**'
      - 'apps/tasks/**'
      - 'packages/**'
      - 'bun.lock'
      - 'turbo.json'
      - 'package.json'
      - 'patches/**'
      - 'scripts/ci/mail-calendar-tasks-affected*'
      - 'scripts/ci/calendar-native-*'
      - 'scripts/ci/calendar-cf-types*'
      - 'scripts/ci/calendar-cf-fixture*'
      - 'scripts/ci/calendar-cf-files*'
      - 'scripts/ci/calendar-cf-output*'
      - 'scripts/ci/calendar-cf-archive.py'
      - 'scripts/ci/native-source-identity-test-helper.js'
      - 'scripts/ci/apps-native-runtime-pointer.mjs'
      - 'scripts/ci/calendar-emitted-defaults*'
      - 'scripts/ci/tasks-native-artifact*'
      - 'scripts/ci/apps-native-artifact.py'
      - '.github/actions/**'
      - '.github/workflows/ci-check.yml'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/mail-calendar-tasks-builds.yaml'
      - '!**/*.md'
      - '!**/*.mdx'
  push:
    branches: [main]
    paths:
      - 'scripts/safe-fs.js'
      - 'apps/mail/**'
      - 'apps/calendar/**'
      - 'apps/web/**'
      - 'apps/tasks/**'
      - 'packages/**'
      - 'bun.lock'
      - 'turbo.json'
      - 'package.json'
      - 'patches/**'
      - 'scripts/ci/mail-calendar-tasks-affected*'
      - 'scripts/ci/calendar-native-*'
      - 'scripts/ci/calendar-cf-types*'
      - 'scripts/ci/calendar-cf-fixture*'
      - 'scripts/ci/calendar-cf-files*'
      - 'scripts/ci/calendar-cf-output*'
      - 'scripts/ci/calendar-cf-archive.py'
      - 'scripts/ci/native-source-identity-test-helper.js'
      - 'scripts/ci/apps-native-runtime-pointer.mjs'
      - 'scripts/ci/calendar-emitted-defaults*'
      - 'scripts/ci/tasks-native-artifact*'
      - 'scripts/ci/apps-native-artifact.py'
      - '.github/actions/**'
      - '.github/workflows/ci-check.yml'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/mail-calendar-tasks-builds.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mail-calendar-tasks-builds.yaml
  build-mail:
    name: build (mail)
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true' && toJSON(fromJSON(needs.check-ci.outputs.affected_jobs || '{}').mail) != 'false') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mail-calendar-tasks-ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_programming_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://mail-calendar-tasks-ci.invalid
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Record Mail route tree presence before frontend build
        id: mail-route-tree-before
        run: |
          route_tree=apps/mail/src/routeTree.gen.ts
          if [ -e "$route_tree" ] || [ -L "$route_tree" ]; then
            echo 'state=present' >> "$GITHUB_OUTPUT"
          else
            echo 'state=absent' >> "$GITHUB_OUTPUT"
          fi
      - name: Build application and shared dependencies without deployment
        id: mail-frontend-build
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=2 --filter=@tuturuuu/mail
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.ref != 'refs/heads/production' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Capture generated Mail route tree evidence
        if: always()
        env:
          MAIL_ROUTE_TREE_BEFORE: ${{ steps.mail-route-tree-before.outputs.state || 'unknown' }}
          MAIL_FRONTEND_BUILD_OUTCOME: ${{ steps.mail-frontend-build.outcome || 'unknown' }}
        run: |
          route_tree=apps/mail/src/routeTree.gen.ts
          if [ ! -f "$route_tree" ]; then
            echo '::notice::Mail route tree is absent; no generated evidence captured'
            exit 0
          fi
          head_tracked=false
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            head_tracked=true
          fi
          source_origin=unproven
          if [ "$MAIL_ROUTE_TREE_BEFORE" = absent ] && [ "$head_tracked" = false ]; then
            case "$MAIL_FRONTEND_BUILD_OUTCOME" in
              success|failure) source_origin=fresh-bootstrap ;;
            esac
          fi
          evidence="$RUNNER_TEMP/mail-route-tree-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$evidence"
          cp "$route_tree" "$evidence/routeTree.gen.ts"
          {
            printf 'source_head=%s\n' "$(git rev-parse HEAD)"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'prebuild_state=%s\n' "$MAIL_ROUTE_TREE_BEFORE"
            printf 'head_tracked=%s\n' "$head_tracked"
            printf 'build_outcome=%s\n' "$MAIL_FRONTEND_BUILD_OUTCOME"
            printf 'source_origin=%s\n' "$source_origin"
            printf 'bun_lock_sha256=%s\n' "$(sha256sum bun.lock | cut -d ' ' -f 1)"
            printf 'route_tree_sha256=%s\n' "$(sha256sum "$evidence/routeTree.gen.ts" | cut -d ' ' -f 1)"
          } > "$evidence/source-receipt.txt"
      - name: Retain generated Mail route tree evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mail-route-tree-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mail-route-tree-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Reject tracked Mail route tree drift
        if: always()
        run: |
          route_tree=apps/mail/src/routeTree.gen.ts
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            git diff --exit-code HEAD -- "$route_tree"
          fi
  build-tasks:
    name: build (tasks)
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true' && toJSON(fromJSON(needs.check-ci.outputs.affected_jobs || '{}').tasks) != 'false') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mail-calendar-tasks-ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_programming_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://mail-calendar-tasks-ci.invalid
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Tasks native artifact helper regressions
        run: python3 scripts/ci/tasks-native-artifact.test.py
      - name: Build application and shared dependencies without deployment
        id: mail-frontend-build
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=2 --filter=@tuturuuu/tasks
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.ref != 'refs/heads/production' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}
      - name: Build the native Tasks candidate
        run: bun run --cwd apps/tasks build:cloudflare
      - name: Qualify the emitted Tasks Worker config
        run: python3 scripts/ci/tasks-native-artifact.py config apps/tasks
      - name: Seal the native Tasks output
        env:
          TASKS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/tasks-native-artifact.py seal apps/tasks --receipt "$RUNNER_TEMP/tasks-native-artifact.json"
      - name: Serve the exact offline fallback from the emitted Worker
        timeout-minutes: 4
        run: bun run --cwd apps/tasks test:runtime
      - name: Confirm the runtime check left the sealed output unchanged
        env:
          TASKS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/tasks-native-artifact.py verify apps/tasks --receipt "$RUNNER_TEMP/tasks-native-artifact.json"

  build-web:
    name: build (web)
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true' && toJSON(fromJSON(needs.check-ci.outputs.affected_jobs || '{}').web) != 'false') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mail-calendar-tasks-ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_programming_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://mail-calendar-tasks-ci.invalid
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Build application and shared dependencies without deployment
        id: mail-frontend-build
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=2 --filter=@tuturuuu/web
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.ref != 'refs/heads/production' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

  calendar-native:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true' && toJSON(fromJSON(needs.check-ci.outputs.affected_jobs || '{}').calendar) != 'false') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: https://calendar-ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_calendar_ci_placeholder
      NEXT_PUBLIC_APP_URL: https://calendar-ci.invalid
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      SUPABASE_SECRET_KEY: calendar_ci_private_canary_never_ship_349
      WRANGLER_SEND_METRICS: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
      - name: Assert source and toolchain identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(bun --version)" = 1.4.4
          test "$(node --version)" = v24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Test artifact boundary regressions
        run: node --test scripts/ci/calendar-native-source-identity.test.js scripts/ci/calendar-native-artifact.test.mjs scripts/ci/calendar-emitted-defaults.test.mjs scripts/ci/calendar-native-typegen.test.mjs scripts/ci/calendar-cf-types.test.mjs scripts/ci/calendar-cf-fixture.test.mjs scripts/ci/calendar-cf-files.test.mjs scripts/ci/calendar-cf-output.test.mjs
      - name: Build shared dependencies without a legacy Calendar build
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter='@tuturuuu/calendar^...' --filter='@tuturuuu/web^...' --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.ref != 'refs/heads/production' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}
      - name: Record Calendar route tree presence before frontend build
        id: calendar-route-tree-before
        run: |
          route_tree=apps/calendar/src/routeTree.gen.ts
          if [ -e "$route_tree" ] || [ -L "$route_tree" ]; then
            echo 'state=present' >> "$GITHUB_OUTPUT"
          else
            echo 'state=absent' >> "$GITHUB_OUTPUT"
          fi
      - name: Build native Calendar with the official Void plugin
        id: calendar-native-build
        run: bun run --cwd apps/calendar build
      - name: Capture generated Calendar route tree evidence
        if: always()
        env:
          CALENDAR_ROUTE_TREE_BEFORE: ${{ steps.calendar-route-tree-before.outputs.state || 'unknown' }}
          CALENDAR_NATIVE_BUILD_OUTCOME: ${{ steps.calendar-native-build.outcome || 'unknown' }}
        run: |
          route_tree=apps/calendar/src/routeTree.gen.ts
          if [ ! -f "$route_tree" ]; then
            echo '::notice::Calendar route tree is absent; no generated evidence captured'
            exit 0
          fi
          head_tracked=false
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            head_tracked=true
          fi
          source_origin=unproven
          if [ "$CALENDAR_ROUTE_TREE_BEFORE" = absent ] && [ "$head_tracked" = false ]; then
            case "$CALENDAR_NATIVE_BUILD_OUTCOME" in
              success|failure) source_origin=fresh-bootstrap ;;
            esac
          fi
          evidence="$RUNNER_TEMP/calendar-route-tree-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$evidence"
          cp "$route_tree" "$evidence/routeTree.gen.ts"
          {
            printf 'expected_source_sha=%s\n' "$SOURCE_SHA"
            printf 'source_head=%s\n' "$(git rev-parse HEAD)"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'prebuild_state=%s\n' "$CALENDAR_ROUTE_TREE_BEFORE"
            printf 'head_tracked=%s\n' "$head_tracked"
            printf 'build_outcome=%s\n' "$CALENDAR_NATIVE_BUILD_OUTCOME"
            printf 'source_origin=%s\n' "$source_origin"
            printf 'bun_lock_sha256=%s\n' "$(sha256sum bun.lock | cut -d ' ' -f 1)"
            printf 'route_tree_sha256=%s\n' "$(sha256sum "$evidence/routeTree.gen.ts" | cut -d ' ' -f 1)"
          } > "$evidence/source-receipt.txt"
      - name: Retain generated Calendar route tree evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-route-tree-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-route-tree-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Reject tracked Calendar route tree drift
        if: always()
        run: |
          route_tree=apps/calendar/src/routeTree.gen.ts
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            git diff --exit-code HEAD -- "$route_tree"
          fi
      - name: Run owning Calendar, Web and shared Tasks tests
        run: |
          bun run --cwd apps/calendar test
          bun run --cwd apps/web test
          bun run --cwd packages/tasks-ui test
      - name: Discover and qualify emitted Worker config
        id: output
        run: node scripts/ci/calendar-native-artifact.mjs config apps/calendar "$SOURCE_SHA"
      - name: Record bounded calendar native emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/calendar "$SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config-calendar.json"
      - name: Retain calendar diagnostic config receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-native-config-receipt-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-emitted-config-calendar.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate bindings from the actual emitted config
        working-directory: apps/calendar
        env:
          CALENDAR_EMITTED_CONFIG: ${{ steps.output.outputs.config }}
        run: |
          typegen_dir="$(mktemp -d "${RUNNER_TEMP:?}/calendar-typegen.XXXXXX")"
          trap 'rm -rf -- "$typegen_dir"' EXIT
          typegen_file="$typegen_dir/cloudflare-env.d.ts"
          bun x --no-install wrangler types --config "$CALENDAR_EMITTED_CONFIG" --env-interface CloudflareEnv --include-runtime=false "$typegen_file"
          if [[ ! -f "$typegen_file" || ! -s "$typegen_file" || -L "$typegen_file" ]]; then
            printf '%s\n' 'Reference generator did not produce a regular, nonempty bindings file' >&2
            exit 1
          fi
          node ../../scripts/ci/calendar-cf-types.mjs --config "$CALENDAR_EMITTED_CONFIG" --reference "$typegen_file" --sha "$SOURCE_SHA" > "$typegen_dir/cf-types.json"
          cp -- "$typegen_dir/cf-types.json" "$RUNNER_TEMP/calendar-cf-types.json"
      - name: Retain Calendar binding type parity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-cf-types-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/calendar-cf-types.json
          retention-days: 7
          if-no-files-found: error
      - name: Check Calendar native Worker and affected Web Tasks consumers
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run type-check --filter=@tuturuuu/calendar --filter=@tuturuuu/web --filter=@tuturuuu/tasks --filter=@tuturuuu/tasks-ui --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.ref != 'refs/heads/production' && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}
      - name: Validate actual Worker bundle without publication
        working-directory: apps/calendar
        run: bun x --no-install wrangler deploy --dry-run --config "${{ steps.output.outputs.config }}" --outdir "$RUNNER_TEMP/calendar-dry-run"
      - name: Seal source and emitted artifact identity
        id: calendar-canonical-seal
        run: node scripts/ci/calendar-native-artifact.mjs seal apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
      - name: Qualify Calendar cf Build Output without publication
        run: node scripts/ci/calendar-cf-output.mjs emit apps/calendar "$SOURCE_SHA" "$RUNNER_TEMP/calendar-cf-output"
      - name: Exercise exact emitted Worker public routes
        id: calendar-runtime
        timeout-minutes: 3
        run: node scripts/ci/calendar-native-worker.runtime.mjs "$SOURCE_SHA"
      - name: Retain sanitized Calendar SSR fixture diagnostics
        if: ${{ always() && steps.calendar-runtime.outputs.ssr_diagnostic != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-ssr-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.calendar-runtime.outputs.ssr_diagnostic }}
          retention-days: 3
          if-no-files-found: error
      - name: Exercise exact emitted offline asset
        working-directory: apps/calendar
        run: node --test src/runtime/offline-artifact.runtime.mjs
      - name: Verify cf comparison after runtime checks
        run: node scripts/ci/calendar-cf-output.mjs verify apps/calendar "$SOURCE_SHA" "$RUNNER_TEMP/calendar-cf-output"
      - name: Verify runtime checks left the sealed artifact unchanged
        run: |
          node scripts/ci/calendar-native-artifact.mjs verify apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
          pointer=.wrangler/deploy/config.json
          if [ -f apps/calendar/.void/preview-deploy-config.json ]; then
            pointer=.void/preview-deploy-config.json
          fi
          tar -czf "$RUNNER_TEMP/calendar-worker.tar.gz" -C apps/calendar dist "$pointer" cloudflare-env.d.ts calendar-artifact.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-worker-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/calendar-worker.tar.gz
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Pack verified Calendar cf comparison output
        run: tar -czf "$RUNNER_TEMP/calendar-cf-output.tar.gz" -C "$RUNNER_TEMP/calendar-cf-output" .
      - name: Retain Calendar cf comparison output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-cf-output-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/calendar-cf-output.tar.gz
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Verify and pack failed-job sealed source for debugging
        id: calendar-debug-pack
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        if: ${{ failure() && steps.calendar-canonical-seal.outcome == 'success' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/ci/calendar-native-artifact.mjs verify apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
          pointer=.wrangler/deploy/config.json
          if [ -f apps/calendar/.void/preview-deploy-config.json ]; then
            pointer=.void/preview-deploy-config.json
          fi
          tar -czf "$RUNNER_TEMP/calendar-debug-sealed-source.tar.gz" -C apps/calendar dist "$pointer" cloudflare-env.d.ts calendar-artifact.json
          verify_dir="$(mktemp -d "${RUNNER_TEMP:?}/calendar-debug-verify.XXXXXX")"
          trap 'rm -rf -- "$verify_dir"' EXIT
          tar -xzf "$RUNNER_TEMP/calendar-debug-sealed-source.tar.gz" -C "$verify_dir"
          cmp "apps/calendar/calendar-artifact.json" "$verify_dir/calendar-artifact.json"
          node scripts/ci/calendar-native-artifact.mjs verify "$verify_dir" "$SOURCE_SHA" "$verify_dir/calendar-artifact.json"
          node scripts/ci/calendar-native-artifact.mjs verify apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
          printf 'classification=DEBUG sealed source; NOT qualified release\nexpected_source_sha=%s\ncheckout_head=%s\ngithub_sha=%s\nworkflow_source_sha=%s\nevent_name=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$(git rev-parse HEAD)" "$GITHUB_SHA" "$WORKFLOW_SOURCE_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/calendar-debug-sealed-source.txt"
          sha256sum "$RUNNER_TEMP/calendar-debug-sealed-source.tar.gz" "apps/calendar/calendar-artifact.json" >> "$RUNNER_TEMP/calendar-debug-sealed-source.txt"
      - name: Retain failed-job sealed source for debugging
        if: ${{ failure() && steps.calendar-canonical-seal.outcome == 'success' && steps.calendar-debug-pack.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-debug-sealed-source-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/calendar-debug-sealed-source.tar.gz
            ${{ runner.temp }}/calendar-debug-sealed-source.txt
          retention-days: 3
          if-no-files-found: error
  calendar-artifact-restore:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    needs: calendar-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.0
      - name: Assert restored-job source and toolchain identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(bun --version)" = 1.4.4
          test "$(node --version)" = v24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: calendar-worker-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/calendar-restore
      - name: Download same-run cf comparison archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: calendar-cf-output-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/calendar-cf-output-download
      - name: Restore same-run cf comparison output
        run: |
          archive="$RUNNER_TEMP/calendar-cf-output-download/calendar-cf-output.tar.gz"
          tar -tzf "$archive" > "$RUNNER_TEMP/calendar-cf-output.entries.txt"
          python3 scripts/ci/calendar-cf-archive.py "$archive"
          mkdir "$RUNNER_TEMP/calendar-cf-output-restored"
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/calendar-cf-output-restored"
      - name: Restore same-run immutable artifact without rebuilding
        run: tar -xzf "$RUNNER_TEMP/calendar-restore/calendar-worker.tar.gz" -C apps/calendar
      - name: Verify exact source seal after relocation
        run: node scripts/ci/calendar-native-artifact.mjs verify apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
      - name: Verify relocated cf comparison against the exact sealed source
        run: node scripts/ci/calendar-cf-output.mjs verify apps/calendar "$SOURCE_SHA" "$RUNNER_TEMP/calendar-cf-output-restored"
      - name: Discover restored config
        id: output
        run: node scripts/ci/calendar-native-artifact.mjs config apps/calendar "$SOURCE_SHA"
      - name: Validate restored Worker without publication
        working-directory: apps/calendar
        run: bun x --no-install wrangler deploy --dry-run --config "${{ steps.output.outputs.config }}" --outdir "$RUNNER_TEMP/calendar-restored-dry-run"
      - name: Recheck actual restored Worker public routes
        id: calendar-runtime
        timeout-minutes: 3
        run: node scripts/ci/calendar-native-worker.runtime.mjs "$SOURCE_SHA"
      - name: Retain sanitized Calendar SSR fixture diagnostics
        if: ${{ always() && steps.calendar-runtime.outputs.ssr_diagnostic != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: calendar-ssr-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ steps.calendar-runtime.outputs.ssr_diagnostic }}
          retention-days: 3
          if-no-files-found: error
      - name: Recheck restored offline asset behavior
        working-directory: apps/calendar
        run: node --test src/runtime/offline-artifact.runtime.mjs
      - name: Verify final restored artifact seal
        run: node scripts/ci/calendar-native-artifact.mjs verify apps/calendar "$SOURCE_SHA" apps/calendar/calendar-artifact.json
