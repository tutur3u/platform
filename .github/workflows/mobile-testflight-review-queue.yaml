name: Mobile TestFlight Review Queue

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  deployments: read

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-testflight-review-queue.yaml

  dispatch:
    name: Ask the production workflow to retry review
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Require promoted retry code
        id: promoted
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production
          if git cat-file -e FETCH_HEAD:.github/workflows/mobile-testflight-review-queue.yaml &&
             git cat-file -e FETCH_HEAD:scripts/ci/normalize-release-notes.js; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Retry code is not on production; skipping dispatch."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scoped tuturuuu-bot token
        id: bot-token
        if: vars.TUTURUUU_BOT_APP_ID != '' && github.repository == 'tutur3u/platform' && github.ref == 'refs/heads/main' && steps.promoted.outputs.enabled == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TUTURUUU_BOT_APP_ID }}
          private-key: ${{ secrets.TUTURUUU_BOT_PRIVATE_KEY }}
          owner: tutur3u
          repositories: platform
          permission-actions: write

      - name: Dispatch production review retry
        if: steps.promoted.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
        run: gh api -X POST repos/tutur3u/platform/actions/workflows/mobile-deploy-stores.yaml/dispatches -f ref=production -f 'inputs[mode]=retry_ios_review'
