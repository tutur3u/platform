name: CI Configuration Check

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
        description: "The name of the workflow file (e.g., biome-check.yaml)"
      check_release_only:
        required: false
        type: boolean
        default: false
        description: "Also detect whether this push contains only release metadata"
      check_pr_release_only:
        required: false
        type: boolean
        default: false
        description: "Also detect release-only PR changes; other events always run"
      pr_runner:
        required: false
        type: boolean
        default: false
        description: "Select the dedicated PR runner pool; callers pass the full routing condition"
    outputs:
      affected_jobs:
        description: "Affected validation jobs; absent keys retain validation"
        value: ${{ jobs.check.outputs.affected_jobs }}
      run_checks:
        description: "Whether release relevance requires checks (true when not requested)"
        value: ${{ jobs.check.outputs.run_checks }}
      should_run:
        description: "Whether the workflow should run"
        value: ${{ jobs.check.outputs.should_run }}

permissions:
  contents: read
  deployments: read

jobs:
  check:
    name: Check CI Config
    runs-on: ${{ inputs.pr_runner && fromJSON('["self-hosted","macOS","ARM64","tuturuuu-pr-ephemeral"]') || 'ubuntu-latest' }}
    outputs:
      affected_jobs: ${{ steps.check_config.outputs.affected_jobs }}
      run_checks: ${{ steps.pr_release_relevance.outputs.run_checks || steps.release_relevance.outputs.run_checks || 'true' }}
      should_run: ${{ steps.check_config.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: ${{ runner.environment != 'self-hosted' }}
          sparse-checkout: |
            .github/actions/pr-runner-hygiene/*
            .github/workflows/*
            apps/*/package.json
            bun.lock
            package.json
            packages/*/package.json
            scripts/ci/check-workflow-config.ts
            scripts/ci/github-deployment-markers.ts
            scripts/ci/lockfile-workspace-delta.ts
            scripts/ci/mobile-build-selection.ts
            scripts/ci/mail-calendar-tasks-affected.ts
            scripts/ci/overflow-notes-ci.js
            scripts/ci/production-test-only-paths.ts
            scripts/ci/release-only-changes.js
            scripts/ci/resolve-changed-files-core.ts
            scripts/ci/resolve-changed-files.ts
            scripts/ci/workflow-config-core.ts
            scripts/ci/workspace-dependency-closure.ts
            turbo.json
            tuturuuu.ci.ts
            tuturuuu.ts
          sparse-checkout-cone-mode: false
      - name: Isolate persistent runner state
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/pr-runner-hygiene

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Compute changed files
        id: changed_files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          node --experimental-strip-types scripts/ci/resolve-changed-files.ts

      - name: Check Configuration
        id: check_config
        shell: bash
        env:
          CHANGED_BASE_SHA: ${{ steps.changed_files.outputs.base_sha }}
          CHANGED_FILES_FILE: ${{ steps.changed_files.outputs.changed_files_path }}
          CHANGED_HEAD_SHA: ${{ steps.changed_files.outputs.head_sha }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          if [ "$(node scripts/ci/overflow-notes-ci.js)" = true ]; then
            echo "Validated overflow notes only: no checks required."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFIG_FILE="tuturuuu.ts"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::warning::Configuration file $CONFIG_FILE not found. Defaulting to true."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --experimental-strip-types scripts/ci/check-workflow-config.ts

      - name: Detect release-only changes
        id: release_relevance
        if: inputs.check_release_only
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          result="$(node scripts/ci/release-only-changes.js "$BEFORE_SHA" "$GITHUB_SHA")"
          echo "run_checks=$result" >> "$GITHUB_OUTPUT"

      - name: Detect release-only PR changes
        if: inputs.check_pr_release_only
        id: pr_release_relevance
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            result="$(node scripts/ci/release-only-changes.js "$BASE_SHA" "$HEAD_SHA")"
          else
            result=true
          fi
          echo "run_checks=$result" >> "$GITHUB_OUTPUT"
