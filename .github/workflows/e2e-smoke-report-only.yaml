name: Web E2E report-only

on:
  push:
    branches: [main]
    paths:
      # Include unknown inputs; omit only known non-runtime changes.
      - "**"
      - "!*.md"
      - "!**/AGENTS.md"
      - "!apps/docs/**"
      - "!apps/mobile/**"
      - "!apps/backend/**"
      - "!apps/tanstack-web/**"
      - "!docs/**"
      - "!plans/**"
      - "!plugins/**"
      - "!skills/**"
      - "!conductor/**"
      - "!.agents/**"
      - "!.agent/**"
      - "!.claude/**"
      - "!.codex/**"
      - "!.cursor/**"
      - "!.gemini/**"
      - "!.opencode/**"
      - "!.vscode/**"
      - "!.windsurf/**"
      - "!.zed/**"
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-report-only-${{ github.event_name }}-${{ github.ref }}-${{ (github.run_attempt > 1 || github.event_name != 'push') && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}

jobs:
  e2e:
    # The only admitted Docker E2E exception; never run PR-controlled source.
    if: github.ref == 'refs/heads/main' && github.repository == 'tutur3u/platform'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          package-cache-enabled: "false"
      - name: Restore exact E2E Bun packages
        id: bun-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: web-e2e-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Expose retained E2E CLI compatibility
        shell: bash
        run: |
          e2e_tools="$RUNNER_TEMP/e2e-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$e2e_tools"
          printf '%s\n' '#!/bin/sh' 'exec bun x "$@"' > "$e2e_tools/bunx"
          chmod 700 "$e2e_tools/bunx"
          echo "$e2e_tools" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/setup-supabase-cli-with-retry
      - name: Restore exact E2E Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: web-e2e-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/web/package.json') }}
      - name: Install Chromium
        working-directory: apps/web
        run: bun x playwright install --with-deps chromium
      - name: Bound E2E dependency archives
        id: cache-budget
        shell: bash
        run: |
          bound_cache() {
            local name="$1" directory="$2" limit="$3" size
            if ! size=$(du -sk "$directory" 2>/dev/null | cut -f1); then
              echo "$name=false" >> "$GITHUB_OUTPUT"
              return
            fi
            if [[ "$size" =~ ^[0-9]+$ ]] && (( size <= limit )); then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          bound_cache bun "$HOME/.bun/install/cache" 524288
          bound_cache chromium "$HOME/.cache/ms-playwright" 1048576
      - name: Save exact trusted E2E Bun packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.bun-packages.outputs.cache-hit != 'true' && steps.cache-budget.outputs.bun == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: web-e2e-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - name: Save exact trusted E2E Chromium
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.chromium.outputs.cache-hit != 'true' && steps.cache-budget.outputs.chromium == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: web-e2e-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/web/package.json') }}
      - name: Derive pinned E2E Supabase image identity
        id: supabase-images-identity
        run: node scripts/ci/web-e2e-supabase-cache.js key
      - name: Restore exact E2E Supabase images
        id: supabase-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-e2e-supabase-images/images.tar
          key: web-e2e-supabase-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-images-identity.outputs.digest }}
      - name: Authenticate official Supabase mirror
        if: steps.supabase-images.outputs.cache-hit != 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: node scripts/ci/web-e2e-supabase-cache.js login
      - name: Prepare pinned E2E Supabase images
        id: supabase-images-prepare
        timeout-minutes: 11
        env:
          IMAGE_CACHE_HIT: ${{ steps.supabase-images.outputs.cache-hit }}
        run: node scripts/ci/web-e2e-supabase-cache.js prepare
      - name: Save exact trusted E2E Supabase images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.supabase-images.outputs.cache-hit != 'true' && steps.supabase-images-prepare.outputs.archive-ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/web-e2e-supabase-images/images.tar
          key: web-e2e-supabase-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.supabase-images-identity.outputs.digest }}
      - name: Remove owned image archive and registry credentials
        if: always()
        run: node scripts/ci/web-e2e-supabase-cache.js cleanup
      - name: Smoke (six-minute Playwright budget, excluding provisioning)
        if: github.event_name != 'schedule'
        timeout-minutes: 45
        id: smoke
        run: node scripts/ci/run-web-e2e-report-only.js smoke
      - name: Nightly full suite
        if: github.event_name == 'schedule'
        timeout-minutes: 45
        id: nightly
        run: node scripts/ci/run-web-e2e-report-only.js nightly
      - name: Clean up owned runtime
        id: cleanup
        if: always()
        timeout-minutes: 10
        run: node scripts/ci/run-web-e2e-report-only.js cleanup
      - name: Upload synthetic-fixture reports and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize report-only result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NIGHTLY_OUTCOME: ${{ steps.nightly.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          RUN_MODE: ${{ github.event_name }}
        run: |
          echo "Report-only E2E ($RUN_MODE): $JOB_STATUS; smoke=$SMOKE_OUTCOME nightly=$NIGHTLY_OUTCOME cleanup=$CLEANUP_OUTCOME. Inspect step outcomes and report artifacts; this check is non-required." >> "$GITHUB_STEP_SUMMARY"
