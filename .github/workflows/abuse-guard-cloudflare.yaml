name: Abuse Guard Cloudflare Artifact

# Build-only: verifies the abuse-guard Worker at the exact commit and uploads
# its cf Build Output (`.cloudflare/output/v0`) with a SHA-256 digest, so a
# publication can pin the run id and re-verify the digest before
# `cf deploy --prebuilt`. No deploy, no secrets, no provider writes.
on:
  push:
    branches: [main]
    paths:
      - apps/abuse-guard/**
      - packages/utils/src/abuse-guard/**
      - bun.lock
      - .github/workflows/abuse-guard-cloudflare.yaml
  workflow_dispatch:

permissions:
  contents: read

# Newer main pushes supersede in-progress validation; dispatches and reruns keep
# isolated groups. Publication pins a completed run id, which later runs cannot alter.
concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}-{3}{4}', github.workflow, github.event_name, github.event.pull_request.number || github.ref, (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest', github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '') }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/abuse-guard test
      - run: bun run --cwd apps/abuse-guard type-check
      - run: bun run --cwd apps/abuse-guard lint
      - run: bun run --cwd apps/abuse-guard format:check
      - run: bun run --cwd apps/abuse-guard build
      - name: Assert the publication shape
        working-directory: apps/abuse-guard/.cloudflare/output/v0
        run: |
          jq -e '.name == "tuturuuu-abuse-guard"
            and .workersDev == false
            and .previewUrls == false
            and .exports.GuardSubject.storage == "sqlite"
            and .exports.GuardControl.storage == "sqlite"
            and .env.ABUSE_GUARD_SECRETS.type == "secret"
            and .env.ABUSE_GUARD_OPERATOR_TOKEN.type == "secret"' \
            workers/default/worker.config.json
          jq -e '.buildContext.isPreview == false' config.json
      - name: Package with a digest
        id: package
        working-directory: apps/abuse-guard/.cloudflare
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf abuse-guard-output.tar output
          digest="$(sha256sum abuse-guard-output.tar | cut -d' ' -f1)"
          echo "$digest  abuse-guard-output.tar" > abuse-guard-output.tar.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### abuse-guard artifact"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- sha256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abuse-guard-output-${{ github.sha }}
          path: |
            apps/abuse-guard/.cloudflare/abuse-guard-output.tar
            apps/abuse-guard/.cloudflare/abuse-guard-output.tar.sha256
          if-no-files-found: error
          retention-days: 30
