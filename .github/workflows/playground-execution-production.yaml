name: Playground execution production deploy

# Manual deploy of the Playground execution Worker to production on its
# custom domain, pinned to one registry image digest that staging qualified.
# The build job holds no credentials. The deploy job runs behind the
# reviewer-gated `playground-production` environment, whose reviewer confirms
# the digest passed staging qualification. The admission gate is durable: it
# starts paused, a redeploy pauses it before rolling out, and the smoke pauses
# it again, so a deploy never leaves Runs admitted. Enabling admission is a
# separate operator step.
on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: registry.cloudflare.com/<account>/tuturuuu-playground@sha256:<digest>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playground-execution-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tutur3u/platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The production identity is set only on the steps that build and check
    # the Worker, so the Worker tests run without it.
    steps:
      - name: Accept only a pinned Playground registry digest and an HTTPS source origin
        env:
          PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
          PLAYGROUND_INGRESS_HOST: playground-execution.tuturuuu.com
          # Web production, which serves the source and export routes. A
          # literal: this job binds no environment, so it cannot read one.
          PLAYGROUND_SOURCE_ORIGIN: https://tuturuuu.com
        run: |
          set -euo pipefail
          [[ "$PLAYGROUND_IMAGE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/tuturuuu-playground@sha256:[a-f0-9]{64}$ ]]
          [[ "$PLAYGROUND_SOURCE_ORIGIN" =~ ^https://([a-z0-9-]+\.)*tuturuuu\.com$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Run the execution Worker tests
        run: node --test apps/playground-execution/src/*.test.mjs
      - name: Build the published type entry points the bundle resolves
        run: bun run --cwd packages/types build
      - name: Build the production Worker
        working-directory: apps/playground-execution
        env:
          PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
          PLAYGROUND_INGRESS_HOST: playground-execution.tuturuuu.com
          # Web production, which serves the source and export routes. A
          # literal: this job binds no environment, so it cannot read one.
          PLAYGROUND_SOURCE_ORIGIN: https://tuturuuu.com
        run: bun x --no-install cf build
      - name: Check the emitted Worker is the production shape
        working-directory: apps/playground-execution
        env:
          PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
          PLAYGROUND_INGRESS_HOST: playground-execution.tuturuuu.com
          # Web production, which serves the source and export routes. A
          # literal: this job binds no environment, so it cannot read one.
          PLAYGROUND_SOURCE_ORIGIN: https://tuturuuu.com
        run: |
          set -euo pipefail
          test -d .cloudflare/output
          grep -rFl "$PLAYGROUND_IMAGE" .cloudflare/output > /dev/null
          others="$(grep -rhoE 'registry\.cloudflare\.com/[^"[:space:]]+' .cloudflare/output | sort -u | grep -vxF "$PLAYGROUND_IMAGE" || true)"
          test -z "$others"
          for name in PlaygroundCoordinator PlaygroundSlot PlaygroundChecker; do
            grep -rqF "$name" .cloudflare/output
          done
          # The fixture qualifier and workers.dev exist only in staging.
          if grep -rqF PlaygroundQualifier .cloudflare/output; then
            echo 'The production output must not contain PlaygroundQualifier' >&2
            exit 1
          fi
          if grep -rqF 'tuturuuu-playground-execution-staging' .cloudflare/output; then
            echo 'The production output must not contain tuturuuu-playground-execution-staging' >&2
            exit 1
          fi
          # The code reads the flag; the production configuration must not bind it.
          if grep -rqF --include='*.json' PLAYGROUND_QUALIFY .cloudflare/output; then
            echo 'The production configuration must not bind PLAYGROUND_QUALIFY' >&2
            exit 1
          fi
          grep -rqF "$PLAYGROUND_INGRESS_HOST" .cloudflare/output
          grep -rqF "$PLAYGROUND_SOURCE_ORIGIN" .cloudflare/output
      - name: Stage the build output
        run: cp -R apps/playground-execution/.cloudflare/output "$RUNNER_TEMP/playground-execution-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-execution-production-${{ github.run_id }}
          path: ${{ runner.temp }}/playground-execution-output
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: playground-production
    env:
      PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
      PLAYGROUND_INGRESS_HOST: playground-execution.tuturuuu.com
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground-execution-production-${{ github.run_id }}
          path: apps/playground-execution/.cloudflare/output
      - name: Recheck the downloaded output names only the pinned image
        working-directory: apps/playground-execution
        run: |
          set -euo pipefail
          [[ "$PLAYGROUND_IMAGE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/tuturuuu-playground@sha256:[a-f0-9]{64}$ ]]
          grep -rFl "$PLAYGROUND_IMAGE" .cloudflare/output > /dev/null
          others="$(grep -rhoE 'registry\.cloudflare\.com/[^"[:space:]]+' .cloudflare/output | sort -u | grep -vxF "$PLAYGROUND_IMAGE" || true)"
          test -z "$others"
          if grep -rqF PlaygroundQualifier .cloudflare/output; then
            echo 'The production output must not contain PlaygroundQualifier' >&2
            exit 1
          fi
      - name: Pause admission on an existing deployment before rolling out
        env:
          PLAYGROUND_OPERATOR_SECRET: ${{ secrets.PLAYGROUND_PRODUCTION_OPERATOR_SECRET }}
        run: |
          set -euo pipefail
          test "${#PLAYGROUND_OPERATOR_SECRET}" -ge 32
          origin="https://$PLAYGROUND_INGRESS_HOST"
          status="$(curl --proto '=https' --max-redirs 0 --silent --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 -X POST "$origin/run" || true)"
          # A first deploy has no Worker on the domain yet; a live one must
          # stop admitting before its containers are replaced.
          if [[ "$status" == 401 ]]; then
            control="$(curl --proto '=https' --max-redirs 0 --fail --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer $PLAYGROUND_OPERATOR_SECRET" \
              -H 'Content-Type: application/json' \
              --data '{"enabled":false}' "$origin/control")"
            echo "$control"
            test "$(jq -r .enabled <<<"$control")" = false
          fi
      - name: Deploy the production Worker with its secrets
        working-directory: apps/playground-execution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLAYGROUND_PRODUCTION_CLOUDFLARE_API_TOKEN }}
          PLAYGROUND_INGRESS_SECRET: ${{ secrets.PLAYGROUND_PRODUCTION_INGRESS_SECRET }}
          PLAYGROUND_OPERATOR_SECRET: ${{ secrets.PLAYGROUND_PRODUCTION_OPERATOR_SECRET }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#PLAYGROUND_INGRESS_SECRET}" -ge 32
          test "${#PLAYGROUND_OPERATOR_SECRET}" -ge 32
          test "$PLAYGROUND_INGRESS_SECRET" != "$PLAYGROUND_OPERATOR_SECRET"
          secrets="$RUNNER_TEMP/playground-secrets.env"
          trap 'rm -f "$secrets"' EXIT
          umask 077
          printf 'PLAYGROUND_INGRESS_SECRET=${PLAYGROUND_INGRESS_SECRET}\nPLAYGROUND_OPERATOR_SECRET=${PLAYGROUND_OPERATOR_SECRET}\n' > "$secrets"
          bun x --no-install cf deploy --prebuilt --no-provision \
            --containers-rollout immediate \
            --secrets-file "$secrets" \
            --tag "${GITHUB_SHA:0:12}" \
            --message "playground production ${GITHUB_SHA:0:12}"
      - name: Smoke the custom domain with admission paused
        env:
          PLAYGROUND_OPERATOR_SECRET: ${{ secrets.PLAYGROUND_PRODUCTION_OPERATOR_SECRET }}
        run: |
          set -euo pipefail
          origin="https://$PLAYGROUND_INGRESS_HOST"
          # Wait only while the custom domain and its certificate are not
          # serving the Worker yet; any Worker answer ends the loop.
          status=000
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl --proto '=https' --max-redirs 0 --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 -X POST "$origin/run" || true)"
            [[ "$status" == 000 || "$status" == 52[0-9] ]] || break
            sleep $((attempt * 15))
          done
          # Without the ingress secret a Run is refused, and the staging-only
          # fixture route does not exist.
          test "$status" = 401
          test "$(curl --proto '=https' --max-redirs 0 --silent --output /dev/null --write-out '%{http_code}' --max-time 30 -X POST "$origin/qualify")" = 404
          test "$(curl --proto '=https' --max-redirs 0 --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$origin/")" = 404
          control="$(curl --proto '=https' --max-redirs 0 --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $PLAYGROUND_OPERATOR_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false}' "$origin/control")"
          echo "$control"
          test "$(jq -r .enabled <<<"$control")" = false
          # Runs admitted before the pre-deploy pause may still be finishing.
          echo "active Runs: $(jq -r .active <<<"$control")"
          {
            echo '### Playground production smoke'
            echo "Unauthenticated /run: HTTP $status; /qualify and / answer 404."
            echo '```json'
            echo "$control"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
