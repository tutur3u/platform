name: mobile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')) && format('{0}-{1}-{2}', github.sha, github.event_name, github.run_id) || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--') }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "apps/meet-realtime/**"
      - "packages/realtime/**"
      - "bun.lock"
      - ".github/workflows/mobile.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/meet-realtime/**"
      - "packages/realtime/**"
      - "bun.lock"
      - ".github/workflows/mobile.yaml"

permissions:
  contents: read

jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile.yaml

  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'

  quality:
    name: Mobile Analysis
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
          pub-cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: |
          dart pub global activate very_good_cli 1.1.0
          very_good packages get --recursive --ignore="!*"

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: 🕵️ Analyze
        run: flutter analyze lib test

      - name: ✅ Bloc Lint
        run: |
          flutter pub global activate bloc_tools
          bloc lint .

  tests:
    name: Mobile Tests (${{ matrix.shard }})
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
          pub-cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - name: Install dependencies
        run: flutter pub get
      - name: Run test shard
        run: flutter test --concurrency=2 --total-shards=4 --shard-index=${{ matrix.shard }} -r expanded

      - name: Verify Agenda wall time on a non-UTC device
        if: matrix.shard == 0
        env:
          TZ: Asia/Ho_Chi_Minh
          CALENDAR_NATIVE_TZ_REGRESSION: "1"
        run: flutter test test/features/calendar/widgets/agenda_view_test.dart --concurrency=1 -r expanded

      - name: Verify configured OTP CAPTCHA guards
        if: matrix.shard == 0
        run: |
          flutter test test/features/auth/view/login_email_mode_captcha_test.dart \
            --dart-define=TURNSTILE_SITE_KEY=synthetic-site-key \
            --dart-define=TURNSTILE_BASE_URL=https://turnstile.example.invalid \
            --concurrency=1 -r expanded \
            --file-reporter=json:configured-otp-captcha.json
          jq -s -e '
            [.[] | select(.type == "testDone" and .hidden == false)] |
            length == 4 and all(.[]; .result == "success" and .skipped == false)
          ' configured-otp-captcha.json

      - name: Verify native device DST gap
        if: matrix.shard == 0
        env:
          TZ: America/New_York
        run: flutter test test/features/calendar/calendar_date_time_test.dart -r expanded

  realtime-parity:
    name: Mobile and web Cloudflare parity
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - run: bun install --frozen-lockfile
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Verify native/web room protocol against local Cloudflare
        run: bun apps/meet-realtime/tests/mobile-local-check.ts

  build:
    name: build
    needs: [check-ci, quality, tests, realtime-parity]
    if: always() && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every mobile check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          REALTIME_RESULT: ${{ needs.realtime-parity.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success && test "$REALTIME_RESULT" = success
