name: Mobile Build Android

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-android.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/ci/gradle-cache-budget.js"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-android.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/ci/gradle-cache-budget.js"

permissions:
  contents: read

jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-android.yaml

  build-android:
    name: Build Android APK (Development)
    needs: [check-ci]
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle dependencies without saving
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
          key: gradle-downloads-v2-${{ runner.os }}-${{ runner.arch }}-java17

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Verify pinned Meet WebRTC overlay
        run: node --test android/overlays/flutter_webrtc/verify-overlay.test.mjs

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (development flavor)
        run: flutter build apk --flavor development --target lib/main_development.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-dev-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-development-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build native Meet capture fixture (no account or hosted SFU)
        run: flutter build apk --debug --flavor development --target lib/main_realtime_fixture.dart

      - name: Upload native Meet capture fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-meet-capture-fixture-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Check Gradle download cache budget
        id: gradle-budget
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: node scripts/ci/gradle-cache-budget.js

      - name: Save trusted Gradle dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.gradle-budget.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
          key: gradle-downloads-v2-${{ runner.os }}-${{ runner.arch }}-java17
