name: Mobile Build Android

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-android.yaml"
      - ".github/actions/setup-flutter-cached/**"
      - ".github/actions/save-trusted-cache/**"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-android.yaml"
      - ".github/actions/setup-flutter-cached/**"
      - ".github/actions/save-trusted-cache/**"

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-android.yaml

  build-android:
    name: Build Android APK (Development)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Restore on every event; only default-branch runs save the multi-GB entry.
      - name: Restore Gradle cache
        id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Flutter
        id: flutter
        uses: ./.github/actions/setup-flutter-cached
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Verify pinned Meet WebRTC overlay
        run: node --test android/overlays/flutter_webrtc/verify-overlay.test.mjs

      - name: Install dependencies
        run: flutter pub get

      - name: Save pub cache
        uses: ./.github/actions/save-trusted-cache
        with:
          path: ${{ steps.flutter.outputs.pub-cache-path }}
          key: ${{ steps.flutter.outputs.pub-cache-key }}
          cache-hit: ${{ steps.flutter.outputs.pub-cache-hit }}

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"123","firebase_url":"https://dummy.firebaseio.com","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.tuturuuu.app.mobile"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123:android:def","android_client_info":{"package_name":"com.tuturuuu.app.mobile.dev"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123:android:ghi","android_client_info":{"package_name":"com.tuturuuu.app.mobile.stg"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > android/app/google-services.json

      - name: Build APK (development flavor)
        run: flutter build apk --flavor development --target lib/main_development.dart

      - name: Save Gradle cache
        uses: ./.github/actions/save-trusted-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          cache-hit: ${{ steps.gradle.outputs.cache-hit }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-dev-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-development-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Build native Meet capture fixture (no account or hosted SFU)
        run: flutter build apk --debug --flavor development --target lib/main_realtime_fixture.dart

      - name: Upload native Meet capture fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-meet-capture-fixture-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-development-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
