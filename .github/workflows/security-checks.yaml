name: Security Checks

# PR and main-push checks scan only what the change touched and fail on newly
# introduced findings. The daily schedule (the only security timer) runs CodeQL
# through codeql.yml and builds the redacted findings register; on Mondays it
# also runs the weekly deep pass (full-history secret scan).
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: Also run the weekly deep pass (full-history secret scan)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: security-checks.yaml

  scope:
    name: Resolve security scope
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deep: ${{ steps.mode.outputs.deep }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      register: ${{ steps.mode.outputs.register }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - name: Check out scope inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/github-deployment-markers.ts
            scripts/ci/resolve-changed-files-core.ts
            scripts/ci/resolve-changed-files.ts
            scripts/ci/security-paths.js
          sparse-checkout-cone-mode: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compute changed files
        id: changed_files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: security-checks.yaml
        run: node --experimental-strip-types scripts/ci/resolve-changed-files.ts

      - name: Select scans
        id: scope
        env:
          CHANGED_FILES_FILE: ${{ steps.changed_files.outputs.changed_files_path }}
        run: node scripts/ci/security-paths.js scope

      - name: Select audit mode
        id: mode
        env:
          DEEP_INPUT: ${{ inputs.deep }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          register=false
          deep=false
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            register=true
            if [ "$DEEP_INPUT" = true ] || { [ "$EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 1 ]; }; then
              deep=true
            fi
          fi
          echo "register=$register" >> "$GITHUB_OUTPUT"
          echo "deep=$deep" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      # Configuration, the ignore list and the summarizer come from the trusted
      # base so a change cannot allowlist or hide its own secret: inline
      # `gitleaks:allow` comments are ignored, and checkout-local
      # .gitleaksignore/.gitleaks.toml files are removed before scanning because
      # gitleaks would otherwise load them from the scanned directory.
      # Scheduled runs scan main.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEEP: ${{ needs.scope.outputs.deep }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          trusted="$GITHUB_SHA"
          log_opts="--since=3.days.ago"
          mode=register
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; then
            mode=pr
            if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE_SHA^{commit}"; then
              trusted="$BASE_SHA"
              log_opts="$BASE_SHA..$GITHUB_SHA"
            else
              log_opts="-n 50 $GITHUB_SHA"
            fi
          elif [ "$DEEP" = true ]; then
            log_opts=""
          fi
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          rm -f .gitleaksignore .gitleaks.toml
          if git cat-file -e "$trusted:.github/security/gitleaks.toml" 2>/dev/null; then
            git show "$trusted:.github/security/gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          fi
          : > "$RUNNER_TEMP/gitleaksignore"
          if git cat-file -e "$trusted:.gitleaksignore" 2>/dev/null; then
            git show "$trusted:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore"
          fi
          summarizer="$RUNNER_TEMP/security-scan-diff.js"
          if git cat-file -e "$trusted:scripts/ci/security-scan-diff.js" 2>/dev/null; then
            git show "$trusted:scripts/ci/security-scan-diff.js" > "$summarizer"
          else
            cp scripts/ci/security-scan-diff.js "$summarizer"
          fi
          range=()
          if [ -n "$log_opts" ]; then
            range=(--log-opts "$log_opts")
          fi
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" --ignore-gitleaks-allow \
            ${range[@]+"${range[@]}"} --redact \
            --no-banner --exit-code 0 --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" .
          mkdir -p "$RUNNER_TEMP/register-input"
          node "$summarizer" gitleaks "$RUNNER_TEMP/gitleaks.json" \
            "$RUNNER_TEMP/register-input/gitleaks.json" "$mode"

      - name: Keep redacted secret-scan input for the register
        if: needs.scope.outputs.register == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-register-gitleaks
          path: ${{ runner.temp }}/register-input/gitleaks.json
          retention-days: 2
          if-no-files-found: error

      # Runs the suppression regression against the installed release, so a
      # gitleaks upgrade that changes ignore/config loading fails here. It is
      # checkout (pull request) code, so it runs only after the scan, its
      # summary and the register input are final and cannot be tampered with.
      - name: Prove pull requests cannot suppress findings
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: node --test scripts/ci/security-gitleaks-suppression.test.js

  dependency-review:
    name: Dependency review
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-severity: high
          license-check: false

  # GitHub's dependency graph does not read bun.lock, so bun audit covers the
  # Bun workspace. It reads manifests and the lockfile without installing or
  # running package scripts.
  dependency-audit:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.dependencies == 'true' || needs.scope.outputs.register == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.3

      - name: Audit locked dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          audit() {
            (cd "$1" && bun audit --json > "$2") || true
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$2"
          }
          mkdir -p "$RUNNER_TEMP/register-input"
          audit . "$RUNNER_TEMP/register-input/bun-audit.json"
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != push ]; then
            exit 0
          fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "::warning::No base commit; every high/critical advisory counts as new."
            echo '{}' > "$RUNNER_TEMP/base-audit.json"
          else
            mkdir -p "$RUNNER_TEMP/base"
            git ls-tree -r --name-only "$BASE_SHA" |
              grep -E '^(package\.json|bun\.lock|(apps|packages)/[^/]+/package\.json)$' |
              xargs git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/base"
            audit "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-audit.json"
          fi
          differ="$RUNNER_TEMP/security-scan-diff.js"
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:scripts/ci/security-scan-diff.js" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/security-scan-diff.js" > "$differ"
          else
            cp scripts/ci/security-scan-diff.js "$differ"
          fi
          node "$differ" bun-audit-diff "$RUNNER_TEMP/register-input/bun-audit.json" "$RUNNER_TEMP/base-audit.json"

      - name: Keep dependency audit input for the register
        if: needs.scope.outputs.register == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-register-bun-audit
          path: ${{ runner.temp }}/register-input/bun-audit.json
          retention-days: 2
          if-no-files-found: error

  workflow-trust:
    name: Workflow trust boundaries
    needs: scope
    if: needs.scope.outputs.workflows == 'true' || needs.scope.outputs.register == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.3

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Covers fork PRs, which do not run the push-only script suite.
      - name: Run workflow trust-boundary tests
        run: node scripts/ci/security-trust-tests.js

  codeql:
    needs: scope
    if: needs.scope.outputs.register == 'true'
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  register:
    name: Findings register
    needs: [scope, secrets, dependency-audit, codeql]
    if: always() && needs.scope.outputs.register == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check out register builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/security-findings-register.js
            scripts/ci/security-paths.js
            scripts/ci/security-scan-diff.js
          sparse-checkout-cone-mode: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Collect scanner input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: security-register-*
          path: ${{ runner.temp }}/register-input
          merge-multiple: true

      # Fails while confirmed critical/high findings are open: release blocker.
      - name: Build findings register
        env:
          BUN_AUDIT_FILE: ${{ runner.temp }}/register-input/bun-audit.json
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_FILE: ${{ runner.temp }}/register-input/gitleaks.json
          REGISTER_FILE: ${{ runner.temp }}/security-register.json
        run: node scripts/ci/security-findings-register.js

      - name: Keep redacted findings register
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-findings-register
          path: ${{ runner.temp }}/security-register.json
          retention-days: 30
          if-no-files-found: warn
