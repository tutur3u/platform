name: Mail E2E report-only

on:
  push:
    branches: [main]
    paths:
      - "apps/mail/**"
      - "apps/database/supabase/**"
      - "apps/database/scripts/run-supabase*.js"
      - "packages/auth/**"
      - "packages/email-service/**"
      - "packages/internal-api/**"
      - "packages/satellite/**"
      - "packages/supabase/**"
      - "packages/ui/**"
      - "packages/utils/**"
      - "scripts/ci/run-mail-e2e-report-only*"
      - ".github/actions/cache-supabase-images/**"
      - ".github/workflows/mail-e2e-report-only.yaml"
      - "bun.lock"
      - "package.json"
  schedule:
    - cron: '47 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-e2e-report-only-${{ github.event_name }}-${{ github.ref }}-${{ format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  e2e:
    if: github.ref == 'refs/heads/main' && github.repository == 'tutur3u/platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          package-cache-enabled: "false"
      - name: Restore exact E2E Bun packages
        id: bun-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: mail-e2e-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/setup-supabase-cli-with-retry
      - name: Restore exact E2E Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: mail-e2e-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/mail/package.json') }}
      - name: Install Chromium
        working-directory: apps/mail
        run: bun x playwright install --with-deps chromium
      - name: Save exact trusted E2E Bun packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.bun-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: mail-e2e-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'patches/**') }}
      - name: Save exact trusted E2E Chromium
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: mail-e2e-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/mail/package.json') }}
      - uses: ./.github/actions/cache-supabase-images
        with:
          profile: full
      - name: Run Mail Playwright E2E suite (report-only)
        id: mail-e2e
        timeout-minutes: 30
        continue-on-error: true
        run: node scripts/ci/run-mail-e2e-report-only.js run
      - name: Clean up local Supabase runtime
        id: cleanup
        if: always()
        timeout-minutes: 10
        run: node scripts/ci/run-mail-e2e-report-only.js cleanup
      - name: Upload synthetic-fixture reports and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mail-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/mail/playwright-report/
            apps/mail/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize report-only result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          E2E_OUTCOME: ${{ steps.mail-e2e.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          RUN_MODE: ${{ github.event_name }}
        run: |
          echo "Mail E2E ($RUN_MODE): $JOB_STATUS; mail-e2e=$E2E_OUTCOME cleanup=$CLEANUP_OUTCOME (report-only)." >> "$GITHUB_STEP_SUMMARY"
