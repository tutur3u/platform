name: Shared Secret Write

# Dispatch-only operator job. It generates one random value in memory and
# writes that same value to every destination of the chosen secret (the
# Cloudflare Workers that issue and verify it), so the value exists only in
# process memory and in the Worker secret stores. It is never a GitHub
# secret, output, environment file, artifact, cache entry, log line or command
# argument. Destinations are hard-coded per secret and
# environment in scripts/ci/shared-secret-targets.mjs.
#
# Credentials, by name, from the protected environment:
#   COLAB_CLOUDFLARE_API_TOKEN  Cloudflare token that edits the Workers
#
# Re-running the job rotates the value everywhere. The readback prints names
# and types only and fails closed on any mismatch. The pepper, coordination
# and store secrets have production destinations only.
# `node scripts/ci/shared-secret.mjs plan <secret> <environment>` prints the
# destinations, rotation order and user impact before a dispatch.
on:
  workflow_dispatch:
    inputs:
      secret:
        description: Secret to generate and write to all of its destinations
        required: true
        type: choice
        options:
          - ABUSE_GUARD_SECRET
          - WEB_MULTI_ACCOUNT_SESSION_SECRET
          - ABUSE_GUARD_KEY_PEPPER
          - CLOUDFLARE_COORDINATION_TOKEN
          - MASTERMIND_STORE_TOKEN
          - MASTERMIND_SHIP_CHECK_TOKEN
      environment:
        description: Destination environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: shared-secret-write-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shared-secret-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the secret tooling floor
        run: |
          git merge-base --is-ancestor 018eecf2fff936563b5775f711bfc5606e361219 HEAD \
            || { echo 'This commit predates the abuse-guard ratelimit family (018eecf2).'; exit 1; }
      - name: Write one value to every destination and read it back
        env:
          SHARED_SECRET: ${{ inputs.secret }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          node scripts/ci/shared-secret.mjs preflight "$SHARED_SECRET" "$TARGET_ENVIRONMENT"
          value="$(openssl rand -base64 48 | tr -d '\n')"
          printf '::add-mask::%s\n' "$value"
          printf '%s' "$value" | node scripts/ci/shared-secret.mjs write workers "$SHARED_SECRET" "$TARGET_ENVIRONMENT"
          unset value
          node scripts/ci/shared-secret.mjs verify "$SHARED_SECRET" "$TARGET_ENVIRONMENT"
