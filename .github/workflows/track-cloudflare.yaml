# Generated by the start-bridge codemod for track; re-run it instead of editing.
name: Track Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      [
        'apps/track/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/tasks-api/**',
        'packages/tasks-ui/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/track-native-artifact.py',
        '.github/workflows/track-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/track/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/tasks-api/**',
        'packages/tasks-ui/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/track-native-artifact.py',
        '.github/workflows/track-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: track-cloudflare.yaml
  # Qualification only: no staging or production publisher.
  native:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: track
      package: '@tuturuuu/track'
      artifact-script: scripts/ci/track-native-artifact.py
      env-interface: TrackGeneratedEnv
      worker-environment-type: TrackEnvironment
      # No app test script: run the app's Vitest suite if it has one.
      unit-command: bun x --no-install vitest run --passWithNoTests
      # Public staging values from repository variables for same-repository
      # events; fork pull requests (and unset variables) build with fixtures.
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_URL || 'https://track-ci.supabase.invalid' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_track_ci_placeholder' }}
        NEXT_PUBLIC_APP_URL=https://track.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/track/src/start-bridge apps/track/src/routes apps/track/src/router.tsx apps/track/src/start.ts apps/track/cloudflare apps/track/vite.config.mts apps/track/void.config.ts apps/track/tsconfig.json apps/track/package.json apps/track/start-bridge.routes.json
  # Tonight's cutover path: build the track Start Worker for production and
  # upload it (Worker + assets + wrangler config) for an operator wrangler
  # deploy. No publication happens here. PR runs build with fixtures only.
  track-cutover-artifact:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRUSTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRODUCTION_SUPABASE_URL || 'https://track-ci.supabase.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_track_ci_placeholder' }}
      NEXT_PUBLIC_APP_URL: https://track.tuturuuu.com
      NEXT_PUBLIC_TRACK_APP_URL: https://track.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      WRANGLER_SEND_METRICS: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Generate build metadata
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: production
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build shared dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter="@tuturuuu/track^..." --concurrency=2
          token: ''
          team: ''
      - name: Build the Start Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/track && bun run build:cloudflare
          token: ''
          team: ''
      - name: Record bounded emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/track "$SOURCE_SHA" "$RUNNER_TEMP/track-emitted-config.json"
      - name: Retain emitted config receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-cutover-config-receipt-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/track-emitted-config.json
          retention-days: 7
          if-no-files-found: error
      - name: Write the production wrangler config
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'apps/track/dist/server/wrangler.json';
          const c = JSON.parse(readFileSync(path, 'utf8'));
          for (const k of ['configPath', 'userConfigPath', 'topLevelName', 'definedEnvironments']) delete c[k];
          c.name = 'tuturuuu-track';
          c.workers_dev = false;
          c.preview_urls = false;
          c.upload_source_maps = false;
          c.vars = {
            TUTURUUU_NOINDEX: '0',
            NODE_ENV: 'production',
            // Startup assertion: refuse to serve without required secrets.
            TUTURUUU_REQUIRE_SECRETS: '1',
            NEXT_PUBLIC_APP_URL: 'https://track.tuturuuu.com',
            NEXT_PUBLIC_WEB_APP_URL: 'https://tuturuuu.com',
          };
          writeFileSync(path, `${JSON.stringify(c, null, 2)}\n`);
          JS
          if [ "$(node -p "require('./apps/track/dist/server/wrangler.json').preview_urls")" != false ]; then exit 1; fi
          test -f apps/track/dist/server/index.mjs
          test -d apps/track/dist/client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-cutover-${{ env.TRUSTED == 'true' && 'production' || 'fixture' }}-${{ env.SOURCE_SHA }}
          path: apps/track/dist
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
