name: security-scan

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-diff:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_IMAGE_DIGEST: b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
      GITLEAKS_IMAGE_BINARY_SHA256: 09d435057df51b800201bc3bbe0820554b1cac3cd98162e9e02b20c8b441b5bd
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Restore pinned Gitleaks archive
        id: gitleaks-archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-archive/gitleaks.tar.gz
          key: gitleaks-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Restore pinned Gitleaks image binary
        id: gitleaks-image
        if: steps.gitleaks-archive.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-image/gitleaks
          key: gitleaks-image-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_IMAGE_DIGEST }}-${{ env.GITLEAKS_IMAGE_BINARY_SHA256 }}

      - name: Install checksum-verified gitleaks
        id: gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks-archive/gitleaks.tar.gz"
          image_binary="$RUNNER_TEMP/gitleaks-image/gitleaks"
          image="ghcr.io/gitleaks/gitleaks@sha256:${GITLEAKS_IMAGE_DIGEST}"
          container=''
          cleanup() {
            if [ -n "$container" ]; then docker rm -f "$container" > /dev/null; fi
          }
          trap cleanup EXIT
          from_archive() {
            echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
            tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
            source=release
          }
          from_image() {
            if [ ! -f "$image_binary" ]; then
              mkdir -p "$(dirname "$image_binary")"
              timeout 180 docker pull --platform linux/amd64 "$image"
              container="$(docker create --platform linux/amd64 "$image")"
              docker cp "$container:/usr/bin/gitleaks" "$image_binary"
              docker rm "$container" > /dev/null
              container=''
            fi
            echo "${GITLEAKS_IMAGE_BINARY_SHA256}  ${image_binary}" | sha256sum --check --strict
            chmod 0755 "$image_binary"
            cp "$image_binary" "$RUNNER_TEMP/gitleaks"
            source=image
          }
          if [ -f "$archive" ]; then
            from_archive
          elif [ -f "$image_binary" ]; then
            from_image
          else
            mkdir -p "$(dirname "$archive")"
            if curl --fail --silent --show-error --location --retry 2 --max-time 120 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              --output "$archive"; then
              from_archive
            else
              rm -f "$archive"
              from_image
            fi
          fi
          version="$("$RUNNER_TEMP/gitleaks" version)"
          test "${version#v}" = "$GITLEAKS_VERSION"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Save verified Gitleaks archive
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.gitleaks-archive.outputs.cache-hit != 'true' && steps.gitleaks.outputs.source == 'release'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-archive/gitleaks.tar.gz
          key: gitleaks-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Save verified Gitleaks image binary
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.gitleaks-image.outputs.cache-hit != 'true' && steps.gitleaks.outputs.source == 'image'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-image/gitleaks
          key: gitleaks-image-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_IMAGE_DIGEST }}-${{ env.GITLEAKS_IMAGE_BINARY_SHA256 }}
      - name: Scan last 36 hours and retain only redacted locations
        run: |
          set -euo pipefail
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          rm -f .gitleaksignore .gitleaks.toml
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/daily-gitleaks.toml"
          : > "$RUNNER_TEMP/daily-gitleaksignore"
          "$RUNNER_TEMP/gitleaks" detect --log-opts="--since=36.hours" --redact \
            --config "$RUNNER_TEMP/daily-gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/daily-gitleaksignore" --ignore-gitleaks-allow \
            --no-banner --log-level error --exit-code 0 --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-redacted.json"
          node scripts/ci/security-daily-secrets.js "$RUNNER_TEMP/gitleaks-redacted.json" "$RUNNER_TEMP/gitleaks.json"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-secrets
          path: ${{ runner.temp }}/gitleaks.json
          retention-days: 7
          if-no-files-found: error

  definers:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Lint definer execution policy and auth guards
        run: node scripts/ci/security-definer-guard.js "${{ runner.temp }}/definers.json"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-definers
          path: ${{ runner.temp }}/definers.json
          retention-days: 7
          if-no-files-found: error

  route-permissions:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Inventory route permission helpers
        run: node scripts/ci/security-route-permissions.js "${{ runner.temp }}/routes.json"
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-routes
          path: ${{ runner.temp }}/routes.json
          retention-days: 7
          if-no-files-found: error
