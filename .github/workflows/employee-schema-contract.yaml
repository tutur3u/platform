name: Employee creation and restoration schema
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed creation/restoration stack commit (40 hex characters)
        required: true
        type: string
      normalization_only:
        description: Qualify only the frozen 20-case mailbox normalization and applied catalog
        required: false
        default: false
        type: boolean
      structured_provenance:
        description: Diagnostic-only two-statement provenance; never 172 qualification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: employee-schema-contract.yaml
  schema:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      EMPLOYEE_SCHEMA_SOURCE_SHA: ${{ inputs.source_sha }}
      EMPLOYEE_SCHEMA_CONTROL_SHA: ${{ github.sha }}
      EMPLOYEE_NORMALIZATION_ONLY: ${{ inputs.normalization_only }}
      EMPLOYEE_STRUCTURED_PROVENANCE: ${{ inputs.structured_provenance }}
    steps:
      - name: Require the enabled schema gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - name: Validate exact source selection
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.EMPLOYEE_SCHEMA_SOURCE_SHA)) process.exit(1)'
      - name: Reject incompatible qualification selections
        run: node -e 'if (process.env.EMPLOYEE_NORMALIZATION_ONLY === "true" && process.env.EMPLOYEE_STRUCTURED_PROVENANCE === "true") process.exit(1)'
      - name: Validate structured diagnostic selection
        if: inputs.structured_provenance == true
        run: node -e 'if (process.env.GITHUB_REF !== "refs/heads/main" || process.env.GITHUB_REPOSITORY !== "tutur3u/platform" || process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== "5c7c08e23a3d410bdbdc066f5c4dd2776fbeabd7") process.exit(1)'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact source dependencies
        working-directory: source
        run: bash ../scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Verify strict TAP and receipt gates
        run: node --test apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/employee-schema-tap.test.mjs apps/database/scripts/employee-schema-workflow.test.mjs apps/database/scripts/employee-normalization-qualification.test.mjs
      - name: Verify diagnostic-only provenance parser
        run: node --test apps/database/scripts/employee-failure-provenance.test.mjs
      - name: Apply isolated schema and qualify the selected rollback packet
        if: inputs.structured_provenance != true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs
      - name: Collect diagnostic-only structured exception provenance
        if: inputs.structured_provenance == true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-failure-provenance.mjs
      - name: Stop only this exact owned isolated database
        if: always()
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs --cleanup
      - name: Validate selected safe diagnostic transport
        id: diagnostic-transport
        if: always() && inputs.normalization_only == true && inputs.structured_provenance != true
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateNormalizationDiagnosticArtifact } from './apps/database/scripts/employee-normalization-qualification.mjs';
          validateNormalizationDiagnosticArtifact(readFileSync(`${process.env.RUNNER_TEMP}/employee-schema-receipts/qualification.json`));
          NODE
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance != true && (inputs.normalization_only != true || steps.diagnostic-transport.outcome == 'success')
        with:
          name: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/qualification.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance == true
        with:
          name: employee-provenance-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/provenance.json
          if-no-files-found: error
          retention-days: 3
