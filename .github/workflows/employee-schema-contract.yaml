name: Employee creation and restoration schema
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed creation/restoration stack commit (40 hex characters)
        required: true
        type: string
      structured_provenance:
        description: Diagnostic-only two-statement provenance; never 172 qualification
        required: false
        default: false
        type: boolean
      include_journal:
        description: Include durable journal, reserved-preflight and runtime observation assertions
        required: false
        default: false
        type: boolean
      include_personal_journal:
        description: Qualify personal journal rollback assertions and generate private RPC types; excludes employee journal and HTTP profiles
        required: false
        default: false
        type: boolean
      include_http:
        description: Also qualify real disposable PostgREST and GoTrue transport; requires include_journal
        required: false
        default: false
        type: boolean
      include_web_session:
        description: Build exact Next Web source and qualify real request/session auth; requires include_http
        required: false
        default: false
        type: boolean
      include_restore:
        description: Also qualify RESTORE SQL and Auth transport; requires include_http and include_journal
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: employee-schema-contract.yaml
  schema:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      EMPLOYEE_SCHEMA_SOURCE_SHA: ${{ inputs.source_sha }}
      EMPLOYEE_SCHEMA_CONTROL_SHA: ${{ github.sha }}
      EMPLOYEE_SCHEMA_INCLUDE_JOURNAL: ${{ inputs.include_journal }}
      EMPLOYEE_SCHEMA_INCLUDE_PERSONAL_JOURNAL: ${{ inputs.include_personal_journal }}
      EMPLOYEE_SCHEMA_INCLUDE_HTTP: ${{ inputs.include_http }}
      EMPLOYEE_SCHEMA_INCLUDE_WEB_SESSION: ${{ inputs.include_web_session }}
      EMPLOYEE_SCHEMA_INCLUDE_RESTORE: ${{ inputs.include_restore }}
    steps:
      - name: Require the enabled schema gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - name: Validate exact source selection
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.EMPLOYEE_SCHEMA_SOURCE_SHA)) process.exit(1)'
      - name: Validate structured diagnostic selection
        if: inputs.structured_provenance == true
        run: node -e 'if (process.env.GITHUB_REF !== "refs/heads/main" || process.env.GITHUB_REPOSITORY !== "tutur3u/platform" || process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== "5c7c08e23a3d410bdbdc066f5c4dd2776fbeabd7") process.exit(1)'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact source dependencies
        working-directory: source
        run: bash ../scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Type-check selected HTTP fixtures without builds
        if: inputs.include_http == true
        working-directory: source
        run: bun x tsc --project apps/web/e2e/fixtures/tsconfig.employee-http.json --noEmit
      - name: Verify strict TAP and receipt gates
        run: node --test apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/employee-schema-tap.test.mjs apps/database/scripts/employee-schema-workflow.test.mjs
      - name: Verify HTTP qualification receipt gates
        run: node --test apps/database/scripts/employee-http-receipt.test.mjs
      - name: Verify Web request session receipt gates
        run: node --test apps/database/scripts/employee-web-session-receipt.test.mjs apps/database/scripts/employee-web-session-process.test.mjs
      - name: Type check Web request session fixture
        if: inputs.include_web_session == true
        working-directory: source
        run: bun x tsc --noEmit -p apps/web/e2e/fixtures/tsconfig.employee-web-session.json
      - name: Test Web session fault proxy and owned process cleanup
        if: inputs.include_web_session == true
        working-directory: source
        run: bun x vitest run --config apps/web/e2e/fixtures/vitest.employee-web-session.config.ts
      - name: Verify diagnostic-only provenance parser
        run: node --test apps/database/scripts/employee-failure-provenance.test.mjs
      - name: Apply full isolated schema and qualify selected rollback assertions
        if: inputs.structured_provenance != true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs
      - name: Collect diagnostic-only structured exception provenance
        if: inputs.structured_provenance == true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-failure-provenance.mjs
      - name: Stop only this exact owned isolated database
        if: always()
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs --cleanup
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance != true
        with:
          name: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/employee-schema-receipts/qualification.json
            ${{ runner.temp }}/employee-schema-receipts/generated-types.ts
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance == true
        with:
          name: employee-provenance-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/provenance.json
          if-no-files-found: error
          retention-days: 3
