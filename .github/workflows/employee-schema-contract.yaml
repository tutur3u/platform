name: Employee creation and restoration schema
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed creation/restoration stack commit (40 hex characters)
        required: true
        type: string
      structured_provenance:
        description: Diagnostic-only two-statement provenance; never 172 qualification
        required: false
        default: false
        type: boolean
      include_public_consumer:
        description: Compile current public employee CREATE and RESTORE imports against this run's generated schema; excludes chat and diagnostics
        required: false
        default: false
        type: boolean
      include_journal:
        description: Include durable journal, reserved-preflight and runtime observation assertions
        required: false
        default: false
        type: boolean
      include_managed_profile:
        description: Qualify atomic managed profile rename, provenance and RESTORE revisions; requires include_journal
        required: false
        default: false
        type: boolean
      include_personal_journal:
        description: Qualify personal journal rollback assertions and generate private RPC types; excludes employee journal and HTTP profiles
        required: false
        default: false
        type: boolean
      include_http:
        description: Also qualify real disposable PostgREST and GoTrue transport; requires include_journal
        required: false
        default: false
        type: boolean
      include_profile_route:
        description: Build exact Infrastructure and qualify authenticated profile PATCH; requires journal, HTTP and managed profile
        required: false
        default: false
        type: boolean
      include_web_session:
        description: Build exact Next Web source and qualify real request/session auth; requires include_http
        required: false
        default: false
        type: boolean
      include_restore:
        description: Also qualify RESTORE SQL and Auth transport; requires include_http and include_journal
        required: false
        default: false
        type: boolean
      include_feedback_causal:
        description: Bounded eight expected-RED/restored-GREEN controls; requires include_feedback
        required: false
        default: false
        type: boolean
      include_feedback:
        description: Add the separate 106 feedback rollback assertions to foundation; excludes optional employee profiles
        required: false
        default: false
        type: boolean
      include_address_migration:
        description: Add legacy10, Google30 and retained-adoption41 rollback packets with same-database typegen
        required: false
        default: false
        type: boolean
      include_google_destination_provider:
        description: Qualify real disposable GoTrue Google-destination mutation with nonempty session preservation; requires address migration and identical source/control SHA
        required: false
        default: false
        type: boolean
      include_chat_initial_settings:
        description: Standalone foundation172 plus chat25 and real SQL to Web to Dart creation receipts; excludes all optional profiles and structured provenance
        required: false
        default: false
        type: boolean
      diagnose_chat_process:
        description: Diagnostic-only one direct Node24 comparison after stopped Bunx SIGABRT with nine passing Web controls; never qualification fallback
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: employee-schema-contract.yaml
  schema:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      EMPLOYEE_SCHEMA_SOURCE_SHA: ${{ inputs.source_sha }}
      EMPLOYEE_SCHEMA_CONTROL_SHA: ${{ github.sha }}
      EMPLOYEE_SCHEMA_INCLUDE_PUBLIC_CONSUMER: ${{ inputs.include_public_consumer }}
      EMPLOYEE_SCHEMA_INCLUDE_MANAGED_PROFILE: ${{ inputs.include_managed_profile }}
      EMPLOYEE_SCHEMA_INCLUDE_JOURNAL: ${{ inputs.include_journal }}
      EMPLOYEE_SCHEMA_INCLUDE_PERSONAL_JOURNAL: ${{ inputs.include_personal_journal }}
      EMPLOYEE_SCHEMA_INCLUDE_HTTP: ${{ inputs.include_http }}
      EMPLOYEE_SCHEMA_INCLUDE_PROFILE_ROUTE: ${{ inputs.include_profile_route }}
      EMPLOYEE_SCHEMA_INCLUDE_WEB_SESSION: ${{ inputs.include_web_session }}
      EMPLOYEE_SCHEMA_INCLUDE_RESTORE: ${{ inputs.include_restore }}
      EMPLOYEE_SCHEMA_INCLUDE_FEEDBACK_CAUSAL: ${{ inputs.include_feedback_causal }}
      EMPLOYEE_SCHEMA_INCLUDE_FEEDBACK: ${{ inputs.include_feedback }}
      EMPLOYEE_SCHEMA_INCLUDE_ADDRESS_MIGRATION: ${{ inputs.include_address_migration }}
      EMPLOYEE_SCHEMA_INCLUDE_GOOGLE_DESTINATION_PROVIDER: ${{ inputs.include_google_destination_provider }}
      EMPLOYEE_SCHEMA_INCLUDE_CHAT_INITIAL_SETTINGS: ${{ inputs.include_chat_initial_settings }}
      EMPLOYEE_SCHEMA_DIAGNOSE_CHAT_PROCESS: ${{ inputs.diagnose_chat_process }}
      EMPLOYEE_SCHEMA_INCLUDE_STRUCTURED_PROVENANCE: ${{ inputs.structured_provenance }}
    steps:
      - name: Require the enabled schema gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - name: Validate exact source selection
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.EMPLOYEE_SCHEMA_SOURCE_SHA) || (process.env.EMPLOYEE_SCHEMA_INCLUDE_ADDRESS_MIGRATION === "true" && process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== process.env.EMPLOYEE_SCHEMA_CONTROL_SHA)) process.exit(1)'
      - name: Validate structured diagnostic selection
        if: inputs.structured_provenance == true && inputs.include_chat_initial_settings != true
        run: node -e 'if (process.env.GITHUB_REF !== "refs/heads/main" || process.env.GITHUB_REPOSITORY !== "tutur3u/platform" || process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== "5c7c08e23a3d410bdbdc066f5c4dd2776fbeabd7") process.exit(1)'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Bind optional Google provider qualification
        if: inputs.include_google_destination_provider == true
        working-directory: source
        run: node --experimental-strip-types ../apps/database/scripts/employee-google-provider-ci.mjs --prepare
      - name: Validate standalone chat profile
        if: inputs.include_chat_initial_settings == true || inputs.diagnose_chat_process == true
        run: |
          node --input-type=module - <<'NODE'
          import { selectChatInitialSettings, selectChatProcessDiagnostic } from './apps/database/scripts/chat-initial-settings-qualification.mjs';
          const chat = selectChatInitialSettings(process.env.EMPLOYEE_SCHEMA_INCLUDE_CHAT_INITIAL_SETTINGS,
            Object.fromEntries(['JOURNAL', 'PERSONAL_JOURNAL', 'HTTP', 'WEB_SESSION', 'RESTORE',
              'FEEDBACK_CAUSAL', 'FEEDBACK', 'ADDRESS_MIGRATION', 'STRUCTURED_PROVENANCE']
              .map(name => [name, process.env[`EMPLOYEE_SCHEMA_INCLUDE_${name}`]])));
          selectChatProcessDiagnostic(process.env.EMPLOYEE_SCHEMA_DIAGNOSE_CHAT_PROCESS, chat);
          NODE
      - name: Validate employee public consumer selection
        if: inputs.include_public_consumer == true
        run: |
          node --input-type=module - <<'NODE'
          import { selectEmployeePublicConsumer } from './apps/database/scripts/employee-public-consumer-qualification.mjs';
          selectEmployeePublicConsumer(process.env.EMPLOYEE_SCHEMA_INCLUDE_PUBLIC_CONSUMER, {
            chatInitialSettings: process.env.EMPLOYEE_SCHEMA_INCLUDE_CHAT_INITIAL_SETTINGS === 'true',
            structuredProvenance: process.env.EMPLOYEE_SCHEMA_INCLUDE_STRUCTURED_PROVENANCE === 'true',
          });
          NODE
      - name: Validate authenticated profile route selection
        run: |
          node --input-type=module - <<'NODE'
          import { selectProfileRouteRuntime } from './apps/database/scripts/employee-profile-route-receipt.mjs';
          selectProfileRouteRuntime(process.env.EMPLOYEE_SCHEMA_INCLUDE_PROFILE_ROUTE,
            Object.fromEntries(['JOURNAL', 'HTTP', 'MANAGED_PROFILE', 'PERSONAL_JOURNAL',
              'CHAT_INITIAL_SETTINGS', 'STRUCTURED_PROVENANCE'].map(name =>
              [name, process.env[`EMPLOYEE_SCHEMA_INCLUDE_${name}`]])));
          NODE
      - name: Install exact source dependencies
        working-directory: source
        run: bash ../scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: ./.github/actions/cache-supabase-images
        with:
          database: source/apps/database
          profile: ${{ inputs.include_http == true && 'contract-http' || 'contract' }}
      - name: Verify optional Google provider receipt gates
        if: inputs.include_google_destination_provider == true
        working-directory: source
        run: node --test apps/database/scripts/employee-google-provider-ci.test.mjs
      - name: Type check Google provider fixtures without builds
        if: inputs.include_google_destination_provider == true
        working-directory: source
        run: bun x tsc --project apps/database/scripts/fixtures/employee-address-migration/tsconfig.provider.json --noEmit
      - name: Verify Google provider preservation and cleanup assertions
        if: inputs.include_google_destination_provider == true
        working-directory: source
        run: bun x vitest run --config apps/database/scripts/fixtures/employee-address-migration/vitest.provider.config.mts --maxWorkers=1 --no-file-parallelism
      - name: Type-check selected HTTP fixtures without builds
        if: inputs.include_http == true
        working-directory: source
        run: bun x tsc --project apps/web/e2e/fixtures/tsconfig.employee-http.json --noEmit
      - uses: subosito/flutter-action@v2
        if: inputs.include_chat_initial_settings == true
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - name: Restore locked chat mobile dependencies
        if: inputs.include_chat_initial_settings == true
        working-directory: source/apps/mobile
        run: |
          flutter pub get --help | grep -- --enforce-lockfile
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Build chat bridge workspace declarations
        if: inputs.include_chat_initial_settings == true
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd source && bun turbo:local run build --concurrency=1 --filter=@tuturuuu/types --filter=@tuturuuu/supabase
      - name: Type check explicit chat bridge adapter
        if: inputs.include_chat_initial_settings == true
        working-directory: source/apps/web
        run: bun x tsc --project e2e/fixtures/tsconfig.chat-initial-settings.json --noEmit
      - name: Verify opt-in chat qualification contracts
        if: inputs.include_chat_initial_settings == true
        run: node --test --test-concurrency=1 apps/database/scripts/chat-initial-settings-qualification.test.mjs apps/database/scripts/chat-process-diagnostic.test.mjs
      - name: Verify authenticated profile route receipt gates
        run: node --test apps/database/scripts/employee-profile-route-receipt.test.mjs
      - name: Typecheck authenticated Infrastructure profile fixture
        if: inputs.include_profile_route == true
        working-directory: source
        run: bun x tsc --noEmit -p apps/infrastructure/e2e/fixtures/tsconfig.employee-profile-route.json
      - name: Verify strict TAP and receipt gates
        run: node --test apps/database/scripts/employee-managed-profile-qualification.test.mjs apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/employee-schema-tap.test.mjs apps/database/scripts/employee-retained-mailbox-schema.test.mjs apps/database/scripts/employee-schema-workflow.test.mjs
      - name: Verify Google destination packet source
        if: inputs.include_address_migration == true
        working-directory: source
        run: node --test apps/database/scripts/employee-google-destination-fixture.test.mjs
      - name: Verify employee public consumer proof gates
        run: node --test scripts/employee-public-consumer-qualification.test.mjs
      - name: Verify feedback profile gates
        run: node --test apps/database/scripts/product-feedback-schema-profile.test.mjs
      - name: Verify feedback causal protocol gates
        run: node --test apps/database/scripts/product-feedback-causal-controls.test.mjs
      - name: Verify HTTP qualification receipt gates
        run: node --test apps/database/scripts/employee-http-receipt.test.mjs
      - name: Verify Web request session receipt gates
        run: node --test apps/database/scripts/employee-web-session-receipt.test.mjs apps/database/scripts/employee-web-session-process.test.mjs
      - name: Type check Web request session fixture
        if: inputs.include_web_session == true
        working-directory: source
        run: bun x tsc --noEmit -p apps/web/e2e/fixtures/tsconfig.employee-web-session.json
      - name: Test Web session fault proxy and owned process cleanup
        if: inputs.include_web_session == true
        working-directory: source
        run: bun x vitest run --config apps/web/e2e/fixtures/vitest.employee-web-session.config.ts
      - name: Verify diagnostic-only provenance parser
        run: node --test apps/database/scripts/employee-failure-provenance.test.mjs
      - name: Apply full isolated schema and qualify selected rollback assertions
        if: inputs.structured_provenance != true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs
      - name: Collect diagnostic-only structured exception provenance
        if: inputs.structured_provenance == true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-failure-provenance.mjs
      - name: Qualify optional Google destination provider
        if: inputs.include_google_destination_provider == true
        working-directory: source
        run: node --experimental-strip-types ../apps/database/scripts/employee-google-provider-ci.mjs
      - name: Stop only this exact owned isolated database
        if: always()
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs --cleanup
      - name: Finalize optional Google provider receipt
        if: always() && inputs.include_google_destination_provider == true
        working-directory: source
        run: node --experimental-strip-types ../apps/database/scripts/employee-google-provider-ci.mjs --finalize
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance != true
        with:
          name: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/employee-schema-receipts/qualification.json
            ${{ runner.temp }}/employee-schema-receipts/generated-types.ts
            ${{ runner.temp }}/employee-schema-receipts/chat-*.json
            ${{ runner.temp }}/employee-schema-receipts/google-provider.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance == true
        with:
          name: employee-provenance-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/provenance.json
          if-no-files-found: error
          retention-days: 3
