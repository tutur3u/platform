name: Employee creation and restoration schema
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed creation/restoration stack commit (40 hex characters)
        required: true
        type: string
      structured_provenance:
        description: Diagnostic-only two-statement provenance; never 172 qualification
        required: false
        default: false
        type: boolean
      identity_diagnostic:
        description: Diagnostic-only three-case identity rollback; never 172 qualification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: employee-schema-contract.yaml
  schema:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      EMPLOYEE_SCHEMA_SOURCE_SHA: ${{ inputs.source_sha }}
      EMPLOYEE_SCHEMA_CONTROL_SHA: ${{ github.sha }}
    steps:
      - name: Require the enabled schema gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - name: Validate exact source selection
        run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.EMPLOYEE_SCHEMA_SOURCE_SHA)) process.exit(1)'
      - name: Validate mutually exclusive diagnostic modes
        env:
          STRUCTURED_PROVENANCE: ${{ inputs.structured_provenance }}
          IDENTITY_DIAGNOSTIC: ${{ inputs.identity_diagnostic }}
        run: node -e 'if (process.env.STRUCTURED_PROVENANCE === "true" && process.env.IDENTITY_DIAGNOSTIC === "true") process.exit(1)'
      - name: Validate isolated identity diagnostic selection
        if: inputs.identity_diagnostic == true
        run: node -e 'if (process.env.GITHUB_REF !== "refs/heads/fix/employee-identity-diagnostic-control-20261012" || process.env.GITHUB_REPOSITORY !== "tutur3u/platform" || process.env.GITHUB_EVENT_NAME !== "workflow_dispatch" || process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== "5e05c380f60116e9eba41ba42062738229f877a9" || process.env.EMPLOYEE_SCHEMA_CONTROL_SHA === "f5d42a16613e8ce97cb923df55c4c77d024e6cfb") process.exit(1)'
      - name: Validate structured diagnostic selection
        if: inputs.structured_provenance == true
        run: node -e 'if (process.env.GITHUB_REF !== "refs/heads/main" || process.env.GITHUB_REPOSITORY !== "tutur3u/platform" || process.env.EMPLOYEE_SCHEMA_SOURCE_SHA !== "5c7c08e23a3d410bdbdc066f5c4dd2776fbeabd7") process.exit(1)'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact source dependencies
        working-directory: source
        run: bash ../scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Verify strict TAP and receipt gates
        run: node --test apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/employee-schema-tap.test.mjs apps/database/scripts/employee-schema-workflow.test.mjs
      - name: Verify diagnostic-only provenance parser
        run: node --test apps/database/scripts/employee-failure-provenance.test.mjs
      - name: Verify identity diagnostic parser
        if: inputs.identity_diagnostic == true
        run: node --test apps/database/scripts/employee-identity-diagnostic.test.mjs
      - name: Apply full isolated schema and qualify 172 rollback assertions
        if: inputs.structured_provenance != true && inputs.identity_diagnostic != true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs
      - name: Collect diagnostic-only structured exception provenance
        if: inputs.structured_provenance == true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-failure-provenance.mjs
      - name: Collect rollback-only identity diagnostics
        if: inputs.identity_diagnostic == true
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-identity-diagnostic.mjs
      - name: Stop only this exact owned isolated database
        if: always()
        working-directory: source
        run: node ../apps/database/scripts/verify-employee-schema-contract.mjs --cleanup
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance != true && inputs.identity_diagnostic != true
        with:
          name: employee-schema-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/qualification.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && inputs.structured_provenance == true
        with:
          name: employee-provenance-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/provenance.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always() && inputs.identity_diagnostic == true
        with:
          name: employee-identity-diagnostic-${{ inputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/employee-schema-receipts/identity-diagnostic.json
          if-no-files-found: error
          retention-days: 3
