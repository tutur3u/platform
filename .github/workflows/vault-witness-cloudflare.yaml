name: Vault Witness Cloudflare Artifact

# Build-only: verifies the secrets vault witness Worker at the exact commit
# and uploads its cf Build Output (`.cloudflare/output/v0`) with a SHA-256
# digest. The witness deploys from a dedicated Cloudflare account, so this
# workflow holds no credentials and never publishes.
on:
  push:
    branches: [main]
    paths:
      - apps/vault-witness/**
      - packages/vault-crypto/**
      - bun.lock
      - .github/workflows/vault-witness-cloudflare.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/vault-witness test
      - run: bun run --cwd apps/vault-witness type-check
      - run: bun run --cwd apps/vault-witness lint
      - run: bun run --cwd apps/vault-witness format:check
      - run: bun run --cwd apps/vault-witness build
      - name: Assert the publication shape
        working-directory: apps/vault-witness/.cloudflare/output/v0
        run: |
          jq -e '.name == "tuturuuu-vault-witness"
            and .workersDev == false
            and .previewUrls == false
            and (has("routes") | not)
            and .exports.VaultWitness.storage == "sqlite"
            and .exports.KeyringWitness.storage == "sqlite"
            and .env.WITNESS_SIGNING_KEY.type == "secret"
            and .env.WITNESS_API_TOKEN.type == "secret"
            and .env.WITNESS_STOPPED.type == "secret"' \
            workers/default/worker.config.json
          jq -e '.buildContext.isPreview == false' config.json
      - name: Package with a digest
        id: package
        working-directory: apps/vault-witness/.cloudflare
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf vault-witness-output.tar output
          digest="$(sha256sum vault-witness-output.tar | cut -d' ' -f1)"
          echo "$digest  vault-witness-output.tar" > vault-witness-output.tar.sha256
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### vault-witness artifact"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run: \`$GITHUB_RUN_ID\` attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo "- sha256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-witness-output-${{ github.sha }}
          path: |
            apps/vault-witness/.cloudflare/vault-witness-output.tar
            apps/vault-witness/.cloudflare/vault-witness-output.tar.sha256
          if-no-files-found: error
          retention-days: 30
