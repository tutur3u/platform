name: Web OpenNext families
# apps/web route families built as their own Cloudflare Workers
# (apps/web/cloudflare/opennext/families.json) and the tuturuuu.com gateway
# that routes to them. See apps/docs/build/devops/web-opennext-families.mdx.
on:
  push:
    branches: [production]
    paths:
      - 'apps/web/**'
      - 'apps/gateway/**'
      - 'packages/**'
      - 'bun.lock'
      - 'patches/@opennextjs%2Fcloudflare@1.20.17.patch'
      - '.github/workflows/web-opennext.yaml'
      - 'scripts/ci/web-opennext-*.mjs'
      - 'scripts/ci/gateway-deploy-config.mjs'
      - 'scripts/ci/gateway-cf-publication.mjs'
      - 'scripts/ci/gateway-cf-traffic.mjs'
      - 'scripts/ci/void-cf-publisher.mjs'
      - 'scripts/ci/fixtures/gateway-settings-fixture.json'
      - 'tuturuuu.ci.ts'
  workflow_dispatch:
    inputs:
      family:
        description: 'Enabled family id to build and deploy; empty builds every enabled family'
        required: false
        default: ''
        type: string
      gateway:
        description: 'Deploy the gateway after the families'
        required: false
        default: true
        type: boolean
      api-identity-seal-sha:
        description: 'Exact main SHA for a build-only API identity seal'
        required: false
        default: ''
        type: string
permissions:
  contents: read
# One run per commit; production deploys queue instead of cancelling.
concurrency:
  group: web-opennext-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
  WRANGLER_SEND_METRICS: 'false'
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: web-opennext.yaml
  plan:
    needs: check-ci
    if: >-
      needs.check-ci.outputs.should_run == 'true' && github.ref == 'refs/heads/production' &&
      inputs['api-identity-seal-sha'] == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      families: ${{ steps.plan.outputs.families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /apps/web/cloudflare/opennext/families.json
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          FAMILY: ${{ inputs.family || '' }}
        run: |
          enabled=$(jq -c '[.families[] | select(.enabled) | .id]' apps/web/cloudflare/opennext/families.json)
          if [ -n "$FAMILY" ]; then
            echo "$enabled" | jq -e --arg f "$FAMILY" 'index($f) != null' > /dev/null \
              || { echo "::error::$FAMILY is not an enabled family"; exit 1; }
            enabled=$(jq -cn --arg f "$FAMILY" '[$f]')
          fi
          echo "families=$enabled" >> "$GITHUB_OUTPUT"
          echo "Families: $enabled"
  api-identity-seal:
    needs: check-ci
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs['api-identity-seal-sha'] != '' && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      WEB_OPENNEXT_FAMILY: api-identity
      WEB_OPENNEXT_SHA: ${{ github.sha }}
      WEB_OPENNEXT_AUDIT_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit only the exact main commit
        env:
          REQUESTED_SHA: ${{ inputs['api-identity-seal-sha'] }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build API identity dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter='@tuturuuu/web^...' --concurrency=2
      - name: Verify guard behavior without Redis
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: >
            bun run --cwd packages/utils test src/abuse-protection/__tests__/edge-do-store.test.ts
            src/__tests__/api-proxy-guard-store.test.ts
      - name: Verify the atomic native-integrity store
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun run --cwd apps/abuse-guard test src/native-integrity.test.ts src/fence.test.ts src/worker.test.ts
      - name: Generate exact build metadata
        env:
          PLATFORM_BUILD_ENVIRONMENT: production
          PLATFORM_BUILD_REF_NAME: ${{ github.ref_name }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ github.sha }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Prune and build the held family
        run: |
          printf 'disposable checkout for an OpenNext family build\n' > apps/web/.opennext-disposable-checkout
          bun run --cwd apps/web opennext:prune api-identity --apply
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          bun run --cwd apps/web build:opennext
      - name: Measure the credential-free dry-run bundle
        working-directory: apps/web
        run: |
          set -o pipefail
          bun x --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/upload" \
            -c cloudflare/opennext/wrangler.api-identity.jsonc | tee "$RUNNER_TEMP/dry-run.log"
          node ../../scripts/ci/web-opennext-size.mjs "$RUNNER_TEMP/upload" \
            --log "$RUNNER_TEMP/dry-run.log" --receipt "$RUNNER_TEMP/size-api-identity.json"
      - name: Exercise and restore the sealed OpenNext Worker
        run: |
          node scripts/ci/web-opennext-smoke.mjs api-identity "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/identity-seal" "$RUNNER_TEMP/identity-restore"
          tar -C apps/web -czf "$RUNNER_TEMP/identity-seal/web-api-identity.tar.gz" \
            .open-next cloudflare/opennext/wrangler.api-identity.jsonc
          (
            cd "$RUNNER_TEMP/identity-seal"
            sha256sum web-api-identity.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar -C "$RUNNER_TEMP/identity-restore" -xzf \
            "$RUNNER_TEMP/identity-seal/web-api-identity.tar.gz"
          node scripts/ci/web-opennext-smoke.mjs api-identity "$GITHUB_SHA" "$RUNNER_TEMP/identity-restore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-api-identity-seal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/identity-seal/
            ${{ runner.temp }}/size-api-identity.json
            apps/web/cloudflare/opennext/prune-receipt.json
          if-no-files-found: error
          retention-days: 14
  family:
    needs: plan
    if: github.ref == 'refs/heads/production' && needs.plan.outputs.families != '[]'
    name: family (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: colab-production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family: ${{ fromJSON(needs.plan.outputs.families) }}
    concurrency:
      group: web-opennext-deploy-${{ matrix.family }}
      cancel-in-progress: false
      queue: max
    env:
      FAMILY: ${{ matrix.family }}
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # Public build inputs, inlined into the client and server bundles.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require public configuration
        env:
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          ROOT_WORKSPACE_ID: '00000000-0000-0000-0000-000000000000'
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_URL ROOT_WORKSPACE_ID; do
            test -n "${!name}" || { echo "::error::configuration $name is not set (repository variables PRODUCTION_SUPABASE_URL / PRODUCTION_SUPABASE_PUBLISHABLE_KEY)"; exit 1; }
          done
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Generate shared build metadata
        env:
          PLATFORM_BUILD_ENVIRONMENT: production
          PLATFORM_BUILD_REF_NAME: ${{ github.ref_name }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ github.sha }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - run: bun x --no-install turbo run build --filter='@tuturuuu/web^...' --concurrency=2
      - run: node --test scripts/ci/web-opennext-size.test.mjs scripts/ci/gateway-deploy-config.test.mjs
      # The runner checkout is disposable: prune deletes every route entry the
      # family does not own.
      - name: Prune to the family routes
        run: |
          printf 'disposable checkout for an OpenNext family build\n' > apps/web/.opennext-disposable-checkout
          bun run --cwd apps/web opennext:prune "$FAMILY" --apply
      - name: Build the family Worker
        env:
          WEB_OPENNEXT_SHA: ${{ github.sha }}
          WEB_OPENNEXT_FAMILY: ${{ matrix.family }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ github.sha }}
        run: |
          # API families define no server actions; page families get a
          # per-build key until the shared key build lands.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
          bun run --cwd apps/web build:opennext
      - name: Size gate (whole upload, gzip)
        working-directory: apps/web
        run: |
          bun x --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/upload" \
            -c "cloudflare/opennext/wrangler.$FAMILY.jsonc" | tee "$RUNNER_TEMP/dry-run.log"
          node ../../scripts/ci/web-opennext-size.mjs "$RUNNER_TEMP/upload" \
            --log "$RUNNER_TEMP/dry-run.log" --receipt "$RUNNER_TEMP/size-$FAMILY.json"
      - name: Local emitted-Worker smoke
        timeout-minutes: 5
        run: node scripts/ci/web-opennext-smoke.mjs "$FAMILY" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-opennext-${{ matrix.family }}-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/size-${{ matrix.family }}.json
            apps/web/cloudflare/opennext/prune-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Deploy the family Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          ROOT_WORKSPACE_ID: '00000000-0000-0000-0000-000000000000'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::WEB_OPENNEXT_CLOUDFLARE_API_TOKEN is not set on colab-production"; exit 1; }
          # The family Worker has no routes; nothing serves it until the
          # gateway binds and flags it.
          bun x --no-install wrangler deploy -c "cloudflare/opennext/wrangler.$FAMILY.jsonc" \
            --message "web-$FAMILY $GITHUB_SHA" \
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" \
            --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "ROOT_WORKSPACE_ID:$ROOT_WORKSPACE_ID" \
            --var "PLATFORM_BUILD_COMMIT_HASH:$GITHUB_SHA"
  gateway:
    needs: [plan, family]
    # Runs after every family deploy succeeded, or when no family was built.
    if: >-
      always() && github.ref == 'refs/heads/production' &&
      needs.plan.result == 'success' &&
      (needs.family.result == 'success' || needs.family.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: colab-production
    permissions:
      contents: read
    concurrency:
      group: web-opennext-gateway-deploy
      cancel-in-progress: false
      queue: max
    env:
      WEB_ORIGIN: ${{ vars.GATEWAY_WEB_ORIGIN }}
      MARKETING_ORIGIN: https://marketing.tuturuuu.com
      GATEWAY_WEB_FAMILIES: ${{ vars.GATEWAY_WEB_FAMILIES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/gateway test
      - run: node --test scripts/ci/gateway-deploy-config.test.mjs
      - name: Capture the gateway version serving traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/ci/gateway-deploy-config.mjs capture "$RUNNER_TEMP/gateway-settings.json"
          # Names and types only in the log; values stay in the file.
          jq -r '.result.bindings[] | "\(.type) \(.name)"' "$RUNNER_TEMP/gateway-settings.json"
      # A flagged family must have its Worker and every secret name its config
      # requires before the gateway sends traffic to it.
      - name: Verify flagged family Workers and secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          for id in $(echo "$GATEWAY_WEB_FAMILIES" | tr ',' ' '); do
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid family id in GATEWAY_WEB_FAMILIES"; exit 1; }
            worker="tuturuuu-web-$id"
            config="apps/web/cloudflare/opennext/wrangler.$id.jsonc"
            test -f "$config" || { echo "::error::$id has no committed wrangler config"; exit 1; }
            bun x --no-install wrangler secret list --name "$worker" --format json > "$RUNNER_TEMP/secrets-$id.json"
            required=$(node scripts/ci/gateway-deploy-config.mjs required-secrets "$config")
            jq -e --argjson required "$required" 'map(.name) as $names | all($required[]; . as $n | $names | index($n) != null)' \
              "$RUNNER_TEMP/secrets-$id.json" > /dev/null \
              || { echo "::error::$worker is missing a required secret name: $required"; exit 1; }
            echo "$worker: required secret names present ($required)"
          done
      - name: Write the gateway deploy config
        run: |
          node scripts/ci/gateway-deploy-config.mjs write \
            "$RUNNER_TEMP/gateway-settings.json" apps/gateway/wrangler.deploy.json
      - name: Build the gateway Worker
        run: bun run --cwd apps/gateway build
      - name: Rehearse cf gateway version-only publication (no traffic; Wrangler still live)
        if: vars.GATEWAY_CF_VERSION_UPLOAD_REHEARSAL == 'true'
        env:
          GATEWAY_PUBLICATION_REHEARSAL: '1'
          WEB_ORIGIN: ${{ env.WEB_ORIGIN }}
          MARKETING_ORIGIN: ${{ env.MARKETING_ORIGIN }}
          GATEWAY_WEB_FAMILIES: ${{ env.GATEWAY_WEB_FAMILIES }}
        run: |
          node scripts/ci/gateway-cf-publication.mjs rehearse \
            "$RUNNER_TEMP/gateway-settings.json"
      - name: Upload the gateway version (cf prebuilt, version-only at 0%)
        if: vars.GATEWAY_CF_VERSION_UPLOAD_LIVE == 'true'
        env:
          GATEWAY_CF_VERSION_UPLOAD_LIVE: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
          WEB_ORIGIN: ${{ env.WEB_ORIGIN }}
          MARKETING_ORIGIN: ${{ env.MARKETING_ORIGIN }}
          GATEWAY_WEB_FAMILIES: ${{ env.GATEWAY_WEB_FAMILIES }}
        run: |
          node scripts/ci/gateway-deploy-config.mjs assert-current "$RUNNER_TEMP/gateway-settings.json"
          version=$(node scripts/ci/gateway-cf-publication.mjs publish-version-only \
            "$RUNNER_TEMP/gateway-settings.json" | jq -r .versionId)
          test -n "$version" && test "$version" != null || { echo "::error::cf version-only upload returned no version id"; exit 1; }
          echo "GATEWAY_VERSION_ID=$version" >> "$GITHUB_ENV"
          echo "Uploaded gateway version $version via cf workers versions create --prebuilt (0% traffic until deploy step)."
      - name: Upload the gateway version (Wrangler publisher fallback)
        if: vars.GATEWAY_CF_VERSION_UPLOAD_LIVE != 'true'
        working-directory: apps/gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          node ../../scripts/ci/gateway-deploy-config.mjs assert-current "$RUNNER_TEMP/gateway-settings.json"
          bun x --no-install wrangler versions upload -c wrangler.deploy.json \
            --message "gateway $GITHUB_SHA families=${GATEWAY_WEB_FAMILIES:-none}" | tee "$RUNNER_TEMP/gateway-upload.txt"
          version=$(grep -oE 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/gateway-upload.txt" | awk '{print $4}')
          test -n "$version" || { echo "::error::no version id in the upload output"; exit 1; }
          echo "GATEWAY_VERSION_ID=$version" >> "$GITHUB_ENV"
      - name: Deploy gateway traffic with cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_OPENNEXT_CLOUDFLARE_API_TOKEN }}
        run: |
          version="$GATEWAY_VERSION_ID"
          test -n "$version" || { echo "::error::missing GATEWAY_VERSION_ID from the upload step"; exit 1; }
          previous=$(jq -er .result.versionId "$RUNNER_TEMP/gateway-settings.json")
          echo "Rollback target $previous. Roll back with:"
          echo "cf workers deployments create --worker tuturuuu-gateway --strategy percentage --versions '[{\"version_id\":\"$previous\",\"percentage\":100}]'"
          echo "If Cloudflare rejects the rollback because secrets changed since $previous, review the change and rerun with --bypass-deployment-checks."
          # A just-uploaded version can be briefly undeployable (100146; exit
          # 75, nothing written). Any other outcome is final: serve reconciles
          # failed requests by readback and never repeats a successful one.
          for attempt in 1 2 3 4 5 6; do
            node scripts/ci/gateway-deploy-config.mjs assert-current "$RUNNER_TEMP/gateway-settings.json"
            status=0
            node scripts/ci/gateway-cf-publication.mjs serve "$version" "gateway $GITHUB_SHA" || status=$?
            test "$status" -eq 0 && break
            if test "$status" -ne 75 || test "$attempt" -eq 6; then
              echo "::error::gateway version $version did not deploy"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "Deployed gateway version $version at 100%."
      - name: Verify the gateway answers
        run: |
          status=$(curl --silent --retry 5 --retry-delay 5 --max-time 30 --output /dev/null \
            --write-out '%{http_code}' https://tuturuuu.com/api/build-info)
          test "$status" = 200
