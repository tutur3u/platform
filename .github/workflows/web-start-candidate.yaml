name: Web Start Candidate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'apps/web/**'
      - 'packages/start-bridge/**'
      - 'packages/legal/**'
      - 'packages/utils/src/abuse-protection/**'
      - 'packages/utils/package.json'
      - 'bun.lock'
      - '.github/workflows/web-start-candidate.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: web-start-candidate.yaml
  candidate:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - run: bun apps/web/cloudflare/generate-inventory.ts --check --artifact ${{ runner.temp }}/web-start-census.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-start-census
          path: ${{ runner.temp }}/web-start-census.json
          retention-days: 7
          if-no-files-found: error
      - run: bun run --cwd apps/web test:candidate
      - run: node --experimental-strip-types --test apps/web/e2e-wave1-staging/policy.test.ts
      - run: bun x --no-install tsc --noEmit -p apps/web/tsconfig.wave1-staging.json
      - run: bun run --cwd apps/web build:candidate
      - run: bun run --cwd apps/web test:candidate:runtime
      - run: bun run --cwd apps/web type-check:candidate
      - run: bun x --no-install biome check apps/web/cloudflare apps/web/vite.config.mts apps/web/tsconfig.candidate.json
