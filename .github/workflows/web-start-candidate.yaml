name: Web Start Candidate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'apps/web/**'
      - 'packages/start-bridge/**'
      - 'packages/utils/src/abuse-protection/**'
      - 'bun.lock'
      - '.github/workflows/web-start-candidate.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: web-start-candidate.yaml
  candidate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun apps/web/cloudflare/generate-inventory.ts --check
      - run: bun run --cwd apps/web test:candidate
      - run: bun run --cwd apps/web build:candidate
      - run: bun run --cwd apps/web test:candidate:runtime
      - run: bun run --cwd apps/web type-check:candidate
      - run: bunx --no-install biome check apps/web/cloudflare apps/web/vite.config.mts apps/web/tsconfig.candidate.json
