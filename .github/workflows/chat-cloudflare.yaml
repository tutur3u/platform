name: chat Cloudflare Build
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['apps/chat/**', 'packages/**', 'bun.lock', '.github/workflows/chat-cloudflare.yaml']
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name != 'pull_request' && secrets.PRODUCTION_SUPABASE_URL || vars.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://chat.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-bun-with-retry
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build workspace dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter="@tuturuuu/chat^..." --concurrency=2
          token: ''
          team: ''
      - name: Build Start Worker
        working-directory: apps/chat
        run: bun run build:cloudflare
      - name: Check bridge routes and native types
        working-directory: apps/chat
        run: |
          bun run routes:check
          bun run type-check:cloudflare
      - name: Record emitted config receipt
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/chat "$CI_SOURCE_SHA" "$RUNNER_TEMP/chat-config-receipt.json"
      - name: Anonymous root and closed ingress smoke
        working-directory: apps/chat
        run: node --test cloudflare/anonymous.runtime.mjs
      - name: Package deployable Worker and assets
        run: |
          mkdir -p "$RUNNER_TEMP/cutover"
          tar -czf "$RUNNER_TEMP/cutover/chat-worker.tgz" -C apps/chat dist
          cp "$RUNNER_TEMP/chat-config-receipt.json" "$RUNNER_TEMP/cutover/"
          echo "$CI_SOURCE_SHA" > "$RUNNER_TEMP/cutover/SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-cutover-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cutover/
          retention-days: 7
          if-no-files-found: error
