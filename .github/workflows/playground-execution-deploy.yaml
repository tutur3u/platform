name: Playground execution staging deploy

# Manual deploy of the Playground execution Worker to staging, pinned to one
# registry image digest, followed by hosted qualification of the guest sandbox.
# The build job holds no credentials. The deploy job runs behind the
# reviewer-gated `playground-staging` environment. Admission stays paused: the
# qualification uses only the staging fixture route, never product traffic.
on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: registry.cloudflare.com/<account>/tuturuuu-playground@sha256:<digest>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: playground-execution-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tutur3u/platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
      PLAYGROUND_DEPLOY_ENV: staging
    steps:
      - name: Accept only a pinned Playground registry digest
        run: |
          set -euo pipefail
          [[ "$PLAYGROUND_IMAGE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/tuturuuu-playground@sha256:[a-f0-9]{64}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Run the execution Worker tests
        run: node --test apps/playground-execution/src/*.test.mjs
      - name: Build the published type entry points the bundle resolves
        run: bun run --cwd packages/types build
      - name: Build the staging Worker
        working-directory: apps/playground-execution
        run: bun x --no-install cf build
      - name: Check the emitted Worker references only the pinned image
        working-directory: apps/playground-execution
        run: |
          set -euo pipefail
          test -d .cloudflare/output
          grep -rFl "$PLAYGROUND_IMAGE" .cloudflare/output > /dev/null
          others="$(grep -rhoE 'registry\.cloudflare\.com/[^"[:space:]]+' .cloudflare/output | sort -u | grep -vxF "$PLAYGROUND_IMAGE" || true)"
          test -z "$others"
          for name in PlaygroundCoordinator PlaygroundSlot PlaygroundChecker PlaygroundQualifier; do
            grep -rqF "$name" .cloudflare/output
          done
      - name: Stage the build output
        run: cp -R apps/playground-execution/.cloudflare/output "$RUNNER_TEMP/playground-execution-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-execution-staging-${{ github.sha }}
          path: ${{ runner.temp }}/playground-execution-output
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: playground-staging
    env:
      PLAYGROUND_IMAGE: ${{ inputs.image_reference }}
      PLAYGROUND_DEPLOY_ENV: staging
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground-execution-staging-${{ github.sha }}
          path: apps/playground-execution/.cloudflare/output
      - name: Recheck the downloaded output names only the pinned image
        working-directory: apps/playground-execution
        run: |
          set -euo pipefail
          [[ "$PLAYGROUND_IMAGE" =~ ^registry\.cloudflare\.com/[a-f0-9]{32}/tuturuuu-playground@sha256:[a-f0-9]{64}$ ]]
          grep -rFl "$PLAYGROUND_IMAGE" .cloudflare/output > /dev/null
          others="$(grep -rhoE 'registry\.cloudflare\.com/[^"[:space:]]+' .cloudflare/output | sort -u | grep -vxF "$PLAYGROUND_IMAGE" || true)"
          test -z "$others"
      - name: Deploy the staging Worker with its secrets
        working-directory: apps/playground-execution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLAYGROUND_STAGING_CLOUDFLARE_API_TOKEN }}
          PLAYGROUND_INGRESS_SECRET: ${{ secrets.PLAYGROUND_STAGING_INGRESS_SECRET }}
          PLAYGROUND_OPERATOR_SECRET: ${{ secrets.PLAYGROUND_STAGING_OPERATOR_SECRET }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#PLAYGROUND_INGRESS_SECRET}" -ge 32
          test "${#PLAYGROUND_OPERATOR_SECRET}" -ge 32
          test "$PLAYGROUND_INGRESS_SECRET" != "$PLAYGROUND_OPERATOR_SECRET"
          secrets="$RUNNER_TEMP/playground-secrets.env"
          trap 'rm -f "$secrets"' EXIT
          umask 077
          printf 'PLAYGROUND_INGRESS_SECRET=${PLAYGROUND_INGRESS_SECRET}\nPLAYGROUND_OPERATOR_SECRET=${PLAYGROUND_OPERATOR_SECRET}\n' > "$secrets"
          bun x --no-install cf deploy --prebuilt --no-provision \
            --containers-rollout immediate \
            --secrets-file "$secrets" \
            --tag "${GITHUB_SHA:0:12}" \
            --message "playground staging ${GITHUB_SHA:0:12}"
      - name: Qualify the guest sandbox on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PLAYGROUND_STAGING_CLOUDFLARE_API_TOKEN }}
          PLAYGROUND_OPERATOR_SECRET: ${{ secrets.PLAYGROUND_STAGING_OPERATOR_SECRET }}
        run: |
          set -euo pipefail
          subdomain="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -er 'select(.success == true) | .result.subdomain // empty')"
          # Never send the operator secret to a host the account does not own.
          [[ "$subdomain" =~ ^[a-z0-9-]+$ && "$subdomain" != null ]]
          origin="https://tuturuuu-playground-execution-staging.$subdomain.workers.dev"
          report="$RUNNER_TEMP/qualification.json"
          : > "$report"
          # Retry only while the new deployment is not answering yet. Any HTTP
          # answer from the Worker ends the loop, so runs never stack.
          status=000
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --output "$report" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 300 -X POST \
              -H "Authorization: Bearer $PLAYGROUND_OPERATOR_SECRET" \
              "$origin/qualify" || true)"
            [[ "$status" == 000 || "$status" == 404 || "$status" == 530 ]] || break
            sleep $((attempt * 10))
          done
          echo "qualification HTTP $status"
          jq . "$report" || cat "$report" || true
          {
            echo '### Playground hosted qualification'
            echo "HTTP $status"
            echo '```json'
            jq . "$report" || cat "$report" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Admission must still be paused after a deploy; check it first.
          control="$(curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $PLAYGROUND_OPERATOR_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false}' "$origin/control")"
          echo "$control"
          test "$(jq -r .enabled <<<"$control")" = false
          test "$status" = 200
          test "$(jq -r .passed "$report")" = true
          test "$(jq -r .stopped "$report")" = true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-execution-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 90
          if-no-files-found: ignore
