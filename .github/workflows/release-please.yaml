name: Release Please

on:
  push:
    branches: [production]
  workflow_dispatch:

# Production pushes regenerate the Release Please branch. Serialize that work
# with the daily auto-merge so its selected head cannot be force-pushed midway
# through validation or cleanup.
concurrency:
  group: release-please-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reject-non-production-ref:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-production release ref
        run: |
          echo "::error::Release Please can only run from refs/heads/production. Current ref: ${GITHUB_REF}."
          exit 1

  check-ci:
    permissions:
      contents: read
      deployments: read
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: release-please.yaml

  release-please:
    needs: [check-ci]
    if: github.ref == 'refs/heads/production' && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is an admin PAT; only main and production may read it.
    environment: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Recover overflow release notes
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: node scripts/ci/release-please-overflow-recovery.js --target-branch production

      - name: Capture previous generated release head
        id: previous-release
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git ls-remote --heads origin refs/heads/release-please--branches--production)
          if [ -n "$previous" ]; then
            previous_sha=${previous%%$'\t'*}
            [[ "$previous_sha" =~ ^[a-f0-9]{40}$ ]]
            git fetch origin "$previous_sha"
            echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: production
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please serializes package.json files independently of Biome.
      # When those serializers disagree (for example, a short `files` array),
      # the generated PR immediately goes red even though no authored source is
      # malformed. Normalize only the files changed by the generated release,
      # amend the release commit so the approval guard still sees one untouched
      # release commit, and use the exact remote SHA as a force-with-lease gate.
      - name: Setup Node.js for release formatting
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Setup pinned Bun for generated lock metadata
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4

      - name: Normalize generated release formatting
        shell: bash
        env:
          RELEASE_BRANCH: release-please--branches--production
          PREVIOUS_RELEASE_SHA: ${{ steps.previous-release.outputs.sha }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            echo "origin/${RELEASE_BRANCH} does not exist; there is no generated PR to format."
            exit 0
          fi

          git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          release_sha="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          trusted_scripts=$(mktemp -d)
          cp -R scripts "${trusted_scripts}/scripts"
          mkdir -p "${trusted_scripts}/packages/utils/src"
          cp packages/utils/src/release-note-policy-core.cjs packages/utils/src/release-note-policy.json \
            "${trusted_scripts}/packages/utils/src/"
          git switch --detach "${release_sha}"
          trap 'git switch --detach origin/production >/dev/null; rm -rf -- "${trusted_scripts}"' EXIT

          changed_files=()
          while IFS= read -r -d '' file; do
            changed_files+=("${file}")
          done < <(git diff --name-only -z origin/production...HEAD)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "The generated release branch has no changed files."
            exit 0
          fi

          # Fail before formatting any path outside the generated release set.
          node "${trusted_scripts}/scripts/ci/release-docs-inventory.js" --refresh origin/production HEAD "${PREVIOUS_RELEASE_SHA}"
          node "${trusted_scripts}/scripts/ci/release-workspace-lock.js" origin/production HEAD --working
          node "${trusted_scripts}/scripts/ci/normalize-release-notes.js" origin/production
          npx --yes @biomejs/biome@2.5.13 format --write --files-ignore-unknown=true -- "${changed_files[@]}"

          # Refresh only manager-owned metadata: no dependency installation or
          # package lifecycle scripts. Independently reject any non-version delta.
          bun install --lockfile-only --ignore-scripts
          node "${trusted_scripts}/scripts/ci/release-docs-inventory.js" --refresh origin/production HEAD "${PREVIOUS_RELEASE_SHA}"
          node "${trusted_scripts}/scripts/ci/release-workspace-lock.js" origin/production HEAD --working
          if ! git diff --quiet -- apps/docs/reference/repository/versions.mdx; then
            changed_files+=(apps/docs/reference/repository/versions.mdx)
          fi
          if ! git diff --quiet -- bun.lock; then changed_files+=("bun.lock"); fi

          if git diff --quiet -- "${changed_files[@]}"; then
            echo "Generated release files already match Biome formatting."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed_files[@]}"
          git commit --amend --no-edit
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}" \
            --force-with-lease="refs/heads/${RELEASE_BRANCH}:${release_sha}"

      - name: Normalize generated release description
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: node scripts/ci/normalize-release-description.js

      # Overflow notes are still needed while the merged PR carries
      # `autorelease: pending`. Release Please has consumed them once it reports
      # releases_created=true, so this is the first safe owner and moment for
      # deleting the metadata branch.
      - name: Delete tagged overflow release notes
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_NOTES_BRANCH: release-please--branches--production--release-notes
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "${RELEASE_NOTES_BRANCH}" >/dev/null 2>&1; then
            echo "origin/${RELEASE_NOTES_BRANCH} is already deleted."
            exit 0
          fi

          if git push origin --delete "${RELEASE_NOTES_BRANCH}" 2>&1; then
            echo "Deleted origin/${RELEASE_NOTES_BRANCH} after tagging."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "${RELEASE_NOTES_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Could not delete origin/${RELEASE_NOTES_BRANCH} after tagging."
            exit 1
          fi

          echo "origin/${RELEASE_NOTES_BRANCH} was deleted concurrently."

      # The `Protected branches` ruleset requires an approving review, so an
      # untouched release PR sits at REVIEW_REQUIRED until someone clicks it.
      # This approves it only while it is still nothing but generated output:
      # every commit a release commit by the account that opened the PR, and
      # every changed file one release-please rewrites, derived from
      # release-please-config.json rather than hard-coded.
      #
      # Nothing here needs to un-approve: the same ruleset sets
      # `dismiss_stale_reviews_on_push`, so any later push to the release branch
      # drops the approval, including one this workflow never sees.
      #
      # Deliberately `github.token` and not RELEASE_PLEASE_TOKEN — GitHub
      # refuses a review from the account that opened the pull request, so the
      # approval has to come from a different identity than release-please used
      # above. A skip is reported and leaves the run green.
      - name: Approve untouched release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Preserve the original approval allowlist; neither agents nor vhpx qualify.
          RELEASE_PLEASE_AUTHORS: github-actions[bot]
        run: node scripts/ci/release-please-auto-approve.js --target-branch production
