name: Release Please

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  reject-non-production-ref:
    if: github.ref != 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject non-production release ref
        run: |
          echo "::error::Release Please can only run from refs/heads/production. Current ref: ${GITHUB_REF}."
          exit 1

  check-ci:
    if: github.ref == 'refs/heads/production'
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: release-please.yaml

  release-please:
    needs: [check-ci]
    if: github.ref == 'refs/heads/production' && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: production
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Recover overflow release notes
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: node scripts/ci/release-please-overflow-recovery.js --target-branch production

      - name: Create or update release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: production
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The `Protected branches` ruleset requires an approving review, so an
      # untouched release PR sits at REVIEW_REQUIRED until someone clicks it.
      # This approves it only while it is still nothing but generated output:
      # every commit a release commit by the account that opened the PR, and
      # every changed file one release-please rewrites, derived from
      # release-please-config.json rather than hard-coded.
      #
      # Nothing here needs to un-approve: the same ruleset sets
      # `dismiss_stale_reviews_on_push`, so any later push to the release branch
      # drops the approval, including one this workflow never sees.
      #
      # Deliberately `github.token` and not RELEASE_PLEASE_TOKEN — GitHub
      # refuses a review from the account that opened the pull request, so the
      # approval has to come from a different identity than release-please used
      # above. A skip is reported and leaves the run green.
      - name: Approve untouched release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Extend when release-please starts committing as another identity;
          # the script names the login it saw when it skips for this reason.
          RELEASE_PLEASE_AUTHORS: github-actions[bot]
        run: node scripts/ci/release-please-auto-approve.js --target-branch production
