name: Colab Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: read

# Validation runs supersede per PR or branch; production and manual runs stay
# unique. The literal prefix keeps workflow_call runs from one planner apart.
# Only the deploy job serializes production with a non-cancelling queue.
concurrency:
  group: colab-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: colab-cloudflare.yaml
  validate:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/multiplayer
      - run: bun run test
        working-directory: apps/colab
      - name: Verify idempotent expiry in a local Worker
        run: node --test scripts/verify-expiry-runtime.mjs
        working-directory: apps/colab
      - run: bun run lint
        working-directory: apps/colab
      - run: bun run build
        working-directory: apps/colab
      - name: Verify local Vite Worker preview boundaries
        run: node --test scripts/verify-preview-runtime.mjs
        working-directory: apps/colab
      - run: bun x --no-install wrangler deploy --dry-run
        working-directory: apps/colab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    if: (github.ref == 'refs/heads/production') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: colab-production
    concurrency:
      group: colab-cloudflare-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
      - name: Deploy the verified revision
        working-directory: apps/colab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing COLAB_CLOUDFLARE_API_TOKEN'; exit 1; }
          bun x --no-install wrangler deploy --message "$GITHUB_SHA"
      - name: Verify canonical health and deployed assets
        working-directory: apps/colab
        run: node scripts/verify-deployment.mjs
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: colab-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
