name: Colab Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: read

# Validation runs supersede per PR or branch; production and manual runs stay
# unique. The literal prefix keeps workflow_call runs from one planner apart.
# Only the deploy job serializes production with a non-cancelling queue.
concurrency:
  group: colab-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when colab is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app.outputs.run == 'false') && 'false' || (github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true') }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: colab
  check-ci:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: colab-cloudflare.yaml
  validate:
    needs: [check-ci, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/multiplayer
      - run: bun run test
        working-directory: apps/colab
      - name: Verify the public commit bake and build-info contract
        run: node --experimental-strip-types --test scripts/bake-build-commit.test.mjs scripts/build-info.test.mjs
        working-directory: apps/colab
      - name: Verify idempotent expiry in a local Worker
        run: node --test scripts/verify-expiry-runtime.mjs
        working-directory: apps/colab
      - run: bun run lint
        working-directory: apps/colab
      - run: bun run build
        working-directory: apps/colab
      - name: Verify local Vite Worker preview boundaries
        run: node --test scripts/verify-preview-runtime.mjs
        working-directory: apps/colab
      - run: bun x --no-install wrangler deploy --dry-run
        working-directory: apps/colab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    if: (github.ref == 'refs/heads/production') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: write
      # GitHub OIDC for the deployment coordinator steps, which run only when
      # DEPLOY_COORDINATOR_MODE is observe or enforce. The grant applies to
      # every step in this job whatever the mode.
      id-token: write
    runs-on: ubuntu-latest
    environment: colab-production
    concurrency:
      group: colab-cloudflare-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: colab
          environment: production
      - run: bun install --frozen-lockfile
        if: steps.coordinator.outputs.publish != 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.coordinator.outputs.publish != 'false'
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
      - name: Bake the public commit into build-info
        if: steps.coordinator.outputs.publish != 'false'
        working-directory: apps/colab
        run: node scripts/bake-build-commit.mjs
      - name: Check the deployment coordinator lease
        if: steps.coordinator.outputs.publish != 'false' && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: check
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: colab
          environment: production
      - name: Deploy the verified revision
        if: steps.coordinator.outputs.publish != 'false'
        working-directory: apps/colab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing COLAB_CLOUDFLARE_API_TOKEN'; exit 1; }
          bun x --no-install wrangler deploy --message "$GITHUB_SHA"
      - name: Verify canonical health and deployed assets
        if: steps.coordinator.outputs.publish != 'false'
        working-directory: apps/colab
        run: node scripts/verify-deployment.mjs
      - name: Record successful Cloudflare deployment
        if: steps.coordinator.outputs.publish != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: colab-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: colab
          environment: production
          job-status: ${{ job.status }}
