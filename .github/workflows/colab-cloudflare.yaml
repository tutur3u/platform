name: Colab Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  pull_request:
    paths:
      - 'apps/colab/**'
      - 'packages/multiplayer/**'
      - 'packages/internal-api/**'
      - 'packages/ui/**'
      - 'packages/icons/**'
      - 'packages/utils/**'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ci.ts'
      - 'tuturuuu.ts'
      - '.github/workflows/colab-cloudflare.yaml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: read

concurrency:
  group: colab-cloudflare-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: colab-cloudflare.yaml
  validate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/multiplayer
      - run: bun run test
        working-directory: apps/colab
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify idempotent expiry in a local Worker
        run: node --test scripts/verify-expiry-runtime.mjs
        working-directory: apps/colab
      - run: bun run build
        working-directory: apps/colab
      - run: bun x --no-install wrangler deploy --dry-run
        working-directory: apps/colab
      - uses: actions/upload-artifact@v7
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: colab-production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: colab-assets-${{ github.sha }}
          path: apps/colab/dist
      - name: Deploy the verified revision
        working-directory: apps/colab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing COLAB_CLOUDFLARE_API_TOKEN'; exit 1; }
          bun x --no-install wrangler deploy --message "$GITHUB_SHA"
      - name: Verify canonical health and deployed assets
        working-directory: apps/colab
        run: node scripts/verify-deployment.mjs
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: colab-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
