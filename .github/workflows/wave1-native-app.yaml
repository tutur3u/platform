name: Wave-1 native publication profiles
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
    outputs:
      staging_allowed:
        value: ${{ jobs.policy-staging.outputs.allowed }}
    secrets:
      CLOUDFLARE_STAGING_API_TOKEN:
        required: false
      WAVE1_CONTROL_READ_TOKEN:
        required: false
      STAGING_SUPABASE_URL:
        required: false
      STAGING_SUPABASE_PUBLISHABLE_KEY:
        required: false
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  policy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - id: policy
        env:
          WAVE1_STAGING_PUBLICATION_ADMISSION: ${{ vars.WAVE1_STAGING_PUBLICATION_ADMISSION }}
          WAVE1_STAGING_PUBLISH_ENABLED: ${{ vars.WAVE1_STAGING_PUBLISH_ENABLED }}
          APP: ${{ inputs.app }}
        run: node scripts/ci/wave1-native-publish.mjs policy "$APP" staging "$GITHUB_SHA" "$GITHUB_STEP_SUMMARY"
  policy-production:
    name: Report held for wave-1 cutover
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - id: policy
        env:
          APP: ${{ inputs.app }}
        run: node scripts/ci/wave1-native-publish.mjs policy "$APP" production "$GITHUB_SHA" "$GITHUB_STEP_SUMMARY"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [staging, production]
    env:
      APP: ${{ inputs.app }}
      PROFILE: ${{ matrix.profile }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'wave1-ci-fixture' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.profile == 'staging' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_URL || 'https://wave1-ci.supabase.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ matrix.profile == 'staging' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_wave1_ci_placeholder' }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Configure public build inputs and exact source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { profileFor } from './scripts/ci/wave1-native-profile.mjs';
          const p = profileFor(process.env.APP, process.env.PROFILE, process.env.CLOUDFLARE_WORKERS_SUBDOMAIN);
          appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_APP_URL=https://${p.host}\nNEXT_PUBLIC_${p.app.toUpperCase()}_APP_URL=https://${p.host}\nNEXT_PUBLIC_WEB_APP_URL=${p.environment === 'production' ? 'https://tuturuuu.com' : 'https://staging.tuturuuu.com'}\n`);
          JS
      - name: Generate canonical bundled build metadata
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: ${{ matrix.profile }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build owning native application and shared dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/${{ inputs.app }} --concurrency=2
          token: ''
          team: ''
      - name: Seal admitted publication profile with original emitted bytes
        run: node scripts/ci/wave1-native-artifact.mjs prepare "$APP" "$PROFILE" "$SOURCE_SHA" "$CLOUDFLARE_WORKERS_SUBDOMAIN"
      - name: Original emitted workerd acceptance including Mail and Apps fence
        timeout-minutes: 3
        run: node scripts/ci/wave1-native-runtime.mjs "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Dry-run exact prebundled publication profile
        working-directory: apps/${{ inputs.app }}
        run: bun x --no-install wrangler deploy --dry-run --config dist/wave1/wrangler.json --outdir "$RUNNER_TEMP/native-dry-run"
      - name: Verify and pack accepted bytes
        run: |
          node scripts/ci/wave1-native-artifact.mjs verify "$APP" "$PROFILE" "$SOURCE_SHA"
          python3 scripts/ci/wave1-native-archive.py pack "apps/$APP" "$RUNNER_TEMP/wave1-native.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wave1-${{ inputs.app }}-${{ matrix.profile }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/wave1-native.tar.gz
          retention-days: 14
          if-no-files-found: error
  restored:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        profile: [staging, production]
    env:
      APP: ${{ inputs.app }}
      PROFILE: ${{ matrix.profile }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wave1-${{ inputs.app }}-${{ matrix.profile }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-restore
      - name: Restore same-run artifact after archive preflight
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/ci/wave1-native-archive.py restore "apps/$APP" "$RUNNER_TEMP/native-restore/wave1-native.tar.gz"
          node scripts/ci/wave1-native-artifact.mjs verify "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Restored Mail Calendar Apps workerd acceptance
        timeout-minutes: 3
        run: node scripts/ci/wave1-native-runtime.mjs "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Restored exact bytes dry-run and final seal
        run: |
          (cd "apps/$APP" && bun x --no-install wrangler deploy --dry-run --config dist/wave1/wrangler.json --outdir "$RUNNER_TEMP/restored-dry-run")
          node scripts/ci/wave1-native-artifact.mjs verify "$APP" "$PROFILE" "$SOURCE_SHA"
