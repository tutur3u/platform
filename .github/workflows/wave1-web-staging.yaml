name: Wave-1 staging Web publisher
# Staging Web issuer and its protected Next fallback (staging-web-publisher
# design §3, Tess conditions V1–V6 and §16). Dispatch only, from main, for one
# exact admitted SHA. Ordering is fixed: one Vercel deployment, then
# next-verify (V1b protection, every alias, N15–N17, _next/image and
# monitoring) records `verified` in the signed D1 ledger, and only then may the
# release owner MANUALLY attach the Custom Domain and set
# WEB_STAGING_SERVING=on. This workflow never attaches domains, changes Access
# or DNS, or writes WEB_STAGING_SERVING.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA admitted by WEB_STAGING_NEXT_ADMISSION.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wave1-web-staging
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_WRITE_LOGS: 'false'
jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Exact main ancestry, stop fence, admission and candidate qualification
        env:
          ENABLED: ${{ vars.WAVE1_STAGING_PUBLISH_ENABLED }}
          NEXT_ADMISSION: ${{ vars.WEB_STAGING_NEXT_ADMISSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          test "$ENABLED" = true
          node scripts/ci/wave1-web-admit.mjs "$SOURCE_SHA"
  next-deploy:
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: wave1-web-next-staging
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      origin: ${{ steps.deploy.outputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - run: bash scripts/ci/run-with-backoff.sh bun install --global vercel@59.25.0
      - name: Bundle exact staging build identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: main
          PLATFORM_BUILD_ENVIRONMENT: staging
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Pull staging-target settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
        working-directory: apps/web
        run: vercel pull --yes --environment=staging --token="$VERCEL_TOKEN"
      - name: Build the exact SHA locally with the staging-only Vercel config
        timeout-minutes: 40
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
          NODE_OPTIONS: --max-old-space-size=8192
          TURBO_CONCURRENCY: '2'
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          # No remote cache for the staging identity build.
          command: cd apps/web && vercel build --target=staging --local-config vercel.staging.json --token="$VERCEL_TOKEN"
          token: ''
          team: ''
      - name: One ledger-guarded Vercel deployment for this SHA
        id: deploy
        timeout-minutes: 10
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_WEB_STAGING_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN_WEB_STAGING: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          WAVE1_STAGING_ATTEMPT_D1_ID: ${{ vars.WAVE1_STAGING_ATTEMPT_D1_ID }}
          WAVE1_CONTROL_READ_TOKEN: ${{ secrets.WAVE1_CONTROL_READ_TOKEN }}
        run: node scripts/ci/wave1-web-next.mjs deploy "$SOURCE_SHA"
  next-verify:
    needs: next-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wave1-web-next-staging
    outputs:
      deployment_id: ${{ steps.verify.outputs.deployment_id }}
      origin: ${{ steps.verify.outputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: V1b protection, every alias, N15–N17, _next/image and monitoring, then record verified
        id: verify
        timeout-minutes: 5
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_WEB_STAGING_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN_WEB_STAGING: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TRUSTED_PROXY_ORIGIN_SECRET: ${{ secrets.TRUSTED_PROXY_ORIGIN_SECRET }}
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          WAVE1_STAGING_ATTEMPT_D1_ID: ${{ vars.WAVE1_STAGING_ATTEMPT_D1_ID }}
          WAVE1_CONTROL_READ_TOKEN: ${{ secrets.WAVE1_CONTROL_READ_TOKEN }}
        run: |
          node scripts/ci/wave1-web-next.mjs verify "$SOURCE_SHA"
          {
            echo '## Next fallback verified'
            echo 'The release owner may now, manually and only for this exact pair, attach the'
            echo 'Custom Domain and set WEB_STAGING_SERVING=on before admitting the Worker.'
          } >> "$GITHUB_STEP_SUMMARY"
  seal-worker:
    needs: next-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_sha256: ${{ steps.seal.outputs.artifact_sha256 }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_DEPLOYMENT_ID: ${{ needs.next-verify.outputs.deployment_id }}
      NEXT_ORIGIN: ${{ needs.next-verify.outputs.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/web build:candidate
      - run: bun run --cwd apps/web test:candidate:runtime
      - name: Seal the candidate with the verified Next origin
        id: seal
        run: node scripts/ci/wave1-web-seal.mjs prepare "$SOURCE_SHA" "$NEXT_DEPLOYMENT_ID" "$NEXT_ORIGIN"
      - run: python3 scripts/ci/wave1-native-archive.py pack apps/web/cloudflare "$RUNNER_TEMP/wave1-web.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wave1-web-staging-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/wave1-web.tar.gz
          retention-days: 14
          if-no-files-found: error
  restored:
    needs: seal-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wave1-web-staging-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/restore
      - name: Restore and re-verify the same sealed bytes
        run: |
          python3 scripts/ci/wave1-native-archive.py restore apps/web/cloudflare "$RUNNER_TEMP/restore/wave1-web.tar.gz"
          node scripts/ci/wave1-web-seal.mjs restored "$SOURCE_SHA"
      - name: Restored emitted workerd acceptance
        timeout-minutes: 3
        run: bun run --cwd apps/web test:candidate:runtime
      - name: Restored exact-bytes dry-run and final seal
        run: |
          node scripts/ci/wave1-native-publish.mjs dry-run web staging "$SOURCE_SHA"
          node scripts/ci/wave1-web-seal.mjs verify "$SOURCE_SHA"
  publish-worker:
    needs: [next-verify, restored]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wave1-web-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wave1-web-staging-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/publish
      - run: |
          python3 scripts/ci/wave1-native-archive.py restore apps/web/cloudflare "$RUNNER_TEMP/publish/wave1-web.tar.gz"
          node scripts/ci/wave1-web-seal.mjs verify "$SOURCE_SHA"
      - name: Verified pair, ingress preflight, fresh Vercel recheck, then one upload
        timeout-minutes: 5
        env:
          WAVE1_STAGING_ATTEMPT_D1_ID: ${{ vars.WAVE1_STAGING_ATTEMPT_D1_ID }}
          WAVE1_STAGING_PUBLICATION_ADMISSION: ${{ vars.WAVE1_STAGING_PUBLICATION_ADMISSION }}
          WAVE1_STAGING_PUBLISH_ENABLED: ${{ vars.WAVE1_STAGING_PUBLISH_ENABLED }}
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          WAVE1_CONTROL_READ_TOKEN: ${{ secrets.WAVE1_CONTROL_READ_TOKEN }}
          STAGING_TUTUR3U_ZONE_ID: ${{ vars.STAGING_TUTUR3U_ZONE_ID }}
          STAGING_ACCESS_APP_IDS: ${{ vars.STAGING_ACCESS_APP_IDS }}
          STAGING_ACCESS_STAFF_GROUP_ID: ${{ vars.STAGING_ACCESS_STAFF_GROUP_ID }}
          STAGING_ACCESS_STAFF_EMAIL_LIST_ID: ${{ vars.STAGING_ACCESS_STAFF_EMAIL_LIST_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_WEB_STAGING_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN_WEB_STAGING: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TRUSTED_PROXY_ORIGIN_SECRET: ${{ secrets.TRUSTED_PROXY_ORIGIN_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/ci/wave1-native-publish.mjs publish web staging "$SOURCE_SHA"
  verify-ingress:
    needs: [next-verify, publish-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wave1-web-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Post-publication readback (R1–R4, N1–N5, N10, N17 through the Worker)
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          STAGING_TUTUR3U_ZONE_ID: ${{ vars.STAGING_TUTUR3U_ZONE_ID }}
          STAGING_ACCESS_APP_IDS: ${{ vars.STAGING_ACCESS_APP_IDS }}
          STAGING_ACCESS_STAFF_GROUP_ID: ${{ vars.STAGING_ACCESS_STAFF_GROUP_ID }}
          STAGING_ACCESS_STAFF_EMAIL_LIST_ID: ${{ vars.STAGING_ACCESS_STAFF_EMAIL_LIST_ID }}
          CF_ACCESS_HEALTH_CLIENT_ID: ${{ secrets.CF_ACCESS_HEALTH_CLIENT_ID }}
          CF_ACCESS_HEALTH_CLIENT_SECRET: ${{ secrets.CF_ACCESS_HEALTH_CLIENT_SECRET }}
        run: node scripts/wave1-staging/readback.mjs --app web --expect-sha "$SOURCE_SHA"
      - name: Post-publication Vercel recheck (N15–N17, every alias, _next/image, monitoring)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_WEB_STAGING_PROJECT_ID: ${{ secrets.VERCEL_WEB_STAGING_PROJECT_ID }}
          VERCEL_TOKEN_WEB_STAGING: ${{ secrets.VERCEL_TOKEN_WEB_STAGING }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TRUSTED_PROXY_ORIGIN_SECRET: ${{ secrets.TRUSTED_PROXY_ORIGIN_SECRET }}
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          NEXT_DEPLOYMENT_ID: ${{ needs.next-verify.outputs.deployment_id }}
        run: node scripts/ci/wave1-web-next.mjs recheck "$SOURCE_SHA" "$NEXT_DEPLOYMENT_ID"
