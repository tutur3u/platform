name: Devbox Control Cloudflare
on:
  pull_request:
    paths:
      - 'apps/devbox-control/**'
      - 'packages/sdk/src/cli/devbox-agent*'
      - 'packages/sdk/src/platform-devbox.ts'
      - 'packages/utils/src/devbox-control.ts'
      - '.github/workflows/devbox-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  push:
    branches: [main]
    paths:
      - 'apps/devbox-control/**'
      - 'packages/sdk/src/cli/devbox-agent*'
      - 'packages/sdk/src/platform-devbox.ts'
      - 'packages/utils/src/devbox-control.ts'
      - '.github/workflows/devbox-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  deployments: read
concurrency:
  group: devbox-control-cloudflare-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: devbox-control-cloudflare.yaml
  validate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x --no-install wrangler types --env-interface DevboxControlEnv worker-configuration.d.ts -c wrangler.jsonc
        working-directory: apps/devbox-control
      - name: Check Devbox Control types
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run type-check --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Validate scoped Oxc rules
        run: bun run lint
        working-directory: apps/devbox-control
      - name: Test Devbox Control
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run test --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify the source Worker with disposable credentials
        run: node --test apps/devbox-control/scripts/verify-worker-runtime.mjs
      - name: Build the Vite-native Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify the emitted Worker with disposable credentials
        env:
          DEVBOX_TEST_CONFIG: ${{ github.workspace }}/apps/devbox-control/dist/worker/wrangler.json
        run: node --test apps/devbox-control/scripts/verify-worker-runtime.mjs
      - run: bun x --no-install wrangler deploy --dry-run -c dist/worker/wrangler.json
        working-directory: apps/devbox-control
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: devbox-control-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the Vite-native Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Capture and verify settings before publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cf-worker-settings.mjs before scripts/ci/fixtures/cf-worker-parity/devbox-control.json "$RUNNER_TEMP/devbox-control-settings-before.json"
      - name: Require provisioned secrets
        working-directory: apps/devbox-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          DEVBOX_CONTROL_INTERNAL_TOKEN: ${{ secrets.DEVBOX_CONTROL_INTERNAL_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$DEVBOX_CONTROL_INTERNAL_TOKEN" || { echo 'Missing Worker runtime secret'; exit 1; }
          node -e 'const fs = require("node:fs"); const names = ["SUPABASE_URL", "SUPABASE_SECRET_KEY", "DEVBOX_CONTROL_INTERNAL_TOKEN"]; fs.writeFileSync(process.env.RUNNER_TEMP + "/devbox-control-secrets.json", JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))), { mode: 0o600 });'
          bun x --no-install wrangler secret bulk "$RUNNER_TEMP/devbox-control-secrets.json" -c wrangler.jsonc
      - run: bun x --no-install wrangler deploy -c dist/worker/wrangler.json --message "$GITHUB_SHA"
        working-directory: apps/devbox-control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
      - name: Capture and compare settings after publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cf-worker-settings.mjs after scripts/ci/fixtures/cf-worker-parity/devbox-control.json "$RUNNER_TEMP/devbox-control-settings-before.json" "$RUNNER_TEMP/devbox-control-settings-after.json"
      - name: Retain settings and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devbox-control-settings-${{ github.sha }}
          path: ${{ runner.temp }}/devbox-control-settings-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: devbox-control-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
