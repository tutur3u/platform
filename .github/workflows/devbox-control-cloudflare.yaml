name: Devbox Control Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'apps/devbox-control/**'
      - 'packages/sdk/src/cli/devbox-agent*'
      - 'packages/sdk/src/platform-devbox.ts'
      - 'packages/utils/src/devbox-control.ts'
      - '.github/workflows/devbox-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'scripts/ci/cf-vite-worker.mjs'
      - 'scripts/ci/cf-worker-parity.mjs'
      - 'scripts/ci/cf-wrangler-publication.mjs'
      - 'scripts/ci/cf-wrangler-publication.runtime.mjs'
      - 'scripts/ci/fixtures/cf-worker-parity/devbox-control.json'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  push:
    branches: [main]
    paths:
      - 'apps/devbox-control/**'
      - 'packages/sdk/src/cli/devbox-agent*'
      - 'packages/sdk/src/platform-devbox.ts'
      - 'packages/utils/src/devbox-control.ts'
      - '.github/workflows/devbox-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'scripts/ci/cf-vite-worker.mjs'
      - 'scripts/ci/cf-worker-parity.mjs'
      - 'scripts/ci/cf-wrangler-publication.mjs'
      - 'scripts/ci/cf-wrangler-publication.runtime.mjs'
      - 'scripts/ci/fixtures/cf-worker-parity/devbox-control.json'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  deployments: read
# Validation runs supersede per PR or branch; production and manual runs stay
# unique. The literal prefix keeps workflow_call runs from one planner apart.
# Only the deploy job serializes production with a non-cancelling queue.
concurrency:
  group: devbox-control-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ready-for-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: devbox-control-cloudflare.yaml
  validate:
    needs: check-ci
    if: ${{ (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check Devbox Control types
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run type-check --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Validate scoped Oxc rules
        run: bun run lint
        working-directory: apps/devbox-control
      - name: Test Devbox Control
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run test --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify the source Worker with disposable credentials
        run: node --test apps/devbox-control/scripts/verify-worker-runtime.mjs
      - name: Build the Vite-native Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/devbox-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Compare emitted Build Output with the recorded deployment identity
        run: node scripts/ci/cf-worker-parity.mjs apps/devbox-control scripts/ci/fixtures/cf-worker-parity/devbox-control.json
      - name: Verify the emitted Worker with disposable credentials
        env:
          DEVBOX_TEST_BUILD_OUTPUT: '1'
        run: node --test apps/devbox-control/scripts/verify-worker-runtime.mjs
      - name: Check the prebuilt artifact without credentials
        run: bun x --no-install cf deploy --prebuilt --mode production --dry-run --no-provision
        working-directory: apps/devbox-control
        env:
          CF_SEND_TELEMETRY: 'false'
      - name: Verify publication against real Vite output
        env:
          CF_PUBLICATION_TEST_APP: devbox-control
        run: node --test scripts/ci/cf-wrangler-publication.runtime.mjs
      - name: Prepare the retained Wrangler publication profile
        run: node scripts/ci/cf-wrangler-publication.mjs apps/devbox-control scripts/ci/fixtures/cf-worker-parity/devbox-control.json apps/devbox-control/wrangler.publish.jsonc
      - name: Check Wrangler publication without credentials
        run: bun x --no-install wrangler deploy --dry-run --no-bundle -c .cloudflare/wrangler-publication.json
        working-directory: apps/devbox-control
      # upload-artifact skips hidden paths, so stage the Build Output first.
      - name: Stage the cf Build Output artifact
        run: cp -R apps/devbox-control/.cloudflare/output "$RUNNER_TEMP/devbox-control-build-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devbox-control-worker-${{ github.sha }}
          path: ${{ runner.temp }}/devbox-control-build-output
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  deploy:
    needs: validate
    if: ${{ (github.ref == 'refs/heads/production') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: devbox-control-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    concurrency:
      group: devbox-control-cloudflare-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: devbox-control-worker-${{ github.sha }}
          path: apps/devbox-control/.cloudflare/output
      - name: Recheck the downloaded artifact identity
        run: node scripts/ci/cf-worker-parity.mjs apps/devbox-control scripts/ci/fixtures/cf-worker-parity/devbox-control.json "$CLOUDFLARE_ACCOUNT_ID"
      - name: Capture and verify settings before publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cf-worker-settings.mjs before scripts/ci/fixtures/cf-worker-parity/devbox-control.json "$RUNNER_TEMP/devbox-control-settings-before.json"
      - name: Prepare the retained Wrangler production publisher
        run: node scripts/ci/cf-wrangler-publication.mjs apps/devbox-control scripts/ci/fixtures/cf-worker-parity/devbox-control.json apps/devbox-control/wrangler.publish.jsonc "$CLOUDFLARE_ACCOUNT_ID"
      - name: Publish the exact artifact with retained migration tags and secrets
        working-directory: apps/devbox-control
        env:
          CF_SEND_TELEMETRY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          DEVBOX_CONTROL_INTERNAL_TOKEN: ${{ secrets.DEVBOX_CONTROL_INTERNAL_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$DEVBOX_CONTROL_INTERNAL_TOKEN" || { echo 'Missing Worker runtime secret'; exit 1; }
          secrets_file="$RUNNER_TEMP/devbox-control-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'const fs = require("node:fs"); const names = ["SUPABASE_URL", "SUPABASE_SECRET_KEY", "DEVBOX_CONTROL_INTERNAL_TOKEN"]; fs.writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))), { mode: 0o600 });' "$secrets_file"
          bun x --no-install wrangler secret bulk "$secrets_file" -c .cloudflare/wrangler-publication.json
          bun x --no-install wrangler deploy --no-bundle -c .cloudflare/wrangler-publication.json --message "$GITHUB_SHA"
      - name: Capture and compare settings after publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cf-worker-settings.mjs after scripts/ci/fixtures/cf-worker-parity/devbox-control.json "$RUNNER_TEMP/devbox-control-settings-before.json" "$RUNNER_TEMP/devbox-control-settings-after.json"
      - name: Retain settings and rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devbox-control-settings-${{ github.sha }}
          path: ${{ runner.temp }}/devbox-control-settings-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: devbox-control-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
