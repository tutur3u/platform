name: Resume Deferred Production Deployment
on:
  workflow_run:
    workflows:
      - "Production Deployment Planner"
      - "Release @tuturuuu/ai package"
      - "Release @tuturuuu/apis package"
      - "Release @tuturuuu/devbox package"
      - "Release @tuturuuu/editor package"
      - "Release @tuturuuu/google package"
      - "Release @tuturuuu/hooks package"
      - "Release @tuturuuu/icons package"
      - "Release @tuturuuu/internal-api package"
      - "Release tuturuuu package"
      - "Release @tuturuuu/supabase package"
      - "Release @tuturuuu/types package"
      - "Release @tuturuuu/typescript-config package"
      - "Release @tuturuuu/ui package"
      - "Release @tuturuuu/utils package"
    types: [completed]
    branches: [production]

# Package and planner completions share one exact-production dispatch window.
concurrency:
  group: production-package-resume-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: write
  deployments: write
jobs:
  resume:
    if: >-
      (github.event.workflow_run.name != 'Production Deployment Planner' || github.event.workflow_run.conclusion == 'success') &&
      github.event.workflow_run.head_branch == 'production' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted trigger
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          # One producer per line: <workflow file> <workflow ID> <exact branch> <events> <conclusions>
          TRUSTED_PRODUCERS: |
            vercel-production.yaml 317228637 production push,workflow_dispatch success
            release-ai-package.yaml 143019466 production push,workflow_dispatch any
            release-apis-package.yaml 295165909 production push,workflow_dispatch any
            release-devbox-package.yaml 288518081 production push,workflow_dispatch any
            release-editor-package.yaml 321277714 production push,workflow_dispatch any
            release-google-package.yaml 295165910 production push,workflow_dispatch any
            release-hooks-package.yaml 295165911 production push,workflow_dispatch any
            release-icons-package.yaml 295165912 production push,workflow_dispatch any
            release-internal-api-package.yaml 288518082 production push,workflow_dispatch any
            release-sdk-package.yaml 274063698 production push,workflow_dispatch any
            release-supabase-package.yaml 143034551 production push,workflow_dispatch any
            release-types-package.yaml 143034552 production push,workflow_dispatch any
            release-typescript-config-package.yaml 143034553 production push,workflow_dispatch any
            release-ui-package.yaml 143139666 production push,workflow_dispatch any
            release-utils-package.yaml 295165913 production push,workflow_dispatch any
        run: |
          set -euo pipefail
          # Expression `==` ignores case and workflow_run matches producers by name, so
          # re-prove the trigger with exact comparisons before any privileged step runs.
          # Values come from the event file and runner variables, never interpolation.
          reject() {
            echo "::error::Untrusted trigger: $1"
            exit 1
          }
          field() {
            jq -r "$1 // \"\" | tostring" "$GITHUB_EVENT_PATH"
          }
          listed() {
            local item
            local -a items
            IFS=',' read -r -a items <<< "$2"
            for item in "${items[@]}"; do
              if [ "$item" = "$1" ] || [ "$item" = any ]; then
                return 0
              fi
            done
            return 1
          }

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ -z "${TRUSTED_DISPATCH_REF:-}" ] || [ "$GITHUB_REF" != "$TRUSTED_DISPATCH_REF" ]; then
                reject "manual runs must start from ${TRUSTED_DISPATCH_REF:-a trusted producer}"
              fi
              branch="${TRUSTED_DISPATCH_REF#refs/heads/}"
              head_sha="$GITHUB_SHA"
              ;;
            workflow_run)
              run_path="$(field .workflow_run.path)"
              file=""
              while read -r candidate workflow_id branch events conclusions; do
                if [ -n "$candidate" ] && [ "$run_path" = ".github/workflows/$candidate" ]; then
                  file="$candidate"
                  break
                fi
              done <<< "${TRUSTED_PRODUCERS:-}"
              [ -n "$file" ] || reject "producer path '$run_path' is not trusted"
              [ -n "$workflow_id" ] && [ "$(field .workflow_run.workflow_id)" = "$workflow_id" ] ||
                reject "producer workflow ID is not $file's ID $workflow_id"
              [ "$(field .workflow_run.head_branch)" = "$branch" ] ||
                reject "producer branch is not exactly '$branch'"
              listed "$(field .workflow_run.event)" "$events" ||
                reject "producer event is not one of $events"
              listed "$(field .workflow_run.conclusion)" "$conclusions" ||
                reject "producer conclusion is not one of $conclusions"
              [ "$(field .workflow_run.head_repository.full_name)" = "$GITHUB_REPOSITORY" ] &&
                [ "$(field .workflow_run.head_repository.id)" = "$GITHUB_REPOSITORY_ID" ] ||
                reject "producer head repository is not $GITHUB_REPOSITORY"
              head_sha="$(field .workflow_run.head_sha)"
              ;;
            *)
              reject "unsupported event '$GITHUB_EVENT_NAME'"
              ;;
          esac

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || reject "head SHA is not a full commit SHA"
          # Compare against the fully qualified branch ref: a bare name resolves a
          # same-named tag (refs/tags/<branch>) first. identical: the head SHA is the
          # live branch tip; behind: it is reachable from the branch. Deploy
          # consumers set REQUIRE_BRANCH_TIP so a re-run cannot redeploy an old commit.
          # With TIP_TREE_PATH, a head behind the tip is still current when that
          # directory's tree is unchanged at the tip (unrelated commits landed).
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/refs/heads/$branch...$head_sha" --jq .status)"
          if [ "${REQUIRE_BRANCH_TIP:-false}" = true ]; then
            if [ "$status" = behind ] && [ -n "${TIP_TREE_PATH:-}" ]; then
              [[ "$TIP_TREE_PATH" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] ||
                reject "TIP_TREE_PATH is not a nested repository path"
              tree_sha() {
                gh api "repos/$GITHUB_REPOSITORY/contents/${TIP_TREE_PATH%/*}?ref=$1" \
                  --jq ".[] | select(.type == \"dir\" and .name == \"${TIP_TREE_PATH##*/}\") | .sha"
              }
              tip_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
              [[ "$tip_sha" =~ ^[0-9a-f]{40}$ ]] || reject "cannot resolve the tip of $branch"
              head_tree="$(tree_sha "$head_sha")"
              [[ "$head_tree" =~ ^[0-9a-f]{40}$ ]] && [ "$head_tree" = "$(tree_sha "$tip_sha")" ] ||
                reject "head SHA is behind $branch and $TIP_TREE_PATH changed since"
            else
              [ "$status" = identical ] || reject "head SHA is not the live tip of $branch"
            fi
          else
            [ "$status" = identical ] || [ "$status" = behind ] ||
              reject "head SHA is not reachable from $branch"
          fi
          {
            echo "trusted=true"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Trusted trigger: $head_sha on $branch"

      - name: Verify current production before checkout
        id: current
        if: steps.trigger.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ steps.trigger.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_SHA" =~ ^[a-f0-9]{40}$ ]]
          current_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/production" --jq '.object.sha')"
          if [[ "$current_sha" == "$EVENT_SHA" ]]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out trusted exact production source
        if: steps.current.outputs.matches == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trigger.outputs.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Use Node.js 24
        if: steps.current.outputs.matches == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resume only a deferred planner with published package versions
        if: steps.current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/resume-production-package-deployment.js
