name: Parley Cloudflare
on:
  pull_request:
    paths: ['apps/parley/**', 'packages/**', 'bun.lock', '.github/workflows/parley-cloudflare.yaml', 'tuturuuu.ci.ts', 'patches/@opennextjs%2Fcloudflare@https%3A%2F%2Fregistry.npmjs.org%2F@opennextjs%2Fcloudflare%2F-%2Fcloudflare-1.20.6.tgz.patch']
  push:
    branches: [main]
    paths: ['apps/parley/**', 'packages/**', 'bun.lock', '.github/workflows/parley-cloudflare.yaml', 'tuturuuu.ci.ts', 'patches/@opennextjs%2Fcloudflare@https%3A%2F%2Fregistry.npmjs.org%2F@opennextjs%2Fcloudflare%2F-%2Fcloudflare-1.20.6.tgz.patch']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  deployments: read
concurrency:
  group: parley-cloudflare-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: parley-cloudflare.yaml
  release-relevance:
    name: Check release-only changes
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.detect.outputs.run_checks }}
    steps:
      - name: Check out comparison history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          sparse-checkout: scripts/ci/release-only-changes.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Detect release-only changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            result="$(node scripts/ci/release-only-changes.js "$BASE_SHA" "$HEAD_SHA")"
          else
            result=true
          fi
          echo "run_checks=$result" >> "$GITHUB_OUTPUT"
  validate:
    needs: [check-ci, release-relevance]
    if: needs.check-ci.outputs.should_run == 'true' && needs.release-relevance.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Generate shared build metadata
        env:
          PLATFORM_BUILD_ENVIRONMENT: ${{ github.ref == 'refs/heads/production' && 'production' || 'preview' }}
          PLATFORM_BUILD_REF_NAME: ${{ github.ref_name }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ github.sha }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - run: bun x --no-install turbo run build --filter='@tuturuuu/parley^...' --concurrency=2
      - run: bun run --cwd packages/meet-core test
      - run: bun run --cwd apps/parley test
      - run: node --test apps/parley/scripts/opennext-candidate.test.mjs
      - name: Build Parley for Workers
        id: parley-build
        uses: ./.github/actions/run-with-turbo-remote-cache
        env:
          NEXT_PUBLIC_MEETING_APP: parley
          NEXT_PUBLIC_APP_URL: https://parley.tuturuuu.com
          NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://parley-ci.supabase.invalid' || secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && 'sb_publishable_parley_ci_placeholder' || secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        with:
          command: cd apps/parley && bun run build:cloudflare
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify complete CI-built Parley responses locally
        working-directory: apps/parley/test-fixtures/built-worker
        timeout-minutes: 5
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: node --test diagnostic.test.mjs verify.mjs
      - run: bun run --cwd apps/parley cf:typecheck
      - run: bun x --no-install wrangler deploy --dry-run -c apps/parley/wrangler.jsonc
      - if: always() && steps.parley-build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parley-worker-${{ github.sha }}
          path: apps/parley/.open-next
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: meet-production
    timeout-minutes: 50
    env:
      CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
      CLOUDFLARE_API_TOKEN: ${{ secrets.MEET_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: parley-worker-${{ github.sha }}
          path: apps/parley/.open-next
      - name: Wait for production Parley schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
        run: bun packages/meet-core/scripts/verify-schema.ts
      - name: Configure shared realtime signing identity
        env:
          MEET_REALTIME_TOKEN_SECRET: ${{ secrets.MEET_REALTIME_TOKEN_SECRET }}
        run: bun apps/parley/scripts/configure-realtime.ts
      - name: Verify required runtime secret names
        run: |
          bun x --no-install wrangler secret list --name tuturuuu-parley --format json > "$RUNNER_TEMP/parley-secrets.json"
          jq -e --argjson required '["MEET_REALTIME_TOKEN_SECRET","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY","SUPABASE_SECRET_KEY"]' 'map(.name) as $names | all($required[]; . as $name | $names | index($name) != null)' "$RUNNER_TEMP/parley-secrets.json" > /dev/null
      - name: Wait for shared provider runtime
        run: bun apps/parley/scripts/verify-provider.ts
      - name: Deploy verified Worker
        working-directory: apps/parley
        run: bun run deploy:cloudflare -- --message "$GITHUB_SHA"
      - name: Verify rendered canonical route
        run: |
          route_status=$(curl --fail --retry 5 --retry-delay 5 --max-time 30 \
            --write-out '%{http_code}' --output /dev/null \
            https://parley.tuturuuu.com/access-denied)
          test "$route_status" = 200
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: parley-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
