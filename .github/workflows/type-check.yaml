name: TypeScript Type Check

on:
  push:
  workflow_dispatch:

jobs:
  type-check:
    name: Type Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Keep script wiring aligned with ci-check.yml; shell parity is enforced by
      # scripts/ci/type-check-inline-workflow.test.js. Inline differences are the
      # fixed workflow name, no deployment token, and config-gated release detection.
      - name: Compute changed files
        id: changed_files
        shell: bash
        env:
          WORKFLOW_NAME: type-check.yaml
        run: |
          node --experimental-strip-types scripts/ci/resolve-changed-files.ts

      - name: Check Configuration
        id: check_config
        shell: bash
        env:
          CHANGED_FILES_FILE: ${{ steps.changed_files.outputs.changed_files_path }}
          WORKFLOW_NAME: type-check.yaml
        run: |
          if [ "$(node scripts/ci/overflow-notes-ci.js)" = true ]; then
            echo "Validated overflow notes only: no checks required."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONFIG_FILE="tuturuuu.ts"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::warning::Configuration file $CONFIG_FILE not found. Defaulting to true."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --experimental-strip-types scripts/ci/check-workflow-config.ts

      - name: Detect release-only changes
        if: steps.check_config.outputs.should_run == 'true'
        id: release_relevance
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          result="$(node scripts/ci/release-only-changes.js "$BEFORE_SHA" "$GITHUB_SHA")"
          echo "run_checks=$result" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.check_config.outputs.should_run == 'true' && steps.release_relevance.outputs.run_checks == 'true'
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Restore Turbo fallback cache
        if: steps.check_config.outputs.should_run == 'true' && steps.release_relevance.outputs.run_checks == 'true'
        uses: ./.github/actions/setup-turbo-fallback-cache
        with:
          family: type-check
          cross-lock-restore: 'true'

      - name: Install dependencies
        if: steps.check_config.outputs.should_run == 'true' && steps.release_relevance.outputs.run_checks == 'true'
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Build workspace dependencies
        if: steps.check_config.outputs.should_run == 'true' && steps.release_relevance.outputs.run_checks == 'true'
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=4 --filter=@tuturuuu/types --filter=@tuturuuu/supabase --filter=@tuturuuu/internal-api --filter=@tuturuuu/masonry
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Run type check
        if: steps.check_config.outputs.should_run == 'true' && steps.release_relevance.outputs.run_checks == 'true'
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          # The TanStack Start migration is paused; keep maintained workspace
          # type checks active without scheduling its package.
          command: bun turbo:local run type-check --concurrency=4 --filter='!@tuturuuu/tanstack-web'
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Report skipped type check
        if: steps.check_config.outputs.should_run != 'true' || steps.release_relevance.outputs.run_checks != 'true'
        run: echo "Type Check heavy steps skipped by CI configuration or release-only detection; no compilation was performed." >> "$GITHUB_STEP_SUMMARY"
