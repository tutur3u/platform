name: Mastermind Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/cloudflare/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'apps/web/src/lib/mastermind/fleet/**',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/cloudflare/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'apps/web/src/lib/mastermind/fleet/**',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: Mastermind Cloudflare Source-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when mastermind is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: mastermind
  # Build artifact delivery with required runtime evidence; no publisher credentials.
  artifact:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-for-ci')))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MASTERMIND_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install frozen dependencies without lifecycle scripts
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - name: Build active workspace dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter='@tuturuuu/mastermind^...' --concurrency=2
          token: ''
          team: ''
      - name: Generate source identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: preview
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build native Start Worker and assets
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/mastermind && bun run build:cloudflare
          token: ''
          team: ''
      - name: Record emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/mastermind "$SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config.json"
      - name: Upload emitted config receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastermind-native-config-receipt-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-emitted-config.json
          retention-days: 7
          if-no-files-found: error
      - name: Locate and seal deployable output
        id: output
        run: |
          python3 scripts/ci/mastermind-native-artifact.py config apps/mastermind
          python3 scripts/ci/mastermind-native-artifact.py seal apps/mastermind --receipt "$RUNNER_TEMP/mastermind-native-artifact.json"
          python3 scripts/ci/mastermind-native-artifact.py pack apps/mastermind --receipt "$RUNNER_TEMP/mastermind-native-artifact.json" --archive "$RUNNER_TEMP/mastermind-native.tar.gz"
      - name: Upload Worker, assets, emitted config and source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastermind-cutover-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/mastermind-native.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Require emitted runtime smoke
        working-directory: apps/mastermind
        env:
          CI: 'true'
        run: bun run test:runtime
  production-policy:
    needs: affected-gate
    if: (github.ref == 'refs/heads/production' && needs.affected-gate.outputs.run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - id: policy
        run: node scripts/ci/production-publication-policy.ts mastermind-cloudflare.yaml "$GITHUB_STEP_SUMMARY"
  # Publishes the sealed artifact this run built and accepted, for
  # mastermind.tuturuuu.com only. A new version takes traffic only while the
  # captured serving version is still serving; any later failure restores it.
  deploy:
    needs: [artifact, production-policy]
    if: (github.ref == 'refs/heads/production' && needs.production-policy.outputs.allowed == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
      actions: read
    environment: mastermind-production
    env:
      SOURCE_SHA: ${{ github.sha }}
      MASTERMIND_SOURCE_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
      CF_SEND_TELEMETRY: 'false'
      WRANGLER_SEND_METRICS: 'false'
    concurrency:
      group: mastermind-cloudflare-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install frozen dependencies without lifecycle scripts
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mastermind-cutover-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/mastermind-cutover
      - name: Restore and verify the sealed exact-source artifact
        run: |
          python3 scripts/ci/mastermind-native-artifact.py restore apps/mastermind --archive "$RUNNER_TEMP/mastermind-cutover/mastermind-native.tar.gz" --receipt "$RUNNER_TEMP/mastermind-native-artifact.json"
          python3 scripts/ci/mastermind-native-artifact.py verify apps/mastermind --receipt "$RUNNER_TEMP/mastermind-native-artifact.json"
      - name: Locate the restored emitted config
        id: output
        run: python3 scripts/ci/mastermind-native-artifact.py config apps/mastermind
      - name: Convert to cf Build Output without rebuilding
        env:
          EMITTED_CONFIG: ${{ steps.output.outputs.config }}
        run: node scripts/ci/void-cf-output.mjs --config "$EMITTED_CONFIG" --out "$RUNNER_TEMP/mastermind-cf" --sha "$SOURCE_SHA"
      - name: Require the Worker runtime secret names
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MASTERMIND_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          # Names only. A missing Worker is a first release and stays closed
          # with 503 until its secrets are set. Any other failure stops the job.
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          const required = ["MASTERMIND_OWNER_EMAIL","OWNER_IDS","TUTURUUU_APP_COORDINATION_SECRET"];
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !token) {
            console.error("Missing Cloudflare account or credential");
            process.exit(1);
          }
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/tuturuuu-mastermind/secrets`;
          const response = await fetch(url, {
            headers: { authorization: `Bearer ${token}`, accept: "application/json" },
            redirect: "error",
            signal: AbortSignal.timeout(30_000),
          });
          let body = null;
          try { body = await response.json(); } catch { body = null; }
          const gone = response.status === 404 || (Array.isArray(body?.errors) && body.errors.some((entry) => entry?.code === 10007));
          if (gone) {
            process.stdout.write("exists=false\n");
            process.exit(0);
          }
          if (!response.ok || !Array.isArray(body?.result)) {
            console.error(`secret name check failed with HTTP ${response.status}`);
            process.exit(1);
          }
          const names = new Set(body.result.map((entry) => entry?.name));
          const absent = required.filter((name) => !names.has(name));
          if (absent.length > 0) {
            console.error(`missing required secret names: ${absent.join(", ")}`);
            process.exit(1);
          }
          process.stdout.write("exists=true\n");
          EOF
      # A rerun keeps its original ref and SHA; only the current production
      # head may publish, checked after this job holds the deploy slot.
      - name: Admit only the current production head
        id: admission
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/production | cut -f1)
          test -n "$head" || { echo 'Cannot read the production head'; exit 1; }
          if [ "$head" = "$SOURCE_SHA" ]; then
            echo 'superseded=false' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SOURCE_SHA is superseded by production $head; nothing is published"
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Capture the serving version for rollback
        if: steps.admission.outputs.superseded == 'false' && steps.secrets.outputs.exists == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MASTERMIND_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/void-cf-publisher.mjs capture --worker tuturuuu-mastermind --out "$RUNNER_TEMP/mastermind-rollback.json"
      - name: Publish the exact artifact
        id: publish
        if: steps.admission.outputs.superseded == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MASTERMIND_CLOUDFLARE_API_TOKEN }}
          EXISTS: ${{ steps.secrets.outputs.exists }}
        run: |
          # Production can advance while this job captures and uploads; the
          # head is checked again right before traffic moves.
          still_head() {
            [ "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/production | cut -f1)" = "$SOURCE_SHA" ]
          }
          if [ "$EXISTS" = true ]; then
            baseline=$(jq -er .versionId "$RUNNER_TEMP/mastermind-rollback.json")
            node scripts/ci/void-cf-publisher.mjs publish --build "$RUNNER_TEMP/mastermind-cf" --worker tuturuuu-mastermind --message "$SOURCE_SHA" > "$RUNNER_TEMP/mastermind-publish.json"
            version=$(jq -er .versionId "$RUNNER_TEMP/mastermind-publish.json")
            # Recorded before traffic moves, so a timed-out assignment can be
            # reconciled against the serving version.
            echo "version=$version" >> "$GITHUB_OUTPUT"
            if ! still_head; then
              echo "::notice::production advanced past $SOURCE_SHA; version $version stays without traffic"
              exit 0
            fi
            node scripts/ci/void-cf-publisher.mjs assign --worker tuturuuu-mastermind --version "$version" --expect-current "$baseline" > "$RUNNER_TEMP/mastermind-assign.json"
          else
            # First release of a Worker that does not exist yet: the same cf
            # CLI creates it from the identical Build Output.
            node scripts/ci/void-cf-publisher.mjs dry-run --build "$RUNNER_TEMP/mastermind-cf"
            if ! still_head; then
              echo "::notice::production advanced past $SOURCE_SHA; nothing is created"
              exit 0
            fi
            node --input-type=module -e "
              import { execFileSync } from 'node:child_process';
              import { cfCommand } from './scripts/ci/void-cf-publisher.mjs';
              const [command, prefix] = cfCommand();
              execFileSync(command, [...prefix, 'deploy', '--prebuilt', '--mode', 'production', '--no-provision', '--message', process.env.SOURCE_SHA], { cwd: process.env.RUNNER_TEMP + '/mastermind-cf', stdio: 'inherit' });
            "
          fi
          echo 'assigned=true' >> "$GITHUB_OUTPUT"
      - name: Verify the host's sign-in gate
        id: gate
        if: steps.publish.outputs.assigned == 'true' && vars.MASTERMIND_HOST_ATTACHED == 'true'
        env:
          TEAM: ${{ vars.MASTERMIND_ACCESS_TEAM_DOMAIN }}
        run: |
          probe() {
            curl --silent --show-error --retry 5 --retry-delay 5 --connect-timeout 5 --max-time 20 --output /dev/null --dump-header "$RUNNER_TEMP/gate-headers" --write-out '%{http_code} %{redirect_url}' "https://mastermind.tuturuuu.com$1"
          }
          fail() { echo "::error::$1"; exit 1; }
          if [ -n "$TEAM" ]; then
            # While a Cloudflare Access application still fronts the host,
            # every path must redirect to its login for this host.
            expected="https://$TEAM/cdn-cgi/access/login/mastermind.tuturuuu.com"
            for path in / /en /vi /login /verify-token /_serverFn/probe /assets/probe.js /api/build-info; do
              result=$(probe "$path")
              case "${result#* }" in "$expected"|"$expected?"*) ;; *) fail "$path answered $result; expected 302 to $expected" ;; esac
              [ "${result%% *}" = 302 ] || fail "$path answered $result; expected 302"
            done
            exit 0
          fi
          # Without Access the Worker is the gate: signed out, the root and
          # /login lead to Tuturuuu sign-in and every other path is a
          # private 403 that never names an Access login.
          result=$(probe /)
          [ "$result" = "303 https://mastermind.tuturuuu.com/login" ] || fail "/ answered $result; expected 303 to /login"
          result=$(probe /login)
          case "$result" in
            '303 https://tuturuuu.com/login?returnUrl=https%3A%2F%2Fmastermind.tuturuuu.com%2Fverify-token'*) ;;
            *) fail "/login answered $result; expected 303 to Tuturuuu sign-in" ;;
          esac
          # English has no locale prefix; a legacy /en link moves for good.
          result=$(probe /en/ship)
          [ "$result" = "308 https://mastermind.tuturuuu.com/ship" ] || fail "/en/ship answered $result; expected 308 to /ship"
          for path in /ship /vi /verify-token /_serverFn/probe /assets/probe.js /api/build-info; do
            result=$(probe "$path")
            [ "$result" = "403 " ] || fail "$path answered $result; expected 403"
            grep -qi '^cache-control: private, no-store' "$RUNNER_TEMP/gate-headers" || fail "$path is not private, no-store"
          done
      # Restores the captured baseline only when this run's own version is
      # serving; a version an operator moved to after capture is left alone.
      - name: Restore the previous version after a failed release
        if: (failure() || cancelled()) && steps.publish.outputs.version != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MASTERMIND_CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          baseline=$(jq -er .versionId "$RUNNER_TEMP/mastermind-rollback.json")
          node scripts/ci/void-cf-publisher.mjs capture --worker tuturuuu-mastermind --out "$RUNNER_TEMP/mastermind-serving.json"
          serving=$(jq -er .versionId "$RUNNER_TEMP/mastermind-serving.json")
          if [ "$serving" != "$VERSION" ]; then
            echo "::warning::serving $serving is not this run's $VERSION; no rollback"
            exit 0
          fi
          node scripts/ci/void-cf-publisher.mjs assign --worker tuturuuu-mastermind --version "$baseline" --expect-current "$VERSION"
      - name: Retain release and rollback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastermind-release-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mastermind-rollback.json
            ${{ runner.temp }}/mastermind-publish.json
            ${{ runner.temp }}/mastermind-assign.json
            ${{ runner.temp }}/mastermind-serving.json
          retention-days: 30
          if-no-files-found: warn
      # A marker means an existing, configured Worker passed the host check;
      # a first release or an unattached host records none.
      - name: Record successful Cloudflare deployment
        if: steps.publish.outputs.assigned == 'true' && steps.secrets.outputs.exists == 'true' && steps.gate.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ env.SOURCE_SHA }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: mastermind-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
