name: Mastermind Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/turnstile/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/turnstile/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: mastermind-cloudflare.yaml
  # Qualification only: production publication stays HELD by
  # scripts/ci/production-publication-policy.ts and no staging publisher exists.
  native:
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: mastermind
      package: '@tuturuuu/mastermind'
      artifact-script: scripts/ci/mastermind-native-artifact.py
      env-interface: MastermindGeneratedEnv
      worker-environment-type: MastermindEnvironment
      public-env: |
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/mastermind/src apps/mastermind/cloudflare apps/mastermind/vite.config.mts apps/mastermind/void.config.ts apps/mastermind/vitest.config.ts apps/mastermind/tsconfig.json apps/mastermind/package.json apps/mastermind/start-bridge.routes.json
