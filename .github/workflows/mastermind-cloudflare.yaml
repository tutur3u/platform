name: Mastermind Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/cloudflare/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
        '!**/*.md',
        '!**/*.mdx',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/mastermind/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/storage-core/**',
        'packages/cloudflare/**',
        'packages/start-bridge/**',
        'packages/auth/**',
        'packages/satellite/**',
        'packages/internal-api/**',
        'packages/supabase/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/icons/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'apps/web/package.json',
        'scripts/ci/mastermind-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'bun.lock',
        '.github/workflows/mastermind-cloudflare.yaml',
        '.github/workflows/native-start-app.yaml',
        'scripts/ci/native-binding-type-harness*',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when mastermind is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: mastermind
  # Build artifact delivery with required runtime evidence; no publisher credentials.
  artifact:
    needs: affected-gate
    if: ${{ needs.affected-gate.outputs.run == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MASTERMIND_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build active workspace dependencies
        run: bun turbo:local run build --filter='@tuturuuu/mastermind^...' --concurrency=2
      - name: Generate source identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: preview
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build native Start Worker and assets
        working-directory: apps/mastermind
        run: bun run build:cloudflare
      - name: Record emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/mastermind "$SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config.json"
      - name: Upload emitted config receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastermind-native-config-receipt-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-emitted-config.json
          retention-days: 7
          if-no-files-found: error
      - name: Locate and seal deployable output
        id: output
        run: |
          python3 scripts/ci/mastermind-native-artifact.py config apps/mastermind
          python3 scripts/ci/mastermind-native-artifact.py seal apps/mastermind --receipt "$RUNNER_TEMP/mastermind-native-artifact.json"
          python3 scripts/ci/mastermind-native-artifact.py pack apps/mastermind --receipt "$RUNNER_TEMP/mastermind-native-artifact.json" --archive "$RUNNER_TEMP/mastermind-native.tar.gz"
      - name: Upload Worker, assets, emitted Wrangler config and source receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mastermind-cutover-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/mastermind-native.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Require emitted runtime smoke
        working-directory: apps/mastermind
        env:
          CI: 'true'
        run: bun run test:runtime
