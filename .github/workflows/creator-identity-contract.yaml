name: Creator identity database contract
on:
  pull_request:
    paths:
      - 'apps/database/supabase/migrations/**'
      - 'apps/database/supabase/seed.sql'
      - 'apps/database/supabase/tests/public-creator-identity.sql'
      - 'apps/database/supabase/tests/profile-media-upload-limits.sql'
      - 'packages/storage-core/src/lib/profile-upload-budget*'
      - 'packages/utils/src/username-policy*'
      - 'packages/utils/src/__tests__/username-policy.test.ts'
      - 'apps/database/scripts/verify-creator-identity-contract.mjs'
      - 'apps/database/scripts/run-supabase*.js'
      - '.github/actions/cache-supabase-images/**'
      - 'scripts/ci/supabase-image-cache*'
      - '.github/workflows/creator-identity-contract.yaml'
      - 'apps/backend/src/contact/**'
      - 'apps/backend/src/contact.rs'
      - 'apps/web/src/app/api/v1/users/me/profile/**'
      - 'apps/web/src/app/api/v1/users/me/avatar/upload-url/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: creator-identity-contract.yaml
  contract:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - name: Require an enabled contract gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: ./.github/actions/cache-supabase-images
      - name: Apply complete schema, run strict pgTAP, generate actual RPC types
        run: node apps/database/scripts/verify-creator-identity-contract.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: creator-identity-types-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/types/src/supabase.ts
          if-no-files-found: error
          retention-days: 3
  rust-profile-parity:
    if: ${{ false }} # Paused Rust target; live database contract remains enabled.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match the bounded backend test compilation policy in rust-verify.yml.
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate backend profile parity and dispatcher
        working-directory: apps/backend
        run: cargo test --lib --locked
