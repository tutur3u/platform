name: Mobile Build Linux

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-linux.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/desktop-deployment/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-linux.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/desktop-deployment/**"

permissions:
  contents: read
  deployments: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-linux.yaml
  build-linux:
    name: Build Linux (Development)
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Check development release configuration
        id: release-config
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$API_BASE_URL" ]; then
            echo "Skipping development release build: configure NEXT_PUBLIC_SUPABASE_URL and API_BASE_URL repository variables." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/mobile-validate-dart-defines.js /dev/null --dart-define="NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" --dart-define="API_BASE_URL=$API_BASE_URL"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build Linux
        if: steps.release-config.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        working-directory: apps/mobile
        run: flutter build linux --release --target lib/main_development.dart --dart-define="NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" --dart-define="API_BASE_URL=$API_BASE_URL"
      - name: Audit Linux bundle
        if: steps.release-config.outputs.ready == 'true'
        run: node scripts/desktop-deployment/audit-bundle.mjs apps/mobile/build/linux/x64/release/bundle
