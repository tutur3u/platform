name: Publish serving Worker
on:
  workflow_call:
    inputs:
      app:
        description: Serving app id from scripts/ci/serving-workers-apps.mjs
        type: string
        required: true
      artifact:
        description: Same-run sealed artifact built at the production SHA
        type: string
        required: true
      build-ready:
        description: Whether this app built and uploaded its sealed artifact successfully
        type: boolean
        required: true
      supersede:
        description: Exact live SHA an ACKed catch-up may replace when it is not an ancestor
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  publish:
    name: publish-${{ inputs.app }}
    # Durable stop fence: the repository variable must say enabled when the job
    # starts. The script also refuses without the token or a policy admission.
    # Cancelling a running publisher leaves its current step as it is; the
    # receipt's rollbackVersion restores serving in one deployment.
    if: ${{ github.ref == 'refs/heads/production' && vars.SERVING_WORKERS_PUBLICATION == 'enabled' && inputs.build-ready }}
    runs-on: ubuntu-latest
    environment: cloudflare-release-production
    # Includes up to 5 minutes waiting for the coordinator's lane.
    timeout-minutes: 35
    concurrency:
      group: serving-worker-publish-${{ inputs.app }}
      cancel-in-progress: false
    # id-token reports the publication to the deployment coordinator with
    # GitHub OIDC; serving-workers-production.yaml grants it to each caller.
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APP: ${{ inputs.app }}
      SOURCE_SHA: ${{ github.sha }}
      ARTIFACT_NAME: ${{ inputs.artifact }}
      SERVING_SUPERSEDE: ${{ inputs.supersede }}
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history without blobs: the publisher refuses any source that
          # is not a fast-forward of the live build.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      # Lane lock and stop fence on top of the variable fence above: enforce
      # mode skips a superseded or held app and waits out a stop for at most
      # 5 minutes; observe falls open.
      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: ${{ inputs.app }}
          environment: production
          max-wait-minutes: '5'
      - uses: ./.github/actions/setup-bun-with-retry
        if: steps.coordinator.outputs.publish != 'false'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.coordinator.outputs.publish != 'false'
        with:
          node-version: 24.22.0
      - if: steps.coordinator.outputs.publish != 'false'
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.coordinator.outputs.publish != 'false'
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/serving-artifact
      - name: Record the artifact digest for the receipt
        if: steps.coordinator.outputs.publish != 'false'
        run: |
          digest="$(cd "$RUNNER_TEMP/serving-artifact" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "ARTIFACT_SHA256=$digest" >> "$GITHUB_ENV"
      - name: Restore, verify and convert the sealed artifact
        id: restore
        if: steps.coordinator.outputs.publish != 'false'
        env:
          NOVA_ABUSE_GUARD_FAMILIES: ${{ vars.NOVA_ABUSE_GUARD_FAMILIES }}
        run: node scripts/ci/serving-workers.mjs restore "$APP" "$SOURCE_SHA" "$RUNNER_TEMP/serving-artifact" "$RUNNER_TEMP/serving-cf"
      - name: Check the deployment coordinator lease
        if: steps.coordinator.outputs.publish != 'false' && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: check
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: ${{ inputs.app }}
          environment: production
      - name: Upload, stage, smoke and assign
        if: steps.coordinator.outputs.publish != 'false'
        env:
          SERVING_WORKERS_PUBLICATION: ${{ vars.SERVING_WORKERS_PUBLICATION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.SERVING_WORKERS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/serving-workers.mjs publish "$APP" "$SOURCE_SHA" "$RUNNER_TEMP/serving-cf"
      - name: Record an unpublished leg
        if: always() && (steps.coordinator.outputs.publish == 'false' || steps.restore.outcome == 'failure')
        env:
          COORDINATOR_SKIPPED: ${{ steps.coordinator.outputs.publish == 'false' }}
        run: |
          outcome=coordinator-skipped
          step=coordinator-skipped
          message='The coordinator declined publication for this app.'
          if [ "$COORDINATOR_SKIPPED" != true ]; then
            outcome=failed
            step=restore-failed
            message='The sealed artifact could not be restored.'
          fi
          jq -n --arg app "$APP" --arg sha "$SOURCE_SHA" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg outcome "$outcome" \
            --arg step "$step" --arg message "$message" \
            '{schema: 2, app: $app, sourceSha: $sha, run: {attempt: $attempt}, outcome: $outcome, steps: [{step: $step, message: $message}]}' \
            > "$RUNNER_TEMP/$APP-serving-publication.json"
      - name: Retain the publication and rollback receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serving-${{ inputs.app }}-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ inputs.app }}-serving-publication.json
          retention-days: 90
          if-no-files-found: warn
      - name: Explain a coordinator skip
        if: steps.coordinator.outputs.publish == 'false'
        env:
          PROJECT: ${{ inputs.app }}
        run: |
          echo "::warning::The deployment coordinator refused this $PROJECT production publish (superseded, held or already terminal); nothing was published."
          echo "Deployment coordinator refused this $PROJECT production publish; nothing was published." >> "$GITHUB_STEP_SUMMARY"
      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: ${{ inputs.app }}
          environment: production
          job-status: ${{ job.status }}
