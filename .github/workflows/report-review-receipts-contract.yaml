name: Report review receipt foundation
on:
  pull_request:
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/supabase/tests/report-review-receipts.sql"
      - "apps/database/scripts/verify-report-review-receipts-contract.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - "apps/database/scripts/programming-database-tap.mjs"
      - "apps/database/scripts/programming-database-tap.test.mjs"
      - "apps/database/scripts/report-review-receipt-concurrency.mjs"
      - "apps/database/scripts/report-review-receipts-contract.test.mjs"
      - "apps/database/scripts/report-review-receipts-types.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/report-review-receipts-contract.yaml"
  push:
    branches: [main, production]
    paths:
      - "apps/database/supabase/migrations/**"
      - "apps/database/supabase/tests/report-review-receipts.sql"
      - "apps/database/scripts/verify-report-review-receipts-contract.mjs"
      - "apps/database/scripts/run-supabase*.js"
      - "apps/database/scripts/programming-database-tap.mjs"
      - "apps/database/scripts/programming-database-tap.test.mjs"
      - "apps/database/scripts/report-review-receipt-concurrency.mjs"
      - "apps/database/scripts/report-review-receipts-contract.test.mjs"
      - "apps/database/scripts/report-review-receipts-types.ts"
      - "tuturuuu.ci.ts"
      - ".github/workflows/report-review-receipts-contract.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')) && format('{0}-{1}-{2}', github.sha, github.event_name, github.run_id) || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--') }}
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: report-review-receipts-contract.yaml
  contract:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Require an enabled contract gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Verify TAP parser and bounded fixture sessions
        run: node --test apps/database/scripts/programming-database-tap.test.mjs apps/database/scripts/report-review-receipts-contract.test.mjs
      - name: Apply complete schema, run strict pgTAP, generate actual schema types
        run: node apps/database/scripts/verify-report-review-receipts-contract.mjs
      - name: Strictly check actual generated review types
        run: bun x tsc --noEmit --strict --skipLibCheck --target esnext --module nodenext --moduleResolution nodenext apps/database/scripts/report-review-receipts-types.ts
      - uses: actions/upload-artifact@v7
        with:
          name: report-review-receipts-types-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/types/src/supabase.ts
          if-no-files-found: error
          retention-days: 3
