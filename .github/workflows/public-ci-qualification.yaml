name: Public CI qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['scripts/ci/meet-*', '.github/workflows/public-ci-qualification.yaml']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable merged-main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-qualification-${{ inputs.source_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  root-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit immutable merged-main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          cache-enabled: 'false'
          package-cache-enabled: 'false'
      - run: bun install --frozen-lockfile
      - name: Execute disjoint root-test shard
        env:
          SHARD: ${{ matrix.shard }}
          NODE_PATH: ${{ github.workspace }}/apps/web/node_modules
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { discoverScriptTests } = require('./scripts/run-script-tests.js');
          const all = discoverScriptTests().sort();
          const files = all.filter((_, index) => index % 4 === Number(process.env.SHARD));
          if (!files.length) throw new Error('Empty root-test shard');
          const args = ['--experimental-strip-types', '--test', '--test-concurrency=2', '--test-reporter=tap', ...files];
          fs.writeFileSync('root-test-manifest.json', JSON.stringify({ source: process.env.GITHUB_SHA, checkout: require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, shard: process.env.SHARD, total: all.length, argv: args }));
          const result = spawnSync(process.execPath, args, { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: root-tests-${{ inputs.source_sha }}-${{ matrix.shard }}
          path: root-test-manifest.json
          if-no-files-found: error

  meet-public:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit exact public source
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$DISPATCH" = true ]; then git merge-base --is-ancestor "$SOURCE_SHA" origin/main; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          cache-enabled: 'false'
          package-cache-enabled: 'false'
      - run: bun install --frozen-lockfile
      - name: Focused production and fixture contract regressions
        run: node --test scripts/ci/meet-build-metadata.test.js scripts/ci/meet-native-fixture-supplier.test.mjs scripts/ci/meet-native-admission.test.mjs scripts/ci/meet-native-hidden.test.mjs scripts/ci/meet-native-supplier.test.mjs scripts/ci/meet-native-lifecycle.test.mjs scripts/ci/meet-native-evidence.test.mjs scripts/ci/meet-native-assurance.test.mjs
      - name: Changed-source publication gate
        run: bun check:changed --base origin/main --committed
      - name: Build and qualify separate exact-source public fixture
        id: fixture
        run: node scripts/ci/meet-native-fixture-supplier.mjs "$SOURCE_SHA" "$RUNNER_TEMP"
      - name: Qualify fixture runtime
        run: node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --fixture-receipt '${{ steps.fixture.outputs.receipt }}'
      - name: Restore portable fixture independently
        id: restored
        run: node scripts/ci/meet-native-fixture-supplier.mjs restore "$SOURCE_SHA" '${{ steps.fixture.outputs.transport }}' "$RUNNER_TEMP"
      - name: Qualify restored fixture runtime
        run: node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --fixture-receipt '${{ steps.restored.outputs.receipt }}'
      - name: Compile original graph with synthetic public production controls
        env:
          GITHUB_REF: refs/heads/production
          GITHUB_SHA: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: production
          PLATFORM_BUILD_ENVIRONMENT: production
          NEXT_PUBLIC_SUPABASE_URL: https://meet-public-build.supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_public_build_control
          NEXT_PUBLIC_APP_URL: https://meet.tuturuuu.com
          NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
        run: |
          set -euo pipefail
          node scripts/ci/meet-native-fixture-supplier.mjs inputs "$SOURCE_SHA" "$RUNNER_TEMP/public-inputs.json"
          bun run --silent scripts/ci/generate-build-metadata.ts
          bun turbo:local run build --filter='@tuturuuu/meet-core^...' --concurrency=2
          bun run --cwd apps/meet build:cloudflare
          node scripts/ci/verify-meet-start-output.js seal apps/meet apps/meet/meet-artifact.json
          node scripts/ci/meet-native-fixture-supplier.mjs production-receipt "$SOURCE_SHA" "$RUNNER_TEMP/public-inputs.json" "$RUNNER_TEMP/public-production-receipt.json"
      - name: Qualify original public production-profile runtime and dry-run
        run: |
          set -euo pipefail
          node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/public-production-receipt.json"
          (cd apps/meet && node ../../scripts/ci/meet-dry-run-scratch.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/public-production-receipt.json")
      - name: Package public compiler output and provenance
        env:
          TRANSPORT: ${{ steps.fixture.outputs.transport }}
        run: |
          set -euo pipefail
          mkdir public-output
          cp "$TRANSPORT" public-output/fixture-transport.tar.gz
          tar -czf public-output/public-worker.tar.gz -C apps/meet dist meet-artifact.json
          cp "$RUNNER_TEMP/public-inputs.json" "$RUNNER_TEMP/public-production-receipt.json" public-output/
          git rev-parse HEAD HEAD^{tree} > public-output/source.txt
          node --version > public-output/node.txt
          bun --version > public-output/bun.txt
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > public-output/run.txt
          cp .github/workflows/public-ci-qualification.yaml public-output/commands.yaml
          sha256sum bun.lock apps/meet/package.json > public-output/inputs.sha256
          (cd public-output && sha256sum fixture-transport.tar.gz public-worker.tar.gz public-inputs.json public-production-receipt.json source.txt node.txt bun.txt run.txt commands.yaml inputs.sha256 > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: meet-public-${{ env.SOURCE_SHA }}
          path: public-output/
          if-no-files-found: error
          retention-days: 7
