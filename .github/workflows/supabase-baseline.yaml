name: Supabase baseline contract
on:
  push:
    branches-ignore: [production]
    paths:
      - scripts/ci/supabase-registry.test.js
      - scripts/ci/supabase-baseline*
      - apps/database/scripts/run-supabase*.js
      - '.github/actions/cache-supabase-images/**'
      - 'scripts/ci/supabase-image-cache*'
      - .github/actions/setup-supabase-baseline/**
      - .github/workflows/supabase-baseline.yaml
  workflow_dispatch:
    inputs:
      seed_images_only:
        description: Seed all image profiles on main without database contracts
        type: boolean
        default: false
      seed_image_catalog:
        description: Reviewed image catalog for main-only seeding
        type: choice
        default: current
        options: [current, cli-2.121.0]
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  seed-images:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.seed_images_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [contract, contract-http, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: ./.github/actions/cache-supabase-images
        with:
          profile: ${{ matrix.profile }}
          pull-budget-seconds: "600"
          seed-image-catalog: ${{ inputs.seed_image_catalog || 'current' }}
  cold-warm-corrupt:
    if: inputs.seed_images_only != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      seed-epoch: ${{ steps.cold.outputs.seed-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install
      - uses: ./.github/actions/cache-supabase-images
        with:
          profile: full
      - name: Verify image-pull retry boundaries
        run: node --test scripts/ci/supabase-image-cache.test.js scripts/ci/supabase-image-cache-seed.test.js scripts/ci/supabase-image-cache-registry.test.js scripts/ci/supabase-registry.test.js apps/database/scripts/run-supabase-image-retry.test.js apps/database/scripts/run-supabase.test.js
      - name: Cold baseline from all migrations
        id: cold
        run: node scripts/ci/supabase-baseline.js prepare
      - name: Export pristine baseline for a separate runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pristine-supabase-baseline
          path: ${{ runner.temp }}/supabase-baseline
          retention-days: 1
          if-no-files-found: error
      - name: Verify cold setup and add disposable test data
        run: |
          test '${{ steps.cold.outputs.restored }}' = false
          docker exec supabase_db_tuturuuu psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.baseline_contract_mutation(id integer);'
          node apps/database/scripts/run-supabase.js stop --no-backup
      - name: Restore pristine baseline
        id: warm
        run: node scripts/ci/supabase-baseline.js prepare
      - name: Verify warm setup excludes prior test mutations
        run: |
          test '${{ steps.warm.outputs.restored }}' = true
          test "$(docker exec supabase_db_tuturuuu psql -U postgres -d postgres -Atc "SELECT to_regclass('public.baseline_contract_mutation') IS NULL")" = t
          node apps/database/scripts/run-supabase.js stop --no-backup
          printf corrupt > "$RUNNER_TEMP/supabase-baseline/database.tar.gz"
      - name: Rebuild corrupt baseline
        id: corrupt
        run: node scripts/ci/supabase-baseline.js prepare
      - name: Verify corrupt cache falls back to migrations
        run: test '${{ steps.corrupt.outputs.restored }}' = false
      - name: Stop isolated test database
        if: always()
        run: node apps/database/scripts/run-supabase.js stop --no-backup

  cross-runner-restore:
    needs: cold-warm-corrupt
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_BASELINE_EPOCH: ${{ needs.cold-warm-corrupt.outputs.seed-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install
      - uses: ./.github/actions/cache-supabase-images
        with:
          profile: full
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pristine-supabase-baseline
          path: ${{ runner.temp }}/supabase-baseline
      - name: Restore baseline created on another runner
        id: restored
        run: node scripts/ci/supabase-baseline.js prepare
      - name: Require a verified restore without migration replay
        run: |
          test '${{ steps.restored.outputs.restored }}' = true
          test "$(docker exec supabase_db_tuturuuu psql -U postgres -d postgres -Atc "SELECT to_regclass('public.baseline_contract_mutation') IS NULL")" = t
      - name: Stop isolated test database
        if: always()
        run: node apps/database/scripts/run-supabase.js stop --no-backup
