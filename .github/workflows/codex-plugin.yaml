name: Codex Plugin Check

on:
  push:
  workflow_dispatch:

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: codex-plugin.yaml

  validate:
    name: Validate Tuturuuu Codex Plugin
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/tuturuuu/mcp/requirements.lock

      - name: Validate plugin
        run: python3 plugins/tuturuuu/scripts/validate_plugin.py

      - name: Install local MCP test dependency
        run: python3 -m pip install --require-hashes -r plugins/tuturuuu/mcp/requirements.lock

      - parallel:
          - name: Test local MCP boundaries and stdio contract
            shell: bash
            timeout-minutes: 5
            run: |
              ulimit -v 1048576
              python3 -m unittest discover -s plugins/tuturuuu/mcp -p 'test_*.py'

          - name: Test orchestration evidence boundaries
            shell: bash
            timeout-minutes: 5
            run: |
              ulimit -v 1048576
              python3 -m unittest discover -s plugins/tuturuuu/scripts -p 'test_program*.py'

      - name: Validate docs navigation JSON
        run: python3 -m json.tool apps/docs/docs.json > /dev/null
