name: Codex Plugin Check

on:
  workflow_call:
  push:
    branches: [main, production, 'release-please--branches--**']
  workflow_dispatch:

concurrency:
  group: codex-plugin-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

permissions:
  contents: read

jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: codex-plugin.yaml

  validate:
    name: Validate Tuturuuu Codex Plugin
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: plugins/tuturuuu/mcp/requirements.lock

      - name: Validate plugin
        run: python3 plugins/tuturuuu/scripts/validate_plugin.py

      - name: Install local MCP test dependency
        run: python3 -m pip install --require-hashes -r plugins/tuturuuu/mcp/requirements.lock

      - parallel:
          - name: Test local MCP boundaries and stdio contract
            shell: bash
            timeout-minutes: 5
            run: |
              ulimit -v 1048576
              python3 -m unittest discover -s plugins/tuturuuu/mcp -p 'test_*.py'

          - name: Test orchestration evidence boundaries
            shell: bash
            timeout-minutes: 5
            run: |
              ulimit -v 1048576
              python3 -m unittest discover -s plugins/tuturuuu/scripts -p 'test_program*.py'

      - name: Validate docs navigation JSON
        run: python3 -m json.tool apps/docs/docs.json > /dev/null
