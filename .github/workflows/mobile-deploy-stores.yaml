name: Mobile Store Deployment
# Release dispatches are labeled so recovery can tell a run that publishes from
# a review-retry run.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Mobile Store Deployment ({0})', inputs.mode) || 'Mobile Store Deployment' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

on:
  push:
    branches:
      - production
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-deploy-stores.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - ".github/workflows/ci-check.yml"
      - "scripts/mobile-deployment/**"
      - "scripts/ci/normalize-release-notes.js"
      - "scripts/ci/normalize-release-description.js"
      - "tuturuuu.ci.ts"
      - "tuturuuu.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a new beta release or retry an existing iOS review
        required: true
        default: release
        type: choice
        options:
          - release
          - retry_ios_review
      force:
        description: Publish even when the mobile tree matches the last uploaded build
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-deploy-stores.yaml

  mobile-store-publish-gate:
    permissions:
      actions: read
      contents: read
    name: Decide mobile store publish
    needs: [check-ci]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tree: ${{ steps.gate.outputs.tree }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the mobile tree changed
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_STORE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          MAC_APP_STORE_ENABLED: ${{ vars.MAC_APP_STORE_ENABLED == 'true' }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/mobile-deployment/store-publish-gate.mjs

  allocate-app-version:
    permissions:
      # Ledger tag refs, and a head release when this commit is superseded.
      actions: write
      contents: write
    name: Allocate shared app version
    needs: [check-ci, mobile-store-publish-gate]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true' && needs.mobile-store-publish-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      superseded: ${{ steps.allocate.outputs.superseded }}
      version: ${{ steps.allocate.outputs.version }}
      build: ${{ steps.allocate.outputs.build }}
      label: ${{ steps.allocate.outputs.label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Desktop and mobile read one ledger, so a production commit gets the same
      # X.Y.Z and build number on every platform.
      - name: Allocate or reuse the ledger entry
        id: allocate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-version/allocate.mjs

      # A newer production commit (for example a desktop-only change that never
      # runs this workflow) allocated first. That commit contains this one, so a
      # release of the production head carries these mobile changes forward.
      - name: Release the production head instead
        if: steps.allocate.outputs.superseded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # force: the head may share this commit's mobile tree, and a store
        # that failed here must still receive it.
        run: gh api -X POST repos/tutur3u/platform/actions/workflows/mobile-deploy-stores.yaml/dispatches -f ref=production -f 'inputs[mode]=release' -f 'inputs[force]=true'

  mobile-credentials-preflight:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    name: Check mobile deployment credentials
    needs: [check-ci, mobile-store-publish-gate, allocate-app-version]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true' && needs.mobile-store-publish-gate.outputs.publish == 'true' && needs.allocate-app-version.outputs.superseded == 'false'
    runs-on: ubuntu-latest
    environment: mobile-store-beta
    outputs:
      build_number: ${{ steps.credentials.outputs.build_number }}
      build_name: ${{ steps.version_name.outputs.build_name }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require production branch
        run: test "$GITHUB_REF" = refs/heads/production

      - name: Check mobile deployment CI token
        id: credentials
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
          LEDGER_BUILD: ${{ needs.allocate-app-version.outputs.build }}
        run: |
          if [ -z "${MOBILE_DEPLOYMENT_CI_TOKEN:-}" ]; then
            echo "::error title=Mobile store deployment blocked::MOBILE_DEPLOYMENT_CI_TOKEN is not configured in the mobile-store-beta environment."
            exit 1
          fi

          # The shared ledger build number is the iOS CFBundleVersion and the
          # Android versionCode.
          [[ "$LEDGER_BUILD" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$LEDGER_BUILD" -le 2100000000
          echo "build_number=$LEDGER_BUILD" >> "$GITHUB_OUTPUT"

      - name: Fetch iOS release metadata credentials
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          bundle_path="$RUNNER_TEMP/mobile-deployment-ios-metadata.json"
          oidc_response="$RUNNER_TEMP/mobile-deployment-ios-metadata-oidc.json"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tuturuuu-mobile-deployment"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" \
            -o "$oidc_response"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).value)' "$oidc_response")"

          curl -fsSL \
            -H "Authorization: Bearer ${MOBILE_DEPLOYMENT_CI_TOKEN}" \
            -H "X-GitHub-OIDC-Token: ${oidc_token}" \
            "https://infrastructure.tuturuuu.com/api/v1/mobile-deployment/bundle?environment=production&platform=ios" \
            -o "$bundle_path"

          node ../../scripts/mobile-deployment/hydrate-bundle.mjs \
            --platform ios \
            --bundle "$bundle_path" \
            --mobile-root "$PWD"

      - name: Calculate next mobile app version
        id: version_name
        shell: bash
        env:
          LEDGER_VERSION: ${{ needs.allocate-app-version.outputs.version }}
        run: |
          set -euo pipefail
          # The ledger owns the version. Each Apple job checks its train with
          # apple-guard.mjs before uploading.
          [[ "$LEDGER_VERSION" =~ ^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$ ]]
          echo "build_name=$LEDGER_VERSION" >> "$GITHUB_OUTPUT"

      # Ledger tags name the commit behind each ledger build number.
      - name: Fetch release ledger tags
        run: git fetch --quiet --no-tags origin '+refs/tags/app-b*:refs/tags/app-b*'

      - name: Bundle mobile beta release history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILE_BUILD_NAME: ${{ steps.version_name.outputs.build_name }}
          MOBILE_BUILD_NUMBER: ${{ steps.credentials.outputs.build_number }}
        run: node ../../scripts/mobile-deployment/release-history.mjs

      - name: Share beta release history with both stores
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-beta-release-history
          path: apps/mobile/assets/release_history.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup release metadata credentials
        if: always()
        shell: bash
        run: |
          rm -f .env.github
          rm -f ios/Runner/GoogleService-Info.plist
          rm -f ios/Runner/GoogleService-Info-production.plist
          rm -rf "$RUNNER_TEMP/mobile-deployment"
          rm -f "$RUNNER_TEMP/mobile-deployment-ios-metadata.json"
          rm -f "$RUNNER_TEMP/mobile-deployment-ios-metadata-oidc.json"

  publish-android-internal:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    name: Publish Android to Google Play internal
    needs: [check-ci, mobile-store-publish-gate, mobile-credentials-preflight]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true' && needs.mobile-store-publish-gate.outputs.publish == 'true' && needs.mobile-credentials-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: mobile-store-beta
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-android
          environment: production

      - name: Use prepared beta release history
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-beta-release-history
          path: apps/mobile/assets

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      # Production jobs read caches populated by trusted main builds.
      - name: Restore Gradle dependencies without saving
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2/files-2.1
          key: gradle-downloads-v2-${{ runner.os }}-${{ runner.arch }}-java17

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.50.0"
          channel: stable

      - name: Fetch Android deployment bundle from Tuturuuu
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          bundle_path="$RUNNER_TEMP/mobile-deployment-android.json"
          oidc_response="$RUNNER_TEMP/mobile-deployment-android-oidc.json"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tuturuuu-mobile-deployment"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" \
            -o "$oidc_response"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).value)' "$oidc_response")"

          curl -fsSL \
            -H "Authorization: Bearer ${MOBILE_DEPLOYMENT_CI_TOKEN}" \
            -H "X-GitHub-OIDC-Token: ${oidc_token}" \
            "https://infrastructure.tuturuuu.com/api/v1/mobile-deployment/bundle?environment=production&platform=android" \
            -o "$bundle_path"

          node ../../scripts/mobile-deployment/hydrate-bundle.mjs \
            --platform android \
            --bundle "$bundle_path" \
            --mobile-root "$PWD"

      - name: Check for an existing Google Play internal build
        id: existing
        run: node ../../scripts/mobile-deployment/play-beta.mjs --check "${{ needs.mobile-credentials-preflight.outputs.build_number }}"

      - name: Install dependencies
        if: steps.existing.outputs.present != 'true'
        run: flutter pub get

      - name: Validate Android deployment identity
        shell: bash
        run: |
          set -euo pipefail

          test "$GOOGLE_PLAY_PACKAGE_NAME" = "com.tuturuuu.app.mobile"
          test "$GOOGLE_PLAY_TRACK" = "internal"
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEYSTORE_ALIAS" >/dev/null

      - name: Build and verify signed Android App Bundle
        if: steps.existing.outputs.present != 'true'
        uses: ./.github/actions/run-with-turbo-remote-cache
        env:
          MOBILE_DART_DEFINE_FILE: .env.github
        with:
          command: bun build:android --build-name=${{ needs.mobile-credentials-preflight.outputs.build_name }} --build-number=${{ needs.mobile-credentials-preflight.outputs.build_number }}

      - name: Upload Android App Bundle artifact
        if: steps.existing.outputs.present != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-production-aab
          path: apps/mobile/build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Prepare Google Play release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_dir="$RUNNER_TEMP/mobile-play-notes"
          mkdir -p "$notes_dir"
          node -e 'const h = require("./assets/release_history.json"); const r = h.releases.find(r => r.version === h.build.version); if (!r?.changes?.length) throw new Error("Missing exact build notes"); console.log(r.changes.join("\n"))' | node ../../scripts/ci/normalize-release-description.js --mobile > "$notes_dir/whatsnew-en-US"
          test -s "$notes_dir/whatsnew-en-US"
          test "$(wc -m < "$notes_dir/whatsnew-en-US")" -le 500
          echo "MOBILE_PLAY_NOTES=$notes_dir" >> "$GITHUB_ENV"

      - name: Recheck source order before the Play upload
        if: steps.existing.outputs.present != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/app-version/allocate.mjs --assert-current

      - name: Publish Android App Bundle to Google Play internal
        if: steps.existing.outputs.present != 'true'
        # One edit uploads the bundle and commits a completed internal release
        # with ERROR_IF_IN_REVIEW, so it never cancels a release in review.
        run: node ../../scripts/mobile-deployment/play-beta.mjs --upload "${{ needs.mobile-credentials-preflight.outputs.build_number }}" build/app/outputs/bundle/productionRelease/app-production-release.aab "$MOBILE_PLAY_NOTES"

      - name: Verify committed Google Play internal release
        run: node ../../scripts/mobile-deployment/verify-store.mjs android "${{ needs.mobile-credentials-preflight.outputs.build_number }}"

      - name: Recheck source order before Play promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/app-version/allocate.mjs --assert-current

      - name: Add Vietnamese notes and promote to Google Play testing tracks
        env:
          GOOGLE_PLAY_BETA_TRACKS: ${{ vars.GOOGLE_PLAY_BETA_TRACKS || '' }}
        run: node ../../scripts/mobile-deployment/play-beta.mjs "${{ needs.mobile-credentials-preflight.outputs.build_number }}" "$MOBILE_PLAY_NOTES"

      - name: Cleanup Android release files
        if: always()
        shell: bash
        run: |
          rm -f .env.github
          rm -f android/app/src/production/google-services.json
          rm -rf "$RUNNER_TEMP/mobile-deployment"
          rm -f "$RUNNER_TEMP/mobile-deployment-android.json"
          rm -f "$RUNNER_TEMP/mobile-deployment-android-oidc.json"

      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-android
          environment: production
          job-status: ${{ job.status }}


  publish-ios-testflight:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    name: Upload iOS to TestFlight
    needs: [check-ci, mobile-store-publish-gate, mobile-credentials-preflight]
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true' && needs.mobile-store-publish-gate.outputs.publish == 'true' && needs.mobile-credentials-preflight.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: mobile-store-beta
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-ios
          environment: production

      - name: Use prepared beta release history
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-beta-release-history
          path: apps/mobile/assets

      - name: Select Xcode with the iOS 27 SDK
        uses: ./.github/actions/select-xcode-ios-sdk

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.50.0"
          channel: stable

      # Production jobs read caches populated by trusted main builds.
      - name: Restore CocoaPods downloads without saving
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-

      - name: Fetch iOS deployment bundle from Tuturuuu
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          bundle_path="$RUNNER_TEMP/mobile-deployment-ios.json"
          oidc_response="$RUNNER_TEMP/mobile-deployment-ios-oidc.json"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tuturuuu-mobile-deployment"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" \
            -o "$oidc_response"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).value)' "$oidc_response")"

          curl -fsSL \
            -H "Authorization: Bearer ${MOBILE_DEPLOYMENT_CI_TOKEN}" \
            -H "X-GitHub-OIDC-Token: ${oidc_token}" \
            "https://infrastructure.tuturuuu.com/api/v1/mobile-deployment/bundle?environment=production&platform=ios" \
            -o "$bundle_path"

          node ../../scripts/mobile-deployment/hydrate-bundle.mjs \
            --platform ios \
            --bundle "$bundle_path" \
            --mobile-root "$PWD"

      - name: Check App Store Connect for this build
        id: existing
        env:
          LEDGER_VERSION: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          LEDGER_BUILD: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
        run: node ../../scripts/app-version/apple-guard.mjs IOS "$LEDGER_VERSION" "$LEDGER_BUILD"

      - name: Disable Flutter Swift Package Manager
        if: steps.existing.outputs.present != 'true'
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        if: steps.existing.outputs.present != 'true'
        run: flutter pub get

      - name: Import Apple signing assets
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="$RUNNER_TEMP/mobile-deployment/mobile-deployment.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          if ! security import "$APPLE_DISTRIBUTION_CERTIFICATE_P12_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path" >/dev/null 2>&1; then
            echo "::error title=Apple signing import failed::Could not import the distribution identity."
            exit 1
          fi
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          # security prints private-key record attributes even without verbose mode.
          # Keep both normal and failure output out of public Actions logs.
          if ! security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" >/dev/null 2>&1; then
            echo "::error title=Apple signing access failed::Could not grant codesign access to the distribution identity."
            exit 1
          fi

          profile_plist="$RUNNER_TEMP/mobile-deployment/profile.plist"
          security cms -D -i "$APPLE_PROVISIONING_PROFILE_PATH" > "$profile_plist"
          APPLE_LIVE_SCREEN_GROUP_REQUIRED=true swift ../../scripts/mobile-deployment/verify-profile.swift "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$profile_plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")"

          test "$APPLE_TEAM_ID" = "$profile_team"
          test "$app_identifier" = "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$APPLE_PROVISIONING_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          echo "MOBILE_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          cat > ios/Flutter/StoreSigning.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${profile_uuid}
          EOF

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APPLE_BUNDLE_ID}</key>
              <string>${profile_uuid}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Omit Live screen broadcast from TestFlight beta
        if: steps.existing.outputs.present != 'true'
        run: ruby ../../scripts/mobile-deployment/omit-broadcast-extension.rb ios/Runner.xcodeproj

      - name: Verify release backend URLs are https
        if: steps.existing.outputs.present != 'true'
        run: node ../../scripts/mobile-validate-dart-defines.js .env.github

      - name: Build iOS IPA
        if: steps.existing.outputs.present != 'true'
        run: flutter build ipa --release --flavor production --target lib/main_production.dart --dart-define-from-file=.env.github --dart-define=IOS_LIVE_SCREEN_BROADCAST_ENABLED=false --build-name=${{ needs.mobile-credentials-preflight.outputs.build_name }} --build-number=${{ needs.mobile-credentials-preflight.outputs.build_number }} --export-options-plist=ios/ExportOptions.plist

      - name: Resolve iOS IPA path
        if: steps.existing.outputs.present != 'true'
        id: ios-ipa
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "::error title=Missing iOS IPA::No IPA was generated under apps/mobile/build/ios/ipa."
            exit 1
          fi

          echo "path=apps/mobile/$ipa_path" >> "$GITHUB_OUTPUT"
          echo "local_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Verify exported iOS signature and build identity
        if: steps.existing.outputs.present != 'true'
        shell: bash
        env:
          EXPECTED_BUILD_NUMBER: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
          EXPECTED_BUILD_NAME: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          IPA_PATH: ${{ steps.ios-ipa.outputs.local_path }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/mobile-deployment/ipa-verification"
          mkdir -p "$verify_dir"
          ditto -x -k "$IPA_PATH" "$verify_dir"
          shopt -s nullglob
          apps=("$verify_dir"/Payload/*.app)
          test "${#apps[@]}" -eq 1
          app_path="${apps[0]}"
          codesign --verify --deep --strict "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app_path/Info.plist")" = "$APPLE_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app_path/Info.plist")" = "$EXPECTED_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app_path/Info.plist")" = "$EXPECTED_BUILD_NAME"
          codesign -d --entitlements :- "$app_path" > "$verify_dir/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print application-identifier' "$verify_dir/entitlements.plist")" = "$APPLE_TEAM_ID.$APPLE_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print get-task-allow' "$verify_dir/entitlements.plist")" = false
          test "$(/usr/libexec/PlistBuddy -c 'Print com.apple.security.application-groups:0' "$verify_dir/entitlements.plist")" = "group.$APPLE_BUNDLE_ID.live"
          security cms -D -i "$app_path/embedded.mobileprovision" > "$verify_dir/profile.plist"
          APPLE_LIVE_SCREEN_GROUP_REQUIRED=true swift ../../scripts/mobile-deployment/verify-profile.swift "$verify_dir/profile.plist"
          test ! -e "$app_path/PlugIns/LiveScreenBroadcast.appex"

      - name: Verify and upload iOS Crashlytics symbols
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: bash ../../scripts/mobile-deployment/upload-ios-symbols.sh build/ios/archive/Runner.xcarchive ios/Runner/GoogleService-Info-production.plist ios/Pods/FirebaseCrashlytics/upload-symbols

      - name: Preserve iOS dSYM artifact
        if: always() && steps.existing.outputs.present != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-production-dsyms
          path: apps/mobile/build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload iOS IPA artifact
        if: steps.existing.outputs.present != 'true'
        # TestFlight uses the verified local IPA. GitHub artifact storage is
        # diagnostic only and must not block distribution when it times out.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-production-ipa
          path: ${{ steps.ios-ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Recheck source order before the TestFlight upload
        if: steps.existing.outputs.present != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/app-version/allocate.mjs --assert-current

      - name: Recheck App Store Connect before the upload
        id: recheck
        if: steps.existing.outputs.present != 'true'
        env:
          LEDGER_VERSION: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          LEDGER_BUILD: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
        run: node ../../scripts/app-version/apple-guard.mjs IOS "$LEDGER_VERSION" "$LEDGER_BUILD"

      - name: Upload iOS IPA to TestFlight
        if: steps.existing.outputs.present != 'true' && steps.recheck.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail

          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ios-ipa.outputs.local_path }}" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Recheck source order before TestFlight distribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/app-version/allocate.mjs --assert-current

      - name: Verify TestFlight and distribute to beta groups
        timeout-minutes: 35
        env:
          LEDGER_RECHECK: "true"
          MOBILE_BUILD_NAME: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          TESTFLIGHT_BETA_ENABLED: ${{ vars.TESTFLIGHT_BETA_ENABLED || 'true' }}
          TESTFLIGHT_EXTERNAL_BETA_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_BETA_GROUPS || '' }}
          TESTFLIGHT_BETA_GROUPS: ${{ vars.TESTFLIGHT_BETA_GROUPS || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/mobile-deployment/verify-store.mjs ios "${{ needs.mobile-credentials-preflight.outputs.build_number }}"

      - name: Add Vietnamese TestFlight notes
        continue-on-error: true
        run: node ../../scripts/mobile-deployment/testflight-vi-notes.mjs "${{ needs.mobile-credentials-preflight.outputs.build_number }}"

      - name: Cleanup iOS release files
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mobile-deployment/mobile-deployment.keychain-db" || true
          if [ -n "${MOBILE_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${MOBILE_PROFILE_UUID}.mobileprovision"
          fi
          if [ -n "${MOBILE_BROADCAST_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${MOBILE_BROADCAST_PROFILE_UUID}.mobileprovision"
          fi
          if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY_PATH:-}" ]; then
            rm -f "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          fi
          rm -f .env.github
          rm -f ios/ExportOptions.plist
          rm -f ios/Flutter/StoreSigning.xcconfig
          rm -f ios/Runner/GoogleService-Info.plist
          rm -f ios/Runner/GoogleService-Info-production.plist
          rm -rf "$RUNNER_TEMP/mobile-deployment"
          rm -f "$RUNNER_TEMP/mobile-deployment-ios.json"
          rm -f "$RUNNER_TEMP/mobile-deployment-ios-oidc.json"

      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-ios
          environment: production
          job-status: ${{ job.status }}


  publish-macos-app-store:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    name: Upload macOS to the Mac App Store
    needs: [check-ci, mobile-store-publish-gate, mobile-credentials-preflight]
    # Off until MAC_APP_STORE_ENABLED is true; it then still skips its build
    # until the deployment bundle holds the Mac App Store signing entries.
    if: vars.MAC_APP_STORE_ENABLED == 'true' && github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && needs.check-ci.outputs.should_run == 'true' && needs.mobile-store-publish-gate.outputs.publish == 'true' && needs.mobile-credentials-preflight.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 120
    environment: mobile-store-beta
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-macos
          environment: production

      - name: Use prepared beta release history
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-beta-release-history
          path: apps/mobile/assets

      - name: Fetch Apple deployment bundle from Tuturuuu
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          bundle_path="$RUNNER_TEMP/mobile-deployment-macos.json"
          oidc_response="$RUNNER_TEMP/mobile-deployment-macos-oidc.json"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tuturuuu-mobile-deployment"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" \
            -o "$oidc_response"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).value)' "$oidc_response")"

          curl -fsSL \
            -H "Authorization: Bearer ${MOBILE_DEPLOYMENT_CI_TOKEN}" \
            -H "X-GitHub-OIDC-Token: ${oidc_token}" \
            "https://infrastructure.tuturuuu.com/api/v1/mobile-deployment/bundle?environment=production&platform=ios" \
            -o "$bundle_path"

          node ../../scripts/mobile-deployment/hydrate-bundle.mjs \
            --platform ios \
            --bundle "$bundle_path" \
            --mobile-root "$PWD"

      - name: Check Mac App Store signing entries
        id: ready
        shell: bash
        run: |
          if [ "${MAC_APP_STORE_READY:-false}" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # MAC_APP_STORE_ENABLED promises a Mac build, so a missing signing
            # entry fails the job. A skip would look like a delivered tree, and
            # the store gate would then never retry the Mac upload.
            echo "::error title=Mac App Store blocked::MAC_APP_STORE_ENABLED is true, but the deployment bundle has no Mac installer certificate or Mac App Store profile."
            exit 1
          fi

      - name: Check App Store Connect for this build
        id: existing
        if: steps.ready.outputs.ready == 'true'
        env:
          LEDGER_VERSION: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          LEDGER_BUILD: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
        run: node ../../scripts/app-version/apple-guard.mjs MAC_OS "$LEDGER_VERSION" "$LEDGER_BUILD"

      - name: Setup Flutter
        if: steps.ready.outputs.ready == 'true'
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.50.0"
          channel: stable

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: |
          flutter config --enable-macos-desktop
          flutter pub get --enforce-lockfile

      - name: Prepare macOS Firebase inputs
        if: steps.ready.outputs.ready == 'true'
        working-directory: .
        run: node scripts/desktop-deployment/prepare-macos.mjs

      - name: Verify release backend URLs are https
        if: steps.ready.outputs.ready == 'true'
        run: node ../../scripts/mobile-validate-dart-defines.js .env.github

      # Sandboxed entitlements and the store channel define: the direct-download
      # updater is compiled out because the Mac App Store owns updates.
      - name: Build sandboxed macOS app
        if: steps.ready.outputs.ready == 'true' && steps.existing.outputs.present != 'true'
        env:
          FLUTTER_XCODE_TUTURUUU_RELEASE_ENTITLEMENTS: Runner/AppStore.entitlements
        run: flutter build macos --release --flavor production --target lib/main_production.dart --dart-define-from-file=.env.github --dart-define=DESKTOP_STORE_CHANNEL=true --build-name=${{ needs.mobile-credentials-preflight.outputs.build_name }} --build-number=${{ needs.mobile-credentials-preflight.outputs.build_number }}

      - name: Sign and package for the Mac App Store
        if: steps.ready.outputs.ready == 'true' && steps.existing.outputs.present != 'true'
        working-directory: .
        run: |
          set -euo pipefail
          app_path="apps/mobile/build/macos/Build/Products/Release-production/Tuturuuu.app"
          archs="$(lipo -archs "$app_path/Contents/MacOS/Tuturuuu")"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::Mac App Store build must be universal"; exit 1 ;; esac
          node scripts/desktop-deployment/package-mac-app-store.mjs "$app_path" "$RUNNER_TEMP/mac-app-store/Tuturuuu.pkg"

      - name: Recheck source order before the Mac upload
        if: steps.ready.outputs.ready == 'true' && steps.existing.outputs.present != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../../scripts/app-version/allocate.mjs --assert-current

      - name: Recheck App Store Connect before the upload
        id: recheck
        if: steps.ready.outputs.ready == 'true' && steps.existing.outputs.present != 'true'
        env:
          LEDGER_VERSION: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          LEDGER_BUILD: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
        run: node ../../scripts/app-version/apple-guard.mjs MAC_OS "$LEDGER_VERSION" "$LEDGER_BUILD"

      - name: Upload macOS package to App Store Connect
        if: steps.ready.outputs.ready == 'true' && steps.existing.outputs.present != 'true' && steps.recheck.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type macos \
            --file "$RUNNER_TEMP/mac-app-store/Tuturuuu.pkg" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify App Store Connect accepted the macOS build
        if: steps.ready.outputs.ready == 'true'
        timeout-minutes: 35
        env:
          LEDGER_VERSION: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          LEDGER_BUILD: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
        run: node ../../scripts/app-version/apple-guard.mjs --wait MAC_OS "$LEDGER_VERSION" "$LEDGER_BUILD"

      - name: Cleanup macOS release files
        if: always()
        shell: bash
        run: |
          if [ -n "${APP_STORE_CONNECT_PRIVATE_KEY_PATH:-}" ]; then
            rm -f "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          fi
          rm -f .env.github
          rm -f ios/Runner/GoogleService-Info.plist
          rm -f ios/Runner/GoogleService-Info-production.plist
          rm -rf "$RUNNER_TEMP/mobile-deployment" "$RUNNER_TEMP/mac-app-store"
          rm -f "$RUNNER_TEMP/mobile-deployment-macos.json"
          rm -f "$RUNNER_TEMP/mobile-deployment-macos-oidc.json"

      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: observe
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: mobile-macos
          environment: production
          job-status: ${{ job.status }}

  release-head-when-stale:
    permissions:
      actions: write
      contents: read
    name: Release the production head after a stale attempt
    needs:
      [
        allocate-app-version,
        publish-android-internal,
        publish-ios-testflight,
        publish-macos-app-store,
      ]
    # A failed-job rerun keeps its old allocation. When a store step refused
    # because a newer commit holds the ledger, one head release carries the work.
    if: always() && needs.allocate-app-version.outputs.superseded == 'false' && (needs.publish-android-internal.result == 'failure' || needs.publish-ios-testflight.result == 'failure' || needs.publish-macos-app-store.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/app-version

      - name: Check whether a newer commit holds the ledger
        id: stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/app-version/allocate.mjs --report-stale

      - name: Release the production head
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/tutur3u/platform/actions/workflows/mobile-deploy-stores.yaml/dispatches -f ref=production -f 'inputs[mode]=release' -f 'inputs[force]=true'

  record-mobile-store-tree:
    permissions:
      actions: read
      contents: read
    name: Record uploaded mobile tree
    needs:
      [
        mobile-store-publish-gate,
        publish-android-internal,
        publish-ios-testflight,
        publish-macos-app-store,
      ]
    # Only a tree every enabled store accepted counts as uploaded, so a store
    # that failed is retried by the next run instead of being skipped by the
    # gate. The Mac App Store counts only while it is enabled.
    if: always() && needs.mobile-store-publish-gate.outputs.publish == 'true' && needs.publish-ios-testflight.result == 'success' && needs.publish-android-internal.result == 'success' && (vars.MAC_APP_STORE_ENABLED != 'true' || needs.publish-macos-app-store.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Write the uploaded mobile tree
        env:
          TREE: ${{ needs.mobile-store-publish-gate.outputs.tree }}
        run: |
          set -euo pipefail
          test -n "$TREE"
          printf 'tree %s\n' "$TREE" > "$RUNNER_TEMP/mobile-store-uploaded-tree.txt"

      - name: Upload the mobile tree hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-store-uploaded-tree
          path: ${{ runner.temp }}/mobile-store-uploaded-tree.txt
          if-no-files-found: error
          retention-days: 90

  publish-beta-status:
    permissions:
      contents: write
    name: Report beta channel status
    needs: [allocate-app-version, publish-android-internal, publish-ios-testflight]
    if: always() && (needs.publish-ios-testflight.result == 'success' || needs.publish-android-internal.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.allocate-app-version.outputs.version }}
      APP_BUILD: ${{ needs.allocate-app-version.outputs.build }}
      APP_LABEL: ${{ needs.allocate-app-version.outputs.label }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/app-version

      # Public JSON the download page reads; each platform reports only the
      # build its own store verified.
      - name: Report the TestFlight beta
        if: needs.publish-ios-testflight.result == 'success'
        run: node scripts/app-version/beta-status.mjs ios testflight

      - name: Report the Google Play beta
        if: always() && needs.publish-android-internal.result == 'success'
        run: node scripts/app-version/beta-status.mjs android google-play-internal

  mobile-store-receipt:
    permissions:
      contents: read
      issues: write
    name: Write mobile store receipt and alerts
    needs:
      [
        check-ci,
        mobile-store-publish-gate,
        mobile-credentials-preflight,
        publish-android-internal,
        publish-ios-testflight,
      ]
    if: always() && github.ref == 'refs/heads/production' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && (contains(fromJSON('["failure","cancelled"]'), needs.check-ci.result) || contains(fromJSON('["failure","cancelled"]'), needs.mobile-store-publish-gate.result) || needs.mobile-store-publish-gate.outputs.publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/mobile-deployment

      - name: Write the mobile store receipt
        id: receipt
        env:
          MOBILE_BUILD_NAME: ${{ needs.mobile-credentials-preflight.outputs.build_name }}
          MOBILE_BUILD_NUMBER: ${{ needs.mobile-credentials-preflight.outputs.build_number }}
          GOOGLE_PLAY_BETA_TRACKS: ${{ vars.GOOGLE_PLAY_BETA_TRACKS || '' }}
          TESTFLIGHT_EXTERNAL_BETA_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_BETA_GROUPS || '' }}
          RESULT_CHECK: ${{ needs.check-ci.result }}
          RESULT_GATE: ${{ needs.mobile-store-publish-gate.result }}
          RESULT_PREFLIGHT: ${{ needs.mobile-credentials-preflight.result }}
          RESULT_ANDROID: ${{ needs.publish-android-internal.result }}
          RESULT_IOS: ${{ needs.publish-ios-testflight.result }}
        run: node scripts/mobile-deployment/store-receipt.mjs write "$RUNNER_TEMP/mobile-store-receipt.json"

      - name: Upload the mobile store receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-store-receipt
          path: ${{ runner.temp }}/mobile-store-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Sync the mobile-store-alert issue
        # Alert even when artifact storage fails after the receipt was written.
        if: always() && steps.receipt.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mobile-deployment/store-receipt.mjs alert "$RUNNER_TEMP/mobile-store-receipt.json"

  retry-ios-testflight-review:
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
    name: Retry latest eligible TestFlight review
    needs: [check-ci]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'retry_ios_review' && github.ref == 'refs/heads/production' && needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: mobile-store-beta
    timeout-minutes: 15
    outputs:
      ledger_stale: ${{ steps.retry.outputs.ledger_stale }}
    steps:
      - name: Checkout production code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch iOS deployment credentials
        shell: bash
        env:
          MOBILE_DEPLOYMENT_CI_TOKEN: ${{ secrets.MOBILE_DEPLOYMENT_CI_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${MOBILE_DEPLOYMENT_CI_TOKEN:-}"
          bundle_path="$RUNNER_TEMP/mobile-review-bundle.json"
          oidc_response="$RUNNER_TEMP/mobile-review-oidc.json"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tuturuuu-mobile-deployment"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" -o "$oidc_response"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).value)' "$oidc_response")"
          curl -fsSL \
            -H "Authorization: Bearer ${MOBILE_DEPLOYMENT_CI_TOKEN}" \
            -H "X-GitHub-OIDC-Token: ${oidc_token}" \
            "https://infrastructure.tuturuuu.com/api/v1/mobile-deployment/bundle?environment=production&platform=ios" \
            -o "$bundle_path"
          node scripts/mobile-deployment/hydrate-bundle.mjs \
            --platform ios --bundle "$bundle_path" \
            --mobile-root "$RUNNER_TEMP/mobile-review"

      - name: Retry newest eligible build
        id: retry
        env:
          TESTFLIGHT_BETA_ENABLED: ${{ vars.TESTFLIGHT_BETA_ENABLED || 'true' }}
          TESTFLIGHT_EXTERNAL_BETA_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_BETA_GROUPS || '' }}
          TESTFLIGHT_BETA_GROUPS: ${{ vars.TESTFLIGHT_BETA_GROUPS || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER_RECHECK: "true"
        run: node scripts/mobile-deployment/verify-store.mjs ios-pending

      - name: Cleanup iOS release files
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mobile-deployment" "$RUNNER_TEMP/mobile-review"
          rm -f "$RUNNER_TEMP/mobile-review-bundle.json" "$RUNNER_TEMP/mobile-review-oidc.json"

  release-head-after-stale-retry:
    permissions:
      actions: write
      contents: read
    name: Release the production head after a stale review retry
    needs: [retry-ios-testflight-review]
    # The pending build belongs to a commit a newer one superseded (for example
    # a desktop-only change that never ran this workflow). One head release
    # uploads a newer iOS build carrying its changes.
    if: always() && needs.retry-ios-testflight-review.outputs.ledger_stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release the production head unless a store run is pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The review queue retries every few minutes. Dispatch only when no
          # run that can publish a replacement (a production push, or a release
          # dispatch) is queued or running; queued review retries never count.
          pending=0
          for status in queued in_progress waiting pending requested; do
            count="$(gh api "repos/tutur3u/platform/actions/workflows/mobile-deploy-stores.yaml/runs?status=${status}&branch=production&per_page=100" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.event == \"push\" or (.event == \"workflow_dispatch\" and (.display_title | endswith(\"(release)\"))))] | length")"
            pending=$((pending + count))
          done
          if [ "$pending" -gt 0 ]; then
            echo "A mobile store run is already pending; it will carry the changes."
            exit 0
          fi
          gh api -X POST repos/tutur3u/platform/actions/workflows/mobile-deploy-stores.yaml/dispatches -f ref=production -f 'inputs[mode]=release' -f 'inputs[force]=true'
