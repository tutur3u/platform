name: Publish accepted wave-1 native artifact
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      profile:
        type: string
        required: true
    secrets:
      CLOUDFLARE_STAGING_API_TOKEN:
        required: false
      WAVE1_CONTROL_READ_TOKEN:
        required: false
      STAGING_SUPABASE_URL:
        required: false
      STAGING_SUPABASE_PUBLISHABLE_KEY:
        required: false
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: wave1-native-publish-${{ inputs.app }}-${{ inputs.profile }}
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: inputs.profile == 'staging' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wave1-${{ inputs.app }}-staging
    env:
      APP: ${{ inputs.app }}
      PROFILE: ${{ inputs.profile }}
      SOURCE_SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wave1-${{ inputs.app }}-${{ inputs.profile }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-publish
      - name: Restore and verify the exact qualified artifact
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/ci/wave1-native-archive.py restore "apps/$APP" "$RUNNER_TEMP/native-publish/wave1-native.tar.gz"
          node scripts/ci/wave1-native-artifact.mjs verify "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Recheck restored workerd without provider credentials
        timeout-minutes: 3
        run: node scripts/ci/wave1-native-runtime.mjs "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Capture rollback and secret names then publish once behind fresh stop fence
        timeout-minutes: 5
        env:
          WAVE1_STAGING_ATTEMPT_D1_ID: ${{ vars.WAVE1_STAGING_ATTEMPT_D1_ID }}
          WAVE1_STAGING_PUBLICATION_ADMISSION: ${{ vars.WAVE1_STAGING_PUBLICATION_ADMISSION }}
          WAVE1_STAGING_PUBLISH_ENABLED: ${{ vars.WAVE1_STAGING_PUBLISH_ENABLED }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ vars.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          WAVE1_CONTROL_READ_TOKEN: ${{ secrets.WAVE1_CONTROL_READ_TOKEN }}
          STAGING_TUTUR3U_ZONE_ID: ${{ vars.STAGING_TUTUR3U_ZONE_ID }}
          STAGING_ACCESS_APP_IDS: ${{ vars.STAGING_ACCESS_APP_IDS }}
          STAGING_ACCESS_STAFF_GROUP_ID: ${{ vars.STAGING_ACCESS_STAFF_GROUP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/ci/wave1-native-publish.mjs publish "$APP" "$PROFILE" "$SOURCE_SHA"
      - name: Retain sanitized rollback and deployment identity even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wave1-${{ inputs.app }}-${{ inputs.profile }}-publication-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ inputs.app }}-${{ inputs.profile }}-publication.json
          retention-days: 30
          if-no-files-found: warn
      - name: Record deployment marker only after provider identity and private-serving acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: ${{ inputs.app }}-cloudflare.yaml
          DEPLOYMENT_MARKER_ENVIRONMENT: wave1-${{ inputs.app }}-${{ inputs.profile }}
        run: node scripts/ci/record-deployment-marker.ts
