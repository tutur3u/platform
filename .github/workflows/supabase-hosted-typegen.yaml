name: Disposable full-schema types (review candidate)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supabase-hosted-typegen
  cancel-in-progress: false
jobs:
  typegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: synthetic-ci-only
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: synthetic-ci-only
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: synthetic-ci-only
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: synthetic-ci-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Switchboard admission
        id: admission
        env:
          WORKFLOW_NAME: supabase-hosted-typegen.yaml
        run: node --experimental-strip-types scripts/ci/check-workflow-config.ts --event-name workflow_dispatch
      - uses: oven-sh/setup-bun@v2
        if: steps.admission.outputs.should_run == 'true'
        with:
          bun-version: 1.4.1
      - uses: ./.github/actions/setup-supabase-cli-with-retry
        if: steps.admission.outputs.should_run == 'true'
      - name: Bound disposable Docker resources
        if: steps.admission.outputs.should_run == 'true'
        run: |
          test "$(docker info --format '{{.CgroupDriver}}')" = systemd
          test -z "$(docker ps -aq)"
          test -z "$(docker volume ls -q)"
          printf 'SUPABASE_CLI_BINARY_OVERRIDE=%s\n' "$(command -v supabase)" >> "$GITHUB_ENV"
          if ! sudo bpftool version >/dev/null 2>&1; then
            sudo timeout 180 apt-get update -qq >/dev/null 2>&1
            sudo timeout 180 apt-get install -y -qq --no-install-recommends linux-tools-generic >/dev/null 2>&1
            sudo python3 - <<'PYBPF'
          import glob, os, shutil, stat
          candidates = sorted(glob.glob('/usr/lib/linux-tools/*/bpftool'))
          native = []
          for candidate in candidates:
              info = os.stat(candidate)
              if stat.S_ISREG(info.st_mode) and info.st_mode & 0o111:
                  with open(candidate, 'rb') as source:
                      if source.read(4) == b'\x7fELF':
                          native.append(candidate)
          if not native:
              raise SystemExit('Native kernel inspection tool unavailable.')
          shutil.copy2(native[-1], '/usr/local/bin/bpftool')
          PYBPF
          fi
          sudo bpftool version >/dev/null 2>&1
          sudo mkdir -p /etc/systemd/system/tuturuuu-typegen.slice.d
          printf '[Slice]\nCPUQuota=200%%\nMemoryMax=6G\nMemorySwapMax=0\nIPAddressDeny=any\nIPAddressAllow=localhost 172.28.0.0/16\n' | sudo tee /etc/systemd/system/tuturuuu-typegen.slice.d/limits.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start tuturuuu-typegen.slice
          sudo systemd-run --unit=tuturuuu-typegen-admission --slice=tuturuuu-typegen.slice --property=Type=exec /bin/sleep infinity >/dev/null 2>&1
          test -d /sys/fs/cgroup/tuturuuu.slice/tuturuuu-typegen.slice
          sudo bpftool -j cgroup show /sys/fs/cgroup/tuturuuu.slice/tuturuuu-typegen.slice/tuturuuu-typegen-admission.service effective | python3 -c '
          import json, sys
          programs = json.load(sys.stdin)
          if not isinstance(programs, list):
              raise SystemExit("Kernel filter inventory must be an array.")
          types = {program.get("attach_type") for program in programs}
          if not ({"ingress", "cgroup_inet_ingress"} & types and {"egress", "cgroup_inet_egress"} & types):
              raise SystemExit("Kernel ingress or egress admission filter missing.")
          '
          sudo python3 - <<'PYCONFIG'
          import json
          from pathlib import Path
          p = Path('/etc/docker/daemon.json')
          config = json.loads(p.read_text()) if p.exists() else {}
          config.update({'cgroup-parent': 'tuturuuu-typegen.slice', 'default-address-pools': [{'base': '172.28.0.0/16', 'size': 24}], 'dns': ['127.0.0.1'], 'ipv6': False, 'log-driver': 'json-file', 'log-opts': {'max-size': '20m', 'max-file': '1'}})
          p.write_text(json.dumps(config))
          PYCONFIG
          sudo systemctl restart docker
          for firewall in iptables ip6tables; do
            command -v "$firewall"
            if ! sudo "$firewall" -S DOCKER-USER >/dev/null 2>&1; then
              sudo "$firewall" -N DOCKER-USER
            fi
            sudo "$firewall" -N TTR-TYPEGEN-EGRESS
            sudo "$firewall" -A TTR-TYPEGEN-EGRESS -i br+ -o br+ -m physdev --physdev-is-bridged -j RETURN
            sudo "$firewall" -A TTR-TYPEGEN-EGRESS -i br+ -j DROP
            sudo "$firewall" -A TTR-TYPEGEN-EGRESS -i docker0 -o docker0 -j RETURN
            sudo "$firewall" -A TTR-TYPEGEN-EGRESS -i docker0 -j DROP
            sudo "$firewall" -A TTR-TYPEGEN-EGRESS -j RETURN
            sudo "$firewall" -I DOCKER-USER 1 -j TTR-TYPEGEN-EGRESS
            sudo "$firewall" -I FORWARD 1 -j TTR-TYPEGEN-EGRESS
          done
          test "$(docker info --format '{{.CgroupDriver}}')" = systemd
          test "$(systemctl show tuturuuu-typegen.slice -p MemoryMax --value)" = 6442450944
          test "$(systemctl show tuturuuu-typegen.slice -p MemorySwapMax --value)" = 0
          test "$(systemctl show tuturuuu-typegen.slice -p CPUQuotaPerSecUSec --value)" = 2s
          printf 'SUPABASE_CLI_BINARY_OVERRIDE=%s\n' "$(command -v supabase)" >> "$GITHUB_ENV"
      - name: Stage unique disposable project
        id: prepare
        if: steps.admission.outputs.should_run == 'true'
        run: node apps/database/tests/programming-hosted-typegen-review/proposal.mjs prepare
      - name: Full migrations, SQL suite, and type generation
        id: lifecycle
        if: steps.prepare.outcome == 'success'
        run: node apps/database/tests/programming-hosted-typegen-review/proposal.mjs run
      - name: Unconditional scoped cleanup
        id: cleanup
        if: always() && steps.admission.outputs.should_run == 'true'
        timeout-minutes: 4
        run: node apps/database/tests/programming-hosted-typegen-review/proposal.mjs cleanup
      - name: Validate generated types and retain runner-local proof only
        if: success() && steps.lifecycle.outcome == 'success' && steps.cleanup.outcome == 'success'
        run: node apps/database/tests/programming-hosted-typegen-review/proposal.mjs validate
      - name: Commit generated schema declarations to the exact backend candidate
        if: success() && steps.lifecycle.outcome == 'success' && steps.cleanup.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const expectedHead = '62f1180ad88bf6a582ec32ccc8271fe301b4919d';
            const branch = 'feat/learn-programming-persistence';
            const migration = fs.readFileSync('apps/database/supabase/migrations/20261001140000_learn_programming_problem_catalog.sql');
            if (crypto.createHash('sha256').update(migration).digest('hex') !== '2895cf4d9e5d6cae17690c31eb4eecae02800de21730b3bdf6b8a67fc306e96f') throw new Error('Migration identity mismatch');
            const repo = context.repo;
            const ref = await github.rest.git.getRef({...repo, ref: `heads/${branch}`});
            if (ref.data.object.sha !== expectedHead) throw new Error('Backend candidate advanced; refusing source write');
            const commit = await github.rest.git.getCommit({...repo, commit_sha: expectedHead});
            const sourceCommit = await github.rest.git.getCommit({...repo, commit_sha: context.sha});
            const targetTree = await github.rest.git.getTree({...repo, tree_sha: commit.data.tree.sha, recursive: 'true'});
            const sourceTree = await github.rest.git.getTree({...repo, tree_sha: sourceCommit.data.tree.sha, recursive: 'true'});
            if (targetTree.data.truncated || sourceTree.data.truncated) throw new Error('Incomplete source identity inventory');
            for (const path of ['apps/database/supabase', 'apps/database/package.json']) {
              const target = targetTree.data.tree.find(entry => entry.path === path);
              const source = sourceTree.data.tree.find(entry => entry.path === path);
              if (!target?.sha || source?.sha !== target.sha || source.type !== target.type) throw new Error('Complete schema input or pinned CLI identity mismatch');
            }
            const content = fs.readFileSync('packages/types/src/supabase.ts', 'utf8');
            for (const marker of ['programming_problems:', 'programming_problem_cases:', 'public:', 'private:', 'storage:']) {
              if (!content.includes(marker)) throw new Error('Generated schema contract missing');
            }
            const blob = await github.rest.git.createBlob({...repo, content, encoding: 'utf-8'});
            const tree = await github.rest.git.createTree({...repo, base_tree: commit.data.tree.sha, tree: [{path: 'packages/types/src/supabase.ts', mode: '100644', type: 'blob', sha: blob.data.sha}]});
            if (tree.data.sha === commit.data.tree.sha) { core.info('Generated declarations already match backend source.'); return; }
            const next = await github.rest.git.createCommit({...repo, message: 'chore(database): regenerate Programming schema declarations', tree: tree.data.sha, parents: [expectedHead]});
            await github.rest.git.updateRef({...repo, ref: `heads/${branch}`, sha: next.data.sha, force: false});
            core.info('Committed only generated schema declarations to the verified backend branch.');
      - name: Stop the inert slice admission service
        if: always()
        run: |
          if test "$(systemctl show tuturuuu-typegen-admission.service -p LoadState --value)" != not-found; then
            sudo systemctl stop tuturuuu-typegen-admission.service
          fi
