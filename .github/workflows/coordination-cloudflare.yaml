name: Coordination Cloudflare
on:
  pull_request:
    paths:
      - 'apps/coordination/**'
      - 'packages/utils/src/coordination*'
      - 'bun.lock'
      - '.github/workflows/coordination-cloudflare.yaml'
      - 'tuturuuu.ci.ts'
  push:
    branches: [main, production]
    paths:
      - 'apps/coordination/**'
      - 'packages/utils/src/coordination*'
      - 'bun.lock'
      - '.github/workflows/coordination-cloudflare.yaml'
      - 'tuturuuu.ci.ts'
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: coordination-cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: coordination-cloudflare.yaml
  validate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x --no-install wrangler types --env-interface CoordinationEnv apps/coordination/worker-configuration.d.ts -c apps/coordination/wrangler.jsonc
      - run: bun x --no-install tsc --project apps/coordination/tsconfig.json
      - run: node --test apps/coordination/src/worker.test.mjs
      - run: bun x --no-install wrangler deploy --dry-run -c apps/coordination/wrangler.jsonc
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: coordination-production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
      CLOUDFLARE_API_TOKEN: ${{ secrets.COORDINATION_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Require pre-provisioned server credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          bun x --no-install wrangler secret list -c apps/coordination/wrangler.jsonc > "$RUNNER_TEMP/coordination-secrets.json"
          jq -e 'any(.[]; .name == "COORDINATION_TOKEN")' "$RUNNER_TEMP/coordination-secrets.json" > /dev/null
      - run: bun x --no-install wrangler deploy -c apps/coordination/wrangler.jsonc --message "$GITHUB_SHA"
