name: Coordination Cloudflare
on:
  pull_request:
    paths:
      - 'apps/coordination/**'
      - 'packages/utils/src/coordination*'
      - 'bun.lock'
      - '.github/workflows/coordination-cloudflare.yaml'
      - 'tuturuuu.ci.ts'
  push:
    branches: [main]
    paths:
      - 'apps/coordination/**'
      - 'packages/utils/src/coordination*'
      - 'bun.lock'
      - '.github/workflows/coordination-cloudflare.yaml'
      - 'tuturuuu.ci.ts'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  deployments: read
concurrency:
  group: coordination-cloudflare-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: coordination-cloudflare.yaml
  validate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x --no-install wrangler types --env-interface CoordinationEnv apps/coordination/worker-configuration.d.ts -c apps/coordination/wrangler.jsonc
      - run: bun x --no-install tsc --project apps/coordination/tsconfig.json
      - run: node --test apps/coordination/src/request-body.test.mjs
      - run: node --test apps/coordination/src/worker.test.mjs
      - run: bun run lint
        working-directory: apps/coordination
      - name: Build the Worker with scoped Turbo caching
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/coordination --concurrency=1
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify the built Worker and Durable Object
        run: node --test apps/coordination/src/worker.test.mjs
        env:
          COORDINATION_TEST_CONFIG: ${{ github.workspace }}/apps/coordination/dist/worker/wrangler.json
      - run: bun x --no-install wrangler deploy --dry-run -c apps/coordination/dist/worker/wrangler.json
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/production'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: coordination-production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Require pre-provisioned server credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COORDINATION_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          bun x --no-install wrangler secret list -c apps/coordination/wrangler.jsonc > "$RUNNER_TEMP/coordination-secrets.json"
          jq -e 'any(.[]; .name == "COORDINATION_TOKEN")' "$RUNNER_TEMP/coordination-secrets.json" > /dev/null
      - name: Build the Worker with scoped Turbo caching
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/coordination --concurrency=1
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - run: bun x --no-install wrangler deploy -c apps/coordination/dist/worker/wrangler.json --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COORDINATION_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN }}
      - name: Record successful Cloudflare deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: coordination-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
