name: SSO persistence database contract
on:
  pull_request:
    paths:
      - 'apps/database/supabase/migrations/**'
      - 'apps/database/supabase/tests/sso-persistence.sql'
      - 'apps/database/scripts/*sso*persistence*.mjs'
      - 'apps/database/scripts/run-supabase*.js'
      - .github/actions/login-supabase-registry/**
      - 'apps/database/scripts/programming-database-tap.mjs'
      - 'apps/database/scripts/time-tracker-control-concurrency.mjs'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/sso-persistence-contract.yaml'
  push:
    branches: [main, production]
    paths:
      - 'apps/database/supabase/migrations/**'
      - 'apps/database/supabase/tests/sso-persistence.sql'
      - 'apps/database/scripts/*sso*persistence*.mjs'
      - 'apps/database/scripts/run-supabase*.js'
      - .github/actions/login-supabase-registry/**
      - 'apps/database/scripts/programming-database-tap.mjs'
      - 'apps/database/scripts/time-tracker-control-concurrency.mjs'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/sso-persistence-contract.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && format('{0}-{1}', github.sha, github.run_id) || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}
jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: sso-persistence-contract.yaml
  contract:
    needs: check-ci
    if: always() && needs.check-ci.result == 'success'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Require enabled contract gate
        env:
          CONTRACT_ENABLED: ${{ needs.check-ci.outputs.should_run }}
        run: test "$CONTRACT_ENABLED" = true
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/login-supabase-registry
        with:
          username: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Apply full schema, qualify isolation and replay, generate applied types
        run: node apps/database/scripts/verify-sso-persistence.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: sso-applied-schema-types-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/types/src/supabase.ts
          if-no-files-found: error
          retention-days: 3
