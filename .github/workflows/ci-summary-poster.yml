name: CI summary poster

# Posts one "CI summary" check run on a pull request head. The workflow token
# is contents: read only. The tuturuuu-ci-admission App posts the check.
# The workflow reads vars.CI_ADMISSION_APP_ID and
# secrets.CI_ADMISSION_APP_PRIVATE_KEY. When both are absent the poster job
# skips with an "App not configured" notice and posts nothing. A partial or
# malformed configuration still fails closed. The poster script refuses an
# installation token that lacks Checks write permission.
#
# pull_request_target and schedule both run this file from the default branch.
# The job checks out that branch and does not check out or execute pull request
# code. schedule is the refresh: a trusted workflow_run gate rejects pull
# request completions, and this file does not add a workflow_run trigger.
# GitHub may delay or drop a schedule. The minutes sit off the hour.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - edited
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}', github.event.pull_request.number && format('ci-summary-{0}', github.event.pull_request.number) || 'ci-summary-refresh') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configuration:
    name: CI summary configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Detect the CI summary app
        id: detect
        env:
          CI_SUMMARY_APP_ID: ${{ vars.CI_ADMISSION_APP_ID }}
          CI_SUMMARY_APP_PRIVATE_KEY: ${{ secrets.CI_ADMISSION_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${CI_SUMMARY_APP_ID}" ] && [ -z "${CI_SUMMARY_APP_PRIVATE_KEY}" ]; then
            echo "App not configured. The CI summary poster is skipped until vars.CI_ADMISSION_APP_ID and secrets.CI_ADMISSION_APP_PRIVATE_KEY exist."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  summary:
    name: CI summary (poster)
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out default-branch workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/**
            .github/actions/setup-bun-with-retry/**
            scripts/ci/ci-summary.js
            scripts/ci/setup-bun-with-backoff.sh
          sparse-checkout-cone-mode: false

      - name: Install Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          cache-enabled: "false"

      - name: Post the CI summary
        env:
          CI_SUMMARY_APP_ID: ${{ vars.CI_ADMISSION_APP_ID }}
          CI_SUMMARY_APP_PRIVATE_KEY: ${{ secrets.CI_ADMISSION_APP_PRIVATE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN
          bun scripts/ci/ci-summary.js
