# Generated by the start-bridge codemod for tools; re-run it instead of editing.
name: Tools Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'apps/tools/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/turnstile/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/tools-native-artifact.py',
        '.github/workflows/tools-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/tools/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/turnstile/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/vercel/**',
        'scripts/ci/tools-native-artifact.py',
        '.github/workflows/tools-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: tools-cloudflare.yaml
  # Qualification only: no staging or production publisher.
  native:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: tools
      package: '@tuturuuu/tools'
      artifact-script: scripts/ci/tools-native-artifact.py
      env-interface: ToolsGeneratedEnv
      worker-environment-type: ToolsEnvironment
      # No app test script: run the app's Vitest suite if it has one.
      unit-command: bun x --no-install vitest run --passWithNoTests
      # Public staging values from repository variables for same-repository
      # events; fork pull requests (and unset variables) build with fixtures.
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_URL || 'https://tools-ci.supabase.invalid' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tools_ci_placeholder' }}
        NEXT_PUBLIC_APP_URL=https://tools.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/tools/src/start-bridge apps/tools/src/routes apps/tools/src/router.tsx apps/tools/src/start.ts apps/tools/cloudflare apps/tools/vite.config.mts apps/tools/void.config.ts apps/tools/tsconfig.json apps/tools/package.json apps/tools/start-bridge.routes.json
