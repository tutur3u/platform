name: Mobile Build iOS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-ios.yaml"
      - "scripts/mobile-deployment/*firebase*"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-ios.yaml"
      - "scripts/mobile-deployment/*firebase*"

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-ios.yaml

  build-ios:
    name: Build iOS (Development, simulator)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
          pub-cache: true

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Cache iOS dependencies
        uses: actions/cache@v6
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare development Firebase configuration
        run: |
          python3 ../../scripts/mobile-deployment/test_firebase_service_config.py
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform ios

      - name: Build iOS (development flavor, simulator)
        run: flutter build ios --flavor development --target lib/main_development.dart --simulator

      - name: Archive iOS app bundle
        run: |
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform ios --app build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/ios-dev-app.zip"

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-dev-app
          path: ${{ runner.temp }}/ios-dev-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
