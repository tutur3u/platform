name: Mobile Build iOS

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-ios.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/mobile-deployment/*firebase*"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-ios.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/mobile-deployment/*firebase*"

permissions:
  contents: read

jobs:
  check-ci:
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-ios.yaml

  build-ios:
    name: Build iOS (Development, simulator)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Cache iOS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-ios-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare development Firebase configuration
        run: |
          python3 ../../scripts/mobile-deployment/test_firebase_service_config.py
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform ios

      - name: Build iOS (development flavor, simulator)
        run: flutter build ios --flavor development --target lib/main_development.dart --simulator

      - name: Archive iOS app bundle
        run: |
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform ios --app build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/ios-dev-app.zip"

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-dev-app
          path: ${{ runner.temp }}/ios-dev-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
