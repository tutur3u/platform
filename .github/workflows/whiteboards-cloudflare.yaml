# Generated by the start-bridge codemod for whiteboards; re-run it instead of editing.
name: Whiteboards Cloudflare Source
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      [
        'apps/whiteboards/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/offline/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/tasks-api/**',
        'packages/tasks-ui/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/whiteboard/**',
        'scripts/ci/whiteboards-native-artifact.py',
        'scripts/ci/whiteboards-native-artifact.test.py',
        '.github/workflows/whiteboards-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/whiteboards/**',
        'packages/ai/**',
        'packages/apis/**',
        'packages/auth/**',
        'packages/cloudflare/**',
        'packages/google/**',
        'packages/hooks/**',
        'packages/icons/**',
        'packages/internal-api/**',
        'packages/offline/**',
        'packages/payment/**',
        'packages/payment-core/**',
        'packages/realtime/**',
        'packages/satellite/**',
        'packages/start-bridge/**',
        'packages/storage-core/**',
        'packages/supabase/**',
        'packages/tasks-api/**',
        'packages/tasks-ui/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/utils/**',
        'packages/whiteboard/**',
        'scripts/ci/whiteboards-native-artifact.py',
        'scripts/ci/whiteboards-native-artifact.test.py',
        '.github/workflows/whiteboards-cloudflare.yaml',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/apps-native-runtime-pointer.mjs',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'scripts/ci/production-publication-policy.ts',
        'scripts/start-bridge-codemod/runtime-outcome.mjs',
        'scripts/start-bridge-codemod/worker-config.mjs',
        'bun.lock',
        '.github/workflows/native-start-app.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'scripts/ci/check-workflow-config.ts',
        'scripts/ci/workflow-config-core.ts',
        'scripts/ci/workspace-dependency-closure.ts',
        'scripts/ci/resolve-changed-files-core.ts',
        'scripts/ci/resolve-changed-files.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: whiteboards-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when whiteboards is unaffected.
    # Non-PR events skip this job completely (0s, no runner allocated) so a
    # gate failure can never block a main or production deploy.
    if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: whiteboards
  check-ci:
    needs: affected-gate
    if: ${{ (!cancelled() && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      actions: read
      contents: read
      deployments: read
    with:
      workflow_name: whiteboards-cloudflare.yaml
  # Qualification only: no staging or production publisher.
  native:
    needs: [check-ci, affected-gate]
    if: ${{ (!cancelled() && needs.check-ci.result == 'success' && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true') && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/native-start-app.yaml
    permissions:
      contents: read
    with:
      app: whiteboards
      package: '@tuturuuu/whiteboards'
      artifact-script: scripts/ci/whiteboards-native-artifact.py
      env-interface: WhiteboardsGeneratedEnv
      worker-environment-type: WhiteboardsEnvironment
      helper-tests: python3 scripts/ci/whiteboards-native-artifact.test.py
      unit-command: bun run test && bun run type-check:cloudflare
      runtime-command: node --test --test-concurrency=1 cloudflare/*.runtime.mjs
      # Public staging values from repository variables for same-repository
      # events; fork pull requests (and unset variables) build with fixtures.
      public-env: |
        NEXT_PUBLIC_SUPABASE_URL=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_URL || 'https://whiteboards-ci.supabase.invalid' }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_whiteboards_ci_placeholder' }}
        NEXT_PUBLIC_APP_URL=https://whiteboards.tuturuuu.com
        NEXT_PUBLIC_WEB_APP_URL=https://tuturuuu.com
        TUTURUUU_NOINDEX=1
      format-paths: >-
        apps/whiteboards/cloudflare apps/whiteboards/src/routes apps/whiteboards/src/router.tsx apps/whiteboards/src/start.ts apps/whiteboards/vite.config.mts apps/whiteboards/void.config.ts apps/whiteboards/vitest.config.mts apps/whiteboards/tsconfig.json apps/whiteboards/tsconfig.cloudflare.json apps/whiteboards/package.json apps/whiteboards/start-bridge.routes.json apps/whiteboards/start-bridge.config.ts
  whiteboards-cutover-artifact:
    needs: [check-ci, affected-gate]
    if: ${{ (!cancelled() && needs.check-ci.result == 'success' && ((github.event_name != 'pull_request' && needs.affected-gate.result == 'skipped') || needs.affected-gate.outputs.run == 'true') && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WHITEBOARDS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_WHITEBOARDS_NATIVE_PROFILE: production
      TRUSTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRODUCTION_SUPABASE_URL || 'https://whiteboards-ci.supabase.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_whiteboards_ci_placeholder' }}
      NEXT_PUBLIC_APP_URL: https://whiteboards.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      WRANGLER_SEND_METRICS: 'false'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
      - name: Generate build metadata
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: production
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Build shared dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter="@tuturuuu/whiteboards^..." --concurrency=2
          token: ''
          team: ''
      - name: Build the Start Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/whiteboards && bun run build:cloudflare
          token: ''
          team: ''
      - name: Refuse server-only APIs in the client bundle
        run: node scripts/ci/client-bundle-guard.mjs apps/whiteboards/dist/client
      - name: Record emitted configuration receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/whiteboards "$SOURCE_SHA" "$RUNNER_TEMP/whiteboards-emitted-config.json"
      - name: Upload emitted configuration receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whiteboards-config-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/whiteboards-emitted-config.json
          if-no-files-found: error
          retention-days: 7
      - name: Package Worker, assets and emitted Wrangler config
        env:
          CI_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/ci/whiteboards-native-artifact.py config apps/whiteboards
          python3 scripts/ci/whiteboards-native-artifact.py seal apps/whiteboards --receipt "$RUNNER_TEMP/whiteboards-native-artifact.json"
          CI=true bun run --cwd apps/whiteboards test:runtime
          python3 scripts/ci/whiteboards-native-artifact.py pack apps/whiteboards --receipt "$RUNNER_TEMP/whiteboards-native-artifact.json" --archive "$RUNNER_TEMP/whiteboards-production-artifact.tar.gz"
          test -f apps/whiteboards/dist/server/index.mjs
          test -d apps/whiteboards/dist/client
          test -f "$RUNNER_TEMP/whiteboards-production-artifact.tar.gz"
      - name: Restore and qualify the sealed production archive
        env:
          CI_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/whiteboards-restore" "$SOURCE_SHA"
          cd "$RUNNER_TEMP/whiteboards-restore"
          bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile --ignore-scripts
          python3 scripts/ci/whiteboards-native-artifact.py restore apps/whiteboards --archive "$RUNNER_TEMP/whiteboards-production-artifact.tar.gz" --receipt "$RUNNER_TEMP/whiteboards-restored-artifact.json"
          CI=true bun run --cwd apps/whiteboards test:runtime
          python3 scripts/ci/whiteboards-native-artifact.py verify apps/whiteboards --receipt "$RUNNER_TEMP/whiteboards-restored-artifact.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whiteboards-cutover-${{ env.TRUSTED == 'true' && 'production' || 'fixture' }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/whiteboards-production-artifact.tar.gz
          retention-days: 14
          if-no-files-found: error
