name: Whiteboards Worker Secrets

# Dispatch-only operator job. It sets the Worker secrets of
# `tuturuuu-whiteboards` from the GitHub secrets of its protected environment,
# by name, and reads the names back. No agent or person handles a value: it
# exists only in the step's memory and in the Worker's secret store, is masked
# by GitHub, and is never an argument, output, file, artifact or log line.
#
# Run it after the first route-free upload of the sealed Worker (a new Worker
# cannot take secrets before it exists; until then it answers 503) and before
# the hostname is attached. Re-running writes the same sources again.
#
# Environment `wave1-whiteboards-production` (main only) supplies, by name:
#   WAVE1_PRODUCTION_CLOUDFLARE_API_TOKEN (Workers Scripts write) and, inherited
#   from the repository, PRODUCTION_SUPABASE_URL,
#   PRODUCTION_SUPABASE_PUBLISHABLE_KEY and PRODUCTION_SUPABASE_SECRET_KEY
#   (required). TUTURUUU_APP_COORDINATION_SECRET and
#   APP_COORDINATION_TOKEN_SECRET are optional: the signer chain falls back to
#   SUPABASE_SECRET_KEY (app-coordination-secret-rollout).
# `node scripts/ci/whiteboards-worker-secrets.mjs plan` prints the mapping.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteboards-worker-secrets
  cancel-in-progress: false

jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: wave1-whiteboards-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Write the Worker secrets and read the names back
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          # Optional: shared by every app, so a run without them still writes
          # the three required bindings and says which are not set.
          TUTURUUU_APP_COORDINATION_SECRET: ${{ secrets.TUTURUUU_APP_COORDINATION_SECRET }}
          APP_COORDINATION_TOKEN_SECRET: ${{ secrets.APP_COORDINATION_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WAVE1_PRODUCTION_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          node scripts/ci/whiteboards-worker-secrets.mjs write
