name: Cron Control Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'apps/cron-control/**'
      - '.github/workflows/cron-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'scripts/ci/cf-vite-worker.mjs'
      - 'scripts/ci/cf-worker-parity.mjs'
      - 'scripts/ci/fixtures/cf-worker-parity/cron-control.json'
      - 'apps/web/vercel.json'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  push:
    branches: [main]
    paths:
      - 'apps/cron-control/**'
      - '.github/workflows/cron-control-cloudflare.yaml'
      - 'scripts/ci/cf-worker-settings.mjs'
      - 'scripts/ci/cf-vite-worker.mjs'
      - 'scripts/ci/cf-worker-parity.mjs'
      - 'scripts/ci/fixtures/cf-worker-parity/cron-control.json'
      - 'apps/web/vercel.json'
      - 'bun.lock'
      - 'package.json'
      - 'tuturuuu.ts'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  deployments: read
# Validation runs supersede per PR or branch; production and manual runs stay
# unique. The literal prefix keeps workflow_call runs from one planner apart.
# Only the deploy job serializes production with a non-cancelling queue.
concurrency:
  group: cron-control-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  affected-gate:
    # Pull requests only: skip the heavy jobs when cron-control is unaffected.
    # Other events never check out or run the gate: they resolve to run=true, so a
    # gate failure can never block a production deploy. Any error also resolves to run=true.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /scripts/ci/ci-plan.mjs
            /scripts/ci/ci-plan-catalog.json
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: cron-control
  check-ci:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: cron-control-cloudflare.yaml
  validate:
    needs: [check-ci, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (needs.check-ci.outputs.should_run == 'true')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check Cron Control types
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run type-check --filter=@tuturuuu/cron-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - run: bun run lint
        working-directory: apps/cron-control
      - name: Test Cron Control
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run test --filter=@tuturuuu/cron-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify source Worker HTTP boundaries
        run: node --test apps/cron-control/scripts/verify-worker-runtime.mjs
      - name: Build the Vite-native Worker
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/cron-control --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Compare emitted Build Output with the recorded deployment identity
        run: node scripts/ci/cf-worker-parity.mjs apps/cron-control scripts/ci/fixtures/cf-worker-parity/cron-control.json
      - name: Verify emitted Worker HTTP boundaries
        env:
          CRON_TEST_BUILD_OUTPUT: '1'
        run: node --test apps/cron-control/scripts/verify-worker-runtime.mjs
      - name: Check the prebuilt artifact without credentials
        run: bun x --no-install cf deploy --prebuilt --mode production --dry-run --no-provision
        working-directory: apps/cron-control
        env:
          CF_SEND_TELEMETRY: 'false'
      # upload-artifact skips hidden paths, so stage the Build Output first.
      - name: Stage the cf Build Output artifact
        run: cp -R apps/cron-control/.cloudflare/output "$RUNNER_TEMP/cron-control-build-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cron-control-worker-${{ github.sha }}
          path: ${{ runner.temp }}/cron-control-build-output
          retention-days: 7
          if-no-files-found: error
  deploy:
    needs: validate
    if: (github.ref == 'refs/heads/production') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    environment: cron-control-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    concurrency:
      group: cron-control-cloudflare-production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Register with the deployment coordinator
        id: coordinator
        if: vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce'
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: begin
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: cron-control
          environment: production
      - uses: ./.github/actions/setup-bun-with-retry
        if: steps.coordinator.outputs.publish != 'false'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.coordinator.outputs.publish != 'false'
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        if: steps.coordinator.outputs.publish != 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.coordinator.outputs.publish != 'false'
        with:
          name: cron-control-worker-${{ github.sha }}
          path: apps/cron-control/.cloudflare/output
      - name: Recheck the downloaded artifact identity
        if: steps.coordinator.outputs.publish != 'false'
        run: node scripts/ci/cf-worker-parity.mjs apps/cron-control scripts/ci/fixtures/cf-worker-parity/cron-control.json "$CLOUDFLARE_ACCOUNT_ID"
      - name: Capture and verify settings before publication
        if: steps.coordinator.outputs.publish != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/cf-worker-settings.mjs before scripts/ci/fixtures/cf-worker-parity/cron-control.json "$RUNNER_TEMP/cron-control-settings-before.json"
      - name: Check the deployment coordinator lease
        id: coordinator-lease
        if: steps.coordinator.outputs.publish != 'false' && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: check
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: cron-control
          environment: production
      - name: Verify the prebuilt artifact is already serving
        id: already-serving
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          CRON_CONTROL_SERVING_PROOF: ${{ secrets.CRON_CONTROL_SERVING_PROOF }}
          CRON_COORDINATOR_PUBLISH: ${{ steps.coordinator.outputs.publish }}
          CRON_COORDINATOR_CHECK: ${{ steps.coordinator-lease.outcome }}
          CRON_COORDINATOR_MODE: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          CRON_COORDINATOR_DEPLOYMENT_ID: ${{ steps.coordinator.outputs.deployment-id }}
          DEPLOY_COORDINATOR_ORIGIN: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
        run: node apps/cron-control/scripts/verify-already-serving.mjs check apps/cron-control scripts/ci/fixtures/cf-worker-parity/cron-control.json "$RUNNER_TEMP/cron-control-settings-before.json"
      - name: Publish the exact artifact with its secrets
        id: strict-publish
        if: steps.coordinator.outputs.publish != 'false' && steps.already-serving.outputs.reuse == 'false'
        working-directory: apps/cron-control
        env:
          CF_SEND_TELEMETRY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          CRON_CONTROL_DELIVERY_TOKEN: ${{ secrets.CRON_CONTROL_DELIVERY_TOKEN }}
          CRON_CONTROL_OPERATOR_TOKEN: ${{ secrets.CRON_CONTROL_OPERATOR_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$CRON_CONTROL_DELIVERY_TOKEN" && test -n "$CRON_CONTROL_OPERATOR_TOKEN" || { echo 'Missing Cron Control credential'; exit 1; }
          secrets_file="$RUNNER_TEMP/cron-control-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'const fs = require("node:fs"); const names = ["SUPABASE_URL", "SUPABASE_SECRET_KEY", "CRON_CONTROL_DELIVERY_TOKEN", "CRON_CONTROL_OPERATOR_TOKEN"]; fs.writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))), { mode: 0o600 });' "$secrets_file"
          # --no-provision: a deploy must never create resources (cf defaults to provisioning).
          bun x --no-install cf deploy --prebuilt --mode production --no-provision --message "$GITHUB_SHA" --secrets-file "$secrets_file"
      - name: Capture and compare settings after publication
        if: steps.coordinator.outputs.publish != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          CRON_CONTROL_REUSED: ${{ steps.already-serving.outputs.reuse }}
          CRON_CONTROL_PUBLISH_OUTCOME: ${{ steps.strict-publish.outcome }}
        run: |
          case "$CRON_CONTROL_REUSED:$CRON_CONTROL_PUBLISH_OUTCOME" in
            true:skipped|false:success) ;;
            *) echo 'No verified Cron Control publication path completed'; exit 1 ;;
          esac
          node scripts/ci/cf-worker-settings.mjs after scripts/ci/fixtures/cf-worker-parity/cron-control.json "$RUNNER_TEMP/cron-control-settings-before.json" "$RUNNER_TEMP/cron-control-settings-after.json"
      - name: Retain settings and rollback evidence
        if: always() && steps.coordinator.outputs.publish != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cron-control-settings-${{ github.sha }}
          path: ${{ runner.temp }}/cron-control-settings-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Confirm the reused deployment is still serving
        if: steps.coordinator.outputs.publish != 'false' && steps.already-serving.outputs.reuse == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.COLAB_CLOUDFLARE_API_TOKEN }}
          CRON_CONTROL_SERVING_PROOF: ${{ secrets.CRON_CONTROL_SERVING_PROOF }}
          CRON_CONTROL_PROOF_DIGEST: ${{ steps.already-serving.outputs.proof-digest }}
          CRON_COORDINATOR_PUBLISH: ${{ steps.coordinator.outputs.publish }}
          CRON_COORDINATOR_CHECK: ${{ steps.coordinator-lease.outcome }}
          CRON_COORDINATOR_MODE: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          CRON_COORDINATOR_DEPLOYMENT_ID: ${{ steps.coordinator.outputs.deployment-id }}
          DEPLOY_COORDINATOR_ORIGIN: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
        run: node apps/cron-control/scripts/verify-already-serving.mjs confirm apps/cron-control scripts/ci/fixtures/cf-worker-parity/cron-control.json "$RUNNER_TEMP/cron-control-settings-before.json" "$RUNNER_TEMP/cron-control-settings-after.json"
      - name: Record successful Cloudflare deployment
        if: steps.coordinator.outputs.publish != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: cron-control-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
      - name: Report to the deployment coordinator
        if: always() && (vars.DEPLOY_COORDINATOR_MODE == 'observe' || vars.DEPLOY_COORDINATOR_MODE == 'enforce')
        uses: ./.github/actions/deploy-coordinator
        with:
          phase: finish
          mode: ${{ vars.DEPLOY_COORDINATOR_MODE }}
          origin: ${{ vars.DEPLOY_COORDINATOR_ORIGIN }}
          project: cron-control
          environment: production
          job-status: ${{ job.status }}
