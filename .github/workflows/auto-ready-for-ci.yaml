name: Admit ready pull requests to CI

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require CI admission App configuration
        env:
          CI_ADMISSION_APP_ID: ${{ vars.CI_ADMISSION_APP_ID }}
          CI_ADMISSION_APP_PRIVATE_KEY: ${{ secrets.CI_ADMISSION_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$CI_ADMISSION_APP_ID" ]; then
            echo '::error::CI_ADMISSION_APP_ID must identify the GitHub App installed on tutur3u/platform for CI admission.'
            exit 1
          fi
          if [ -z "$CI_ADMISSION_APP_PRIVATE_KEY" ]; then
            echo '::error::CI_ADMISSION_APP_PRIVATE_KEY must contain the CI admission GitHub App private key.'
            exit 1
          fi
      - name: Create CI admission App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_ADMISSION_APP_ID }}
          private-key: ${{ secrets.CI_ADMISSION_APP_PRIVATE_KEY }}
          owner: tutur3u
          repositories: platform
          permission-issues: write
          permission-pull-requests: write
      - name: Label an eligible current pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            if (!['opened', 'ready_for_review'].includes(context.payload.action)) return;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.draft !== false ||
                !pr.head.repo || pr.head.repo.id !== pr.base.repo.id ||
                pr.head.repo.full_name !== repository ||
                pr.base.repo.full_name !== repository) return;
            if (pr.labels.some(label => label.name === 'ready-for-ci')) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pr.number,
              labels: ['ready-for-ci'],
            });
