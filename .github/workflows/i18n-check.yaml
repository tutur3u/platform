name: i18n Check

on:
  push:
    branches:
      - main
      - production
  pull_request:
  workflow_dispatch:

concurrency:
  # PR merge refs are unique across forks and differ from manual branch runs.
  group: i18n-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' }}

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: i18n-check.yaml

  i18n-sort-check:
    name: Translation Sort Check
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_sorted: ${{ steps.sort-check.outputs.is_sorted }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Check if translations are sorted
        id: sort-check
        run: |
          set +e
          sort_output=$(node scripts/i18n-sort.js --check 2>&1)
          sort_exit_code=$?
          set -e

          # Print the output for visibility
          echo "$sort_output"

          if [ "$sort_exit_code" -ne 0 ]; then
            echo "is_sorted=false" >> $GITHUB_OUTPUT
          else
            echo "is_sorted=true" >> $GITHUB_OUTPUT
          fi

          exit $sort_exit_code

  i18n-translation-check:
    name: Translation Keys Check
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      issue_count: ${{ steps.i18n-check.outputs.issue_count }}
      has_issues: ${{ steps.i18n-check.outputs.has_issues }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Run i18n-check
        id: i18n-check
        run: |
          set +e
          i18n_output=$(bun i18n:check 2>&1)
          i18n_exit_code=$?
          set -e

          echo "exit_code=$i18n_exit_code" >> $GITHUB_OUTPUT

          # Save output to file for debugging
          echo "$i18n_output" > i18n_output.txt

          # Count issues from output
          if [ "$i18n_exit_code" -ne 0 ]; then
            # Extract issue count from the table output
            issue_count=$(echo "$i18n_output" | grep -c "│.*│.*│" || echo "0")
            # Subtract header rows
            issue_count=$((issue_count > 2 ? issue_count - 2 : 0))
            echo "issue_count=$issue_count" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "issue_count=0" >> $GITHUB_OUTPUT
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

          # Print the output for visibility
          echo "$i18n_output"

          # Fail the step if there are issues
          exit $i18n_exit_code

  i18n-key-parity-check:
    name: Key Parity Check (en ↔ vi)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_issues: ${{ steps.parity-check.outputs.has_issues }}
      missing_in_vi: ${{ steps.parity-check.outputs.missing_in_vi }}
      missing_in_en: ${{ steps.parity-check.outputs.missing_in_en }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run key parity check
        id: parity-check
        run: |
          set +e
          parity_output=$(node scripts/i18n-key-parity.js 2>&1)
          parity_exit_code=$?
          set -e

          echo "$parity_output"

          if [ "$parity_exit_code" -ne 0 ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
            # Extract counts from output
            missing_vi=$(echo "$parity_output" | grep -o '[0-9]* key(s) missing in vi.json' | grep -o '[0-9]*' | head -1 || echo "0")
            missing_en=$(echo "$parity_output" | grep -o '[0-9]* key(s) missing in en.json' | grep -o '[0-9]*' | head -1 || echo "0")
            echo "missing_in_vi=${missing_vi:-0}" >> $GITHUB_OUTPUT
            echo "missing_in_en=${missing_en:-0}" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "missing_in_vi=0" >> $GITHUB_OUTPUT
            echo "missing_in_en=0" >> $GITHUB_OUTPUT
          fi

          exit $parity_exit_code

  i18n-namespace-check:
    name: Namespace Check (shared → apps)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_issues: ${{ steps.namespace-check.outputs.has_issues }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run namespace check
        id: namespace-check
        run: |
          set +e
          namespace_output=$(node scripts/i18n-namespace-check.js 2>&1)
          namespace_exit_code=$?
          set -e

          echo "$namespace_output"

          if [ "$namespace_exit_code" -ne 0 ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

          exit $namespace_exit_code

  comment:
    name: Comment on PR
    concurrency:
      group: i18n-report-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: [i18n-sort-check, i18n-translation-check, i18n-key-parity-check, i18n-namespace-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment on PR with i18n status
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;

            if (!prNumber) {
              console.log('No PR found to comment on');
              return;
            }

            const isSorted = '${{ needs.i18n-sort-check.outputs.is_sorted }}';
            const hasTranslationIssues = '${{ needs.i18n-translation-check.outputs.has_issues }}';
            const issueCount = '${{ needs.i18n-translation-check.outputs.issue_count }}';
            const hasParityIssues = '${{ needs.i18n-key-parity-check.outputs.has_issues }}';
            const missingInVi = '${{ needs.i18n-key-parity-check.outputs.missing_in_vi }}';
            const missingInEn = '${{ needs.i18n-key-parity-check.outputs.missing_in_en }}';
            const hasNamespaceIssues = '${{ needs.i18n-namespace-check.outputs.has_issues }}';

            // Missing outputs never prove success or a translation defect.
            const status = (result, output, passingValue, passLabel, failLabel) => {
              if (result === 'success' && output === passingValue) return { kind: 'pass', label: passLabel };
              if (result === 'failure' && output === (passingValue === 'true' ? 'false' : 'true')) return { kind: 'fail', label: failLabel };
              return { kind: 'incomplete', label: `Incomplete (${result || 'unknown'})` };
            };
            const sorting = status('${{ needs.i18n-sort-check.result }}', isSorted, 'true', 'Sorted', 'Not sorted');
            const translation = status('${{ needs.i18n-translation-check.result }}', hasTranslationIssues, 'false', 'All in sync', 'Issues found');
            const parity = status('${{ needs.i18n-key-parity-check.result }}', hasParityIssues, 'false', 'Keys in sync', 'Keys mismatch');
            const namespace = status('${{ needs.i18n-namespace-check.result }}', hasNamespaceIssues, 'false', 'All present', 'Missing namespaces');
            const states = [sorting, translation, parity, namespace];
            const overallSuccess = states.every(state => state.kind === 'pass');
            const confirmedFailure = states.some(state => state.kind === 'fail');
            const timestamp = new Date().toISOString();
            const sortStatus = sorting.label;
            const translationStatus = translation.label;
            const parityStatus = parity.label;
            const namespaceStatus = namespace.label;
            const sourceHead = context.payload.pull_request.head.sha;
            const runId = BigInt(context.runId);
            const attempt = Number('${{ github.run_attempt }}');

            let parityDetails = '';
            if (parity.kind === 'fail') {
              const details = [];
              if (parseInt(missingInVi) > 0) details.push(`${missingInVi} missing in vi.json`);
              if (parseInt(missingInEn) > 0) details.push(`${missingInEn} missing in en.json`);
              parityDetails = details.length > 0 ? ` (${details.join(', ')})` : '';
            }

            let nextSteps = '';
            if (confirmedFailure) {
              nextSteps = '### 📋 Next Steps\n\n';
              if (sorting.kind === 'fail') {
                nextSteps += '**Sorting Issues:**\n```bash\nbun i18n:sort\n```\n\n';
              }
              if (translation.kind === 'fail') {
                nextSteps += '**Translation Issues:**\n```bash\nbun i18n:check\n```\n\n';
              }
              if (parity.kind === 'fail') {
                nextSteps += '**Key Parity Issues (en ↔ vi):**\n```bash\nbun i18n:key-parity\n```\n\n';
                nextSteps += '> 💡 Use `bun i18n:sync` to auto-sync missing keys.\n\n';
              }
              if (namespace.kind === 'fail') {
                nextSteps += '**Namespace Issues (shared → apps):**\n```bash\nbun i18n:namespace-check\n```\n\n';
                nextSteps += '> 💡 Add missing namespaces to each app\'s `messages/en.json` and `vi.json`, or add exceptions to `i18n-namespace-check.config.json`.\n';
              }
            }

            const body = `
            ## 🌐 i18n Check Report

            <div align="center">

            ${overallSuccess ? '### All i18n checks passed' : confirmedFailure ? '### Confirmed i18n issues found' : '### i18n validation incomplete'}

            </div>

            | Check | Status |
            |-------|--------|
            | 🔤 **Translation Sorting** | ${sortStatus} |
            | 🔑 **Translation Keys** | ${translationStatus} ${translation.kind === 'fail' ? `(${issueCount} issues)` : ''} |
            | 🔄 **Key Parity (en ↔ vi)** | ${parityStatus}${parityDetails} |
            | 📦 **Namespace Check (shared → apps)** | ${namespaceStatus} |

            ${states.some(state => state.kind === 'incomplete') ? 'Some checks did not complete. This report does not establish passing validation; inspect the linked run.' : ''}

            ${nextSteps}

            <div align="center">
            <sub>🤖 Auto-generated by <strong>i18n Check</strong> workflow • Source: \`${sourceHead}\` • [Run ${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) • Last updated: ${timestamp}</sub>
            </div>
            `;

            // Find existing i18n Check comment and update it, or create new one
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const existingComment = comments.find(comment =>
                comment.user.login === 'github-actions[bot]' &&
                comment.body.includes('<!-- i18n-check-comment -->')
              );

              const bodyWithMarker = `<!-- i18n-check-comment -->\n<!-- i18n-check-run:${runId}:${attempt} -->\n` + body;

              const { data: livePr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
              if (livePr.head.sha !== sourceHead || livePr.state !== 'open') {
                console.log('Ignoring stale or closed PR report');
                return;
              }
              const previous = existingComment?.body.match(/<!-- i18n-check-run:(\d+):(\d+) -->/);
              if (previous && (BigInt(previous[1]) > runId || (BigInt(previous[1]) === runId && Number(previous[2]) > attempt))) {
                console.log('Ignoring an older run report');
                return;
              }

              if (existingComment) {
                console.log(`Updating existing comment ${existingComment.id} on PR ${prNumber}`);
                await github.rest.issues.updateComment({
                  comment_id: existingComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: bodyWithMarker
                });
              } else {
                console.log(`Creating new comment on PR ${prNumber}`);
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: bodyWithMarker
                });
              }
            } catch (error) {
              console.log('Error managing PR comment:', error.message);
            }
