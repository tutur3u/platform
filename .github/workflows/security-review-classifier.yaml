name: Security Review Classification

# Marks pull requests that touch auth, RLS/database, tenant isolation, runners,
# CI, tokens/secrets or storage as security-review-required. pull_request_target
# runs this file and the classifier from the base/default branch with a write
# token, so it must never check out, install or execute pull request content:
# it reads the PR file list through the API only. Removing the label re-runs
# the classification and re-adds it. There is deliberately no path filter: the
# Security review check is reported for every pull request (success when no
# sensitive path changed) so it can be a required status check. Review
# submissions and dismissals are recomputed by security-review-reclassify.yaml.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
      - labeled
      - unlabeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

permissions:
  contents: read

jobs:
  classify:
    name: Classify security review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default-branch classifier only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/security-paths.js
            scripts/ci/security-review-classification.js
          sparse-checkout-cone-mode: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Classify, label and record the security review check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECURITY_REVIEWERS: ${{ vars.SECURITY_REVIEWERS }}
        run: node scripts/ci/security-review-classification.js
