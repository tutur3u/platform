name: Production Deployment Planner
on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional exact production SHA for guarded recovery"
        type: string
        default: ""
      package_resume:
        description: "Identify one automatic package-deferred recovery"
        type: string
        default: "false"
      resume_intent:
        description: "Durable dispatch reservation ID for automatic recovery"
        type: string
        default: ""

run-name: ${{ inputs.package_resume == 'true' && format('Production package resume {0} intent {1}', inputs.expected_sha, inputs.resume_intent) || 'Production Deployment Planner' }}

concurrency:
  group: production-deployment-planner-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: read
  deployments: write

jobs:
  plan:
    if: github.ref == 'refs/heads/production' && (inputs.expected_sha == '' || inputs.expected_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      workflows_json: ${{ steps.admission.outputs.superseded == 'true' && '[]' || steps.plan.outputs.workflows_json }}
    steps:
      - name: Admit queued production revision
        id: admission
        timeout-minutes: 2
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/production ]
          [ "${#GITHUB_SHA}" -eq 40 ]
          case "$GITHUB_SHA" in
            *[!0123456789abcdef]*) exit 1 ;;
          esac
          case "$GITHUB_EVENT_NAME" in
            push)
              comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/refs/heads/production...$GITHUB_SHA?per_page=1" --jq .status)
              case "$comparison" in
                identical) ;;
                behind)
                  echo 'superseded=true' >> "$GITHUB_OUTPUT"
                  echo "Skipped $GITHUB_SHA because a newer authorized revision reached production while this run waited." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                *)
                  echo '::error::Cannot establish that the queued revision is on the production branch.'
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch)
              if [ -n "$EXPECTED_SHA" ]; then
                [ "$EXPECTED_SHA" = "$GITHUB_SHA" ]
              fi
              ;;
            *) exit 1 ;;
          esac
          echo 'superseded=false' >> "$GITHUB_OUTPUT"

      - name: Check out code
        if: steps.admission.outputs.superseded == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        if: steps.admission.outputs.superseded == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Resolve affected production apps
        if: steps.admission.outputs.superseded == 'false'
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_PACKAGE_RESUME: ${{ inputs.package_resume }}
          PRODUCTION_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node --experimental-strip-types scripts/ci/resolve-production-vercel-targets.ts --package-resume "$PRODUCTION_PACKAGE_RESUME" --expected-sha "$PRODUCTION_EXPECTED_SHA" --step-summary "${GITHUB_STEP_SUMMARY}"

  deploy-colab-cloudflare:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.workflows_json), 'colab-cloudflare.yaml')
    uses: ./.github/workflows/colab-cloudflare.yaml
    # Its deploy job reports to the deployment coordinator with GitHub OIDC.
    permissions:
      contents: read
      deployments: write
      id-token: write
    secrets: inherit

