name: Desktop Beta Distribution

on:
  push:
    branches: [production]
    paths:
      - "apps/mobile/**"
      - "scripts/desktop-deployment/**"
      - "packages/utils/src/desktop-signing-profiles.ts"
      - ".github/workflows/desktop-beta.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "scripts/desktop-deployment/**"
      - ".github/workflows/desktop-beta.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build unsigned Windows artifacts only, without publishing"
        type: boolean
        default: true

concurrency:
  group: desktop-beta-${{ github.ref }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  deployments: read

jobs:
  check-ci:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: desktop-beta.yaml

  validate:
    name: Desktop distribution tests
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test scripts/desktop-deployment/*.test.mjs

  windows-dry-run:
    name: Windows x64 installer dry run
    needs: [check-ci, validate]
    if: (needs.check-ci.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable
      - name: Validate Windows smoke and updater scripts
        run: node --test scripts/desktop-deployment/installer-syntax.test.mjs scripts/desktop-deployment/windows-smoke.test.mjs
      - name: Write dry-run public configuration
        env:
          DESKTOP_PUBLIC_CONFIG: '{"NEXT_PUBLIC_SUPABASE_URL":"https://desktop-ci.supabase.co","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY":"sb_publishable_desktop_ci_placeholder","API_BASE_URL":"https://tuturuuu.com"}'
        run: node scripts/desktop-deployment/write-ci-config.mjs
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Windows dry run
        working-directory: apps/mobile
        run: flutter build windows --release --target lib/main_production.dart --dart-define=DESKTOP_RELEASE_RUN_ID=${{ github.run_id }} --dart-define-from-file="$env:RUNNER_TEMP/desktop-public.json"
      - name: Audit and package unsigned Windows dry run
        env:
          DESKTOP_PLATFORM: windows
        run: node scripts/desktop-deployment/package-ci.mjs
      - name: Verify Windows dry-run receipt
        env:
          DESKTOP_BETA_PLATFORMS: windows
        run: node scripts/desktop-deployment/verify-publication.mjs
      - name: Smoke installed Windows dry run
        run: pwsh -NoProfile -File scripts/desktop-deployment/smoke-windows.ps1
      - name: Upload Windows dry-run installer and checksum receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64-dry-run
          path: |
            ${{ runner.temp }}/desktop-artifacts/*
            ${{ runner.temp }}/windows-installed-files.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove dry-run public configuration
        if: always()
        run: Remove-Item "$env:RUNNER_TEMP/desktop-public.json" -Force -ErrorAction SilentlyContinue

  release-status:
    name: Desktop beta availability
    needs: check-ci
    if: (needs.check-ci.outputs.should_run == 'true' && github.ref == 'refs/heads/production' && !inputs.dry_run) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: platforms
        env:
          DESKTOP_BETA_PLATFORMS: ${{ vars.DESKTOP_BETA_PLATFORMS }}
        run: node scripts/desktop-deployment/platforms.mjs
      - id: status
        env:
          ENABLED: ${{ vars.DESKTOP_BETA_ENABLED == 'true' }}
        run: |
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" != true ]; then
            echo 'Desktop downloads are coming soon. Signing setup and platform verification are deferred; no desktop release was published.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Desktop beta (${{ matrix.platform }})
    needs: [check-ci, validate, release-status]
    if: (needs.release-status.outputs.enabled == 'true' && github.ref == 'refs/heads/production') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    environment: desktop-beta
    permissions:
      contents: read
      deployments: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-status.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate Windows smoke and updater scripts
        if: matrix.platform == 'windows'
        run: node --test scripts/desktop-deployment/installer-syntax.test.mjs scripts/desktop-deployment/windows-smoke.test.mjs
      - name: Require desktop signing configuration
        if: matrix.platform != 'windows'
        shell: bash
        env:
          SIGNING_READY: ${{ matrix.platform == 'linux' || (vars.DESKTOP_SIGNING_SOURCE == 'vault' && ((matrix.platform == 'windows' && secrets.DESKTOP_WINDOWS_VAULT_CI_TOKEN != '') || (matrix.platform == 'macos' && secrets.DESKTOP_MACOS_VAULT_CI_TOKEN != ''))) || (vars.DESKTOP_SIGNING_SOURCE != 'vault' && ((matrix.platform == 'windows' && secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_B64 != '' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '') || (matrix.platform == 'macos' && secrets.MACOS_CERTIFICATE_P12_B64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && vars.MACOS_SIGNING_IDENTITY != '' && vars.APPLE_TEAM_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_B64 != ''))) }}
        run: |
          if [ "$SIGNING_READY" != true ]; then
            echo "::error::Desktop signing credentials are not configured. Public beta publication is blocked."
            exit 1
          fi
      - uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable
      - name: Validate public build configuration
        shell: bash
        env:
          DESKTOP_PUBLIC_CONFIG: ${{ vars.DESKTOP_PUBLIC_CONFIG }}
        run: |
          node scripts/desktop-deployment/write-ci-config.mjs
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb dbus-x11 xdotool desktop-file-utils
      - name: Prepare macOS Firebase inputs
        if: matrix.platform == 'macos'
        run: node scripts/desktop-deployment/prepare-macos.mjs
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Windows beta
        if: matrix.platform == 'windows'
        working-directory: apps/mobile
        run: flutter build windows --release --target lib/main_production.dart --dart-define=DESKTOP_RELEASE_RUN_ID=${{ github.run_id }} --dart-define-from-file="$env:RUNNER_TEMP/desktop-public.json"
      - name: Select Windows signing mode
        id: windows-signing
        if: matrix.platform == 'windows'
        env:
          DESKTOP_SIGNING_SOURCE: ${{ vars.DESKTOP_SIGNING_SOURCE }}
          WINDOWS_PFX_PRESENT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_B64 != '' }}
          WINDOWS_PASSWORD_PRESENT: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '' }}
          WINDOWS_VAULT_PRESENT: ${{ secrets.DESKTOP_WINDOWS_VAULT_CI_TOKEN != '' }}
        run: node scripts/desktop-deployment/windows-signing.mjs
      - name: Build macOS beta
        if: matrix.platform == 'macos'
        working-directory: apps/mobile
        run: flutter build macos --release --flavor production --target lib/main_production.dart --dart-define=DESKTOP_RELEASE_RUN_ID=${{ github.run_id }} --dart-define-from-file="$RUNNER_TEMP/desktop-public.json"
      - name: Build Linux beta
        if: matrix.platform == 'linux'
        working-directory: apps/mobile
        run: flutter build linux --release --target lib/main_production.dart --dart-define=DESKTOP_RELEASE_RUN_ID=${{ github.run_id }} --dart-define-from-file="$RUNNER_TEMP/desktop-public.json"
      - name: Audit and package beta
        if: matrix.platform == 'linux'
        shell: bash
        env:
          DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: node scripts/desktop-deployment/package-ci.mjs
      - name: Validate installed Linux launch and URI activation
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/desktop-artifacts/Tuturuuu-linux-x64.deb"
          sudo update-desktop-database
          xvfb-run -a dbus-run-session -- node scripts/desktop-deployment/smoke-linux.mjs
      - name: Sign Windows beta with Infrastructure vault
        if: matrix.platform == 'windows' && vars.DESKTOP_SIGNING_SOURCE == 'vault' && steps.windows-signing.outputs.mode == 'vault'
        env:
          DESKTOP_PLATFORM: windows
          DESKTOP_SIGNING_SOURCE: vault
          DESKTOP_VAULT_CI_TOKEN: ${{ secrets.DESKTOP_WINDOWS_VAULT_CI_TOKEN }}
        run: node scripts/desktop-deployment/package-vault-ci.mjs
      - name: Sign macOS beta with Infrastructure vault
        if: matrix.platform == 'macos' && vars.DESKTOP_SIGNING_SOURCE == 'vault'
        env:
          DESKTOP_PLATFORM: macos
          DESKTOP_SIGNING_SOURCE: vault
          DESKTOP_VAULT_CI_TOKEN: ${{ secrets.DESKTOP_MACOS_VAULT_CI_TOKEN }}
        run: node scripts/desktop-deployment/package-vault-ci.mjs
      - name: Package Windows beta
        if: matrix.platform == 'windows' && vars.DESKTOP_SIGNING_SOURCE != 'vault'
        env:
          DESKTOP_PLATFORM: windows
          WINDOWS_SIGNING_CERTIFICATE_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_B64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: node scripts/desktop-deployment/package-ci.mjs
      - name: Sign and notarize macOS beta
        if: matrix.platform == 'macos' && vars.DESKTOP_SIGNING_SOURCE != 'vault'
        env:
          DESKTOP_PLATFORM: macos
          MACOS_CERTIFICATE_P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_B64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_B64 }}
        run: node scripts/desktop-deployment/package-ci.mjs
      - name: Smoke installed Windows beta
        if: matrix.platform == 'windows'
        run: pwsh -NoProfile -File scripts/desktop-deployment/smoke-windows.ps1
      - name: Upload isolated beta package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-beta-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload Windows installation inventory
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installation-inventory
          path: ${{ runner.temp }}/windows-installed-files.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove public build input
        if: always()
        shell: bash
        run: node -e 'require("node:fs").rmSync(require("node:path").join(process.env.RUNNER_TEMP,"desktop-public.json"),{force:true})'

  publish:
    name: Publish verified desktop beta
    needs: [build, release-status]
    env:
      DESKTOP_BETA_PLATFORMS: ${{ needs.release-status.outputs.platforms }}
    if: (always() && !cancelled() && needs.release-status.outputs.enabled == 'true' && github.ref == 'refs/heads/production' && (needs.build.result == 'success' || needs.build.result == 'failure')) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    environment: desktop-beta
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-beta-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop-artifacts
      - name: Select successful verified platforms
        run: node scripts/desktop-deployment/select-publication.mjs
      - name: Verify publication prerequisites
        run: node scripts/desktop-deployment/verify-publication.mjs
      - name: Attest beta packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/desktop-artifacts/*
      - name: Verify signed beta provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-deployment/verify-provenance.mjs
      - name: Publish immutable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop-deployment/publish.mjs
