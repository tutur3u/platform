name: Passwords Cloudflare Source
# Qualification only: this workflow builds and verifies the exact head SHA and
# retains the sealed Worker. It has no deploy job, no secrets and no write scopes.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'apps/passwords/**',
        'packages/auth/**',
        'packages/storage-core/**',
        'packages/internal-api/**',
        'packages/satellite/**',
        'packages/supabase/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/icons/**',
        'packages/utils/**',
        'scripts/ci/passwords-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'bun.lock',
        '.github/workflows/passwords-cloudflare.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
  push:
    branches: [main]
    paths:
      [
        'apps/passwords/**',
        'packages/auth/**',
        'packages/storage-core/**',
        'packages/internal-api/**',
        'packages/satellite/**',
        'packages/supabase/**',
        'packages/types/**',
        'packages/typescript-config/**',
        'packages/ui/**',
        'packages/icons/**',
        'packages/utils/**',
        'scripts/ci/passwords-native-*',
        'scripts/ci/apps-native-artifact.py',
        'scripts/ci/native-emitted-config-receipt.mjs',
        'scripts/ci/native-config-default-probe.mjs',
        'scripts/ci/native-receipt-layout.mjs',
        'bun.lock',
        '.github/workflows/passwords-cloudflare.yaml',
        '.github/workflows/ci-check.yml',
        '.github/actions/setup-bun-with-retry/action.yml',
        '.github/actions/run-with-turbo-remote-cache/action.yml',
        'scripts/ci/generate-build-metadata.ts',
        'package.json',
        'turbo.json',
        'tuturuuu.ts',
        'tuturuuu.ci.ts',
      ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: passwords-cloudflare.yaml
  validate:
    needs: check-ci
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PASSWORDS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PASSWORDS_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.0
      - name: Verify immutable checkout identity
        run: test "$(git rev-parse HEAD)" = "$PASSWORDS_SOURCE_SHA"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build required active workspace dependencies
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter='@tuturuuu/passwords^...' --concurrency=2
          token: ''
          team: ''
      - name: Generate exact-checkout build identity
        env:
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.PASSWORDS_SOURCE_SHA }}
          PLATFORM_BUILD_REF_NAME: ${{ github.head_ref || github.ref_name }}
          PLATFORM_BUILD_ENVIRONMENT: preview
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Test step-up, schemas, secret lifetime, clipboard and response headers
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/passwords && bun run test
          token: ''
          team: ''
      - name: Check owned source formatting
        run: bun x --no-install biome check apps/passwords/src apps/passwords/cloudflare apps/passwords/messages apps/passwords/vite.config.ts apps/passwords/void.config.ts apps/passwords/vitest.config.ts apps/passwords/tsconfig.json apps/passwords/package.json
      - name: Record route tree presence before the build
        id: route-tree-before
        shell: bash
        run: |
          route_tree=apps/passwords/src/routeTree.gen.ts
          if [ -e "$route_tree" ] || [ -L "$route_tree" ]; then
            echo 'state=present' >> "$GITHUB_OUTPUT"
          else
            echo 'state=absent' >> "$GITHUB_OUTPUT"
          fi
      - name: Build native Start SSR with the official Void SDK
        uses: ./.github/actions/run-with-turbo-remote-cache
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://passwords-ci.supabase.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_passwords_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://passwords.tuturuuu.com
          NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
        with:
          command: cd apps/passwords && bun run build:cloudflare
          token: ''
          team: ''
      - name: Reject tracked route tree drift
        shell: bash
        run: |
          route_tree=apps/passwords/src/routeTree.gen.ts
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            git diff --exit-code HEAD -- "$route_tree"
          fi
      - name: Type-check without a build
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: cd apps/passwords && bun run type-check
          token: ''
          team: ''
      - name: Remove only verified synthetic preview inputs before sealing
        run: python3 scripts/ci/passwords-native-artifact.py prepare apps/passwords
      - name: Discover the emitted config and assert identity, ASSETS-only bindings and no triggers
        id: output
        run: python3 scripts/ci/passwords-native-artifact.py config apps/passwords
      - name: Record bounded emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/passwords "$PASSWORDS_SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config-passwords.json"
      - name: Qualify the emitted Worker with the pinned Wrangler adapter without publication
        working-directory: apps/passwords
        env:
          PASSWORDS_EMITTED_CONFIG: ${{ steps.output.outputs.config }}
        run: bun x --no-install wrangler deploy --dry-run --config "$PASSWORDS_EMITTED_CONFIG" --outdir "$RUNNER_TEMP/passwords-dry-run"
      - name: Exercise the emitted Worker stop, restart and auth boundaries
        working-directory: apps/passwords
        env:
          CI: 'true'
          CI_SOURCE_SHA: ${{ env.PASSWORDS_SOURCE_SHA }}
        run: bun run test:runtime
      - name: Seal exact-source output
        run: python3 scripts/ci/passwords-native-artifact.py seal apps/passwords --receipt "$RUNNER_TEMP/passwords-native-artifact.json"
      - name: Recheck and pack only qualified bytes
        run: |
          python3 scripts/ci/passwords-native-artifact.py verify apps/passwords --receipt "$RUNNER_TEMP/passwords-native-artifact.json"
          python3 scripts/ci/passwords-native-artifact.py pack apps/passwords --receipt "$RUNNER_TEMP/passwords-native-artifact.json" --archive "$RUNNER_TEMP/passwords-native.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passwords-native-${{ env.PASSWORDS_SOURCE_SHA }}
          path: ${{ runner.temp }}/passwords-native.tar.gz
          retention-days: 7
          if-no-files-found: error
