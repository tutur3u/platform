      - name: Restore and verify exact frontend artifact
        run: |
          tar -xzf "$RUNNER_TEMP/meet-worker/meet-worker.tar.gz" -C apps/meet
          GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js verify apps/meet apps/meet/meet-artifact.json
      - name: Download exact-source fixture transport
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: "meet-fixture-${{ env.SOURCE_SHA }}", path: "${{ runner.temp }}/meet-fixture-transport" }
      - name: Restore and admit fixture graph
        id: meet-restored-fixture
        timeout-minutes: 8
        run: node scripts/ci/meet-native-fixture-supplier.mjs restore "$SOURCE_SHA" "$RUNNER_TEMP/meet-fixture-transport/fixture-transport.tar.gz" "$RUNNER_TEMP"
      - name: Download production provenance
        if: env.MEET_PRODUCTION == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: "meet-production-provenance-${{ env.SOURCE_SHA }}", path: "${{ runner.temp }}" }
      - name: Discover restored native Void Start output
        id: meet-output
        run: GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js config-restored apps/meet
      - name: Dry-run restored frontend artifact
        working-directory: apps/meet
        run: node ../../scripts/ci/meet-dry-run-scratch.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/meet-production-receipt.json"
      - name: Verify restored fixture semantic runtime
        timeout-minutes: 3
        env: { WRANGLER_SEND_METRICS: 'false', MEET_FIXTURE_RECEIPT: "${{ steps.meet-restored-fixture.outputs.receipt }}" }
        run: TMPDIR="$RUNNER_TEMP" node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --fixture-receipt "$MEET_FIXTURE_RECEIPT"
      - name: Verify restored Start runtime before production writes
        timeout-minutes: 3
        env: { WRANGLER_SEND_METRICS: 'false' }
        run: |
          node scripts/ci/meet-standalone-release.mjs verify
          TMPDIR="$RUNNER_TEMP" node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/meet-production-receipt.json"
