        run: bash scripts/ci/meet-release-operations.sh restore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        continue-on-error: true
        with:
          name: meet-release-deploy-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meet*release*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Record successful Cloudflare deployment
        if: steps.admission.outputs.superseded != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_MARKER_SHA: ${{ github.sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: meet-cloudflare.yaml
        run: node --experimental-strip-types scripts/ci/record-deployment-marker.ts
