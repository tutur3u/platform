name: Meet Cloudflare
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'scripts/safe-fs.js'
      - 'scripts/check-meet-ai-containment*'
      - 'apps/meet/**'
      - 'apps/meet-realtime/**'
      - 'apps/web/src/lib/meet/**'
      - 'apps/web/src/app/api/v1/workspaces/*/meetings/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/ci/meet-cloudflare-render.runtime.mjs'
      - 'scripts/ci/meet-*release*'
      - 'scripts/ci/meet-native-*.mjs'
      - 'scripts/ci/meet-dry-run-scratch.mjs'
      - 'scripts/ci/native-wrangler-evidence.mjs'
      - 'scripts/ci/native-wrangler-diagnostics.mjs'
      - 'scripts/ci/native-wrangler-observable.mjs'
      - 'scripts/ci/native-wrangler-summary.mjs'
      - 'scripts/ci/native-source-identity-test-helper.js'
      - 'scripts/ci/meet-native-source-identity.test.js'
      - 'scripts/ci/native-wrangler-runtime.mjs'
      - 'scripts/ci/native-wrangler-runtime.test.mjs'
      - 'scripts/ci/native-wrangler-runtime.runtime.mjs'
      - 'scripts/ci/meet-build-metadata.test.js'
      - 'scripts/ci/verify-meet-start-output*'
      - 'scripts/ci/meet-emitted-defaults.mjs'
      - 'scripts/ci/native-config-default-probe.mjs'
      - 'scripts/ci/native-emitted-config-receipt*'
      - 'scripts/ci/native-receipt-layout*'
      - 'scripts/ci/workflow-yaml-test-helper.js'
      - 'scripts/ci/verify-meet-build-info*'
      - 'scripts/ci/generate-build-metadata*'
      - 'tuturuuu.ts'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/ci-check.yml'
      - '.github/actions/**'
      - '.github/workflows/meet-cloudflare.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/safe-fs.js'
      - 'scripts/check-meet-ai-containment*'
      - 'apps/meet/**'
      - 'apps/meet-realtime/**'
      - 'apps/web/src/lib/meet/**'
      - 'apps/web/src/app/api/v1/workspaces/*/meetings/**'
      - 'packages/**'
      - 'bun.lock'
      - 'patches/**'
      - 'scripts/ci/meet-cloudflare-render.runtime.mjs'
      - 'scripts/ci/meet-*release*'
      - 'scripts/ci/meet-native-*.mjs'
      - 'scripts/ci/meet-dry-run-scratch.mjs'
      - 'scripts/ci/native-wrangler-evidence.mjs'
      - 'scripts/ci/native-wrangler-diagnostics.mjs'
      - 'scripts/ci/native-wrangler-observable.mjs'
      - 'scripts/ci/native-wrangler-summary.mjs'
      - 'scripts/ci/native-source-identity-test-helper.js'
      - 'scripts/ci/meet-native-source-identity.test.js'
      - 'scripts/ci/native-wrangler-runtime.mjs'
      - 'scripts/ci/native-wrangler-runtime.test.mjs'
      - 'scripts/ci/native-wrangler-runtime.runtime.mjs'
      - 'scripts/ci/meet-build-metadata.test.js'
      - 'scripts/ci/verify-meet-start-output*'
      - 'scripts/ci/meet-emitted-defaults.mjs'
      - 'scripts/ci/native-config-default-probe.mjs'
      - 'scripts/ci/native-emitted-config-receipt*'
      - 'scripts/ci/native-receipt-layout*'
      - 'scripts/ci/workflow-yaml-test-helper.js'
      - 'scripts/ci/verify-meet-build-info*'
      - 'scripts/ci/generate-build-metadata*'
      - 'package.json'
      - 'turbo.json'
      - 'tuturuuu.ts'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/ci-check.yml'
      - '.github/actions/**'
      - '.github/workflows/meet-cloudflare.yaml'
  workflow_dispatch:
    inputs:
      release:
        description: Publish only Meet from an admitted exact main commit
        type: boolean
        default: false
      source_sha:
        description: Full immutable main SHA; required when release is true
        type: string
        default: ''
  workflow_call:
permissions:
  contents: read
  deployments: read
concurrency:
  group: meet-cloudflare-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
  MEET_PRODUCTION: ${{ github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && inputs.release == true) }}
jobs:
  affected-gate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name != 'pull_request' && 'true' || steps.app.outputs.run || 'true' }}
      reason: ${{ steps.app.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/affected-gate/
            /scripts/ci/affected-apps.mjs
            /scripts/ci/affected-apps.extra-edges.json
            /scripts/ci/affected-gate.mjs
            /apps/*/package.json
            /packages/*/package.json
          sparse-checkout-cone-mode: false
      - id: app
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/affected-gate
        with:
          app: meet
  check-ci:
    needs: affected-gate
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
      deployments: read
    with:
      workflow_name: meet-cloudflare.yaml
      check_pr_release_only: true
  validate:
    outputs:
      realtime_sha256: ${{ steps.realtime-seal.outputs.sha256 }}
    needs: [check-ci, production-policy, affected-gate]
    if: ${{ (needs.affected-gate.outputs.run == 'true' && (!cancelled() && needs.check-ci.result == 'success' && needs.check-ci.outputs.should_run == 'true' && needs.check-ci.outputs.run_checks == 'true' && ((github.ref != 'refs/heads/production' && inputs.release != true) || (needs.production-policy.result == 'success' && needs.production-policy.outputs.allowed == 'true')))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable checkout identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile
      - name: Generate shared build metadata
        env:
          PLATFORM_BUILD_ENVIRONMENT: ${{ env.MEET_PRODUCTION == 'true' && 'production' || 'preview' }}
          PLATFORM_BUILD_REF_NAME: ${{ env.MEET_PRODUCTION == 'true' && 'production' || github.ref_name }}
          PLATFORM_BUILD_COMMIT_HASH: ${{ env.SOURCE_SHA }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts
      - name: Enforce SR-919 Meet AI containment
        run: |
          node --test scripts/check-meet-ai-containment.test.js
          node scripts/check-meet-ai-containment.js
      - name: Test build identity and workflow ordering
        run: node --test scripts/ci/meet-build-metadata.test.js scripts/ci/verify-meet-build-info.test.js scripts/ci/generate-build-metadata.test.js scripts/ci/verify-meet-start-output.test.js scripts/ci/meet-native-source-identity.test.js scripts/ci/meet-native-admission.test.mjs scripts/ci/meet-native-abuse-guard-stub.test.mjs scripts/ci/meet-native-lifecycle.test.mjs scripts/ci/meet-native-supplier.test.mjs scripts/ci/meet-native-evidence.test.mjs scripts/ci/meet-native-hidden.test.mjs scripts/ci/meet-native-fixture-supplier.test.mjs scripts/ci/meet-native-assurance.test.mjs scripts/ci/meet-native-response-diagnostics.test.mjs scripts/ci/meet-ssr-capture.test.mjs scripts/ci/meet-standalone-release.test.mjs
      - name: Test Meet public callback and current account assurance
        working-directory: apps/meet
        run: bun x --no-install vitest run --config vitest.native-auth.config.ts --maxWorkers=1
      - name: Test bounded Meet SSR diagnostics
        working-directory: apps/meet
        run: bun x --no-install vitest run --config vitest.config.ts src/runtime/ssr-diagnostics.test.ts src/runtime/ssr-error-boundary.test.tsx src/runtime/login-redirect-diagnostics.test.ts src/runtime/handler-start-handoff.test.ts src/runtime/proxy-bridge.test.ts --maxWorkers=1
      - name: Test diagnostic receipt serialization
        run: node --test scripts/ci/native-emitted-config-receipt.test.mjs scripts/ci/native-receipt-layout.test.mjs
      - name: Build realtime dependencies and test realtime
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/types --filter=@tuturuuu/supabase --concurrency=2 && bun turbo:local run test --filter=@tuturuuu/realtime --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Test durable room lifecycle and recovery
        timeout-minutes: 2
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          bun test \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/room-do-empty-lifecycle.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/room-do-lifecycle-race.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/room-do-recovery.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/attendance-room-erase.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/attendance-directory-spill.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/collaboration-retry-budget.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/channel-retry-budget.test.ts" \
            "$GITHUB_WORKSPACE/apps/meet-realtime/src/channel-checkpoint-request.test.ts"
      - name: Verify offline checkpoint retry budget in real SQLite
        timeout-minutes: 2
        run: node --test verify.mjs
        working-directory: apps/meet-realtime/test-fixtures/collaboration-retry
      - name: Verify channel retry reservations in real SQLite
        timeout-minutes: 2
        run: node --test verify.mjs
        working-directory: apps/meet-realtime/test-fixtures/channel-retry
      - name: Verify completed Live finalization in real SQLite
        timeout-minutes: 2
        run: node --test verify.mjs
        working-directory: packages/meet-core/test-fixtures/live-finalization
      - name: Verify real local Durable Objects and collaboration protocols
        timeout-minutes: 5
        run: bun apps/meet-realtime/tests/local-check.ts
      - run: node --experimental-strip-types --test apps/meet-realtime/src/check-endpoint.test.ts apps/meet-realtime/src/check-socket.test.ts apps/meet-realtime/src/turn-credentials.test.ts
      - name: Check scoped realtime Vite+ tooling
        working-directory: apps/meet-realtime
        run: |
          bun run lint
          bun run format:check
      - name: Check realtime Worker types
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run type-check --filter=@tuturuuu/meet-realtime --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Build the native realtime Worker candidate
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter=@tuturuuu/meet-realtime --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Verify emitted realtime Worker and SQLite routing
        timeout-minutes: 2
        working-directory: apps/meet-realtime
        env:
          MEET_REALTIME_TEST_CONFIG: dist/worker/wrangler.json
        run: bun run test:runtime
      - name: Build Meet dependencies and test Meet packages
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --filter='@tuturuuu/meet-core^...' --concurrency=2 && bun turbo:local run test --filter=@tuturuuu/meet-core --filter=@tuturuuu/meet --concurrency=2
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Record Meet route tree presence before frontend build
        id: meet-route-tree-before
        run: |
          route_tree=apps/meet/src/routeTree.gen.ts
          if [ -e "$route_tree" ] || [ -L "$route_tree" ]; then
            echo 'state=present' >> "$GITHUB_OUTPUT"
          else
            echo 'state=absent' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the frontend for Workers
        id: meet-frontend-build
        uses: ./.github/actions/run-with-turbo-remote-cache
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.MEET_PRODUCTION != 'true' && 'https://meet-ci.supabase.invalid' || secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.MEET_PRODUCTION != 'true' && 'sb_publishable_meet_ci_placeholder' || secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://meet.tuturuuu.com
          NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
        with:
          command: >-
            if [ "$MEET_PRODUCTION" = true ]; then
              node scripts/ci/meet-native-fixture-supplier.mjs inputs "$SOURCE_SHA" "$RUNNER_TEMP/meet-production-inputs.json";
            fi && cd apps/meet && bun run build:cloudflare
          token: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
      - name: Capture generated Meet route tree evidence
        if: always()
        env:
          MEET_ROUTE_TREE_BEFORE: ${{ steps.meet-route-tree-before.outputs.state || 'unknown' }}
          MEET_FRONTEND_BUILD_OUTCOME: ${{ steps.meet-frontend-build.outcome || 'unknown' }}
        run: bash scripts/ci/meet-release-operations.sh route-tree
      - name: Retain generated Meet route tree evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-route-tree-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meet-route-tree-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
      - name: Reject tracked Meet route tree drift
        if: always()
        run: |
          route_tree=apps/meet/src/routeTree.gen.ts
          if git cat-file -e "HEAD:$route_tree" 2>/dev/null; then
            git diff --exit-code HEAD -- "$route_tree"
          fi
      - name: Discover and verify native Void Start output
        id: meet-output
        run: GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js config apps/meet
      - name: Record bounded meet native emitted config receipt
        if: always()
        run: node scripts/ci/native-emitted-config-receipt.mjs apps/meet "$SOURCE_SHA" "$RUNNER_TEMP/native-emitted-config-meet.json"
      - name: Retain meet diagnostic config receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-native-config-receipt-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-emitted-config-meet.json
          retention-days: 7
          if-no-files-found: error
      - name: Generate emitted Worker binding types
        working-directory: apps/meet
        run: bun x --no-install wrangler types --config "${{ steps.meet-output.outputs.config }}" --env-interface CloudflareEnv --include-runtime=false cloudflare-env.d.ts
      - name: Check Worker binding types
        run: bun run --cwd apps/meet cf:typecheck
      - name: Seal exact-SHA frontend artifact
        id: meet-canonical-seal
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js seal apps/meet apps/meet/meet-artifact.json
      - name: Bind production compiler inputs to emitted graph
        if: env.MEET_PRODUCTION == 'true'
        run: |
          node scripts/ci/meet-native-fixture-supplier.mjs production-receipt "$SOURCE_SHA" "$RUNNER_TEMP/meet-production-inputs.json" "$RUNNER_TEMP/meet-production-receipt.json"
          node scripts/ci/meet-standalone-release.mjs bind
      - name: Supply exact-source Meet public fixture graph
        id: meet-fixture-supplier
        timeout-minutes: 25
        run: node scripts/ci/meet-native-fixture-supplier.mjs "$SOURCE_SHA" "$RUNNER_TEMP"
      - name: Verify emitted Start SSR, auth, cookies, rewrites and Live guards
        timeout-minutes: 3
        env:
          WRANGLER_SEND_METRICS: 'false'
          MEET_FIXTURE_RECEIPT: ${{ steps.meet-fixture-supplier.outputs.receipt }}
        run: |
          test -n "$MEET_FIXTURE_RECEIPT"
          GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js verify apps/meet apps/meet/meet-artifact.json
          meet_status=0
          TMPDIR="$RUNNER_TEMP" node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --fixture-receipt "$MEET_FIXTURE_RECEIPT" || meet_status=$?
          GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js verify apps/meet apps/meet/meet-artifact.json
          sdk_status=0
          GITHUB_SHA="$SOURCE_SHA" node --test --test-concurrency=1 scripts/ci/native-wrangler-runtime.test.mjs scripts/ci/native-wrangler-runtime.runtime.mjs || sdk_status=$?
          test "$meet_status" -eq 0
          test "$sdk_status" -eq 0
      - name: Verify production emitted Start runtime
        if: env.MEET_PRODUCTION == 'true'
        timeout-minutes: 3
        env: { WRANGLER_SEND_METRICS: 'false' }
        run: |
          node scripts/ci/meet-standalone-release.mjs verify
          TMPDIR="$RUNNER_TEMP" node scripts/ci/meet-native-launcher.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/meet-production-receipt.json"
      - name: Retain production input and graph provenance
        if: ${{ always() && env.MEET_PRODUCTION == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-production-provenance-${{ env.SOURCE_SHA }}
          path: "${{ runner.temp }}/meet-production-inputs.json\n${{ runner.temp }}/meet-production-receipt.json\n${{ runner.temp }}/meet-release-intent.json"
          retention-days: 7
          if-no-files-found: warn
      - name: Retain Meet fixture supplier identity and progress
        if: ${{ always() && steps.meet-fixture-supplier.outputs.root != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-fixture-${{ env.SOURCE_SHA }}
          path: "${{ steps.meet-fixture-supplier.outputs.root }}/journal.json\n${{ steps.meet-fixture-supplier.outputs.transport }}"
          retention-days: 7
          if-no-files-found: warn
      - name: Pack finite Meet graph evidence
        if: always()
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/meet-release-operations.sh" pack-graph
      - name: Retain finite Meet graph evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-native-graph-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meet-native-evidence.tar.gz
          retention-days: 7
          if-no-files-found: warn
      - name: Validate both Worker bundles
        run: |
          if [ "$MEET_PRODUCTION" = true ]; then
            (cd apps/meet && node ../../scripts/ci/meet-dry-run-scratch.mjs "$SOURCE_SHA" --production-receipt "$RUNNER_TEMP/meet-production-receipt.json")
          else
            (cd apps/meet && node ../../scripts/ci/meet-dry-run-scratch.mjs "$SOURCE_SHA")
          fi
          bun x --no-install wrangler deploy --dry-run -c apps/meet-realtime/wrangler.jsonc
      - name: Qualify the frontend cf Build Output without credentials
        working-directory: apps/meet
        env:
          CF_SEND_TELEMETRY: 'false'
        run: |
          out="$RUNNER_TEMP/meet-cf-output-check"
          node ../../scripts/ci/void-cf-output.mjs --config "${{ steps.meet-output.outputs.config }}" \
            --out "$out" --sha "$SOURCE_SHA" \
            --var TTR_ONE_ORIGIN_MEET=off --var TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS=302
          node ../../scripts/ci/void-cf-publisher.mjs dry-run --build "$out"
          rm -rf "$out"
      - name: Verify and pack accepted exact-SHA frontend artifact
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          GITHUB_SHA="$SOURCE_SHA" node scripts/ci/verify-meet-start-output.js verify apps/meet apps/meet/meet-artifact.json
          pointer=.wrangler/deploy/config.json
          if [ -f apps/meet/.void/preview-deploy-config.json ]; then
            pointer=.void/preview-deploy-config.json
          fi
          tar -czf "$RUNNER_TEMP/meet-worker.tar.gz" -C apps/meet dist "$pointer" meet-artifact.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meet-worker-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/meet-worker.tar.gz
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Seal emitted realtime artifact
        id: realtime-seal
        run: |
          node scripts/ci/meet-realtime-release.mjs seal "$SOURCE_SHA"
