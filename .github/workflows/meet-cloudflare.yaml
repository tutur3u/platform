            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY == 'true' && secrets.MEET_DEDICATED_CLOUDFLARE_API_TOKEN) ||
            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY != 'true' && (secrets.MEET_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN)) || '' }}
        id: signaling
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential'; exit 1; }
          node scripts/ci/meet-realtime-release.mjs verify "$SOURCE_SHA"
          bun x --no-install wrangler deploy --no-bundle -c apps/meet-realtime/dist/worker/wrangler.json --message "$SOURCE_SHA"
      - name: Deploy the verified frontend
        if: steps.admission.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{
            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY == 'true' && secrets.MEET_DEDICATED_CLOUDFLARE_API_TOKEN) ||
            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY != 'true' && (secrets.MEET_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN)) || '' }}
          CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
          # Shared-origin mode and redirect status are repository variables so
          # every release carries the current cutover stage.
          TTR_ONE_ORIGIN_MEET: ${{ vars.TTR_ONE_ORIGIN_MEET || 'off' }}
          TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS: ${{ vars.TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS || '302' }}
        id: frontend
        working-directory: apps/meet
        timeout-minutes: 20
        run: |
          GITHUB_SHA="$SOURCE_SHA" node ../../scripts/ci/verify-meet-start-output.js verify . meet-artifact.json
          case "$TTR_ONE_ORIGIN_MEET" in off|shadow|on) ;; *) echo '::error::TTR_ONE_ORIGIN_MEET must be off, shadow or on'; exit 1 ;; esac
          case "$TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS" in 301|302|307) ;; *) echo '::error::TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS must be 301, 302 or 307'; exit 1 ;; esac
          export CF_SEND_TELEMETRY=false
          out="$RUNNER_TEMP/meet-cf-output"
          node ../../scripts/ci/void-cf-output.mjs --config "${{ steps.meet-output.outputs.config }}" \
            --out "$out" --sha "$SOURCE_SHA" \
            --var "TTR_ONE_ORIGIN_MEET=$TTR_ONE_ORIGIN_MEET" \
            --var "TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS=$TTR_ONE_ORIGIN_MEET_REDIRECT_STATUS"
          # Publish captures the serving version it verified against; traffic
          # moves only while that version is still serving.
          node ../../scripts/ci/void-cf-publisher.mjs publish --build "$out" --worker tuturuuu-meet --message "$SOURCE_SHA" > "$RUNNER_TEMP/meet-cf-publish.json"
          version=$(jq -er .versionId "$RUNNER_TEMP/meet-cf-publish.json")
          serving=$(jq -er .previousVersionId "$RUNNER_TEMP/meet-cf-publish.json")
          node ../../scripts/ci/void-cf-publisher.mjs assign --worker tuturuuu-meet --version "$version" --expect-current "$serving" \
            --build-info-url https://meet.tuturuuu.com/api/build-info --expect-build "$SOURCE_SHA"
      - name: Verify canonical routes
        if: steps.admission.outputs.superseded != 'true'
        timeout-minutes: 8
        run: |
          curl --fail --retry 5 --retry-delay 5 --connect-timeout 5 --max-time 20 --retry-max-time 150 https://meet-realtime.tuturuuu.com/health
          curl --fail --retry 5 --retry-delay 5 --connect-timeout 5 --max-time 20 --retry-max-time 150 --output /dev/null https://meet.tuturuuu.com/login
      - name: Verify canonical frontend build identity
        if: steps.admission.outputs.superseded != 'true'
        timeout-minutes: 5
        env:
          MEET_PREVIOUS_LIVE_SHA: ${{ steps.admission.outputs.live }}
        run: node scripts/ci/verify-meet-build-info.js
      - name: Verify authenticated realtime and SFU behavior
        if: steps.admission.outputs.superseded != 'true'
        env:
          MEET_REALTIME_TOKEN_SECRET: ${{ secrets.MEET_REALTIME_TOKEN_SECRET }}
          MEET_CHECK_REALTIME_URL: wss://meet-realtime.tuturuuu.com/realtime
        run: |
          bun apps/meet-realtime/src/integration-check.ts
          bun apps/meet-realtime/src/room-controls-check.ts
      - name: Restore the previous Meet pair after a failed release
        env:
          CLOUDFLARE_API_TOKEN: ${{
            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY == 'true' && secrets.MEET_DEDICATED_CLOUDFLARE_API_TOKEN) ||
            (vars.MEET_DEDICATED_PRODUCTION_ENV_READY != 'true' && (secrets.MEET_CLOUDFLARE_API_TOKEN || secrets.COLAB_CLOUDFLARE_API_TOKEN)) || '' }}
        if: (failure() || cancelled()) && steps.signaling.outcome != 'skipped'
