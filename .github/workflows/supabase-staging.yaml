name: Supabase Staging Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Invalid triggers use a private lock and cannot block a real migration.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && github.event.ref == github.ref && github.event.repository.full_name == github.repository && github.event.repository.id == github.repository_id && github.event.after == github.sha && github.event.deleted == false)) && 'supabase-staging-migration' || format('supabase-staging-migration-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  deployments: write

jobs:
  migrate:
    name: Migrate staging database
    # Admit protected main pushes and main-only repair dispatches. Re-prove
    # exact ref, repository and commit before checking out any target source.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected && github.event.ref == github.ref && github.event.repository.full_name == github.repository && github.event.repository.id == github.repository_id && github.event.after == github.sha && github.event.deleted == false)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Restricted to main so other branches cannot read the migration credentials.
    environment: supabase-staging-migrations
    steps:
      - name: Verify trusted trigger
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          # Behind-main SHAs remain eligible: production may promote an older
          # main commit after a descendant has applied staging migrations.
        run: |
          set -euo pipefail
          # Job expressions ignore case; the shell proof is exact and precedes checkout.
          reject() {
            echo "::error::Untrusted trigger: $1"
            exit 1
          }
          field() {
            jq -r "$1 // \"\" | tostring" "$GITHUB_EVENT_PATH"
          }
          [ "$GITHUB_REF" = refs/heads/main ] || reject "runner ref is not main"
          [ "$(field .repository.full_name)" = "$GITHUB_REPOSITORY" ] &&
            [ "$(field .repository.id)" = "$GITHUB_REPOSITORY_ID" ] ||
            reject "event repository does not match the runner repository"
          branch=main
          head_sha="$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              [ "${GITHUB_REF_PROTECTED:-}" = true ] || reject "main ref is not protected"
              [ "$(field .ref)" = "$GITHUB_REF" ] || reject "event ref does not match main"
              [ "$(field .after)" = "$GITHUB_SHA" ] || reject "push after does not match runner SHA"
              jq -e '.deleted == false' "$GITHUB_EVENT_PATH" >/dev/null || reject "push deletes the branch"
              ;;
            workflow_dispatch) ;;
            *) reject "unsupported event '$GITHUB_EVENT_NAME'" ;;
          esac

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || reject "head SHA is not a full commit SHA"
          # Compare against the fully qualified branch ref: a bare name resolves a
          # same-named tag (refs/tags/<branch>) first. identical: the head SHA is the
          # live branch tip; behind: it is reachable from the branch. Deploy
          # consumers set REQUIRE_BRANCH_TIP so a re-run cannot redeploy an old commit.
          # With TIP_TREE_PATH, a head behind the tip is still current when that
          # directory's tree is unchanged at the tip (unrelated commits landed).
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/refs/heads/$branch...$head_sha" --jq .status)"
          if [ "${REQUIRE_BRANCH_TIP:-false}" = true ]; then
            if [ "$status" = behind ] && [ -n "${TIP_TREE_PATH:-}" ]; then
              [[ "$TIP_TREE_PATH" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]] ||
                reject "TIP_TREE_PATH is not a nested repository path"
              tree_sha() {
                gh api "repos/$GITHUB_REPOSITORY/contents/${TIP_TREE_PATH%/*}?ref=$1" \
                  --jq ".[] | select(.type == \"dir\" and .name == \"${TIP_TREE_PATH##*/}\") | .sha"
              }
              tip_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)"
              [[ "$tip_sha" =~ ^[0-9a-f]{40}$ ]] || reject "cannot resolve the tip of $branch"
              head_tree="$(tree_sha "$head_sha")"
              [[ "$head_tree" =~ ^[0-9a-f]{40}$ ]] && [ "$head_tree" = "$(tree_sha "$tip_sha")" ] ||
                reject "head SHA is behind $branch and $TIP_TREE_PATH changed since"
            else
              [ "$status" = identical ] || reject "head SHA is not the live tip of $branch"
            fi
          else
            [ "$status" = identical ] || [ "$status" = behind ] ||
              reject "head SHA is not reachable from $branch"
          fi
          {
            echo "trusted=true"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Trusted trigger: $head_sha on $branch"

      - name: Check out migration target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.trigger.outputs.head_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check migration configuration
        id: check_config
        run: |
          node --experimental-strip-types --input-type=module <<'STAGING_CONFIG'
          import { appendFileSync } from 'node:fs';
          import { ci } from './tuturuuu.ci.ts';
          const enabled = ci?.['supabase-staging.yaml'];
          if (typeof enabled !== 'boolean') {
            throw new Error('Staging migration configuration must be boolean');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${enabled}\n`);
          STAGING_CONFIG

      - name: Evaluate staging prerequisites
        id: evaluate
        env:
          STAGING_ENABLED: ${{ steps.check_config.outputs.should_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHOULD_DEPLOY=false

          if [ "$STAGING_ENABLED" != "true" ]; then
            echo "::notice::Skipping staging migration because staging migration is explicitly disabled."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch detected. Proceeding with staging migration."
            SHOULD_DEPLOY=true
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "Trusted main push detected. Proceeding with staging migration."
            SHOULD_DEPLOY=true
          else
            echo "::notice::Skipping staging migration for an unsupported event."
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.evaluate.outputs.should_deploy == 'true'
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Deploy migrations to staging
        if: steps.trigger.outputs.trusted == 'true' && steps.evaluate.outputs.should_deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Fail closed unless the environment targets the staging project.
          if [ "$STAGING_PROJECT_ID" != "fxefojytwimjiqxseqag" ]; then
            echo "::error::STAGING_PROJECT_ID does not match the staging project ref."
            exit 1
          fi
          cd apps/database
          supabase link --project-ref "$STAGING_PROJECT_ID"
          # An older main SHA can run after a descendant already applied newer
          # migrations; `db push` then refuses the remote-only versions. Compare
          # first. A remote-only version that is not on main fails closed. When
          # every local version is applied and staging is only ahead with main's
          # versions, skip the push so this SHA still gets its marker.
          versions() { sed -n 's/^\([0-9][0-9]*\)_.*\.sql$/\1/p' | sort -u; }
          nonblank() { printf '%s\n' "$1" | sed '/^$/d'; }
          local_versions="$(ls supabase/migrations | versions)"
          # An unreadable listing leaves remote_versions empty, so the step
          # falls back to today's push.
          listing="$(supabase migration list --linked)" || listing=""
          remote_versions="$(printf '%s\n' "$listing" |
            awk -F'|' 'NF >= 3 { gsub(/[[:space:]]/, "", $2); if ($2 ~ /^[0-9]+$/) print $2 }' | sort -u)"
          pending="$(comm -23 <(nonblank "$local_versions") <(nonblank "$remote_versions"))"
          remote_only="$(comm -13 <(nonblank "$local_versions") <(nonblank "$remote_versions"))"
          if [ -n "$remote_only" ]; then
            git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null ||
              git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            main_versions="$(git ls-tree --full-tree --name-only refs/remotes/origin/main:apps/database/supabase/migrations | versions)"
            [ -n "$main_versions" ] || { echo "::error::Cannot read main's migrations."; exit 1; }
            unknown="$(comm -23 <(nonblank "$remote_only") <(nonblank "$main_versions"))"
            if [ -n "$unknown" ]; then
              echo "::error::Staging has $(nonblank "$unknown" | wc -l | tr -d ' ') applied migration version(s) that are not on main; refusing to migrate or mark."
              exit 1
            fi
            if [ -z "$pending" ]; then
              ahead="$(nonblank "$remote_only" | wc -l | tr -d ' ')"
              echo "::notice::Already applied by a descendant: every migration at this SHA is on staging, which is $ahead version(s) ahead with migrations from main. Skipping db push and recording this SHA's marker."
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '### Staging migration\n\nAlready applied by a descendant (%s version(s) ahead on main); no push.\n' "$ahead" >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
          fi
          supabase db push --include-all

      # The marker binds the SHA the trust step verified, never the raw event.
      - name: Record successful staging migration marker
        if: steps.trigger.outputs.trusted == 'true' && steps.evaluate.outputs.should_deploy == 'true'
        env:
          DEPLOYMENT_MARKER_REF_NAME: main
          DEPLOYMENT_MARKER_SHA: ${{ steps.trigger.outputs.head_sha }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: supabase-staging.yaml
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types
          scripts/ci/record-deployment-marker.ts
