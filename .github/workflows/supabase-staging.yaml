name: Supabase Staging Migration

on:
  workflow_run:
    workflows: ["Vercel Platform Preview Deployment"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Ineligible (for example name-spoofed) runs get their own group so they never
# queue behind or ahead of a real staging migration.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'supabase-staging-migration' || format('supabase-staging-migration-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  deployments: write

jobs:
  migrate:
    name: Migrate staging database
    # workflow_run matches upstreams by name, and a fork PR can define a
    # workflow with the same name on a branch called main. Only same-repository
    # push completions may select the migration target, and nothing from the
    # target checkout runs before this gate. Manual migrations run from main
    # only, so an unreviewed branch cannot push migrations to staging.
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out migration target
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check migration configuration
        id: check_config
        run: |
          node --experimental-strip-types --input-type=module <<'STAGING_CONFIG'
          import { appendFileSync } from 'node:fs';
          import { ci } from './tuturuuu.ci.ts';
          const enabled = ci?.['supabase-staging.yaml'];
          if (typeof enabled !== 'boolean') {
            throw new Error('Staging migration configuration must be boolean');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `should_run=${enabled}\n`);
          STAGING_CONFIG

      - name: Evaluate staging prerequisites
        id: evaluate
        env:
          STAGING_ENABLED: ${{ steps.check_config.outputs.should_run }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          SHOULD_DEPLOY=false

          if [ "$STAGING_ENABLED" != "true" ]; then
            echo "::notice::Skipping staging migration because staging migration is explicitly disabled."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch detected. Proceeding with staging migration."
            SHOULD_DEPLOY=true
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$TRIGGER_CONCLUSION" = "success" ]; then
            echo "Platform preview build completed successfully. Proceeding with staging migration."
            SHOULD_DEPLOY=true
          else
            echo "::notice::Skipping staging migration because the triggering workflow concluded with '$TRIGGER_CONCLUSION'."
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.evaluate.outputs.should_deploy == 'true'
        uses: ./.github/actions/setup-supabase-cli-with-retry

      - name: Deploy migrations to staging
        if: steps.evaluate.outputs.should_deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
        run: |
          cd apps/database
          supabase link --project-ref "$STAGING_PROJECT_ID"
          supabase db push --include-all

      - name: Record successful staging migration marker
        if: steps.evaluate.outputs.should_deploy == 'true'
        env:
          DEPLOYMENT_MARKER_REF_NAME: main
          DEPLOYMENT_MARKER_SHA: ${{ env.TARGET_SHA }}
          DEPLOYMENT_MARKER_WORKFLOW_NAME: supabase-staging.yaml
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --experimental-strip-types
          scripts/ci/record-deployment-marker.ts
