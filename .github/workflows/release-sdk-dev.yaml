name: SDK dev channel

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "scripts/ci/sdk-dev*"
      - ".github/workflows/release-sdk-dev.yaml"
  workflow_dispatch:

# Serialize dev-tag movement. A newer push never cancels an in-flight publish.
concurrency:
  group: sdk-dev-channel
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reject-untrusted-ref:
    if: github.repository != 'tutur3u/platform' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::SDK dev builds require tutur3u/platform refs/heads/main. Branch tarballs must be built privately on an admitted host."
          exit 1

  prepare:
    if: github.repository == 'tutur3u/platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.pack.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: timeout --kill-after=10s 300s bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile
      - name: Test qualification and dev controls
        run: timeout --kill-after=10s 60s node --test scripts/ci/sdk-package-process.test.js scripts/ci/qualify-sdk-package.test.js scripts/ci/sdk-qualification-phase.test.js scripts/ci/sdk-dev*.test.js packages/sdk/scripts/portable-build.test.cjs
      - name: Build and qualify dev package
        id: pack
        env:
          QUALIFICATION_OUTPUT: ${{ runner.temp }}/tuturuuu-sdk-dev
          SDK_DEV_INTERNAL_ONLY: "false"
        run: |
          timeout --kill-after=10s 1500s node scripts/ci/sdk-dev-pack.js
          node -e 'const m = require(process.env.QUALIFICATION_OUTPUT + "/manifest.json"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `package_version=${m.version}\n`);'
      - name: Upload qualified tarball and checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuturuuu-sdk-dev-package
          path: ${{ runner.temp }}/tuturuuu-sdk-dev/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: prepare
    if: github.repository == 'tutur3u/platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sdk-release-dev
    permissions:
      contents: read
      id-token: write
    # No checkout, package lifecycle execution, install, build, or artifact code
    # runs with publish authority. The environment must allow main only.
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Check npm trusted publishing support
        run: |
          NPM_VERSION=$(npm --version)
          node - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2];
          const [major = 0, minor = 0, patch = 0] = version
            .split('.')
            .map((value) => Number.parseInt(value, 10));
          const supportsTrustedPublishing =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));

          if (!supportsTrustedPublishing) {
            throw new Error(
              `npm ${version} does not support trusted publishing. ` +
                'Use Node 24 with npm 11.5.1+ instead of installing npm ' +
                'inside the OIDC publish job.'
            );
          }

          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Download qualified artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tuturuuu-sdk-dev-package
          path: sdk-package

      - name: Verify package artifact
        id: artifact
        env:
          EXPECTED_PACKAGE_NAME: "tuturuuu"
          EXPECTED_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          PACKAGE_TARBALL=$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          function verifyPublishReceipt({ directory, sourceSha, name, version }) {
            const receipt = JSON.parse(
              fs.readFileSync(path.join(directory, 'receipt.json'), 'utf8')
            );
            const pkg = receipt.package;
            const archives = fs
              .readdirSync(directory)
              .filter((file) => file.endsWith('.tgz'));
            if (
              !/^[a-f0-9]{40}$/.test(sourceSha || '') ||
              receipt.version !== 2 ||
              receipt.phase !== 'public' ||
              receipt.sourceSha !== sourceSha ||
              receipt.qualified !== true ||
              receipt.blocker ||
              receipt.processGroupsDrained !== true ||
              receipt.temporaryFixtureDrained !== true ||
              receipt.lifecycleScriptsExecuted !== false ||
              receipt.modelActivity !== false ||
              pkg?.name !== name ||
              pkg?.version !== version ||
              archives.length !== 1 ||
              pkg.archive !== archives[0] ||
              typeof pkg.archive !== 'string' ||
              pkg.archive.length > 255 ||
              !/^[a-z0-9][a-z0-9_-]*(?:\.[0-9][a-z0-9_-]*)*(?:\.[a-f0-9]{7})?\.tgz$/.test(
                pkg.archive
              ) ||
              path.basename(pkg.archive) !== pkg.archive
            ) {
              throw new Error('PUBLIC_QUALIFICATION_RECEIPT_MISMATCH');
            }
            const archive = path.join(directory, pkg.archive);
            const fd = fs.openSync(
              archive,
              fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK
            );
            try {
              if (
                !fs.fstatSync(fd).isFile() ||
                createHash('sha256').update(fs.readFileSync(fd)).digest('hex') !==
                  pkg.sha256
              ) {
                throw new Error('PUBLIC_QUALIFICATION_ARTIFACT_MISMATCH');
              }
              return archive;
            } finally {
              fs.closeSync(fd);
            }
          }
          console.log(verifyPublishReceipt({ directory: 'sdk-package', sourceSha: process.env.GITHUB_SHA, name: process.env.EXPECTED_PACKAGE_NAME, version: process.env.EXPECTED_PACKAGE_VERSION }));
          NODE
          )
          echo "path=./${PACKAGE_TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Verify dev identity and reconcile existing publication
        id: publication
        env:
          EXPECTED_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          async function verifyDevPublication({
            directory,
            sourceSha,
            version,
            fetchRegistry = fetch,
          }) {
            if (
              !/^[a-f0-9]{40}$/.test(sourceSha || '') ||
              !/^\d+\.\d+\.\d+-dev\.[1-9][0-9]*\.[a-f0-9]{7}$/.test(version || '') ||
              !version.endsWith(`.${sourceSha.slice(0, 7)}`)
            )
              throw new Error('INVALID_DEV_VERSION');
            const manifest = JSON.parse(
              fs.readFileSync(path.join(directory, 'manifest.json'), 'utf8')
            );
            if (
              manifest.schemaVersion !== 1 ||
              manifest.name !== 'tuturuuu' ||
              manifest.version !== version ||
              manifest.sha !== sourceSha ||
              manifest.sourceSha !== sourceSha ||
              manifest.channel !== 'dev' ||
              manifest.internalOnly !== false ||
              manifest.archive !== `tuturuuu-${version}.tgz`
            )
              throw new Error('DEV_MANIFEST_MISMATCH');
            const archive = fs.readFileSync(path.join(directory, manifest.archive));
            const digest = (algorithm, encoding) =>
              createHash(algorithm).update(archive).digest(encoding);
            const integrity = `sha512-${digest('sha512', 'base64')}`;
            const shasum = digest('sha1', 'hex');
            if (
              manifest.integrity !== integrity ||
              manifest.shasum !== shasum ||
              manifest.sha256 !== digest('sha256', 'hex')
            )
              throw new Error('DEV_MANIFEST_CHECKSUM_MISMATCH');
            const response = await fetchRegistry(
              `https://registry.npmjs.org/tuturuuu/${version}`,
              { signal: AbortSignal.timeout(10000) }
            );
            if (response.status === 404) return { shouldPublish: true };
            if (!response.ok)
              throw Object.assign(
                new Error(`REGISTRY_VERIFICATION_FAILED: ${response.status}`),
                { retryable: response.status >= 500 && response.status < 600 }
              );
            const published = await response.json();
            if (
              published.name !== 'tuturuuu' ||
              published.version !== version ||
              published.dist?.integrity !== integrity ||
              published.dist?.shasum !== shasum ||
              published.tuturuuuBuild?.channel !== 'dev' ||
              published.tuturuuuBuild?.sourceSha !== sourceSha
            )
              throw new Error('PUBLISHED_DEV_BYTES_MISMATCH');
            return { shouldPublish: false };
          }
          verifyDevPublication({ directory: 'sdk-package', sourceSha: process.env.GITHUB_SHA,
            version: process.env.EXPECTED_PACKAGE_VERSION }).then(({ shouldPublish }) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_publish=${shouldPublish}\n`);
          }).catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Publish dev only with provenance
        if: steps.publication.outputs.should_publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ steps.artifact.outputs.path }}
        run: npm publish "${PACKAGE_TARBALL}" --tag dev --provenance --access public --ignore-scripts

      - name: Verify registry bytes after publication
        env:
          EXPECTED_PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          async function verifyDevPublication({
            directory,
            sourceSha,
            version,
            fetchRegistry = fetch,
          }) {
            if (
              !/^[a-f0-9]{40}$/.test(sourceSha || '') ||
              !/^\d+\.\d+\.\d+-dev\.[1-9][0-9]*\.[a-f0-9]{7}$/.test(version || '') ||
              !version.endsWith(`.${sourceSha.slice(0, 7)}`)
            )
              throw new Error('INVALID_DEV_VERSION');
            const manifest = JSON.parse(
              fs.readFileSync(path.join(directory, 'manifest.json'), 'utf8')
            );
            if (
              manifest.schemaVersion !== 1 ||
              manifest.name !== 'tuturuuu' ||
              manifest.version !== version ||
              manifest.sha !== sourceSha ||
              manifest.sourceSha !== sourceSha ||
              manifest.channel !== 'dev' ||
              manifest.internalOnly !== false ||
              manifest.archive !== `tuturuuu-${version}.tgz`
            )
              throw new Error('DEV_MANIFEST_MISMATCH');
            const archive = fs.readFileSync(path.join(directory, manifest.archive));
            const digest = (algorithm, encoding) =>
              createHash(algorithm).update(archive).digest(encoding);
            const integrity = `sha512-${digest('sha512', 'base64')}`;
            const shasum = digest('sha1', 'hex');
            if (
              manifest.integrity !== integrity ||
              manifest.shasum !== shasum ||
              manifest.sha256 !== digest('sha256', 'hex')
            )
              throw new Error('DEV_MANIFEST_CHECKSUM_MISMATCH');
            const response = await fetchRegistry(
              `https://registry.npmjs.org/tuturuuu/${version}`,
              { signal: AbortSignal.timeout(10000) }
            );
            if (response.status === 404) return { shouldPublish: true };
            if (!response.ok)
              throw Object.assign(
                new Error(`REGISTRY_VERIFICATION_FAILED: ${response.status}`),
                { retryable: response.status >= 500 && response.status < 600 }
              );
            const published = await response.json();
            if (
              published.name !== 'tuturuuu' ||
              published.version !== version ||
              published.dist?.integrity !== integrity ||
              published.dist?.shasum !== shasum ||
              published.tuturuuuBuild?.channel !== 'dev' ||
              published.tuturuuuBuild?.sourceSha !== sourceSha
            )
              throw new Error('PUBLISHED_DEV_BYTES_MISMATCH');
            return { shouldPublish: false };
          }
          async function waitForDevPublication(
            options,
            {
              attempts = 12,
              sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
            } = {}
          ) {
            for (let attempt = 0; attempt < attempts; attempt++) {
              try {
                if (!(await verifyDevPublication(options)).shouldPublish) return;
              } catch (error) {
                if (error.retryable !== true) throw error;
              }
              if (attempt + 1 < attempts) await sleep(10000);
            }
            throw new Error('PUBLICATION_NOT_VISIBLE_DO_NOT_BLINDLY_REPUBLISH');
          }
          waitForDevPublication({ directory: 'sdk-package', sourceSha: process.env.GITHUB_SHA,
            version: process.env.EXPECTED_PACKAGE_VERSION }).catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
