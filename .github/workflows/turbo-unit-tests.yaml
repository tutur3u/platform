name: Test

on:
  push:
    branches: [main, production, 'release-please--branches--**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

# Production and generated release attempts retain immutable evidence.
# Main and feature branch pushes supersede obsolete validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event.action == 'labeled' && github.event.label.name != 'ready-for-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  check-ci:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: turbo-unit-tests.yaml
      check_release_only: true

  coverage-check-ci:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: codecov.yaml
      check_release_only: true

  root-script-tests:
    name: Root script tests (24)
    needs: [check-ci]
    if: (needs.check-ci.outputs.should_run == 'true' && needs.check-ci.outputs.run_checks == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_PATH: ${{ github.workspace }}/apps/web/node_modules
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Verify script-test prerequisites
        run: |
          ruby --version
          node -e "console.log(require.resolve('@playwright/test'))"

      - name: Run complete root script suite
        run: |
          node <<'NODE'
          const { discoverScriptTests } = require('./scripts/run-script-tests.js');
          const { spawnSync } = require('node:child_process');
          const files = discoverScriptTests();
          console.log(`Discovered ${files.length} script test files.`);
          const result = spawnSync(process.execPath, ['--experimental-strip-types', '--test', '--test-concurrency=2', '--test-reporter=tap', ...files], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          NODE

  backend-source-qualification:
    name: Rust source qualification (1.95)
    needs: [check-ci]
    if: (needs.check-ci.outputs.should_run == 'true' && needs.check-ci.outputs.run_checks == 'true' && (github.ref == 'refs/heads/fix/release-5795-reconciliation' || github.ref == 'refs/heads/fix/main-production-reconciliation-20261012')) && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: ./apps/backend
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "Source SHA: $GITHUB_SHA"
            sha256sum apps/backend/Cargo.toml apps/backend/Cargo.lock
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup repository minimum Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # verified stable implementation
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Record toolchain
        run: rustc --version --verbose >> "$GITHUB_STEP_SUMMARY"

      - name: Download locked modules
        run: bash ../../scripts/ci/run-with-backoff.sh cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy native targets
        run: cargo clippy --locked --all-targets --features native -- -D warnings

      - name: Test complete native library
        run: cargo test --locked --lib -- --test-threads=2

      - name: Check wasm Worker target
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features worker

  # One first-attempt run serves either switchboard entry. Historical unit-only
  # receipts cannot prove coverage, so generated pushes also execute fresh shards.
  test-shards:
    name: Unit test shard (${{ matrix.shard }})
    needs: [check-ci, coverage-check-ci]
    if: ${{ (!cancelled() && ((needs.check-ci.result == 'success' && needs.check-ci.outputs.should_run == 'true' && needs.check-ci.outputs.run_checks == 'true') || (needs.coverage-check-ci.result == 'success' && needs.coverage-check-ci.outputs.should_run == 'true' && needs.coverage-check-ci.outputs.run_checks == 'true'))) && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    env:
      # Configure production Supabase client
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}

      # Configure infrastructure
      PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
      NEXT_PUBLIC_PROXY_API_KEY: ${{ secrets.NEXT_PUBLIC_PROXY_API_KEY }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4

      - name: Restore Turbo fallback cache
        uses: ./.github/actions/setup-turbo-fallback-cache
        with:
          family: unit-tests-${{ matrix.shard }}

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Build workspace setup
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=4 --filter=@tuturuuu/types --filter=@tuturuuu/supabase --filter=@tuturuuu/masonry --filter=@tuturuuu/internal-api --filter=tuturuuu
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Test
        # Cap Turbo concurrency so parallel package test suites don't
        # oversubscribe the runner's CPUs and starve the event loop, which is a
        # common source of flaky "Test timed out in 5000ms" failures in
        # otherwise-fast mocked unit tests during repository-wide test runs.
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: node scripts/ci/run-test-shard.js ${{ matrix.shard }} 4 --coverage
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      - name: Preserve complete workspace coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            apps/*/coverage/**
            packages/*/coverage/**
          if-no-files-found: error
          retention-days: 2

  # Preserve historical coverage check contexts without executing suites again.
  coverage-shards:
    name: Coverage shard (${{ matrix.shard }})
    needs: [coverage-check-ci, test-shards]
    if: ${{ (!cancelled() && needs.coverage-check-ci.result == 'success' && needs.coverage-check-ci.outputs.should_run == 'true' && needs.coverage-check-ci.outputs.run_checks == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Require shared test execution
        env:
          TEST_RESULT: ${{ needs.test-shards.result }}
        run: test "$TEST_RESULT" = success

  coverage-upload:
    needs: [coverage-check-ci, test-shards]
    if: ${{ (needs.coverage-check-ci.result == 'success' && needs.coverage-check-ci.outputs.should_run == 'true' && needs.coverage-check-ci.outputs.run_checks == 'true' && needs.test-shards.result == 'success') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    uses: ./.github/workflows/codecov.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  coverage-result:
    name: Run tests and collect coverage
    needs: [coverage-check-ci, test-shards, coverage-shards, coverage-upload]
    if: ${{ (!cancelled() && needs.coverage-check-ci.result == 'success' && needs.coverage-check-ci.outputs.should_run == 'true' && needs.coverage-check-ci.outputs.run_checks == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and coverage upload
        env:
          TEST_RESULT: ${{ needs.test-shards.result }}
          UPLOAD_RESULT: ${{ needs.coverage-upload.result }}
          COVERAGE_RESULT: ${{ needs.coverage-shards.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$COVERAGE_RESULT" = success

  build:
    name: Unit Tests (24)
    needs: [check-ci, test-shards, root-script-tests, backend-source-qualification]
    if: ${{ (!cancelled() && needs.check-ci.result == 'success' && needs.check-ci.outputs.should_run == 'true' && needs.check-ci.outputs.run_checks == 'true') && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && (github.event.action != 'labeled' || github.event.label.name == 'ready-for-ci'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every unit-test shard
        env:
          TEST_RESULT: ${{ needs.test-shards.result }}
          ROOT_SCRIPT_RESULT: ${{ needs.root-script-tests.result }}
          RUST_RESULT: ${{ needs.backend-source-qualification.result }}
          RUST_QUALIFICATION_REQUIRED: ${{ (github.ref == 'refs/heads/fix/release-5795-reconciliation' || github.ref == 'refs/heads/fix/main-production-reconciliation-20261012') }}
        run: |
          test "$TEST_RESULT" = success
          test "$ROOT_SCRIPT_RESULT" = success
          if [ "$RUST_QUALIFICATION_REQUIRED" = true ]; then
            test "$RUST_RESULT" = success
          fi
