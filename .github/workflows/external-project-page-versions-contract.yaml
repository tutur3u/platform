name: External project page versions contract
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - 'apps/database/supabase/migrations/**'
      - 'apps/database/supabase/seed.sql'
      - 'apps/database/supabase/tests/external-project-page-versions.sql'
      - 'apps/database/rollbacks/*external_project_edit_permission*'
      - 'apps/database/rollbacks/*external_project_page_versions*'
      - 'apps/database/scripts/verify-external-project-page-versions-contract.mjs'
      - 'apps/database/scripts/external-project-page-versions*.mjs'
      - 'apps/database/scripts/fixtures/external-project-page-versions-schema.sql'
      - 'apps/database/scripts/programming-database-tap.mjs'
      - 'apps/database/scripts/run-supabase*.js'
      - '.github/actions/cache-supabase-images/**'
      - 'scripts/ci/supabase-image-cache*'
      - 'tuturuuu.ci.ts'
      - '.github/workflows/external-project-page-versions-contract.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}-{3}{4}', github.workflow, github.event_name, github.event.pull_request.number || github.ref, (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest', github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '') }}
