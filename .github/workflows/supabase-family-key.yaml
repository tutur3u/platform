name: Supabase Family Key

# Dispatch-only operator job. It creates the `cf-web-families` Supabase secret
# key once and writes its value to SUPABASE_SECRET_KEY on opted-in web
# route family Workers (apps/web/cloudflare/opennext/families.json). The value is
# held in a shell variable only: never a GitHub secret, output, environment
# file, artifact, log line or command argument. A second run refuses to create
# a second key.
#
# Use the repository Supabase token and the dedicated environment's
# account-scoped Workers Scripts:Edit token. Readback prints names, IDs and
# types only, and fails closed on a mismatch.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: true
        type: choice
        options:
          - create
          - revoke

permissions:
  contents: read

concurrency:
  group: supabase-family-key
  cancel-in-progress: false

jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-family-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the secret tooling floor
        run: |
          git merge-base --is-ancestor 018eecf2fff936563b5775f711fbfc5606e361219 HEAD \
            || { echo 'This commit predates the abuse-guard ratelimit family (018eecf2).'; exit 1; }
      - name: Manage the Supabase family key
        env:
          KEY_ACTION: ${{ inputs.action }}
          CLOUDFLARE_ACCOUNT_ID: e8912e2867beecc673d171907bf09649
          CLOUDFLARE_API_TOKEN: ${{ secrets.SUPABASE_FAMILY_KEY_CLOUDFLARE_API_TOKEN }}
          SUPABASE_PROJECT_REF: nzamlzqfdwaaxdefwraj
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          : "${SUPABASE_ACCESS_TOKEN:?Missing Supabase access token}"
          printf '::add-mask::%s\n' "$SUPABASE_ACCESS_TOKEN"
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare family key token}"
          printf '::add-mask::%s\n' "$CLOUDFLARE_API_TOKEN"
          case "$KEY_ACTION" in
            create) ;;
            revoke)
              unset CLOUDFLARE_API_TOKEN
              node scripts/ci/supabase-family-key.mjs revoke
              exit
              ;;
            *) printf '%s\n' 'Unknown Supabase family key action' >&2; exit 1 ;;
          esac
          node scripts/ci/supabase-family-key.mjs preflight
          value="$(node scripts/ci/supabase-family-key.mjs create)"
          printf '::add-mask::%s\n' "$value"
          printf '%s' "$value" | node scripts/ci/supabase-family-key.mjs put
          unset value
          node scripts/ci/supabase-family-key.mjs verify
