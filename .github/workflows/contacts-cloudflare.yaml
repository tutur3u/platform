name: Contacts Cloudflare artifact
on:
  push:
    branches: [cf/contacts-20261104-ci-artifact]
  pull_request:
    paths: ['apps/contacts/**', 'packages/**', 'bun.lock', '.github/workflows/contacts-cloudflare.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTACTS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_contacts_ci_placeholder' }}
      NEXT_PUBLIC_APP_URL: https://contacts.tuturuuu.com
      NEXT_PUBLIC_WEB_APP_URL: https://tuturuuu.com
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTACTS_SOURCE_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build app dependencies
        run: bun turbo:local run build --filter='@tuturuuu/contacts^...' --concurrency=2
      - name: Build Contacts Start Worker and assets
        run: bun run --cwd apps/contacts build:cloudflare
      - name: Seal deployable output
        run: |
          python3 scripts/ci/contacts-native-artifact.py seal apps/contacts --receipt "$RUNNER_TEMP/contacts-native.json"
          python3 scripts/ci/contacts-native-artifact.py pack apps/contacts --receipt "$RUNNER_TEMP/contacts-native.json" --archive "$RUNNER_TEMP/contacts-native.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contacts-native-${{ env.CONTACTS_SOURCE_SHA }}
          path: ${{ runner.temp }}/contacts-native.tar.gz
          if-no-files-found: error
          retention-days: 7
