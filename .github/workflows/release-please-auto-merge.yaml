name: Release Please Auto Merge

# Runs `bun git-release-please` and `bun git-sync` on a schedule — the same two
# commands the release flow uses locally, rather than a YAML reimplementation of
# them. Those scripts already own the merge rules (platform version sync,
# conflict detection, `bun check`, fast-forward safety) and are covered by
# scripts/git-release-please.test.js and scripts/git-sync.test.js, so keeping
# CI on top of them means the cloud path and the local path cannot drift.
#
# The end state this guarantees is that origin/main and origin/production point
# at the same commit — the merge commit, when there was something to merge.

on:
  schedule:
    # Daily at 00:00 UTC (07:00 in Vietnam, UTC+7). A run with nothing to
    # merge is a clean no-op.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Merge and verify locally without pushing anything.
        type: boolean
        default: false

# Release Please force-pushes its generated branch whenever production moves.
# Hold the same lock as release-please.yaml so that branch cannot change after
# this workflow selects and validates it but before cleanup checks its ancestry.
concurrency:
  group: release-please-production
  cancel-in-progress: false

permissions: {}

jobs:
  merge:
    name: Merge release-please and align production
    runs-on: ubuntu-latest
    # `bun git-release-please` runs the full repo check before committing, and
    # every release bumps apps/mobile/pubspec.yaml, so the Flutter suite runs
    # too.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # The merge needs real history, and the push needs credentials that
          # can write to protected branches.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve work to do
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          # Explicit refspec: checking out a single ref can leave the remote
          # configured to track only that branch, and this step needs
          # origin/production and the release branches too.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          # Same selection rule as scripts/git-release-please.js: prefer the
          # branch cut against production, fall back to the newest, and never
          # pick the overflow release-notes branch.
          preferred="origin/release-please--branches--production"
          branch=""

          if git show-ref --verify --quiet "refs/remotes/${preferred}"; then
            branch="${preferred}"
          else
            branch="$(git for-each-ref \
              --sort=-committerdate \
              --format='%(refname:short)' \
              'refs/remotes/origin/release-please--branches--*' \
              | grep -v -- '--release-notes$' \
              | head -n 1 || true)"
          fi

          should_merge=false
          if [ -z "${branch}" ]; then
            echo "No release-please branch on origin."
          elif git merge-base --is-ancestor "${branch}" origin/main; then
            echo "${branch} is already merged into origin/main."
          else
            echo "${branch} is unmerged and will be merged into main."
            should_merge=true
          fi

          main_sha="$(git rev-parse origin/main)"
          prod_sha="$(git rev-parse origin/production)"
          needs_sync=false
          if [ "${main_sha}" != "${prod_sha}" ]; then
            echo "production (${prod_sha}) is not aligned with main (${main_sha})."
            needs_sync=true
          fi

          {
            echo "branch=${branch}"
            echo "should_merge=${should_merge}"
            echo "needs_sync=${needs_sync}"
          } >> "$GITHUB_OUTPUT"

      # Checked before the ~40 minutes of install, build and `bun check` that
      # follow, because none of it can land without this. `main` and
      # `production` are covered by a ruleset whose only bypass actor is
      # OrganizationAdmin, so `github.token` is refused by the remote with
      # `GH013: Changes must be made through a pull request`. Granting the
      # Actions app a bypass instead would not work either: pushes made with
      # `GITHUB_TOKEN` do not trigger `push` workflows, so the production push
      # would skip the Vercel production planner and the next Release Please
      # run.
      - name: Require a token that can push protected branches
        if: (steps.plan.outputs.should_merge == 'true' || steps.plan.outputs.needs_sync == 'true') && inputs.dry_run != true
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "RELEASE_PLEASE_TOKEN is configured."
            exit 0
          fi

          echo "::error::RELEASE_PLEASE_TOKEN is not configured, so this run fell back to GITHUB_TOKEN and its push to main would be rejected. Add a repository secret named RELEASE_PLEASE_TOKEN holding a personal access token (repo + workflow scopes) owned by an organization admin, then re-run this workflow."
          exit 1

      - name: Install dependencies
        if: steps.plan.outputs.should_merge == 'true'
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      # `bun git-release-please` runs `bun check`, and the turbo `test` task
      # depends on `transit` (a no-op marker), not `^build`. Locally that is
      # invisible because `bun setup` builds these five packages, but a fresh CI
      # checkout has no `dist/**`, and @tuturuuu/types, @tuturuuu/supabase and
      # @tuturuuu/internal-api expose only built entrypoints to Node resolution.
      # Without this the suites fail with ERR_MODULE_NOT_FOUND. Keep the filter
      # list in step with the `setup` script in package.json.
      - name: Build workspace setup
        if: steps.plan.outputs.should_merge == 'true'
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: bun turbo:local run build --concurrency=4 --filter=@tuturuuu/types --filter=@tuturuuu/supabase --filter=@tuturuuu/masonry --filter=@tuturuuu/internal-api --filter=tuturuuu
          token: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && secrets.TURBO_TOKEN || '' }}
          team: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production') && (vars.TURBO_TEAM || secrets.TURBO_TEAM) || '' }}

      # Release-please bumps apps/mobile/pubspec.yaml on every release, so
      # `touchesMobile()` in scripts/git-release-please.js is always true and
      # `bun check` is followed by `bun check:mobile` — dart-format,
      # flutter-analyze and flutter-test. Without a Flutter toolchain all three
      # exit 127 and the merge never reaches the push. Keep the version pin in
      # step with mobile.yaml.
      - name: Setup Flutter
        if: steps.plan.outputs.should_merge == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true
          pub-cache: true

      # `generate: true` in pubspec.yaml means this also runs gen-l10n, which
      # flutter-analyze needs before it can resolve lib/l10n/gen.
      - name: Install mobile dependencies
        if: steps.plan.outputs.should_merge == 'true'
        working-directory: apps/mobile
        run: flutter pub get

      - name: Configure git identity
        if: steps.plan.outputs.should_merge == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge release-please branch into main
        if: steps.plan.outputs.should_merge == 'true'
        run: bun git-release-please

      - name: Sync main and production
        if: (steps.plan.outputs.should_merge == 'true' || steps.plan.outputs.needs_sync == 'true') && inputs.dry_run != true
        run: bun git-sync

      - name: Sync main and production (dry run)
        if: (steps.plan.outputs.should_merge == 'true' || steps.plan.outputs.needs_sync == 'true') && inputs.dry_run == true
        run: bun git-sync --no-push

      - name: Verify main and production point at the same commit
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git rev-parse origin/main)"
          prod_sha="$(git rev-parse origin/production)"

          if [ "${main_sha}" != "${prod_sha}" ]; then
            echo "::error::main (${main_sha}) and production (${prod_sha}) are not aligned."
            exit 1
          fi

          echo "main and production are both at ${main_sha}."
          echo "aligned_sha=${main_sha}" >> "$GITHUB_ENV"

      - name: Delete merged release-please branch
        # Release Please recreates this branch from scratch on its next run, so
        # a merged one left on origin is only noise. This is deliberately not
        # gated on should_merge: a run whose merge landed but whose cleanup did
        # not still tidies up the next time round.
        if: inputs.dry_run != true
        shell: bash
        # Values reach the script through the environment rather than being
        # pasted into it, so a ref name can never be read as shell.
        env:
          MERGED_BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail

          # The plan step reports the remote-tracking name (origin/<branch>);
          # a delete refspec needs the plain branch name.
          branch="${MERGED_BRANCH#origin/}"

          if [ -z "${branch}" ]; then
            echo "No release-please branch to delete."
            exit 0
          fi

          # Deleting a branch that is already gone is success, not failure.
          # Pushing production closes the release PR, and GitHub deletes the
          # head branch itself moments later — after the fetch below and
          # sometimes mid-step, so no amount of re-checking first removes the
          # race. Only a delete that failed while the branch is still on origin
          # is a real error.
          delete_remote_branch() {
            local target="$1"

            if git push origin --delete "${target}" 2>&1; then
              echo "Deleted origin/${target}."
              return 0
            fi

            if git ls-remote --exit-code --heads origin "${target}" >/dev/null 2>&1; then
              echo "::error::Could not delete origin/${target}; it is still on origin."
              return 1
            fi

            echo "origin/${target} was already deleted, most likely by the merged pull request."
            return 0
          }

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
            echo "origin/${branch} is already deleted."
          elif ! git merge-base --is-ancestor "origin/${branch}" origin/main; then
            # Never delete unmerged release commits, whatever else went on.
            echo "::warning::origin/${branch} is not merged into main; leaving it in place."
            exit 0
          else
            delete_remote_branch "${branch}"
          fi

      - name: Write run summary
        if: always()
        shell: bash
        # Values reach the script through the environment rather than being
        # pasted into it, so a ref name can never be read as shell.
        env:
          MERGED_BRANCH: ${{ steps.plan.outputs.branch }}
          SHOULD_MERGE: ${{ steps.plan.outputs.should_merge }}
        run: |
          set -euo pipefail

          {
            echo "### Release Please Auto Merge"
            echo
            if [ "${SHOULD_MERGE:-}" = "true" ]; then
              echo "- Merged \`${MERGED_BRANCH}\` into \`main\`."
            else
              echo "- Nothing to merge (no unmerged release-please branch)."
            fi
            if [ -n "${aligned_sha:-}" ]; then
              echo "- \`main\` and \`production\` are aligned at \`${aligned_sha}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
