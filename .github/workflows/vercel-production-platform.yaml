name: Vercel Platform Production Deployment
on:
  workflow_call:
    outputs:
      promoted:
        description: "Whether the exact Web candidate was staged, verified and promoted"
        value: ${{ jobs.Deploy-Production.outputs.promoted }}
  workflow_dispatch:

concurrency:
  group: vercel-production-platform-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  Deploy-Production:
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    if: github.ref == 'refs/heads/production'
    environment: vercel-production-platform
    runs-on: ${{ vars.PRODUCTION_RUNNER_LABELS && fromJSON(vars.PRODUCTION_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
      deployments: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve checked-out SHA
        id: resolve_target
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup bun
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4

      - name: Gate package release visibility
        id: package_release_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/package-release-readiness.js gate-changed-package-versions

      - name: Skip build while package releases publish
        if: steps.package_release_gate.outputs.packages_ready == 'false'
        run: |
          echo "Changed package versions are still publishing; skipping this platform build run without failing."
          echo 'Pending packages: ${{ steps.package_release_gate.outputs.pending_packages }}'

      - name: Install dependencies
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Install Vercel CLI
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        # unfrozen-bun-install: pinned global CLI has no project lockfile
        run: bash scripts/ci/run-with-backoff.sh bun install --global vercel@59.25.0 --ignore-scripts

      - name: Pull Vercel Environment Information
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate shared build metadata
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          PLATFORM_BUILD_ENVIRONMENT: production
          PLATFORM_BUILD_REF_NAME: production
        run: bun run --silent scripts/ci/generate-build-metadata.ts

      - name: Build Project Artifacts
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TURBO_CONCURRENCY: "2"
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          token: ${{ github.actor != 'dependabot[bot]' && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}

      - name: Stage production artifacts without assigning domains
        id: stage_deployment
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url=$(vercel deploy --archive=tgz --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged source and ordinary API boundaries
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_STAGED_DEPLOYMENT_URL: ${{ steps.stage_deployment.outputs.url }}
          VERCEL_STAGED_APP: platform
        run: node scripts/ci/verify-staged-critical-app.js

      - name: Restore shared Chromium input
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/finance-native-playwright
          # Finance seeds this exact-lock cache with the same Web Playwright CLI.
          key: finance-browser-v1-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-node24.22.0-${{ hashFiles('bun.lock') }}

      - name: Install staged Chromium prerequisites
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/install-native-runtime-prerequisites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/finance-native-playwright
        with:
          working-directory: .
          command: bun apps/web/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify staged CSS and styled viewports
        id: verify_styles
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        timeout-minutes: 3
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_STAGED_DEPLOYMENT_URL: ${{ steps.stage_deployment.outputs.url }}
          VERCEL_STAGED_APP: platform
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/finance-native-playwright
        run: node scripts/ci/verify-staged-style.js

      - name: Retain staged style proof
        if: always() && steps.package_release_gate.outputs.packages_ready == 'true' && steps.stage_deployment.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-platform-styles-${{ steps.resolve_target.outputs.sha }}
          path: ${{ runner.temp }}/staged-style-proof/${{ steps.resolve_target.outputs.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Promote verified production deployment
        id: promote
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
        run: |
          set -euo pipefail
          vercel promote "${{ steps.stage_deployment.outputs.url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo 'promoted=true' >> "$GITHUB_OUTPUT"

      - name: Record successful Vercel build marker
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_MARKER_KIND: build
          VERCEL_MARKER_SHA: ${{ steps.resolve_target.outputs.sha }}
          VERCEL_WORKFLOW_NAME: vercel-production-platform.yaml
        run: node --experimental-strip-types scripts/ci/record-vercel-deployment.ts

      - name: Record successful Vercel deployment marker
        if: steps.package_release_gate.outputs.packages_ready == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_MARKER_KIND: deployment
          VERCEL_MARKER_SHA: ${{ steps.resolve_target.outputs.sha }}
          VERCEL_WORKFLOW_NAME: vercel-production-platform.yaml
        run: node --experimental-strip-types scripts/ci/record-vercel-deployment.ts
