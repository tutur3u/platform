name: Mobile Build Windows

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
    cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
    schedule:
      - cron: "50 18 * * *"
    release:
      types: [published]
    workflow_dispatch:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
        branches:
            - main
        paths:
            - "apps/mobile/**"
            - "scripts/desktop-deployment/**"
            - ".github/workflows/mobile-build-windows.yaml"

permissions:
  contents: read

jobs:
    check-ci:
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
        permissions:
            contents: read
            deployments: read
        uses: ./.github/workflows/ci-check.yml
        with:
            workflow_name: mobile-build-windows.yaml

    build-windows:
        name: Build Windows (Development)
        needs: [check-ci]
        if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
        runs-on: windows-latest
        timeout-minutes: 45
        defaults:
            run:
                working-directory: apps/mobile
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Validate Windows signing script syntax
              shell: pwsh
              run: |
                  $tokens = $null
                  $parseErrors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '../../scripts/desktop-deployment/sign-windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
                  if ($parseErrors.Count -gt 0) { throw 'Windows signing script has syntax errors' }

            - name: Setup Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version: "3.47.x"
                  channel: stable
                  # Cache uploads can stall the Windows post-job step after the
                  # build artifact is already available. Keep this check bounded.
                  cache: false
                  pub-cache: false

            - name: Enable Windows desktop
              run: flutter config --enable-windows-desktop

            - name: Install dependencies
              run: flutter pub get

            - name: Build Windows
              run: flutter build windows --target lib/main_development.dart

            - name: Archive Windows app bundle
              shell: pwsh
              run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:RUNNER_TEMP/windows-dev-app.zip"

            - name: Upload Windows app artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: windows-dev-app
                  path: ${{ runner.temp }}/windows-dev-app.zip
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
