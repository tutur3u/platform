name: Mobile Build Windows

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches:
            - main
        paths:
            - "apps/mobile/**"
            - "scripts/desktop-deployment/**"
            - ".github/workflows/mobile-build-windows.yaml"
    pull_request:
        branches:
            - main
        paths:
            - "apps/mobile/**"
            - "scripts/desktop-deployment/**"
            - ".github/workflows/mobile-build-windows.yaml"

jobs:
    check-ci:
        uses: ./.github/workflows/ci-check.yml
        with:
            workflow_name: mobile-build-windows.yaml

    build-windows:
        name: Build Windows (Development)
        needs: [check-ci]
        if: needs.check-ci.outputs.should_run == 'true'
        runs-on: windows-latest
        timeout-minutes: 45
        defaults:
            run:
                working-directory: apps/mobile
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Validate Windows signing script syntax
              shell: pwsh
              run: |
                  $tokens = $null
                  $parseErrors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '../../scripts/desktop-deployment/sign-windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
                  if ($parseErrors.Count -gt 0) { throw 'Windows signing script has syntax errors' }

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.x"
                  channel: stable
                  # Cache uploads can stall the Windows post-job step after the
                  # build artifact is already available. Keep this check bounded.
                  cache: false
                  pub-cache: false

            - name: Enable Windows desktop
              run: flutter config --enable-windows-desktop

            - name: Install dependencies
              run: flutter pub get

            - name: Build Windows
              run: flutter build windows --target lib/main_development.dart

            - name: Archive Windows app bundle
              shell: pwsh
              run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:RUNNER_TEMP/windows-dev-app.zip"

            - name: Upload Windows app artifact
              uses: actions/upload-artifact@v7
              with:
                  name: windows-dev-app
                  path: ${{ runner.temp }}/windows-dev-app.zip
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
