name: Mobile Build macOS

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
  schedule:
    - cron: "30 18 * * *"
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-macos.yaml"
      - ".github/actions/setup-flutter-with-cache/**"
      - "scripts/mobile-deployment/*firebase*"

permissions:
  contents: read

jobs:
  check-ci:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-macos.yaml

  build-macos:
    name: Build macOS (Development)
    needs: [check-ci]
    if: (needs.check-ci.outputs.should_run == 'true') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter-with-cache
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Restore CocoaPods downloads without saving
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/macos/Podfile', 'apps/mobile/macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-

      - name: Prepare development Firebase configuration
        run: |
          python3 ../../scripts/mobile-deployment/test_firebase_service_config.py
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform macos

      - name: Build macOS
        run: flutter build macos --flavor development --target lib/main_development.dart

      - name: Archive macOS app bundle
        run: |
          app_path="$(find build/macos/Build/Products -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform macos --app "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/macos-dev-app.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dev-app
          path: ${{ runner.temp }}/macos-dev-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save trusted CocoaPods downloads
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/macos/Podfile', 'apps/mobile/macos/Podfile.lock') }}
