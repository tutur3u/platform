name: Mobile Build macOS

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-macos.yaml"
      - ".github/actions/setup-flutter-cached/**"
      - ".github/actions/save-trusted-cache/**"
      - "scripts/mobile-deployment/*firebase*"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build-macos.yaml"
      - ".github/actions/setup-flutter-cached/**"
      - ".github/actions/save-trusted-cache/**"
      - "scripts/mobile-deployment/*firebase*"

jobs:
  check-ci:
    uses: ./.github/workflows/ci-check.yml
    with:
      workflow_name: mobile-build-macos.yaml

  build-macos:
    name: Build macOS (Development)
    needs: [check-ci]
    if: needs.check-ci.outputs.should_run == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        id: flutter
        uses: ./.github/actions/setup-flutter-cached
        with:
          flutter-version: "3.47.x"
          channel: stable

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Save pub cache
        uses: ./.github/actions/save-trusted-cache
        with:
          path: ${{ steps.flutter.outputs.pub-cache-path }}
          key: ${{ steps.flutter.outputs.pub-cache-key }}
          cache-hit: ${{ steps.flutter.outputs.pub-cache-hit }}

      - name: Restore CocoaPods downloads
        id: pods
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/macos/Podfile', 'apps/mobile/macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-

      - name: Prepare development Firebase configuration
        run: |
          python3 ../../scripts/mobile-deployment/test_firebase_service_config.py
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform macos

      - name: Build macOS
        run: flutter build macos --flavor development --target lib/main_development.dart

      - name: Save CocoaPods downloads
        uses: ./.github/actions/save-trusted-cache
        with:
          path: |
            /Users/runner/Library/Caches/CocoaPods
            /Users/runner/.cocoapods/repos/trunk
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-macos-pods-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/macos/Podfile', 'apps/mobile/macos/Podfile.lock') }}
          cache-hit: ${{ steps.pods.outputs.cache-hit }}

      - name: Archive macOS app bundle
        run: |
          app_path="$(find build/macos/Build/Products -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          python3 ../../scripts/mobile-deployment/firebase-service-config.py --platform macos --app "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$RUNNER_TEMP/macos-dev-app.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dev-app
          path: ${{ runner.temp }}/macos-dev-app.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
