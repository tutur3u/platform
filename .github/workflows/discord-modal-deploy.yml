name: Discord Modal Deploy

on:
  workflow_run:
    workflows: ["Discord Python CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}

jobs:
  trigger:
    name: Verify trusted trigger
    # Cheap pre-filter only: expression `==` ignores case and workflow_run
    # matches producers by name, so the step re-proves the trigger exactly.
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.trigger.outputs.head_sha }}
      trusted: ${{ steps.trigger.outputs.trusted }}
    steps:
      - name: Verify trusted trigger
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_DISPATCH_REF: refs/heads/main
          # One producer per line: <workflow file> <workflow ID> <exact branch> <events> <conclusions>
          TRUSTED_PRODUCERS: |
            discord-python-ci.yml 207981538 main push success
        run: |
          set -euo pipefail
          # Expression `==` ignores case and workflow_run matches producers by name, so
          # re-prove the trigger with exact comparisons before any privileged step runs.
          # Values come from the event file and runner variables, never interpolation.
          reject() {
            echo "::error::Untrusted trigger: $1"
            exit 1
          }
          field() {
            jq -r "$1 // \"\" | tostring" "$GITHUB_EVENT_PATH"
          }
          listed() {
            local item
            local -a items
            IFS=',' read -r -a items <<< "$2"
            for item in "${items[@]}"; do
              if [ "$item" = "$1" ] || [ "$item" = any ]; then
                return 0
              fi
            done
            return 1
          }

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ -z "${TRUSTED_DISPATCH_REF:-}" ] || [ "$GITHUB_REF" != "$TRUSTED_DISPATCH_REF" ]; then
                reject "manual runs must start from ${TRUSTED_DISPATCH_REF:-a trusted producer}"
              fi
              branch="${TRUSTED_DISPATCH_REF#refs/heads/}"
              head_sha="$GITHUB_SHA"
              ;;
            workflow_run)
              run_path="$(field .workflow_run.path)"
              file=""
              while read -r candidate workflow_id branch events conclusions; do
                if [ -n "$candidate" ] && [ "$run_path" = ".github/workflows/$candidate" ]; then
                  file="$candidate"
                  break
                fi
              done <<< "${TRUSTED_PRODUCERS:-}"
              [ -n "$file" ] || reject "producer path '$run_path' is not trusted"
              [ -n "$workflow_id" ] && [ "$(field .workflow_run.workflow_id)" = "$workflow_id" ] ||
                reject "producer workflow ID is not $file's ID $workflow_id"
              [ "$(field .workflow_run.head_branch)" = "$branch" ] ||
                reject "producer branch is not exactly '$branch'"
              listed "$(field .workflow_run.event)" "$events" ||
                reject "producer event is not one of $events"
              listed "$(field .workflow_run.conclusion)" "$conclusions" ||
                reject "producer conclusion is not one of $conclusions"
              [ "$(field .workflow_run.head_repository.full_name)" = "$GITHUB_REPOSITORY" ] &&
                [ "$(field .workflow_run.head_repository.id)" = "$GITHUB_REPOSITORY_ID" ] ||
                reject "producer head repository is not $GITHUB_REPOSITORY"
              head_sha="$(field .workflow_run.head_sha)"
              ;;
            *)
              reject "unsupported event '$GITHUB_EVENT_NAME'"
              ;;
          esac

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || reject "head SHA is not a full commit SHA"
          # behind/identical: the head SHA is reachable from (or equal to) the branch.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$head_sha" --jq .status)"
          [ "$status" = identical ] || [ "$status" = behind ] ||
            reject "head SHA is not reachable from $branch"
          {
            echo "trusted=true"
            echo "head_sha=$head_sha"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "Trusted trigger: $head_sha on $branch"

  deploy:
    name: Deploy to Modal
    needs: trigger
    # Manual deploys run from main only; the environment lets admins add a
    # main-only branch policy and environment-scoped Modal secrets.
    environment: discord-production
    if: needs.trigger.outputs.trusted == 'true'
    concurrency:
      group: discord-modal-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/discord
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: auto
          prune-cache: true
          cache-dependency-glob: apps/discord/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ] || [ -z "${MODAL_TOKEN_SECRET}" ]; then
            echo "MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must be configured as GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "${MODAL_ENVIRONMENT}" ]; then
            uv run modal deploy --env "${MODAL_ENVIRONMENT}" app.py
          else
            uv run modal deploy app.py
          fi
