name: Discord Modal Deploy

on:
  workflow_run:
    workflows: ["Discord Python CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}

jobs:
  deploy:
    name: Deploy to Modal
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    concurrency:
      group: discord-modal-deploy
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/discord
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: auto
          prune-cache: true
          cache-dependency-glob: apps/discord/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "${MODAL_TOKEN_ID}" ] || [ -z "${MODAL_TOKEN_SECRET}" ]; then
            echo "MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must be configured as GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "${MODAL_ENVIRONMENT}" ]; then
            uv run modal deploy --env "${MODAL_ENVIRONMENT}" app.py
          else
            uv run modal deploy app.py
          fi
