name: Web E2E Framework (report-only)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]
    paths:
      - ".e2e/cache/**"
      - ".github/workflows/e2e-framework-report-only.yaml"
      - "apps/web/e2e-agent/**"
      - "bun.lock"
      - "e2e.config.ts"
      - "package.json"
      - "scripts/e2e/**"
  push:
    branches:
      - main
    paths:
      - ".e2e/cache/**"
      - ".github/workflows/e2e-framework-report-only.yaml"
      - "apps/web/e2e-agent/**"
      - "bun.lock"
      - "e2e.config.ts"
      - "package.json"
      - "scripts/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}-{3}{4}', github.workflow, github.event_name, github.event.pull_request.number || github.ref, (github.run_attempt > 1 || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.event_name != 'push' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/heads/release-please--branches--')))) && format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) || 'latest', github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ready-for-ci') && '-unadmitted' || '') }}
  cancel-in-progress: ${{ !(github.run_attempt > 1) && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && !startsWith(github.ref, 'refs/heads/release-please--branches--'))) }}

jobs:
  e2e-strict-cache:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-for-ci'))
    name: E2E strict-cache replay (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.4
          package-cache-enabled: "false"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore Bun package cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: e2e-framework-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install dependencies
        run: bash scripts/ci/run-with-backoff.sh bun install --frozen-lockfile

      - name: Restore Playwright Chromium cache
        id: chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: e2e-framework-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Install Playwright Chromium for @e2e-dev/web
        run: bun x e2e-web install chromium --with-deps

      - name: Save trusted Bun package cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: e2e-framework-bun-v1-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Save trusted Playwright Chromium cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: e2e-framework-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

      - name: Run deterministic e2e suite (--strict-cache, zero model calls)
        id: e2e
        env:
          CI: "1"
          E2E_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          # Synthesize per-run loopback fixture credentials in memory; no secrets
          # or model API keys are passed to this deterministic replay job.
          export E2E_SECRET_FLEET_EMAIL="qa-fixture-$(openssl rand -hex 6)@example.invalid"
          export E2E_USER_FLEET_PASSWORD="$(openssl rand -hex 24)"
          npx --no-install e2e run --strict-cache --reporter list,junit

      - name: Upload e2e reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-framework-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .e2e/report.json
            .e2e/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-framework-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e/results
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize report-only outcome
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "E2E strict-cache replay (report-only, zero model calls): job=$JOB_STATUS step=$E2E_OUTCOME. Inspect uploaded .e2e/report.json and .e2e/junit.xml artifacts; this check is non-required." >> "$GITHUB_STEP_SUMMARY"
