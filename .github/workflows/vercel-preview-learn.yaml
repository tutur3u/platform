name: Vercel Learn Preview Build
on:
  workflow_dispatch:
    inputs:
      preview_ref:
        description: Branch, tag, or SHA to build for preview.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.preview_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Deploy-Preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(format(',{0},', vars.TRUSTED_PREVIEW_DEPLOY_ACTORS), format(',{0},', github.actor))
    environment: vercel-preview-learn
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ inputs.preview_ref }}

      - name: Confirm preview ref
        id: check_commits
        run: |
          source_sha="$(git rev-parse --verify HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Building checked-out source %s.\n' "$source_sha"
          echo "skip_build=false" >> $GITHUB_OUTPUT

      - name: Setup bun
        if: steps.check_commits.outputs.skip_build != 'true'
        uses: ./.github/actions/setup-bun-with-retry
        with:
          bun-version: 1.4.1

      - name: Use Node.js 24
        if: steps.check_commits.outputs.skip_build != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.check_commits.outputs.skip_build != 'true'
        run: bash scripts/ci/run-with-backoff.sh bun install

      - name: Install Vercel CLI
        if: steps.check_commits.outputs.skip_build != 'true'
        run: bash scripts/ci/run-with-backoff.sh bun install --global vercel@59.25.0

      - name: Pull Vercel Environment Information
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LEARN_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate shared build metadata
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          PLATFORM_BUILD_ENVIRONMENT: preview
          PLATFORM_BUILD_REF_NAME: ${{ inputs.preview_ref || github.ref_name }}
        run: bun run --silent scripts/ci/generate-build-metadata.ts

      - name: Build Project Artifacts
        if: steps.check_commits.outputs.skip_build != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          TURBO_CONCURRENCY: "2"
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_LEARN_PROJECT_ID }}
        uses: ./.github/actions/run-with-turbo-remote-cache
        with:
          command: vercel build --token=${{ secrets.VERCEL_TOKEN }}
          token: ${{ github.actor != 'dependabot[bot]' && secrets.TURBO_TOKEN || '' }}
          team: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}

      - name: Record successful Vercel build marker
        if: steps.check_commits.outputs.skip_build != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_WORKFLOW_NAME: vercel-preview-learn.yaml
          VERCEL_MARKER_KIND: build
          VERCEL_MARKER_SHA: ${{ steps.check_commits.outputs.source_sha }}
        run: bun run --silent scripts/ci/record-vercel-deployment.ts
